:root{--bg:#FFFBF3;--ink:#1E2A38;--navy:#1F4E79;--muted:#5B6B7C;--card:#FFFFFF;--line:#EADFCB;--soft:#F4EBDD;--acc:#C0392B;--ok:#2E7D5B;--bad:#C0392B;--paper:#FFFFFF;--rule:#2b2b2b;--guide:#D9D9D9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A22;--ink:#EEF2F6;--navy:#9CC3EA;--muted:#A6B3C2;--card:#1D2531;--line:#2C3747;--soft:#26303D}}
:root[data-theme="dark"]{--bg:#141A22;--ink:#EEF2F6;--navy:#9CC3EA;--muted:#A6B3C2;--card:#1D2531;--line:#2C3747;--soft:#26303D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI','Nunito',system-ui,sans-serif;font-size:17px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.back{display:inline-block;margin:4px 0 10px;color:var(--navy);font-weight:800;text-decoration:none}
h1{font-family:'Segoe UI Black','Arial Black',sans-serif;font-size:clamp(24px,5vw,38px);margin:0;color:var(--navy)}
.sub{color:var(--muted);margin:4px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 8px;cursor:pointer;text-align:center;font:inherit;color:inherit;min-height:96px}
.tile b{display:block;font-family:'Cur',cursive;font-size:30px;line-height:1.5;color:var(--acc)}
.tile span{font-size:13px;color:var(--muted)}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(192,57,43,.2)}
.tile .st{font-size:13px;color:#B9770E}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.tab{border:none;border-radius:999px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--soft);color:var(--ink);min-height:44px}
.tab.on{background:#E8833A;color:#fff}
.sw{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.cur{font-family:'Cur',cursive;line-height:1.7}
.syl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:4px 14px;font-family:'Cur',cursive;font-size:24px;cursor:pointer;color:inherit}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.w{border:2px solid var(--line);border-radius:16px;padding:8px 12px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit}
.w .es{font-family:'Cur',cursive;font-size:22px;line-height:1.6}
.w .hu{font-size:14px;color:var(--muted)}
.s{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding:10px 0}
.s .t{flex:1}
.s .es{font-family:'Cur',cursive;font-size:23px;line-height:1.7}
.s .hu{color:var(--muted);font-size:15px}
.ab{border:none;border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;cursor:pointer;background:var(--soft);color:var(--ink);min-width:52px;min-height:40px}
.ab.hu{background:#E3F0FB;color:#1F4E79}
.big{border:none;border-radius:999px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;min-height:48px;background:#1F4E79;color:#fff}
.big.g{background:#2E7D5B}.big.l{background:var(--soft);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
select{font:inherit;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.cv{width:100%;touch-action:none;border:2px solid var(--line);border-radius:16px;background:#fff;display:block}
.reveal{font-family:'Cur',cursive;font-size:28px;min-height:48px;margin:6px 0;color:var(--ok)}
.q{font-size:20px;font-weight:800;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--bg);cursor:pointer;font:inherit;color:inherit;font-size:20px;min-height:60px}
.opt.cur2{font-family:'Cur',cursive;font-size:24px}
.opt.ok{border-color:var(--ok);background:#E3F4E8;color:#1D5233}.opt.no{border-color:var(--bad);background:#FBE5E2;color:#7a1f15}
.kit{font-size:46px;display:inline-block;transition:transform .2s}
.kit.j{animation:j .5s}.kit.c{animation:c .5s}

 P.innerHTML=h;
 P.querySelectorAll('.chip').forEach(b=>b.onclick=()=>sayEs(b.dataset.y));
 P.querySelectorAll('.w').forEach(b=>b.onclick=()=>{const [e,u]=s.words[b.dataset.k];sayPair(e,u)});
 P.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>sayEs(s.sent[b.dataset.se][0]));
 P.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{const [e,u]=s.sent[b.dataset.sh];sayHuEs(u,e)});
 $('#rdAll').onclick=()=>{const L=[];[...new Set(s.syl.split(' '))].forEach(y=>L.push(clip('es',y)));s.words.forEach(([e,u])=>{L.push(clip('es',e));if(huOn)L.push(clip('hu',u))});
  s.sent.forEach(([e,u])=>{L.push(clip('es',e));if(huOn)L.push(clip('hu',u))});say(L)};
}
// ---- rajzlap (vonalazás)
function mkPad(cv){const P={cv,ctx:cv.getContext('2d'),strokes:[],cur:null,model:'',lines:3};
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);P.cur=[pos(e)];P.strokes.push(P.cur);drawPad(P)});
 cv.addEventListener('pointermove',e=>{if(!P.cur)return;e.preventDefault();P.cur.push(pos(e));drawPad(P)});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>P.cur=null));
 return P}
function sizePad(P,lines){const cw=(P.cv.parentElement.clientWidth||document.body.clientWidth);const W=cw<640?800:1600;if(W===800)lines=Math.min(lines*2,6);P.lines=lines;P.cv.width=W;P.cv.height=150*lines}
function wrapModel(ctx,text,maxw){const ws=text.split(' ');const out=[];let line='';
 ws.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxw&&line){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
function drawPad(P){const c=P.ctx,W=P.cv.width,H=P.cv.height,rowH=150,band=44;c.clearRect(0,0,W,H);c.fillStyle='#fff';c.fillRect(0,0,W,H);
 c.strokeStyle='#DADADA';c.lineWidth=1.5;for(let x=40;x<W;x+=44){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
 c.strokeStyle='#333';c.lineWidth=2.5;for(let k=0;k<P.lines;k++){const b=k*rowH+100;[b,b-band].forEach(y=>{c.beginPath();c.moveTo(20,y);c.lineTo(W-20,y);c.stroke()})}
 if(P.model){c.font='88px Cur';c.fillStyle='rgba(120,120,120,.38)';c.textBaseline='alphabetic';
  wrapModel(c,P.model,W-80).slice(0,P.lines).forEach((t,k)=>c.fillText(t,40,k*rowH+100))}
 c.strokeStyle='#1F4E79';c.lineWidth=7;c.lineCap='round';c.lineJoin='round';
 P.strokes.forEach(s=>{c.beginPath();s.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(s.length===1)c.lineTo(s[0][0]+.1,s[0][1]);c.stroke()})}
// ---- átírás
const tr=mkPad($('#trCv'));let trItems=[],trI=0;
function buildTrace(){const s=D[cur];trItems=[];[...new Set(s.syl.split(' '))].length&&trItems.push({es:s.syl,hu:'szótagok'});
 s.words.forEach(([e,u])=>trItems.push({es:e,hu:u}));s.sent.forEach(([e,u])=>trItems.push({es:e,hu:u}));
 $('#trSel').innerHTML=trItems.map((t,i)=>`<option value="${i}">${esc(t.es)}</option>`).join('');trI=0;setTrace()}
function setTrace(){$('#trSel').value=trI;const it=trItems[trI];tr.strokes=[];tr.model=$('#trModel').checked?it.es:'';
 const lines=it.es.length>30?3:(it.es.length>16?2:1);sizePad(tr,lines+1);$('#trHu').textContent=huOn?'Magyarul: '+it.hu:'';drawTrace()}
function drawTrace(){if(trItems.length)drawPad(tr)}
$('#trSel').onchange=e=>{trI=+e.target.value;setTrace()};
$('#trPrev').onclick=()=>{trI=(trI-1+trItems.length)%trItems.length;setTrace()};
$('#trNext').onclick=()=>{trI=(trI+1)%trItems.length;setTrace()};
$('#trModel').onchange=()=>{tr.model=$('#trModel').checked?trItems[trI].es:'';drawPad(tr)};
$('#trUndo').onclick=()=>{tr.strokes.pop();drawPad(tr)};$('#trClear').onclick=()=>{tr.strokes=[];drawPad(tr)};
$('#trPlay').onclick=()=>{const it=trItems[trI];if(it.hu==='szótagok')say([...new Set(it.es.split(' '))].map(y=>clip('es',y)));else sayEs(it.es)};
$('#trPlayHu').onclick=()=>{const it=trItems[trI];if(it.hu!=='szótagok')say([clip('hu',it.hu)])};
$('#trDone').onclick=()=>{if(!tr.strokes.length)return;addStar(1);say([clip('hu','Ügyes vagy!')]);trI=(trI+1)%trItems.length;setTrace()};
// ---- diktálás
const dk=mkPad($('#dkCv'));let dkCur=null,dkOk=0,dkAll=0;
function dkPool(){const s=D[cur],k=$('#dkKind').value;if(k==='w')return s.words.map(([e,u])=>({es:e,hu:u}));if(k==='s')return s.sent.map(([e,u])=>({es:e,hu:u}));
 return [...new Set(s.syl.split(' '))].map(y=>({es:y,hu:''}))}
function dkNew(){const p=dkPool();let n;do{n=p[Math.floor(Math.random()*p.length)]}while(p.length>1&&dkCur&&n.es===dkCur.es);dkCur=n;dk.strokes=[];dk.model='';
 sizePad(dk,dkCur.es.length>22?3:2);$('#dkRev').textContent='';drawPad(dk);$('#dkScore').textContent=dkAll?`Eredmény: ${dkOk} / ${dkAll}`:'Hallgasd meg, és írd le folyóírással!'}
function dkSay(){if(dkCur)sayEs(dkCur.es)}
$('#dkKind').onchange=()=>{dkNew();dkSay()};$('#dkPlay').onclick=dkSay;
$('#dkShow').onclick=()=>{$('#dkRev').textContent=dkCur.es+(huOn&&dkCur.hu?'  ('+dkCur.hu+')':'');sayEs(dkCur.es)};
$('#dkOk').onclick=()=>{dkOk++;dkAll++;addStar(1);say([clip('hu','Nagyon jó!')]);setTimeout(()=>{dkNew();dkSay()},1400)};
$('#dkNo').onclick=()=>{dkAll++;$('#dkRev').textContent=dkCur.es;sayEs(dkCur.es);setTimeout(()=>{dkNew();dkSay()},2600)};
$('#dkClear').onclick=()=>{dk.strokes=[];drawPad(dk)};
// ---- kvíz
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let QZ=null;
$('#qzStart').onclick=()=>{const all=$('#qzAll').checked;const src=all?D:[D[cur]];let pool=[];src.forEach(s=>s.words.forEach(([e,u])=>pool.push({es:e,hu:u})));
 const N=+$('#qzN').value,mode=$('#qzMode').value;const qs=[];for(let i=0;i<N;i++){const it=pool[Math.floor(Math.random()*pool.length)];
  const m=mode==='mix'?['hear','mean','es'][Math.floor(Math.random()*3)]:mode;const wrong=shuffle(pool.filter(p=>p.es!==it.es)).slice(0,3);qs.push({it,m,opts:shuffle([it,...wrong])})}
 QZ={qs,i:0,ok:0};qzShow()};
function qzShow(){const B=$('#qzBox');if(QZ.i>=QZ.qs.length){B.innerHTML=`<p class="q"><span class="kit j">😺</span> Kész! ${QZ.ok} / ${QZ.qs.length} jó válasz.</p>`;addStar(Math.round(QZ.ok/5));return}
 const Q=QZ.qs[QZ.i];let h=`<p class="score">${QZ.i+1}. kérdés / ${QZ.qs.length} · jó: ${QZ.ok} <span class="kit" id="kit">🐱</span></p>`;
 if(Q.m==='hear')h+=`<p class="q">🔊 Melyik szót hallod? <button class="ab" id="qRep">🔊 Újra</button></p>`;
 if(Q.m==='mean')h+=`<p class="q">Mit jelent? <span class="cur" style="font-size:30px;font-weight:400">${esc(Q.it.es)}</span> <button class="ab" id="qRep">🔊</button></p>`;
 if(Q.m==='es')h+=`<p class="q">Hogy mondják spanyolul: „${esc(Q.it.hu)}”?</p>`;
 h+='<div class="opts">'+Q.opts.map((o,k)=>`<button class="opt ${Q.m==='mean'?'':'cur2'}" data-k="${k}">${esc(Q.m==='mean'?o.hu:o.es)}</button>`).join('')+'</div>';B.innerHTML=h;
 const rep=()=>sayEs(Q.it.es);if(Q.m!=='es')rep();else if(huOn)say([clip('hu',Q.it.hu)]);const r=$('#qRep');if(r)r.onclick=rep;
 B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.done)return;Q.done=1;const o=Q.opts[b.dataset.k],good=o.es===Q.it.es;
  B.querySelectorAll('.opt').forEach(x=>{if(Q.opts[x.dataset.k].es===Q.it.es)x.classList.add('ok')});if(!good)b.classList.add('no');
  const k=$('#kit');k.textContent=good?'😹':'😿';k.className='kit '+(good?'j':'c');if(good)QZ.ok++;
  say(huOn?[clip('es',Q.it.es),clip('hu',Q.it.hu)]:[clip('es',Q.it.es)]);setTimeout(()=>{QZ.i++;qzShow()},good?1900:2900)})}
window.addEventListener('resize',()=>{if(cur!==null){setTrace();drawPad(dk)}});
tiles();
if(document.fonts&&document.fonts.load)document.fonts.load('40px Cur').then(()=>{if(cur!==null){drawPad(tr);drawPad(dk)}});
const last=LS.get('last',null);if(last!==null&&D[last])open(last);
</script>
