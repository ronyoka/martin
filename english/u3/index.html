<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 3 – Unit 3: A day in the life</title>
<style>
:root{--bg:#FFF4D6;--ink:#1E2A38;--muted:#5B6B7C;--card:#FFFFFF;--line:#EADFCB;--soft:#FBEBC8;--acc:#E8833A;--green:#6BBF59;--navy:#1F4E79;--ok:#2E7D5B;--okbg:#E3F4E8;--bad:#C0392B;--badbg:#FBE5E2;--hl:#FFE27A;--chip:#E3F0FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A22;--ink:#EEF2F6;--muted:#A6B3C2;--card:#1D2531;--line:#2C3747;--soft:#26303D;--chip:#22364D;--okbg:#1B3A2A;--badbg:#3E2220;--hl:#6B5A10}}
:root[data-theme="dark"]{--bg:#141A22;--ink:#EEF2F6;--muted:#A6B3C2;--card:#1D2531;--line:#2C3747;--soft:#26303D;--chip:#22364D;--okbg:#1B3A2A;--badbg:#3E2220;--hl:#6B5A10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI','Nunito',system-ui,sans-serif;font-size:17px;line-height:1.45}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:800}
.top a{color:var(--navy);text-decoration:none}
.unav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.unav a{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--soft)}.unav a.on{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.top a{color:#9CC3EA}}
.hero{display:flex;gap:16px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.hero .num{width:64px;height:64px;border-radius:20px;background:var(--green);color:#fff;font:900 34px 'Segoe UI Black',sans-serif;display:grid;place-items:center;flex:none}
.hero h1{margin:0;font-family:'Segoe UI Black','Arial Black',sans-serif;font-size:clamp(24px,5vw,36px);line-height:1.1}
.hero .sub{color:var(--muted)}
.stars{margin-left:auto;font-weight:900;font-size:20px;color:#B9770E}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tab{border:none;border-radius:16px;padding:10px 16px;font-weight:900;cursor:pointer;background:var(--soft);min-height:48px;font-size:16px}
.tab.on{background:var(--acc);color:#fff}
.sw{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;margin-left:auto}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sec{border:2px solid var(--line);border-radius:20px;padding:12px;background:var(--bg);cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;min-height:90px}
.sec .ic{width:56px;height:56px;flex:none}
.sec .ic svg{width:56px;height:56px}
.sec b{display:block;font-size:18px}
.sec small{color:var(--muted);display:block}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.pchip{display:inline-flex;align-items:center;gap:4px;border:none;border-radius:999px;background:var(--chip);color:var(--navy);padding:3px 10px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.pchip{color:#9CC3EA}}
.kind{display:inline-block;border-radius:999px;background:var(--green);color:#fff;font-size:13px;font-weight:800;padding:2px 10px}
.schips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.schip{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;display:flex;gap:6px;align-items:center}
.schip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.schip .e{width:24px;height:24px}.schip .e svg{width:24px;height:24px}
.card{border:3px solid var(--line);border-radius:24px;padding:16px;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:center;min-height:320px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
.card .pic{display:grid;place-items:center;min-height:200px;background:var(--card);border-radius:18px;padding:8px}
.card .pic svg{width:100%;max-width:360px;height:auto;max-height:260px}
.card .pic .emo svg{width:150px;height:150px}
.es{font-size:23px;font-weight:700}
.hu{color:var(--muted);font-size:17px;margin-top:6px}
.es .w{cursor:pointer;border-radius:6px;padding:0 1px}
.es .w:hover{background:var(--soft)}
mark{background:var(--hl);color:inherit;border-radius:6px;padding:0 3px;font-weight:900}
.abtn{border:none;border-radius:14px;padding:8px 12px;font-weight:900;cursor:pointer;background:var(--soft);min-height:44px;min-width:56px}
.abtn.h{background:var(--chip)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px}
.big{border:none;border-radius:999px;padding:12px 22px;font-weight:900;cursor:pointer;min-height:50px;background:var(--navy);color:#fff;font-size:17px}
.big.l{background:var(--soft);color:var(--ink)}.big.g{background:var(--ok)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}.dots i.on{background:var(--acc)}.dots i.done{background:var(--green)}
.check{margin-top:12px;border-top:2px dashed var(--line);padding-top:10px}
.check .q{font-weight:800}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.opt{border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--card);cursor:pointer;text-align:left;min-height:52px}
.opt small{display:block;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.rule{margin-top:16px;border-radius:24px;padding:16px;background:linear-gradient(135deg,#FFE9A8,#FFD4A3);color:#3B2A10;border:3px solid #F2B55A}
.rule h3{margin:0 0 6px;font-size:22px}
.rule .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.rule .it{background:#FFF8E6;border-radius:16px;padding:10px;cursor:pointer;border:2px solid #F2C36E}
.rule .it b{display:block;font-size:19px}
.rule .it span{display:block;color:#6B5426;font-size:15px}
.wid{margin-top:16px;border:3px solid var(--line);border-radius:22px;padding:14px;background:var(--bg)}
.wid h4{margin:0;font-size:19px}
.wid .pr{color:var(--muted)}
.tw{font-size:24px;line-height:2.1}
.tw .tok{border:2px solid var(--line);border-radius:10px;padding:2px 8px;margin:2px;cursor:pointer;display:inline-block;background:var(--card);line-height:1.4}
.tw .tok.sel{background:var(--hl)}.tw .tok.ok{background:var(--okbg);border-color:var(--ok)}.tw .tok.no{background:var(--badbg);border-color:var(--bad)}.tw .tok.miss{border-color:var(--ok);border-style:dashed}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tile{border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--card);cursor:pointer;font-weight:800;min-height:44px}
.tile.sel{outline:4px solid var(--acc)}.tile.ok{background:var(--okbg);border-color:var(--ok)}.tile.no{background:var(--badbg);border-color:var(--bad)}.tile.used{opacity:.35;pointer-events:none}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:3px dashed var(--acc);border-radius:18px;padding:10px;min-height:110px;cursor:pointer;background:var(--card)}
.bin b{display:block}.bin .in{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fillq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0}
.fillq .w{font-size:24px;font-weight:800;min-width:150px}
.fillq .e{width:40px;height:40px}.fillq .e svg{width:40px;height:40px}
.res{font-weight:900;margin-top:8px;min-height:24px}
.kit{display:inline-block;font-size:34px;transition:transform .2s}.kit.j{animation:j .6s}.kit.c{animation:c .5s}
@keyframes j{50%{transform:translateY(-18px) rotate(-10deg)}}@keyframes c{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ex{display:grid;grid-template-columns:64px 1fr;gap:12px;border-bottom:2px dashed var(--line);padding:12px 0;align-items:center}
.ex .e svg{width:64px;height:64px}
.ex .hu.hide{filter:blur(6px);cursor:pointer}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.wc{perspective:600px;height:190px;cursor:pointer}
.wc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.wc.f .in{transform:rotateY(180deg)}
.wc .fa,.wc .ba{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--line);border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.wc .ba{transform:rotateY(180deg);background:var(--chip)}
.wc .e svg{width:84px;height:84px}
.wc b{font-size:19px}.wc small{color:var(--muted);font-size:13px}
.wc.known .fa{border-color:var(--green)}
.pos{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);font-weight:800}
.filt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filt input,.filt select{font:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .box{background:var(--card);border-radius:24px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.pgtabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.pgt{border:2px solid var(--line);background:var(--card);color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;cursor:pointer;min-height:40px}.pgt.on{background:var(--navy);color:#fff;border-color:var(--navy)}.pgx{background:var(--chip);border-radius:14px;padding:8px 12px;margin:6px 0}.pchip{white-space:normal!important;text-align:left}
.ovs{background:var(--card);border:3px solid var(--acc);border-radius:24px;padding:14px;margin:0 0 14px}
.ovs-head b{font-size:21px}.ovs-hu{color:var(--muted);font-size:15px;margin-top:2px}.ovs-meta{margin-top:6px;font-weight:800;color:var(--navy)}
.ovs-l{border:2px solid var(--line);border-radius:18px;margin:10px 0;background:var(--bg)}
.ovs-l summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none;min-height:44px}.ovs-l summary::-webkit-details-marker{display:none}
.ovs-l summary small{display:block;color:var(--muted);font-weight:400}.ovs-ic{font-size:28px}.ovs-pg{margin-left:auto;font-size:13px;font-weight:800;color:var(--navy);background:var(--chip);border-radius:999px;padding:3px 9px;white-space:normal;text-align:right;max-width:40%}
.ovs-c{margin:0;padding:0 14px 4px 34px}.ovs-c li{margin:6px 0}.ovs-ex{font-size:15px;margin-top:2px}
.ovs-t{background:var(--card);border:2px dashed var(--line);border-radius:14px;margin:8px 12px;padding:10px}.ovs-q{font-weight:800}
.ovs-o{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ovs-o button,.ovs-chk{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px;text-align:left}
.ovs-o button small{display:block;font-weight:400;color:var(--muted);font-size:13px}.ovs-chk{margin-top:8px;background:var(--acc);color:#fff;border-color:var(--acc)}
.ovs-o button.ok,.ovs-m select.ok{background:var(--okbg);border-color:var(--ok)}.ovs-o button.no,.ovs-m select.no{background:var(--badbg);border-color:var(--bad)}
.ovs-m{display:grid;gap:6px;margin-top:8px}.ovs-mr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ovs-ma{min-width:120px;font-weight:800}.ovs-ma small{display:block;font-weight:400;color:var(--muted)}
.ovs-m select{font-size:16px;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:40px;max-width:100%}
.ovs-r{margin-top:6px;min-height:1em}
.ovs-m select{flex:1 1 180px;min-width:0;width:100%}.ovs-mr{min-width:0}

.modal img{width:100%;border-radius:12px;border:1px solid var(--line)}
.hide{display:none!important}
.games{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mc{height:110px;border-radius:16px;border:3px solid var(--line);background:var(--acc);cursor:pointer;display:grid;place-items:center;font-weight:900;color:#fff;font-size:30px}
.mc.open{background:var(--card);color:var(--ink);font-size:17px}.mc.done{background:var(--okbg);border-color:var(--ok);color:var(--ink);font-size:17px}
.mc .e svg{width:70px;height:70px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pg{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--bg);cursor:pointer;text-align:left}
.foot{color:var(--muted);font-size:13px;margin:24px 0}
@media (max-width:720px){.card{grid-template-columns:1fr}.card .pic{min-height:150px}.es{font-size:20px}.cols{grid-template-columns:1fr}.sw{margin-left:0}}

/* ---------- Gyakorló a könyv szerint (gy) ---------- */
.gyhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.gyc{border:2px solid var(--line);border-radius:20px;padding:12px;margin:14px 0;background:var(--bg)}
.gyc h4{margin:0;font-size:18px}
.gyc .ins{font-weight:900;font-size:18px}
.gyc .inshu{color:var(--muted);font-size:15px;margin:2px 0 8px}
.gytype{display:inline-block;background:var(--chip);border-radius:10px;padding:2px 8px;font-size:13px;font-weight:800;color:var(--navy)}
@media (prefers-color-scheme:dark){.gytype{color:#9CC3EA}}
.gybody{margin-top:8px}
.gyfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.gyres{font-weight:800}
.gygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gyi{border:2px solid var(--line);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.gyi .num{position:absolute;top:6px;left:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;background:var(--card)}
.gyi .pic{display:grid;place-items:center;min-height:84px}
.gyi .pic svg{width:76px;height:76px}
.gyi .pic .e svg{width:76px;height:76px}
.gyi .qt{font-weight:800;text-align:center}
.gyo{border:2px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;justify-content:space-around;gap:4px}
.gyo button{border:2px solid transparent;background:none;border-radius:999px;padding:6px 10px;cursor:pointer;font-weight:700;min-height:40px;font-size:16px}
.gyo button.cir{border-color:var(--navy)}
.gyo button.ok{border-color:var(--ok);background:var(--okbg)}
.gyo button.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.gyo button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gyhu{color:var(--muted);font-size:14px;text-align:center}
/* match */
.gym{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px 80px}
.gym svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.gym .col{display:flex;flex-direction:column;gap:10px}
.gym button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;background:var(--card);padding:6px 12px;min-height:48px;cursor:pointer;text-align:left;font-size:16px;font-weight:700}
.gym button .bd{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:14px}
.gym button.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--hl)}
.gym button.ok{border-color:var(--ok);background:var(--okbg)}
.gym button.no{border-color:var(--bad);background:var(--badbg)}
.gym button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gym button .e svg{width:40px;height:40px}
@media (max-width:560px){.gym{gap:8px 34px}.gym button{font-size:14px;padding:4px 8px}}
/* keresztrejtvény + szókereső */
.cw{display:inline-grid;gap:2px;margin:6px 0;user-select:none}
.cw .c{width:34px;height:34px;position:relative}
.cw .c.on{background:var(--card);border:2px solid var(--ink);border-radius:4px}
.cw .c input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:800 19px 'Segoe UI',sans-serif;text-transform:lowercase;color:var(--ink);padding:0}
.cw .c input:focus{outline:3px solid var(--hl)}
.cw .c .n{position:absolute;top:-1px;left:2px;font-size:10px;font-weight:900;color:var(--muted);pointer-events:none}
.cw .c.ok{background:var(--okbg)}.cw .c.no{background:var(--badbg)}
.cwclues{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.cwclue{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:4px 8px;background:var(--card);cursor:pointer}
.cwclue b{min-width:22px}
.cwclue span{min-width:0;overflow-wrap:anywhere;font-size:15px;line-height:1.25}
.cwclue .e svg{width:44px;height:44px}
.cwclue.done{border-color:var(--ok);background:var(--okbg)}
.cwwrap{overflow-x:auto;max-width:100%}
@media (max-width:480px){.cw .c{width:27px;height:27px}.cw .c input{font-size:15px}}
.ws{display:inline-grid;gap:3px;user-select:none;touch-action:manipulation}
.ws button{width:34px;height:34px;border:2px solid var(--line);border-radius:8px;background:var(--card);font:800 17px 'Segoe UI',sans-serif;cursor:pointer;padding:0;text-transform:lowercase}
.ws button.s{border-color:var(--acc);background:var(--hl)}
.ws button.f{background:var(--okbg);border-color:var(--ok)}
@media (max-width:480px){.ws button{width:28px;height:28px;font-size:14px}}
/* írás */
.gyw{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;background:var(--card);padding:8px;margin:8px 0}
.gyw .e svg{width:56px;height:56px}
.gyw input.t{font:700 18px 'Segoe UI',sans-serif;padding:8px 10px;border:2px solid var(--line);border-radius:12px;min-width:150px;flex:1 1 160px;background:var(--bg);color:var(--ink)}
.gyw input.t.ok{border-color:var(--ok);background:var(--okbg)}.gyw input.t.no{border-color:var(--bad);background:var(--badbg)}
.lbx{display:inline-flex;gap:3px;flex-wrap:wrap;align-items:center}
.lbx span{min-width:28px;height:36px;border-bottom:3px solid var(--ink);display:inline-grid;place-items:center;font:800 20px 'Segoe UI',sans-serif}
.lbx span.gap{border:2px dashed var(--acc);border-radius:8px;cursor:pointer;color:var(--acc)}
.lbx span.sp{border:0;min-width:12px}
.lbx span.ok{color:var(--ok);border-color:var(--ok)}.lbx span.no{color:var(--bad);border-color:var(--bad)}
.ltiles{display:flex;flex-wrap:wrap;gap:6px}
.ltiles button{min-width:42px;min-height:42px;border:2px solid var(--line);border-radius:12px;background:var(--soft);font:800 19px 'Segoe UI',sans-serif;cursor:pointer;text-transform:lowercase}
.ltiles button.used{opacity:.25;pointer-events:none}
/* mondatkirakó, szódoboz */
.gys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;border-bottom:3px solid var(--line);padding:4px 0;margin:6px 0}
.chip2{border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:6px 10px;font-weight:700;font-size:17px;cursor:pointer;min-height:42px}
.chip2.used{opacity:.25;pointer-events:none}
.chip2.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--hl)}
.chip2.ok{border-color:var(--ok);background:var(--okbg)}.chip2.no{border-color:var(--bad);background:var(--badbg)}
.wbox{border:2px solid var(--navy);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;background:var(--card)}
.gline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-size:18px}
.gline .gapb{min-width:90px;min-height:38px;border:0;border-bottom:3px solid var(--ink);background:none;font:700 18px 'Segoe UI',sans-serif;color:var(--navy);cursor:pointer}
.gline .gapb.act{background:var(--hl)}
.gline .gapb.ok{color:var(--ok);border-color:var(--ok)}.gline .gapb.no{color:var(--bad);border-color:var(--bad)}
/* jelölés a mondatban */
.tws{font-size:20px;line-height:2.2}
.tws .tk{cursor:pointer;padding:2px 3px;border-radius:999px;border:2px solid transparent}
.tws .tk.m-circle{border-color:#2E7D5B}
.tws .tk.m-under{text-decoration:underline 3px #C0392B;text-underline-offset:5px}
.tws .tk.m-blue{border-color:#1F4E79;border-radius:6px}
.tws .tk.bad{background:var(--badbg)}
.tws .tk.miss{background:var(--hl)}
.pens{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pens button{border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card);font-weight:800;cursor:pointer}
.pens button.on{border-color:var(--acc);background:var(--hl)}
.clk svg{width:132px;height:132px}
.code{font:800 16px monospace;display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.code span{border:1px solid var(--line);border-radius:6px;padding:2px 5px;background:var(--card)}
.gyseq{display:flex;flex-direction:column;gap:6px}
.gyseq button{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:6px 10px;font-size:17px;font-weight:700;cursor:pointer;min-height:46px}
.gyseq button .bd{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900}
.gyseq button.ok{border-color:var(--ok);background:var(--okbg)}
.gyseq button.no{border-color:var(--bad);background:var(--badbg)}
.gyseq button .e svg{width:40px;height:40px}
.gyseq small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.gyfilter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gyfilter button{border:2px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);font-weight:800;cursor:pointer;min-height:40px}
.gyfilter button.on{background:var(--green);color:#fff;border-color:var(--green)}

skolába.","ref":{"book":"pb","page":28},"hl":[],"pic":"🚌","svg":null,"check":null},{"id":"pb28c6","es":"After school Stella does her homework at her desk.","hu":"Iskola után Stella megírja a házi feladatát az íróasztalánál.","ref":{"book":"pb","page":28},"hl":[],"pic":"📚","svg":null,"check":null},{"id":"pb28c7","es":"She washes her hands before dinner.","hu":"Vacsora előtt kezet mos.","ref":{"book":"pb","page":28},"hl":[],"pic":"🧼","svg":null,"check":null},{"id":"pb28c8","es":"In the evening she gets undressed and takes off her T-shirt.","hu":"Este levetkőzik, és leveszi a pólóját.","ref":{"book":"pb","page":28},"hl":[],"pic":"👚","svg":null,"check":null},{"id":"pb28c9","es":"Stella goes to bed at nine o'clock. She reads a book in bed.","hu":"Stella kilenc órakor lefekszik. Az ágyban könyvet olvas.","ref":{"book":"pb","page":28},"hl":[],"pic":"😴","svg":null,"check":null},{"id":"pb28c10","es":"We say the time like this: at seven o'clock, at eight o'clock.","hu":"Az időt így mondjuk: at seven o'clock (hét órakor), at eight o'clock (nyolc órakor).","ref":{"book":"pb","page":28},"hl":[],"pic":"🕖","svg":null,"check":null},{"id":"pb28c11","es":"With she or he, the verb gets an -s: she wakes up, he gets up.","hu":"Ha ő (she/he) csinálja, az ige -s végződést kap: she wakes up, he gets up.","ref":{"book":"pb","page":28},"hl":[],"pic":"➕","svg":null,"check":null},{"id":"pb29c0","es":"The boy wakes up in the morning and gets up for breakfast.","hu":"A fiú reggel felébred, és felkel reggelizni.","ref":{"book":"pb","page":29},"hl":[],"pic":"🌅","svg":null,"check":null},{"id":"pb29c1","es":"He has a shower and gets dressed at seven o'clock.","hu":"Lezuhanyozik, és hét órakor felöltözik.","ref":{"book":"pb","page":29},"hl":[],"pic":"👕","svg":null,"check":null},{"id":"pb29c2","es":"He catches the bus to school at eight o'clock.","hu":"Nyolc órakor elkapja az iskolabuszt.","ref":{"book":"pb","page":29},"hl":[],"pic":"🚌","svg":null,"check":null},{"id":"pb29c3","es":"He does his homework on the bus, on the way to school.","hu":"A buszon, útközben írja meg a házi feladatát.","ref":{"book":"pb","page":29},"hl":[],"pic":"📚","svg":null,"check":null},{"id":"pb29c4","es":"Lessons start at nine o'clock and he sees his teacher.","hu":"Kilenc órakor kezdődnek az órák, és látja a tanárát.","ref":{"book":"pb","page":29},"hl":[],"pic":"🧑‍🏫","svg":null,"check":null},{"id":"pb29c5","es":"At eleven o'clock the children go out to play.","hu":"Tizenegy órakor a gyerekek kimennek játszani.","ref":{"book":"pb","page":29},"hl":[],"pic":"⚽","svg":null,"check":null},{"id":"pb29c6","es":"He washes his hands at six o'clock, before dinner.","hu":"Hat órakor, vacsora előtt kezet mos.","ref":{"book":"pb","page":29},"hl":[],"pic":"🧼","svg":null,"check":null},{"id":"pb29c7","es":"He gets undressed and goes to bed at nine o'clock.","hu":"Levetkőzik, és kilenc órakor lefekszik.","ref":{"book":"pb","page":29},"hl":[],"pic":"😴","svg":null,"check":null},{"id":"pb29c8","es":"We ask: What time does he get dressed?","hu":"Így kérdezünk: Hány órakor öltözik fel?","ref":{"book":"pb","page":29},"hl":[],"pic":"❓","svg":null,"check":null},{"id":"pb29c9","es":"We answer: He gets dressed at seven o'clock.","hu":"Így válaszolunk: Hét órakor öltözik fel.","ref":{"book":"pb","page":29},"hl":[],"pic":"🕖","svg":null,"check":null},{"id":"pb29c10","es":"We ask a friend: What do you do before breakfast? After school?","hu":"Barátunkat így kérdezzük: Mit csinálsz reggeli előtt? Iskola után?","ref":{"book":"pb","page":29},"hl":[],"pic":"🗣️","svg":null,"check":null},{"id":"ab28c0","es":"A routine is the things we do every day.","hu":"A napirend (routine) azok a dolgok, amiket minden nap csinálunk.","ref":{"book":"ab","page":28},"hl":[],"pic":"📅","svg":null,"check":null},{"id":"ab28c1","es":"Alisha wakes up early at seven o'clock.","hu":"Alisha korán, hét órakor ébred.","ref":{"book":"ab","page":28},"hl":[],"pic":"⏰","svg":null,"check":null},{"id":"ab28c2","es":"Then she gets up and has a shower.","hu":"Aztán felkel és lezuhanyozik.","ref":{"book":"ab","page":28},"hl":[],"pic":"🚿","svg":null,"check":null},{"id":"ab28c3","es":"After that she gets dressed.","hu":"Utána felöltözik.","ref":{"book":"ab","page":28},"hl":[],"pic":"👕","svg":null,"check":null},{"id":"ab28c4","es":"She goes downstairs and has breakfast. She loves breakfast!","hu":"Lemegy a földszintre és megreggelizik. Imádja a reggelit!","ref":{"book":"ab","page":28},"hl":[],"pic":"🥣","svg":null,"check":null},{"id":"ab28c5","es":"After breakfast she goes to school.","hu":"Reggeli után iskolába megy.","ref":{"book":"ab","page":28},"hl":[],"pic":"🏫","svg":null,"check":null},{"id":"ab28c6","es":"School starts at nine o'clock.","hu":"Az iskola kilenckor kezdődik.","ref":{"book":"ab","page":28},"hl":[],"pic":"🕘","svg":null,"check":null},{"id":"ab28c7","es":"She has lunch at school with her friends.","hu":"Az iskolában ebédel a barátaival.","ref":{"book":"ab","page":28},"hl":[],"pic":"🥪","svg":null,"check":null},{"id":"ab28c8","es":"School finishes at three o'clock and she goes home.","hu":"Az iskola háromkor ér véget, és hazamegy.","ref":{"book":"ab","page":28},"hl":[],"pic":"🏠","svg":null,"check":null},{"id":"ab28c9","es":"She has dinner, does homework and watches TV.","hu":"Vacsorázik, megírja a házit és tévét néz.","ref":{"book":"ab","page":28},"hl":[],"pic":"📺","svg":null,"check":null},{"id":"ab28c10","es":"She goes to bed at nine o'clock.","hu":"Kilenckor lefekszik aludni.","ref":{"book":"ab","page":28},"hl":[],"pic":"😴","svg":null,"check":null},{"id":"ab28c11","es":"In the picture a boy is waking up. The clock says seven o'clock.","hu":"A képen egy fiú ébredezik. Az óra hetet mutat.","ref":{"book":"ab","page":28},"hl":[],"pic":"🕖","svg":null,"check":null},{"id":"ab28c12","es":"A man with a moustache is having a shower.","hu":"Egy bajuszos férfi zuhanyozik.","ref":{"book":"ab","page":28},"hl":[],"pic":"🚿","svg":null,"check":null},{"id":"ab28c13","es":"A man with a beard is getting dressed.","hu":"Egy szakállas férfi öltözik.","ref":{"book":"ab","page":28},"hl":[],"pic":"🧥","svg":null,"check":null},{"id":"ab28c14","es":"A woman with curly hair is getting up.","hu":"Egy göndör hajú nő felkel.","ref":{"book":"ab","page":28},"hl":[],"pic":"🛏️","svg":null,"check":null},{"id":"ab28c15","es":"We say: I wake up, I get up, I go to bed.","hu":"Így mondjuk: I wake up (felébredek), I get up (felkelek), I go to bed (lefekszem).","ref":{"book":"ab","page":28},"hl":[],"pic":"🗣️","svg":null,"check":null},{"id":"ab29c0","es":"When the long hand is on twelve, we say o'clock.","hu":"Ha a nagy mutató a 12-n áll, azt mondjuk: o'clock (egész óra).","ref":{"book":"ab","page":29},"hl":[],"pic":"🕛","svg":null,"check":null},{"id":"ab29c1","es":"The short hand shows the hour.","hu":"A kis mutató mutatja, hány óra van.","ref":{"book":"ab","page":29},"hl":[],"pic":"🕐","svg":null,"check":null},{"id":"ab29c2","es":"Short hand on ten: it's ten o'clock.","hu":"Kis mutató a 10-en: tíz óra van.","ref":{"book":"ab","page":29},"hl":[],"pic":"🕙","svg":null,"check":null},{"id":"ab29c3","es":"A digital clock shows 11:00. It's eleven o'clock.","hu":"A digitális óra 11:00-t mutat. Tizenegy óra van.","ref":{"book":"ab","page":29},"hl":[],"pic":"⌚","svg":null,"check":null},{"id":"ab29c4","es":"03:00 is three o'clock.","hu":"A 03:00 három óra.","ref":{"book":"ab","page":29},"hl":[],"pic":"🕒","svg":null,"check":null},{"id":"ab29c5","es":"'Before' means something happens first.","hu":"A 'before' azt jelenti: előtte, mielőtt – az történik előbb.","ref":{"book":"ab","page":29},"hl":[],"pic":"⬅️","svg":null,"check":null},{"id":"ab29c6","es":"'After' means something happens later.","hu":"Az 'after' azt jelenti: utána, miután – az történik később.","ref":{"book":"ab","page":29},"hl":[],"pic":"➡️","svg":null,"check":null},{"id":"ab29c7","es":"I take off my clothes before I have a shower.","hu":"Leveszem a ruháimat, mielőtt lezuhanyozom.","ref":{"book":"ab","page":29},"hl":[],"pic":"🚿","svg":null,"check":null},{"id":"ab29c8","es":"I put on my socks before I put on my shoes.","hu":"Előbb a zoknit veszem fel, aztán a cipőt.","ref":{"book":"ab","page":29},"hl":[],"pic":"🧦","svg":null,"check":null},{"id":"ab29c9","es":"I go to bed after I have dinner.","hu":"Vacsora után fekszem le.","ref":{"book":"ab","page":29},"hl":[],"pic":"😴","svg":null,"check":null},{"id":"ab29c10","es":"Ask a friend: Do you get dressed after breakfast?","hu":"Kérdezd meg a barátodat: Reggeli után öltözöl fel?","ref":{"book":"ab","page":29},"hl":[],"pic":"❓","svg":null,"check":null},{"id":"ab29c11","es":"Answer: Yes, I do. or No, I don't.","hu":"Válasz: Yes, I do. (Igen.) vagy No, I don't. (Nem.)","ref":{"book":"ab","page":29},"hl":[],"pic":"💬","svg":null,"check":null},{"id":"ab29c12","es":"Then say: Same! or Different!","hu":"Aztán mondd: Same! (Ugyanaz!) vagy Different! (Más!)","ref":{"book":"ab","page":29},"hl":[],"pic":"🟰","svg":null,"check":null}],"rule":{"es":"I wake up – she wakes up. I wash – she washes.","hu":"Én felébredek: I wake up – ő felébred: she wakes up. Mosakszom: I wash – mosakszik: she washes.","ref":{"book":"pb","page":28},"items":[{"es":"at + time: at seven o'clock","hu":"Időpont előtt: at → at seven o'clock = hét órakor"},{"es":"What time does he …? – He … at … o'clock.","hu":"Hány órakor …? – … órakor."},{"es":"What do you do before / after breakfast?","hu":"Mit csinálsz reggeli előtt / után?"},{"es":"wake up = felébred, get up = felkel (az ágyból)","hu":"Először felébredsz (wake up), aztán felkelsz (get up)."},{"es":"He is getting dressed. = Éppen öltözik.","hu":"Az -ing alak azt mutatja, mit csinál valaki ÉPPEN most."},{"es":"long hand on 12 → ... o'clock","hu":"Nagy mutató a 12-n → egész óra (o'clock)."},{"es":"before = előtt · after = után","hu":"before = előtt, mielőtt · after = után, miután"}]},"widgets":[{"id":"pb28tf","type":"truefalse","ref":{"book":"pb","page":28},"prompt":"True or false?","prompt_hu":"Igaz vagy hamis?","items":[{"t":"Stella wakes up at seven o'clock.","hu":"Stella hét órakor ébred fel.","answer":true},{"t":"Stella has a shower after dinner.","hu":"Stella vacsora után zuhanyozik.","answer":false},{"t":"'Get undressed' means to take off your clothes.","hu":"A „get undressed” azt jelenti: levetkőzni.","answer":true},{"t":"Stella catches the bus at eight o'clock.","hu":"Stella nyolc órakor szál fel a buszra.","answer":true},{"t":"Stella goes to bed at ten o'clock.","hu":"Stella tíz órakor fekszik le.","answer":false}]},{"id":"pb28t1","type":"choice","ref":{"book":"pb","page":28,"ex":"1"},"prompt":"Listen and say the letter.","prompt_hu":"Hallgasd meg, és mondd meg a kép betűjét!","items":[{"q":"Picture a: Stella is in bed, the alarm clock rings. What does she do?","q_hu":"a kép: Stella az ágyban van, csörög az ébresztő. Mit csinál?","options":[{"t":"wake up","hu":"felébred"},{"t":"go to bed","hu":"lefekszik aludni"},{"t":"do homework","hu":"házi feladatot ír"}],"answer":0},{"q":"Picture b: Stella is at the sink with a towel.","q_hu":"b kép: Stella a mosdónál áll egy törölközővel.","options":[{"t":"catch the bus","hu":"eléri a buszt"},{"t":"wash","hu":"megmosakszik"},{"t":"get up","hu":"felkel"}],"answer":1},{"q":"Picture c: Stella is next to a big bus.","q_hu":"c kép: Stella egy nagy busz mellett áll.","options":[{"t":"go to bed","hu":"lefekszik aludni"},{"t":"have a shower","hu":"lezuhanyozik"},{"t":"catch the bus","hu":"eléri a buszt"}],"answer":2},{"q":"Picture d: It is night. Stella is in bed with a book.","q_hu":"d kép: Éjszaka van. Stella egy könyvvel az ágyban van.","options":[{"t":"go to bed","hu":"lefekszik aludni"},{"t":"get dressed","hu":"felöltözik"},{"t":"wake up","hu":"felébred"}],"answer":0},{"q":"Picture e: Stella is in the shower.","q_hu":"e kép: Stella a zuhany alatt van.","options":[{"t":"do homework","hu":"házi feladatot ír"},{"t":"have a shower","hu":"lezuhanyozik"},{"t":"take off","hu":"levesz (ruhát)"}],"answer":1},{"q":"Picture f: Stella is at her desk with books.","q_hu":"f kép: Stella az íróasztalán y.","hu":"A hét napjai: hétfő, kedd, szerda, csütörtök és péntek.","ref":{"book":"pb","page":30},"hl":[],"pic":"📅","svg":null,"check":null},{"id":"pb30c1","es":"Saturday and Sunday are the weekend.","hu":"A szombat és a vasárnap a hétvége.","ref":{"book":"pb","page":30},"hl":[],"pic":"🎉","svg":null,"check":null},{"id":"pb30c2","es":"In English, days always start with a capital letter: Monday.","hu":"Angolul a napokat mindig nagy kezdőbetűvel írjuk: Monday.","ref":{"book":"pb","page":30},"hl":[],"pic":"🔠","svg":null,"check":null},{"id":"pb30c3","es":"We ask: What do you do on Mondays? – I go swimming.","hu":"Így kérdezünk: Mit csinálsz hétfőnként? – Úszni járok.","ref":{"book":"pb","page":30},"hl":[],"pic":"🏊","svg":null,"check":null},{"id":"pb30c4","es":"Always means every time. Three ticks: ✓✓✓.","hu":"Az always azt jelenti: mindig. Három pipa: ✓✓✓.","ref":{"book":"pb","page":30},"hl":[],"pic":"✅","svg":null,"check":null},{"id":"pb30c5","es":"Sometimes means not every time. One tick: ✓.","hu":"A sometimes azt jelenti: néha. Egy pipa: ✓.","ref":{"book":"pb","page":30},"hl":[],"pic":"☑️","svg":null,"check":null},{"id":"pb30c6","es":"Never means not one time. A cross: ✗.","hu":"A never azt jelenti: soha. Egy x: ✗.","ref":{"book":"pb","page":30},"hl":[],"pic":"❌","svg":null,"check":null},{"id":"pb30c7","es":"The word goes before the action: She sometimes plays football.","hu":"A szó a cselekvés elé kerül: She sometimes plays football. (Néha focizik.)","ref":{"book":"pb","page":30},"hl":[],"pic":"⚽","svg":null,"check":null},{"id":"pb30c8","es":"He always wakes up at seven o'clock. They never go to school on Sundays.","hu":"Mindig hétkor ébred. Vasárnaponként soha nem mennek iskolába.","ref":{"book":"pb","page":30},"hl":[],"pic":"🕖","svg":null,"check":null},{"id":"pb30c9","es":"On Mondays the park is closed, so Simon never plays there. He does his homework.","hu":"Hétfőn a park zárva van, ezért Simon soha nem játszik ott. A leckéjét írja.","ref":{"book":"pb","page":30},"hl":[],"pic":"🌳","svg":null,"check":null},{"id":"pb31c0","es":"James Flunk is a music teacher.","hu":"James Flunk zenetanár.","ref":{"book":"pb","page":31},"hl":[],"pic":"🎹","svg":null,"check":null},{"id":"pb31c1","es":"At school he always plays the piano.","hu":"Az iskolában mindig zongorázik.","ref":{"book":"pb","page":31},"hl":[],"pic":"🎹","svg":null,"check":null},{"id":"pb31c2","es":"But he never plays the piano in his holidays.","hu":"De a szünidőben soha nem zongorázik.","ref":{"book":"pb","page":31},"hl":[],"pic":"🏖️","svg":null,"check":null},{"id":"pb31c3","es":"James loves tennis, so he always plays on Wednesdays.","hu":"James imádja a teniszt, ezért szerdánként mindig játszik.","ref":{"book":"pb","page":31},"hl":[],"pic":"🎾","svg":null,"check":null},{"id":"pb31c4","es":"He sometimes plays football with his daughter Jane. She sometimes scores a goal.","hu":"Néha focizik a lányával, Jane-nel. Jane néha gólt rúg.","ref":{"book":"pb","page":31},"hl":[],"pic":"⚽","svg":null,"check":null},{"id":"pb31c5","es":"Every Saturday he takes his son to his swimming lesson, but James never goes swimming.","hu":"Minden szombaton elviszi a fiát úszóórára, de James soha nem úszik.","ref":{"book":"pb","page":31},"hl":[],"pic":"🏊","svg":null,"check":null},{"id":"pb31c6","es":"He sometimes takes his family to the mountains on Sundays.","hu":"Vasárnaponként néha elviszi a családját a hegyekbe.","ref":{"book":"pb","page":31},"hl":[],"pic":"⛰️","svg":null,"check":null},{"id":"pb31c7","es":"They sometimes sing songs in the car.","hu":"Az autóban néha dalokat énekelnek.","ref":{"book":"pb","page":31},"hl":[],"pic":"🚗","svg":null,"check":null},{"id":"pb31c8","es":"We can make sentences: I never ride my bike on Wednesdays.","hu":"Mondatokat alkothatunk: Szerdánként soha nem biciklizek.","ref":{"book":"pb","page":31},"hl":[],"pic":"🚲","svg":null,"check":null},{"id":"pb31c9","es":"Time words go at the end: on Saturdays, after school, in the morning.","hu":"Az időt jelentő szavak a monda  Archie napirendjét olvassuk el, és válaszolunk a kérdésekre (mit csinál hány órakor). A nyelvtani doboz azt tanítja, hogyan kérdezzük meg, milyen gyakran csinál valaki valamit (How often…?), és hogyan válaszolunk: never, sometimes, always, every day. Egyes szám 3. személyben (he/she) az ige végére -s kerül.","cards":[{"id":"hb12c0","es":"This unit is called “A day in the life”.","hu":"Ennek a fejezetnek a címe: „Egy nap az életből”.","ref":{"book":"hb","page":12},"hl":[],"pic":"📖","svg":null,"check":null},{"id":"hb12c1","es":"Archie writes about his day.","hu":"Archie leírja, hogyan telik a napja.","ref":{"book":"hb","page":12},"hl":[],"pic":"✏️","svg":null,"check":null},{"id":"hb12c2","es":"At seven o'clock he wakes up, gets up and has a shower.","hu":"Hét órakor felébred, felkel és lezuhanyozik.","ref":{"book":"hb","page":12},"hl":[],"pic":"🚿","svg":null,"check":null},{"id":"hb12c3","es":"Then he gets dressed.","hu":"Aztán felöltözik.","ref":{"book":"hb","page":12},"hl":[],"pic":"👕","svg":null,"check":null},{"id":"hb12c4","es":"At eight o'clock he has breakfast and goes to school.","hu":"Nyolc órakor reggelizik, és elmegy az iskolába.","ref":{"book":"hb","page":12},"hl":[],"pic":"🥣","svg":null,"check":null},{"id":"hb12c5","es":"After school, at three o'clock, he catches the bus.","hu":"Iskola után, három órakor felszáll a buszra.","ref":{"book":"hb","page":12},"hl":[],"pic":"🚌","svg":null,"check":null},{"id":"hb12c6","es":"Then he does his homework.","hu":"Aztán megcsinálja a házi feladatát.","ref":{"book":"hb","page":12},"hl":[],"pic":"📝","svg":null,"check":null},{"id":"hb12c7","es":"At six o'clock he has dinner.","hu":"Hat órakor vacsorázik.","ref":{"book":"hb","page":12},"hl":[],"pic":"🍽️","svg":null,"check":null},{"id":"hb12c8","es":"After dinner he washes his face and gets undressed.","hu":"Vacsora után megmossa az arcát és levetkőzik.","ref":{"book":"hb","page":12},"hl":[],"pic":"🧼","svg":null,"check":null},{"id":"hb12c9","es":"At nine o'clock he goes to bed.","hu":"Kilenc órakor lefekszik aludni.","ref":{"book":"hb","page":12},"hl":[],"pic":"😴","svg":null,"check":null},{"id":"hb12c10","es":"We ask “How often do you play in the park?”","hu":"Így kérdezzük: „Milyen gyakran játszol a parkban?”","ref":{"book":"hb","page":12},"hl":[],"pic":"❓","svg":null,"check":null},{"id":"hb12c11","es":"We answer: I never, sometimes or always play in the park.","hu":"Így válaszolunk: soha, néha vagy mindig játszom a parkban.","ref":{"book":"hb","page":12},"hl":[],"pic":"🌳","svg":null,"check":null},{"id":"hb12c12","es":"Or we say: I play in the park every day.","hu":"Vagy azt mondjuk: minden nap játszom a parkban.","ref":{"book":"hb","page":12},"hl":[],"pic":"📅","svg":null,"check":null},{"id":"hb12c13","es":"For he or she, we add -s: He plays, she plays.","hu":"Ha „ő”-ről beszélünk (he/she), az ige végére -s kerül: he plays, she plays.","ref":{"book":"hb","page":12},"hl":[],"pic":"➕","svg":null,"check":null},{"id":"hb12c14","es":"In the question we use “does”: How often does he play?","hu":"A kérdésben „does”-t használunk: How often does he play?","ref":{"book":"hb","page":12},"hl":[],"pic":"🔤","svg":null,"check":null},{"id":"hb12c15","es":"The pictures show things we do: play badminton, watch TV, read, eat chocolate, drink juice, ride a bike, listen to music, ride a horse.","hu":"A képeken tevékenységek vannak: tollaslabda, tévénézés, olvasás, csokievés, gyümölcslé, biciklizés, zenehallgatás, lovaglás.","ref":{"book":"hb","page":12},"hl":[],"pic":"🚲","svg":null,"check":null},{"id":"hb12c16","es":"Listen to the story and tell it to your family in Hungarian.","hu":"Hallgasd meg a történetet, és meséld el a családodnak magyarul.","ref":{"book":"hb","page":12},"hl":[],"pic":"🎧","svg":null,"check":null},{"id":"hb13c0","es":"A boy writes “Interesting facts about me”.","hu":"Egy fiú leírja: „Érdekességek rólam”.","ref":{"book":"hb","page":13},"hl":[],"pic":"📝","svg":null,"check":null},{"id":"hb13c1","es":"He doesn't like baths. He has a shower every day.","hu":"Nem szereti a kádfürdőt. Minden nap zuhanyozik.","ref":{"book":"hb","page":13},"hl":[],"pic":"🚿","svg":null,"check":null},{"id":"hb13c2","es":"He never eats bananas, but he eats an apple every day.","hu":"Soha nem eszik banánt, de minden nap eszik egy almát.","ref":{"book":"hb","page":13},"hl":[],"pic":"🍎","svg":null,"check":null},{"id":"hb13c3","es":"He always wears glasses.","hu":"Mindig szemüveget hord.","ref":{"book":"hb","page":13},"hl":[],"pic":"👓","svg":null,"check":null},{"id":"hb13c4","es":"He sometimes plays hockey on Wednesdays.","hu":"Szerdánként néha hokizik.","ref":{"book":"hb","page":13},"hl":[],"pic":"🏑","svg":null,"check":null},{"id":"hb13c5","es":"He always plays football at the weekend.","hu":"Hétvégén mindig focizik.","ref":{"book":"hb","page":13},"hl":[],"pic":"⚽","svg":null,"check":null},{"id":"hb13c6","es":"He never does his homework on Fridays.","hu":"Pénteken soha nem csinálja a házi feladatát.","ref":{"book":"hb","page":13},"hl":[],"pic":"📝","svg":null,"check":null},{"id":"hb13c7","es":"He listens to music every day.","hu":"Minden nap zenét hallgat.","ref":{"book":"hb","page":13},"hl":[],"pic":"🎵","svg":null,"check":null},{"id":"hb13c8","es":"He sometimes helps to cook dinner on Saturdays.","hu":"Szombatonként néha segít vacsorát főzni.","ref":{"book":"hb","page":13},"hl":[],"pic":"🍳","svg":null,"check":null},{"id":"hb13c9","es":"Circle the pictures of the things he does.","hu":"Karikázd be azokat a képeket, amiket csinál.","ref":{"book":"hb","page":13},"hl":[],"pic":"⭕","svg":null,"check":null},{"id":"hb13c10","es":"Then write about your habits with always, every day, never and sometimes.","hu":"Aztán írj a saját szokásaidról az always, every day, never és sometimes szavakkal.","ref":{"book":"hb","page":13},"hl":[],"pic":"✍️","svg":null,"check":null},{"id":"hb13c11","es":"You can write about food, home, school and sport.","hu":"Írhatsz ételről, otthonról, iskoláról és sportról.","ref":{"book":"hb","page":13},"hl":[],"pic":"🍽️","svg":null,"check":null},{"id":"hb13c12","es":"Compare with your family: My mum never plays hockey.","hu":"Hasonlítsd össze a családoddal: Anya soha nem hokizik.","ref":{"book":"hb","page":13},"hl":[],"pic":"👨‍👩‍👦","svg":null,"check":null},{"id":"hb13c13","es":"In “My progress” you draw a happy or a sad mouth on each face.","hu":"A „My progress” részben minden arcra vidám vagy szomorú szájat rajzolsz.","ref":{"book":"hb","page":13},"hl":[],"pic":"🙂","svg":null,"check":null}],"rule":{"es":"How often do you…? – I never / sometimes / always … / … every day.","hu":"Milyen gyakran…? – soha / néha / mindig … / minden nap.","ref":{"book":"hb","page":12},"items":[{"es":"He / She + verb + s: he wakes up, she plays.","hu":"He / She után az igére -s kerül: he wakes up, she plays."},{"es":"How often does he/she play?","hu":"He/she-nél a kérdésben „does” van: How often does he/she play?"},{"es":"always > every day > sometimes > never","hu":"mindig > minden nap > néha > soha"},{"es":"The frequency word goes before the verb: I never eat bananas.","hu":"A gyakoriság szava az ige elé kerül: I never eat bananas."}]},"widgets":[{"id":"hb12tf","type":"truefalse","ref":{"book":"hb","page":12},"prompt":"True or false?","prompt_hu":"Igaz vagy hamis?","items":[{"t":"Archie wakes up at seven o'clock.","hu":"Archie hét órakor ébred.","answer":true},{"t":"Archie has dinner at three o'clock.","hu":"Archie három órakor vacsorázik.","answer":false},{"t":"“Never” means “every day”.","hu":"A „never” azt jelenti: minden nap.","answer":false},{"t":"We say: She plays in the park.","hu":"Így mondjuk: She plays in the park.","answer":true},{"t":"Archie goes to bed at nine o'clock.","hu":"Archie kilenc órakor fekszik le.","answer":true},{"t":"The question is: How often do he play?","hu":"A kérdés így helyes: How often do he play?","answer":false}]},{"id":"hb12t2","type":"choice","ref":{"book":"hb","page":12,"ex":"2"},"prompt":"Study the box. Talk about your day.","prompt_hu":"Tanulmányozd a dobo /><path fill=\"none\" stroke=\"#fff\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3.86\" d=\"m48.63 54.55h-4.69v-13.49h4.69c2.22 0 4.02 1.80 4.02 4.02v5.44c0 2.22-1.80 4.02-4.02 4.02z\"/><path fill=\"none\" stroke=\"#3f3f3f\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3.86\" d=\"m28.04 53.25c-0.85 0.75-1.97 1.21-3.20 1.21-2.66 0-4.83-2.16-4.83-4.83v-3.86 3.86-3.86c0-2.67 2.16-4.83 4.83-4.83 1.23 0 2.35 0.46 3.20 1.21\"/><path fill=\"none\" stroke=\"#fff\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3.86\" d=\"m20.45 28.08h7.73\"/></g><g fill=\"none\"><rect x=\"12\" y=\"12\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"#000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\"/></g></svg>"},"pages":{"pb28":{"title":"A day in the life","title_hu":"Egy nap az életből","summary_hu":"A 3. fejezet nyitóoldala: Stella egy napja képekben, a napirend kifejezései (felébred, felkel, zuhanyozik, felöltözik, buszra száll, leckét ír, lefekszik). Meg kell tanulni ezeket a kifejezéseket, és hogy hogyan mondjuk meg, hány órakor csinálunk valamit (at seven o'clock).","section":"routine","tasks":[{"n":"1","text":"Listen and say the letter.","text_hu":"Hallgasd meg, és mondd meg a kép betűjét!"},{"n":"2","text":"Read and complete.","text_hu":"Olvasd el, és egészítsd ki!"},{"n":"3","text":"Listen and do the actions.","text_hu":"Hallgasd meg, és mutasd el a mozdulatokat!"}]},"pb29":{"title":"Every day (song)","title_hu":"Minden nap (dal)","summary_hu":"Egy dal egy fiú napjáról (Every day), hat képpel és órákkal. Meg kell tanulni kérdezni és válaszolni, hogy mikor csinál valaki valamit (What time does he…? He… at … o'clock.), és a before/after (előtt/után) szavakat.","section":"routine","tasks":[{"n":"1","text":"Listen and match.","text_hu":"Hallgasd meg, és párosítsd!"},{"n":"2","text":"Listen and sing. Do karaoke.","text_hu":"Hallgasd meg és énekeld! Karaoke!"},{"n":"3","text":"Answer the questions.","text_hu":"Válaszolj a kérdésekre!"},{"n":"4","text":"Ask and answer.","text_hu":"Kérdezz és válaszolj!"}]},"ab28":{"title":"A day in the life","title_hu":"Egy nap az életből","summary_hu":"Alisha elmeséli a napját: mikor ébred, mikor reggelizik, mikor megy iskolába és mikor fekszik le. A mondatokat időrendbe kell számozni, aztán egy képről kell mondatokat kiegészíteni (felkel, zuhanyozik, öltözik).","section":"routine","tasks":[{"n":"1","text":"Read and number the sentences.","text_hu":"Olvasd el, és számozd meg a mondatokat (milyen sorrendben történnek)."},{"n":"2","text":"Look and read and write.","text_hu":"Nézd meg a képet, olvasd el és írd be."}]},"ab29":{"title":"Times and routines: before and after","title_hu":"Időpontok és napirend: előtt és után","summary_hu":"Egész órák kiolvasása (o'clock): az órákat össze kell kötni az időpontokkal. Aztán a 'before' (előtt) és 'after' (után) szavakkal kell a napi teendők sorrendjét kifejezni, végül megbeszélni egy baráttal, hogy ugyanolyan-e a napirendünk.","section":"routine","tasks":[{"n":"1","text":"Look and match.","text_hu":"Nézd meg és kösd össze."},{"n":"2","text":"Write 'before' or 'after'.","text_hu":"Írd be: 'before' (előtt) vagy 'after' (után)."},{"n":"3","text":"Talk to your friend. Is your routine the same or different?","text_hu":"Beszélgess a barátoddal. Ugyanolyan vagy más a napirendetek?"}]},"pb30":{"title":"Days of the week: always, sometimes, never","title_hu":"A hét napjai: mindig, néha, soha","summary_hu":"A hét napjai angolul (Monday … Sunday), és három fontos szó: always (mindig ✓✓✓), sometimes (néha ✓), never (soha ✗). Simon hétfőn soha nem megy a parkba, de mindig leckét ír.","section":"week","tasks":[{"n":"1","text":"Say the chant. Ask and answer.","text_hu":"Mondd a mondókát! Kérdezz és válaszolj!"},{"n":"2","text":"Listen and say the day.","text_hu":"Hallgasd meg, és mondd meg, melyik nap van!"},{"n":"3","text":"Listen again. Choose the right words.","text_hu":"Hallgasd meg újra! Válaszd ki a helyes szót!"}]},"pb31":{"title":"James Flunk's week","title_hu":"James Flunk hete","summary_hu":"James Flunk zenetanárról szóló szöveg: mit csinál mindig, néha és soha (pipák és x-ek a képeken). Utána saját mondatokat kell alkotni az always / sometimes / never szavakkal és időpontokkal (on Saturdays, after school…).","section":"week","tasks":[{"n":"1","text":"Look, read and complete.","text_hu":"Nézd meg, olvasd el, és egészítsd ki!"},{"n":"2","text":"Listen and say 'yes' or 'no'.","text_hu":"Hallgasd meg, és mondd: „yes” (igen) vagy „no” (nem)!"},{"n":"3","text":"Look and make sentences. Use the words in the boxes.","text_hu":"Nézd meg, és alkoss mondatokat! Használd a dobozok szavait!"}]},"ab30":{"title":"Days of the week","title_hu":"A hét napjai","summary_hu":"A hét napjainak angol nevei: meg kell keresni őket egy betűrejtvényben, aztán hét fotó alá kell írni, melyik napon történik (pl. Daisy csütörtökön úszik). Megjelennek a gyakoriságot jelző szavak is: always (mindig), sometimes (néha), never (soha).","section":"week","tasks":[{"n":"1","text":"Find and write the words.","text_hu":"Keresd meg és írd le a szavakat."},{"n":"2","text":"Look, read and write.","text_hu":"Nézd meg, olvasd el és írd be."}]},"ab31":{"title":"Always, sometimes, never – Bingo!","title_hu":"Mindig, néha, soha – Bingó!","summary_hu":"Mondatalkotás egy bingó-táblázatból: név + always/sometimes/never + cselekvés + időpont. Fontos a szórend: a gyakoriságot jelző szó az ige ELÉ kerül. Végül saját napirendről kell mondatokat írni és elmondani.","section":"week","tasks":[{"n":"1","text":"Use the words to make three sentences.","text_hu":"Használd a szavakat, és alkoss három mondatot."},{"n":"2","text":"Write sentences about you.","text_hu":"Írj mondatokat magadról."},{"n":"3","text":"Tell your partner.","text_hu":"Mondd el a társadnak."}]},"pb32":{"title":"Lock's sounds and spelling","title_hu":"Lock hangjai és helyesírása","summary_hu":"Kiejtés: ha az ige -s vagy -es végződést kap (he/she/it), háromféleképpen hangzik: /s/ (eats), /z/ (plays) vagy /iz/ (dances, catches). Egy versike a bagolyról, és mondatok állatok napjáról (tigris, denevér, méhecske).","section":"sounds","tasks":[{"n":"1","text":"Watch the video. Watch again and practise.","text_hu":"Nézd meg a videót! Nézd meg újra, és gyakorolj!"},{"n":"2","text":"Read. Find and point to the /iz/, /z/, and /s/ sounds. Say.","text_hu":"Olvasd el! Keresd meg és mutasd meg az /iz/, /z/ és /s/ hangokat! Mondd ki!"},{"n":"3","text":"Work in pairs. Point and say.","text_hu":"Dolgozzatok párban! Mutass rá, és mondd!"},{"n":"Show what you know","text":"Show what you know: The bat … and … fruit at night.","text_hu":"Mutasd meg, mit tudsz: A denevér … és … gyümölcsöt éjszaka."}]},"ab32":{"title":"Lock's sounds and spelling","title_hu":"Lock hangjai és helyesírása","summary_hu":"Ha he/she (ő) a mondat alanya, az ige végére -s vagy -es kerül (wakes, catches). Az igéket két csoportba kell rendezni, aztán kilenc képhez kell a megfelelő kifejezést kiválasztani (pl. washes her hands = kezet mos).","section":"sounds","tasks":[{"n":"1","text":"Say and write.","text_hu":"Mondd ki és írd be."},{"n":"2","text":"Read and match.","text_hu":"Olvasd el és párosítsd."}]},"pb33":{"title":"Lock & Key!","title_hu":"Lock és Key – képregény","summary_hu":"Képregény: Johnny Talkalot riporter a tévében bemutatja Lock és Key nyomozókat, akik „sokat dolgoznak és korán kelnek”. Kiderül, hogy soha nem kelnek fel tíz óra előtt, és amikor csendben követnek valakit, Key nekimegy egy lámpaoszlopnak. A kérdés: tényleg sokat dolgoznak, csendesek és nagyon okosak?","section":"story","tasks":[{"n":"Story","text":"Read the story Lock & Key.","text_hu":"Olvasd el a Lock & Key történetet!"},{"n":"1","text":"Ask and answer the questions in picture 6.","text_hu":"Tedd fel és válaszold meg a 6. kép kérdéseit!"}]},"ab33":{"title":"Movers Listening","title_hu":"Movers hallás utáni értés","summary_hu":"Vizsgagyakorló hallgatási feladat: Lily különböző helyeken különböző ételeket eszik. A hangfelvétel alapján minden ételhez (banán, szendvics, fagyi, cukorka, torta) be kell írni a hely betűjét (A–H). A palacsinta a példa: H (étkezde).","section":"story","tasks":[{"n":"1","text":"What food does Lily have in these places? Listen and write a letter in each box. There is one example.","text_hu":"Milyen ételt eszik Lily ezeken a helyeken? Hallgasd meg, és írj egy betűt minden dobozba. Van egy példa."}]},"ab35":{"title":"Do you remember?","title_hu":"Emlékszel?","summary_hu":"A fejezet ismétlése: Paul hétfői napjáról szóló történetet kell kiegészíteni a képek alapján (zuhany, konyha, kabát, busz, iskola, időpontok). Utána a Pupil's Book Lock & Key képregényéről kell kérdésekre válaszolni.","section":"story","tasks":[{"n":"1","text":"Read and complete the story.","text_hu":"Olvasd el és egészítsd ki a történetet."},{"n":"2","text":"Write the answers.","text_hu":"Írd le a válaszokat."}]},"pb34":{"title":"What do astronauts do in space?","title_hu":"Mit csinálnak az űrhajósok az űrben?","summary_hu":"Tudomány: Sally űrhajós, aki az űrállomáson él és dolgozik. Az űrben minden lebeg, még az étel is; az űrállomáson nincs zuhany, de van vécé. Össze kell hasonlítani az űrhajós napját a saját napunkkal.","section":"space","tasks":[{"n":"1","text":"Listen and say. Who is Sally? Where does she live?","text_hu":"Hallgasd meg, és mondd el! Ki Sally? Hol lakik?"},{"n":"2","text":"Listen again and choose the true sentences.","text_hu":"Hallgasd meg újra, és válaszd ki az igaz mondatokat!"},{"n":"3","text":"Think about the astronaut's day. How is your day similar or different? Think and say.","text_hu":"Gondolj az űrhajós napjára! Miben hasonlít a te napod, és miben különbözik? Gondold végig, és mondd el!"}]},"pb35":{"title":"Sally's blog","title_hu":"Sally blogja","summary_hu":"Sally blogja az első űrsétájáról: hatkor kel, fél hétkor reggelizik, felveszi az űrruhát, és kilenckor kimegy az űrbe, ahonnan gyönyörűen látja a Földet. Meg kell tanulni az időpontokat (six o'clock, half past six), és kérdéseket írni egy űrhajósnak.","section":"space","tasks":[{"n":"4","text":"Read Sally's blog. What is special about today?","text_hu":"Olvasd el Sally blogját! Mi különleges a mai napban?"},{"n":"5","text":"Write the times in Activity 4.","text_hu":"Írd le az időpontokat a 4. feladatból!"},{"n":"6","text":"Prepare for an interview with an astronaut. What questions do you want to ask?","text_hu":"Készülj fel egy interjúra egy űrhajóssal! Milyen kérdéseket szeretnél feltenni?"}]},"ab34":{"title":"What do astronauts do in space?","title_hu":"Mit csinálnak az űrhajósok az űrben?","summary_hu":"Egész és fél órák kiolvasása (o'clock, half past). Sally űrhajós blogja alapján (Pupil's Book 35. o.) ki kell választani, mit csinál ő. Aztán saját esti napirendről kell blogbejegyzést írni, és ellenőrizni, benne vannak-e a tevékenységek és az időpontok.","section":"space","tasks":[{"n":"1","text":"Look and complete the times.","text_hu":"Nézd meg, és egészítsd ki az időpontokat."},{"n":"2","text":"Reread the blog on Pupil's Book page 35. Which activity does Sally do?","text_hu":"Olvasd el újra a blogot a Pupil's Book 35. oldalán. Melyik dolgot csinálja Sally?"},{"n":"3","text":"Tick (✓) the activities that you do in the evening. Add one of your own.","text_hu":"Pipáld ki, amit te este csinálsz. Írj hozzá egy sajátot is."},{"n":"4","text":"Write a blog post about your evening routine.","text_hu":"Írj blogbejegyzést az esti napirendedről."},{"n":"5","text":"Did you … include your evening activities? include times?","text_hu":"Ellenőrizd: beleírtad az esti tevékenységeidet? Beleírtad az időpontokat?"}]},"hb12":{"title":"A day in the life","title_hu":"Egy nap az életből","summary_hu":"Az oldal a napi teendőkről szól: Archie napirendjét olvassuk el, és válaszolunk a kérdésekre (mit csinál hány órakor). A nyelvtani doboz azt tanítja, hogyan kérdezzük meg, milyen gyakran csinál valaki valamit (How often…?), és hogyan válaszolunk: never, sometimes, always, every day. Egyes szám 3. személyben (he/she) az ige végére -s kerül.","section":"home","tasks":[{"n":"1","text":"Look, read and write the answers.","text_hu":"Nézd meg, olvasd el, és írd le a válaszokat."},{"n":"2","text":"Study the box. Talk about your day.","text_hu":"Tanulmányozd a dobozt. Beszélj a napodról."},{"n":"3","text":"Listen or watch. Retell the story to your family in your home language.","text_hu":"Hallgasd meg vagy nézd meg. Meséld el a történetet a családodnak az anyanyelveden."}]},"hb13":{"title":"Interesting facts about me","title_hu":"Érdekességek rólam","summary_hu":"Egy fiú leírja a szokásait (mit csinál mindig, néha, soha). El kell olvasni, és bekarikázni azokat a képeket, amiket tényleg csinál. Utána a saját szokásainkról írunk, a családdal összehasonlítva, végül a „My progress” részben felmérjük, mit tudunk már.","section":"home","tasks":[{"n":"4","text":"Read and circle the things he does.","text_hu":"Olvasd el, és karikázd be, amiket csinál."},{"n":"5","text":"Write about your habits. Compare with your family.","text_hu":"Írj a szokásaidról. Hasonlítsd össze a családodéval."},{"n":"6","text":"My progress. Draw the mouths and colour the faces.","text_hu":"Az én fejlődésem. Rajzold meg a szájakat, és színezd ki az arcokat."}]}},"books":{"pb":"Pupil's Book","ab":"Activity Book","hb":"Home Booklet"}},SP={"es":{"\"brushes\" – which box: -s or -es?":[0.0,2.926],"\"dances\" – which box: -s or -es?":[3.226,2.902],"\"eats\" – which box: -s or -es?":[6.428,2.67],"\"gets up\" – which box: -s or -es?":[9.399,2.786],"\"puts on\" – which box: -s or -es?":[12.485,2.844],"\"washes\" – which box: -s or -es?":[15.629,2.914],"\"watches\" – which box: -s or -es?":[18.843,2.937],"'After' in Hungarian is…":[22.081,2.032],"'After' means 'előtt'.":[24.413,1.66],"'After' means something happens later.":[26.373,2.299],"'Before' in Hungarian is…":[28.972,2.078],"'Before' means 'előtt' in Hungarian.":[31.35,2.38],"'Before' means something happens first.":[34.03,2.461],"'Catches' ends with /iz/.":[36.791,2.461],"'Dances' also ends in -es, and you hear iz too.":[39.552,3.576],"'Eats' ends with an /iz/ sound.":[43.428,2.682],"'Eats' goes in the -es box.":[46.41,2.125],"'Get undressed' means to take off your clothes.":[48.835,2.752],"'I have breakfast, too.' – Is this similar or different?":[51.886,3.843],"'My food doesn't float.' – Is this similar or different?":[56.029,3.947],"'Never' means 'mindig'.":[60.277,1.8],"'Never' means 'soha'.":[62.376,1.533],"'Paul watches always TV' is correct.":[64.209,2.972],"'Plays' ends with a /z/ sound.":[67.481,2.879],"'Sally always gets dressed before breakfast' is a correct sentence.":[70.66,3.936],"'Sometimes' has three ticks.":[74.896,2.02],"'Sometimes' means 'mindig'.":[77.216,1.904],"'Watches' goes in the -es box.":[79.42,2.357],"'catches' – which sound at the end?":[82.077,2.45],"'dances' – which sound at the end?":[84.827,2.531],"'eats' – which sound at the end?":[87.658,2.206],"'plays' – which sound at the end?":[90.163,2.415],"-es":[92.878,0.789],"-s":[93.968,0.789],"/iz/":[95.057,1.335],"/s/":[96.692,1.393],"/s/ eats, wakes · /z/ plays, flies · /iz/ dances, catches, washes":[98.386,6.084],"/s/!":[104.769,1.625],"/z/":[106.695,1.37],"03:00 is three o'clock.":[108.365,2.74],"1 I take off my clothes ___ I have a shower.":[111.405,2.601],"1 What does the reporter say about detectives' routine?":[114.305,2.961],"11:00 is one o'clock.":[117.566,2.659],"1: 'I have a shower and I get dressed' (example)":[120.524,3.39],"2 I wash my hands ___ I have lunch.":[124.215,2.276],"2 What time do Lock and Key usually get up?":[126.79,2.705],"2: 'I do my homework on the way'":[129.795,2.02],"3 I take off my shirt ___ I take off my jacket.":[132.115,2.833],"3 What is the man with the moustache doing?":[135.248,2.229],"3 Why aren't Lock and Key at the detective agency?":[137.777,3.309],"3.00 is three o'clock.":[141.386,2.798],"3: 'Lessons start and I see my teacher'":[144.4 function ovsShuf(a,seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;a=a.slice();for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function quizPool(sec){const P=[];D.sections.forEach(s=>{if(sec!=='all'&&s.id!==sec)return;
 (s.cards||[]).forEach(c=>{if(c.check)P.push({...c.check,ref:c.ref,s:s.id})});
 (s.examples||[]).forEach(e=>{if(e.try)P.push({...e.try,ref:e.ref,s:s.id})});
 (s.widgets||[]).forEach(w=>{if(w.type==='choice')w.items.forEach(c=>P.push({...c,ref:w.ref,s:s.id}));
  if(w.type==='truefalse')w.items.forEach(it=>P.push({q:it.t,q_hu:it.hu,options:[{t:'True',hu:'Igaz'},{t:'False',hu:'Hamis'}],answer:it.answer?0:1,ref:w.ref,s:s.id}));
  if(w.type==='fill')w.items.forEach(it=>P.push({q:it.t.replace('__','_'),q_hu:it.hu,options:it.options.map(o=>({t:it.t.replace('__',o)})),answer:it.options.indexOf(it.answer),ref:w.ref,s:s.id,say:it.full}));
  if(w.type==='match')w.pairs.forEach((p,i)=>{const o=shuffle(w.pairs.filter((x,j)=>j!==i)).slice(0,2).map(x=>({t:x.b,hu:x.b_hu}));const opts=shuffle([{t:p.b,hu:p.b_hu},...o]);P.push({q:`${p.a} → ?`,q_hu:w.prompt_hu,options:opts,answer:opts.findIndex(x=>x.t===p.b),ref:w.ref,s:s.id})});
  if(w.type==='sort')w.items.forEach(it=>{const opts=w.bins.map(b=>({t:b.es,hu:b.hu}));P.push({q:`${it.t}: ${w.bins.map(b=>b.es).join(' or ')}?`,q_hu:it.hu,options:opts,answer:w.bins.findIndex(b=>b.id===it.bin),ref:w.ref,s:s.id})})});
 (s.words||[]).forEach(wd=>{const others=shuffle(WORDS.filter(x=>x.w!==wd.w&&x.hu!==wd.hu)).slice(0,3);
  let o=shuffle([wd,...others]);P.push({q:`What does «${wd.w}» mean?`,q_hu:'Mit jelent?',options:o.map(x=>({t:x.hu})),answer:o.indexOf(wd),ref:{book:wd.book||'pb',page:wd.page},s:s.id,say:wd.w,nohu:1});
  o=shuffle([wd,...others]);P.push({q:`«${wd.hu}» – in English?`,q_hu:'Hogy mondják angolul?',options:o.map(x=>({t:x.w})),answer:o.indexOf(wd),ref:{book:wd.book||'pb',page:wd.page},s:s.id,say:wd.w,nohu:1})})});
 return P.filter(q=>q.options&&q.answer>=0&&q.answer<q.options.length)}

 let t='';for(let i=1;i<=12;i++){const[x,y]=P(i*30,47);t+=`<text x="${x}" y="${y+4}" font-size="11" font-weight="800" text-anchor="middle" fill="currentColor">${i}</text>`}
 let k='';for(let i=0;i<60;i++){const[x1,y1]=P(i*6,56),[x2,y2]=P(i*6,i%5?53:50);k+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="${i%5?1:2}"/>`}
 return `<span class="clk"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="var(--card)" stroke="currentColor" stroke-width="3"/>${k}${t}<line x1="60" y1="60" x2="${hx}" y2="${hy}" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="60" x2="${mx}" y2="${my}" stroke="#1F4E79" stroke-width="3.5" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="currentColor"/></svg></span>`}
function gyClock(B,f,fin){const T=gyTimes(f),n=gyCnt(f,6);const mode=f.mode==='mix'?['read','write','match'][Math.floor(Math.random()*3)]:(f.mode||'read');
 if(mode==='match'){return gyMatch(B,{...f,gen:null,pairs:gyPick(T,n).map(t=>({a:t.say.replace(/\.$/,''),a_hu:t.hu,b:t.dig,bpic:null}))},fin)}
 const its=gyPick(T,n);let ok=0,c=0;
 if(mode==='read'){B.innerHTML=`<div class="gygrid">${its.map((t,i)=>{const o=shuffle([t,...gyPick(T.filter(x=>x.say!==t.say&&(x.h===t.h||x.m===t.m)),2)]);t.o=o;return `<div class="gyi" data-i="${i}"><span class="num">${i+1}</span><div class="pic">${gyClockSVG(t.h,t.m)}</div><div class="gyo" style="flex-direction:column">${o.map((x,j)=>`<button data-j="${j}">${esc(x.say)}</button>`).join('')}</div><div class="gyhu" data-h></div></div>`}).join('')}</div>`;
  B.querySelectorAll('.gyi').forEach(d=>{const t=its[d.dataset.i];d.querySelectorAll('.gyo button').forEach(b=>b.onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;c++;const x=t.o[+b.dataset.j],good=x===t;if(good)ok++;b.classList.add('cir',good?'ok':'no');
   if(!good)d.querySelectorAll('.gyo button')[t.o.indexOf(t)].classList.add('cir','ok');if(huOn)d.querySelector('[data-h]').textContent=t.dig+' – '+t.hu;play([clip('es',t.say),huOn?clip('hu',t.hu):null]);if(c===its.length)fin(ok,c)})});return}
 // write: a könyv AB 34. o. 1. feladata – „half past ___”, „___ o'clock”
 B.innerHTML=its.map((t,i)=>{const s=t.say.replace(/^It's /,'').replace(/\.$/,'');const ws=s.split(' ');const cand=ws.map((w,j)=>j).filter(j=>!['past','to','a'].includes(ws[j]));const gi=cand[Math.floor(Math.random()*cand.length)];t.ans=ws[gi];
  return `<div class="gyw" data-i="${i}"><b>${i+1}.</b>${gyClockSVG(t.h,t.m)}<span class="es" style="font-size:22px">${t.dig}</span><span class="es" style="font-size:20px">${ws.map((w,j)=>j===gi?'<input class="t" data-in style="min-width:110px;flex:0 1 140px" autocomplete="off" autocapitalize="off">':esc(w)).join(' ')}</span><button class="big g" data-ok>✔</button><div class="gyhu" data-h style="flex-basis:100%;text-align:left"></div></div>`}).join('');
 B.querySelectorAll('.gyw').forEach(d=>{const t=its[d.dataset.i],i=d.querySelector('[data-in]');const go=()=>{if(d.dataset.done||!i.value.trim())return;d.dataset.done=1;c++;const good=gyStrip(i.value).replace(/-/g,' ')===gyStrip(t.ans).replace(/-/g,' ');if(good)ok++;i.classList.add(good?'ok':'no');i.disabled=true;
  d.querySelector('[data-h]').innerHTML=(good?'✅ ':'❌ ')+`<b>${esc(t.say)}</b>`+(huOn?' – '+esc(t.hu):'');play([clip('es',t.say),huOn?clip('hu',t.hu):null]);if(c===its.length)fin(ok,c)};
  d.querySelector('[data-ok]').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}})}
// ---------- 13. jelölés a mondatban (Circle the nouns / RODEA los adjetivos y SUBRAYA los nombres / ENCUENTRA)
function gyTapw(B,f,fin){const its=gyPick(f.items,gyCnt(f,3));const cats=f.cats;let pen=cats[0].id;let checked=0,okAll=0;
 B.innerHTML=(cats.length>1?`<div class="pens">${cats.map(c=>`<button data-pen="${c.id}" class="${c.id===pen?'on':''}">${c.mark==='under'?'〰️':'⭕'} ${esc(c.t)}${huOn?` (${esc(c.hu)})`:''}</button>`).join('')}</div>`:`<p class="hu" style="margin:0">Koppints minden ${esc(cats[0].hu||cats[0].t)} szóra!</p>`)+
 its.map((it,i)=>{const toks=it.list?it.list.map(t=>({t,w:1})):(it.s.match(/[\p{L}'’-]+|[^\p{L}'’-]+/gu)||[]).map(t=>({t,w:/\p{L}/u.test(t)}));it.toks=toks;
  return `<div class="gyw" data-i="${i}" style="display:block"><b>${i+1}.</b> <span class="tws">${toks.map((x,j)=>x.w?`<span class="tk" data-j="${j}">${esc(x.t)}</span>`:esc(x.t)).join(it.list?' · ':'')}</span> ${it.s?'<button class="abtn" data-s>🔊</button>':''}${huOn&&it.hu?`<div class="hu" style="margin:0">${esc(it.hu)}</div>`:''}<div class="row" style="margin:4px 0 0"><button class="big g" data-ok>✔ Kész</button></div><div class="gyhu" data-h style="text-align:left"></div></div>`}).join('');
 B.querySelectorAll('[data-pen]').forEach(b=>b.onclick=()=>{pen=b.dataset.pen;B.querySelectorAll('[data-pen]').forEach(x=>x.classList.toggle('on',x===b))});
 const cls=id=>{const c=cats.find(x=>x.id===id);return 'm-'+(c.mark||'circle')};
 B.querySelectorAll('.gyw').forEach(d=>{const it=its[d.dataset.i];const mk={};const sb=d.querySelector('[data-s]');if(sb)sb.onclick=()=>sayPair(it.s,it.hu);
  d.querySelectorAll('.tk').forEach(t=>t.onclick=()=>{if(d.dataset.done)return;const j=t.dataset.j;cats.forEach(c=>t.classList.remove(cls(c.id)));if(mk[j]===pen){delete mk[j]}else{mk[j]=pen;t.classList.add(cls(pen))}sayEs(t.textContent)});
  d.querySelector('[data-ok]').onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;let good=true;const want={};cats.forEach(c=>(it.marks[c.id]||[]).forEach(w=>{want[gyN(w)]=c.id}));
   const seen={};d.querySelectorAll('.tk').forEach(t=>{const j=t.dataset.j,w=gyN(t.textContent),need=want[w],got=mk[j];if(need&&!seen[w+need]){seen[w+need]=1;if(got!==need){good=false;t.classList.add('miss');cats.forEach(c=>t.classList.remove(cls(c.id)));t.classList.add(cls(need))}}
    else if(got&&!need){good=false;t.classList.add('bad')}});
   checked++;if(good)okAll++;d.querySelector('[data-h]').innerHTML=(good?'✅ Mind jó!':'Sárgával: amit kihagytál · pirossal: ami nem kell.')+' '+cats.map(c=>`<b>${esc(c.t)}:</b> ${esc((it.marks[c.id]||[]).join(', ')||'–')}`).join(' · ');
   if(checked===its.length)fin(okAll,its.length)}})}
// ---------- 14. titkos kód (Look at the code. Write the secret message.)
function gyCode(B,f,fin){const it=gyPick(f.items,1)[0];const AB='abcdefghijklmnopqrstuvwxyz';const enc=ch=>{const i=AB.indexOf(ch);return i<0?ch:String(f.rev?26-i:i+1)};
 const words=it.s.replace(/[.!?]/g,'').split(' ');
 B.innerHTML=`<div class="code">${[...AB].map(ch=>`<span>${ch}=${enc(ch)}</span>`).join('')}</div>`+words.map((w,i)=>`<div class="gyw" data-i="${i}"><b>${i+1}.</b><span class="es" style="font-family:monospace">${[...w.toLowerCase()].map(ch=>AB.includes(ch)?enc(ch):ch).join(' ')}</span><input class="t" data-in autocomplete="off" autocapitalize="off"><button class="big g" data-ok>✔</button></div>`).join('')+
 `<div class="gyhu" data-h style="text-align:left;font-size:17px"></div>`;let ok=0,c=0;
 B.querySelectorAll('.gyw').forEach(d=>{const w=words[d.dataset.i],i=d.querySelector('[data-in]');const go=()=>{if(d.dataset.done||!i.value.trim())return;d.dataset.done=1;c++;const good=gyN(i.value)===gyN(w);if(good)ok++;i.classList.add(good?'ok':'no');if(!good)i.value=w;i.disabled=true;
  if(c===words.length){B.querySelector('[data-h]').innerHTML=`🔓 <b>${esc(it.s)}</b>`+(huOn&&it.hu?' – '+esc(it.hu):'');sayPair(it.s,it.hu);fin(ok,c)}};d.querySelector('[data-ok]').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}})}
// ---------- 15. térkép (Look at the map: next to / between / opposite / in front of)
function gyMap(B,f,fin){const P=gyPick(f.pool,8);const top=P.slice(0,4),bot=P.slice(4,8);const at=(r,c)=>(r?bot:top)[c];const qs=[];
 for(let r=0;r<2;r++)for(let c=0;c<4;c++){const x=at(r,c);
  qs.push({q:`What's opposite the ${x.t}?`,q_hu:`Mi van szemben ezzel: ${x.hu}?`,a:at(1-r,c).t});
  if(c>0&&c<3)qs.push({q:`What's between the ${at(r,c-1).t} and the ${at(r,c+1).t}?`,q_hu:`Mi van ${at(r,c-1).hu} és ${at(r,c+1).hu} között?`,a:x.t});
  if(c===0||c===3)qs.push({q:`What's next to the ${x.t}?`,q_hu:`Mi van ${x.hu} mellett?`,a:at(r,c?2:1).t})}
 const its=gyPick(qs,gyCnt(f,5)).map(q=>{const o=shuffle([q.a,...gyPick(P.map(p=>p.t).filter(t=>t!==q.a&&!q.q.includes('the '+t+' ')&&!q.q.includes('the '+t+'?')),2)]);return {...q,opts:o.map(t=>({t})),a:o.indexOf(q.a)}});
 const cell=x=>`<div style="border:2px solid var(--line);border-radius:12px;background:var(--card);padding:4px;text-align:center;font-weight:800;font-size:14px">${emo(x.pic,'e')}<div>${esc(x.t)}</div>${huOn?`<small class="hu" style="margin:0">${esc(x.hu)}</small>`:''}</div>`;
 B.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:620px">${top.map(cell).join('')}<div style="grid-column:1/5;height:26px;background:repeating-linear-gradient(90deg,#9AA5B1 0 18px,transparent 18px 30px) center/100% 4px no-repeat,#5B6B7C;border-radius:6px"></div>${bot.map(cell).join('')}</div>`+
  `<div id="mq"></div>`;const Q=B.querySelector('#mq');gyCircle(Q,{items:its.map(it=>({q:it.q,q_hu:it.q_hu,opts:it.opts,a:it.a})),n:its.length,keep:1},fin)}
const GYF={map:gyMap,circle:gyCircle,odd:gyOdd,match:gyMatch,cross:gyCross,ws:gyWS,write:gyWrite,order:gyOrder,seq:gySeq,sort:gySort,tf:gyTF,gap:gyGap,clock:gyClock,tapw:gyTapw,code:gyCode};
function rGy(V){if(!GY||!GY.groups){V.innerHTML='<div class="panel">Ehhez a fejezethez még nincs könyv szerinti feladat.</div>';return}
 if(gyGrp===null)gyGrp=GY.groups[0].id;const G=GY.groups.find(g=>g.id===gyGrp)||GY.groups[0];
 const fams=gyGrp==='mix'?gyPick(GY.groups.flatMap(g=>g.fams),6):G.fams;
 let h=`<div class="panel"><div class="gyhead"><b style="font-size:20px">✏️ Feladatok a könyv szerint</b></div>
 <p class="hu" style="margin:0">Ugyanazok a feladattípusok, mint a könyvben (📖 oldal és feladat a címkén) – csak a könyv szavaival, és minden „↻ Új változat” gombnyomásra más kérdésekkel. ${esc(GY.note_hu||'')}</p>
 <div class="gyfilter">${GY.groups.map(g=>`<button data-g="${g.id}" class="${g.id===gyGrp?'on':''}">${esc(g.icon||'')} ${esc(g.t)}${huOn&&g.hu?` <small style="font-weight:400">· ${esc(g.hu)}</small>`:''} (${g.fams.length})</button>`).join('')}<button data-g="mix" class="${gyGrp==='mix'?'on':''}">🎲 Vegyes (6 véletlen feladat)</button></div>
 ${gyGrp!=='mix'&&G.note_hu?`<p class="hu">${esc(G.note_hu)}</p>`:''}<div id="gyl"></div></div>`;
 V.innerHTML=h;V.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gyGrp=b.dataset.g;render()});
 const L=$('#gyl');fams.forEach(f=>{const el=document.createElement('div');el.className='gyc';L.appendChild(el);gyCard(el,f)})}

// ---------- indítás
$('#hnum').textContent=D.unit.num;$('#htitle').textContent=D.unit.title;
$('#hsub').textContent=[D.unit.title_hu||'',D.unit.pages_tb||'',D.unit.pages_cu?'Munkafüzet '+D.unit.pages_cu:'',D.unit.pages_sb?'Saberes básicos '+D.unit.pages_sb:''].filter(Boolean).join(' · ');$('#stars').textContent='⭐ '+ST.stars;
const hs=location.hash.slice(1);if(['ov','ex','eg','wd','qz','gy'].includes(hs))tab=hs;render();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
</script>
