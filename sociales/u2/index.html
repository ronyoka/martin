g><g/><g/><g/><g><path fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M16,37.16 c1,3,2.23,5,5,5c2.74,0,3.98-1.98,4.98-4.96c0.00-0.01,0.00-0.02,0.01-0.03l0.01-0.05 c1.79-5.37,4.02-8.94,8.98-8.94c4.97,0,7.2,3.6,9,9l0.03,0.11c1.11,2.90,2.23,4.88,4.96,4.88 c2.76,0,4-2,5-5l0,0l0.02-0.06l0.02-0.06c1.79-5.32,4.02-8.86,8.95-8.86v0.07v4.85v0.06 c-2.63,0.33-4.27,1.82-5,4l-0.08,0.24c-1.78,5.26-4.02,8.75-8.91,8.75c-4.94,0-7.17-3.56-8.97-8.92 l-0.11-0.34C38.96,34.05,37.68,32.16,35,32.16c-2.76,0-4,2-5,5l-0.06,0.17 c-1.78,5.30-4.02,8.82-8.94,8.82c-4.97,0-7.2-3.6-9-9l-0.03-0.08C11.23,34.95,9.59,33.49,7,33.16 v-0.08v-4.85v-0.05C11.97,28.16,14.2,31.76,16,37.16\"/></g></svg>"}, "pages": {"tb32": {"title": "Los mapas", "title_hu": "A térképek", "summary_hu": "A 2. fejezet nyitóoldala: túrázók fotója a hegyekben. Silvia imád túrázni, fényképez és útvonalakat, tanácsokat oszt meg. A kérdés: te hogyan ismertetnéd meg másokkal Spanyolország földrajzát?", "tasks": [{"n": "?", "text": "¿Cómo darías tú a conocer la geografía de España?", "text_hu": "Hogyan ismertetnéd meg te Spanyolország földrajzát?"}], "section": "inicio"}, "tb33": {"title": "¿Qué vamos a aprender?", "title_hu": "Mit fogunk tanulni?", "summary_hu": "Fotók túrázókról (térképpel, hátizsákkal) és a fejezet tartalma: földgömb és síktérkép, tájékozódás, térképek, Spanyolország elhelyezkedése és határai, földrajzi koordináták.", "tasks": [{"n": "?", "text": "¿Qué vamos a aprender?", "text_hu": "Mit fogunk tanulni?"}], "section": "inicio"}, "tb34": {"title": "Actívate", "title_hu": "Hangolódj rá!", "summary_hu": "Ráhangoló feladatok: rajzold le a Földet, játszd el az utazást földgömbbel, másold le a világtérképet és írd rá a hat földrészt, adj irányítást a társadnak, hogy eljusson egy tárgyhoz.", "tasks": [{"n": "1", "text": "DIBUJA muy rápido lo que imaginas cuando piensas en el planeta Tierra. ¿Se parece más a una bola o a un objeto plano?", "text_hu": "RAJZOLD le nagyon gyorsan, mit képzelsz el, amikor a Föld bolygóra gondolsz. Inkább egy golyóra hasonlít vagy egy lapos tárgyra?"}, {"n": "2", "text": "Con un globo terráqueo, jugad a viajar por todo el mundo empleando la imaginación. Mientras un compañero hace girar el globo, tú, con los ojos cerrados, señala un punto sobre el mismo. ESCRIBE el nombre del país, de su capital y del continente al que te ha tocado viajar.", "text_hu": "Földgömbbel játsszatok világutazást a képzeletetekkel. Amíg egy társad forgatja a földgömböt, te csukott szemmel mutass rá egy pontra. ÍRD le az ország nevét, a fővárosát és a földrészt, ahová utaznod kell."}, {"n": "3", "text": "Te han propuesto que elijas un continente para hacer un viaje. COPIA este mapa y ESCRIBE el nombre de los seis continentes en su lugar correspondiente.", "text_hu": "Azt javasolták, hogy válassz egy földrészt egy utazáshoz. MÁSOLD LE ezt a térképet, és ÍRD rá a hat földrész nevét a megfelelő helyre."}, {"n": "4", "text": "INDICA a un compañero o una compañera cómo llegar a un objeto sin decir su nombre. Tienes que utilizar instrucciones como hacia delante, da cinco pasos hacia la izquierda, gira a la derecha, sigue de frente...", "text_hu": "MUTASD MEG egy társadnak, hogyan jusson el egy tárgyhoz, anélkül, hogy megmondanád a nevét. Ilyen utasításokat használj: előre, tégy öt lépést balra, fordulj jobbra, menj tovább egyenesen..."}], "section": "inicio"}, "tb35": {"title": "Actívate (2) y Ticket de entrada", "title_hu": "Hangolódj rá! (2) és belépőjegy", "summary_hu": "Spanyolország fizikai térképén két archipelágus neve el van írva: a helyes nevek Baleares és Canarias. Utána rejtvény: melyik északi szomszéd ország (Eiffel-torony, Disneyland)? A „belépőjegy” önértékelő lista a fejezet témáiról.", "tasks": [{"n": "5", "text": "En este mapa han escrito mal el nombre de los dos archipiélagos españoles. ESCRIBE sus nombres correctos.", "text_hu": "Ezen a térképen rosszul írták a két spanyol szigetcsoport nevét. ÍRD le a helyes neveket."}, {"n": "6", "text": "El año que viene vas a hacer un intercambio con una niña o un niño de un colegio de un país que limita con España. AVERIGUA el nombre a partir de estas pistas. «Es un país que está al norte de España y en él se encuentran sitios tan asombrosos como la torre Eiffel y Disneyland».", "text_hu": "Jövőre csereprogramban veszel részt egy olyan ország iskolájának lány- vagy fiútanulójával, amely határos Spanyolországgal. DERÍTSD KI az ország nevét ezekből a tippekből: „Spanyolországtól északra van, és olyan csodálatos helyek vannak benne, mint az Eiffel-torony és a Disneyland.”"}, {"n": "ticket", "text": "LEE cada enunciado y DI si crees que sabes mucho, poco o nada.", "text_hu": "OLVASD el az egyes mondatokat, és mondd meg, szerinted sokat, keveset vagy semmit sem tudsz róla."}], "section": "inicio"}, "tb36": {"title": "El globo terráqueo y el planisferio", "title_hu": "A földgömb és a síktérkép", "summary_hu": "A Földet repülőgépről és műholdról készült képekkel ábrázolják. Teljes egészében földgömbbel és síktérképpel mutatjuk be. A földgömb gömb alakú: mutatja a földrészeket, óceánokat, a forgástengelyt, a sarkokat és az Egyenlítőt (két félgömbre osztja a Földet).", "tasks": [{"n": "extra", "text": "Extra: Fíjate en el globo terráqueo y contesta.", "text_hu": "Extra: Nézd meg a földgömböt, és válaszolj."}], "section": "globo"}, "tb37": {"title": "El mapamundi o planisferio", "title_hu": "A világtérkép vagy síktérkép", "summary_hu": "A síktérkép az egész Föld felszínét lapos felületen ábrázolja, mintha kinyitnánk a földgömböt. Rajta szerepel az összes földrész és óceán neve. Feladatok: a földgömb és a síktérkép különbsége, miért hasonlít jobban a valóságra a földgömb, tévedések kijavítása.", "tasks": [{"n": "1", "text": "EXPLICA cuál es la principal diferencia entre un globo terráqueo y un planisferio.", "text_hu": "MAGYARÁZD EL, mi a fő különbség a földgömb és a síktérkép között."}, {"n": "2", "text": "¿Por qué el globo terráqueo se parece más a la realidad que un mapa? JUSTIFICA tu respuesta.", "text_hu": "Miért hasonlít a földgömb jobban a valóságra, mint egy térkép? INDOKOLD MEG a válaszod."}, {"n": "3", "text": "CORRIGE los siguientes enunciados. • El globo terráqueo es un buen ejemplo para entender que la Tierra es plana. • Los planisferios solo representan una pequeña parte de la Tierra. • El ecuador es una línea imaginaria que atraviesa la Tierra de norte a sur. • El eje de rotación es una línea real que atraviesa la Tierra de norte a sur.", "text_hu": "JAVÍTSD KI a következő állításokat. • A földgömb jó példa annak megértéséhez, hogy a Föld lapos. • A síktérképek a Földnek csak egy kis részét ábrázolják. • Az Egyenlítő képzeletbeli vonal, ami északról délre szeli át a Földet. • A forgástengely valódi vonal, ami északról délre szeli át a Földet."}], "section": "globo"}, "tb38": {"title": "Orientación y localización", "title_hu": "Tájékozódás és elhelyezkedés", "summary_hu": "Hogy megtaláljuk a helyeket, tájékozódnunk kell. A négy fő égtáj: észak, dél, kelet, nyugat (É, D, K, Ny; spanyolul N, S, E, O). A szélrózsa a térképen jelzi őket. Napból: kelet = ahol kel, nyugat = ahol nyugszik. Éjszaka a Sarkcsillag mutatja az északot.", "tasks": [{"n": "extra", "text": "Extra: Mira el dibujo del niño con los brazos en cruz y contesta.", "text_hu": "Extra: Nézd meg a kinyújtott karú fiú rajzát, és válaszolj."}], "section": "orientacion"}, "tb39": {"title": "Con una brújula y el GPS", "title_hu": "Iránytűvel és a GPS-szel", "summary_hu": "Az iránytű mágnestűje mindig északot mutat; ha tudjuk, hol van észak, a többi égtáj is könnyen meghatározható. A GPS (Global Positioning System) műholdak hálózatával a Föld bármely pontját meghatározza. Feladatok: égtájak, Nappal való tájékozódás, iránytű működése, a műholdas rendszer neve.", "tasks": [{"n": "1", "text": "NOMBRA los cuatro puntos cardinales.", "text_hu": "NEVEZD MEG a négy égtájat."}, {"n": "2", "text": "¿Cómo podemos orientarnos con el Sol? JUSTIFICA tu respuesta.", "text_hu": "Hogyan tájékozódhatunk a Nappal? INDOKOLD MEG a válaszod."}, {"n": "3", "text": "EXPLICA el funcionamiento de una brújula.", "text_hu": "MAGYARÁZD EL az iránytű működését."}, {"n": "4", "text": "ESCRIBE el nombre del sistema de posicionamiento que está basado en una red de satélites artificiales.", "text_hu": "ÍRD LE annak a helymeghatározó rendszernek a nevét, amely mesterséges holdak hálózatán alapul."}], "section": "orientacion"}, "tb40": {"title": "Los mapas", "title_hu": "A térképek", "summary_hu": "A térkép a Föld felszínének (vagy egy részének) kisebb méretű rajza. Hasznos helyek megtalálására, útvonaltervezésre. Részei: cím, jelmagyarázat (legenda), szélrózsa, méretarány. A méretarányról példa: egy 10 m-es tanterem 1 cm = 1 m léptékkel, azaz 1:100.", "tasks": [{"n": "extra", "text": "Extra: Fíjate en el mapa político de Europa y en la escala. Contesta.", "text_hu": "Extra: Nézd meg Európa politikai térképét és a méretarányt. Válaszolj."}], "section": "mapas"}, "tb41": {"title": "Tipos de mapas", "title_hu": "A térképek fajtái", "summary_hu": "A térképeknek sokféle típusa van. A fizikai térkép a természeti jellemzőket mutatja (hegyek, síkságok, fennsíkok, tengerek, folyók, tavak). A tematikus térkép egy adott témára szakosodott; ilyen a politikai térkép (országok, autonóm közösségek), de lehet éghajlat, népesség, védett területek, utak térképe is.", "tasks": [{"n": "1", "text": "EXPLICA qué son los mapas.", "text_hu": "MAGYARÁZD EL, mik azok a térképek."}, {"n": "2", "text": "DESCRIBE los diferentes componentes que aparecen en un mapa.", "text_hu": "ÍRD LE a térképen megjelenő különböző részeket."}, {"n": "3", "text": "¿Qué tipo de mapas debes consultar para localizar una montaña o una comunidad autónoma? RAZONA tu contestación.", "text_hu": "Milyen típusú térképet kell nézned egy hegy vagy egy autonóm közösség megtalálásához? INDOKOLD a válaszod."}], "section": "mapas"}, "tb42": {"title": "Localización y límites de España", "title_hu": "Spanyolország elhelyezkedése és határai", "summary_hu": "Spanyolország az északi félgömbön van, Európa országa. Területének nagy része az Ibériai-félszigeten fekszik. Hozzá tartoznak a Kanári-szigetek (Atlanti-óceán), a Baleár-szigetek (Földközi-tenger), Ceuta és Melilla (Észak-Afrika) és más kisebb területek. Térképek mutatják őket.", "tasks": [{"n": "extra", "text": "Extra: Mira los mapas de la página y contesta.", "text_hu": "Extra: Nézd meg az oldal térképeit, és válaszolj."}], "section": "espana"}, "tb43": {"title": "Los límites de España", "title_hu": "Spanyolország határai", "summary_hu": "Spanyolország földrajzi határai: mesterséges határok (északon Franciaország és Andorra, nyugaton Portugália, délen Gibraltár / Egyesült Királyság) és természetes határok (északon Cantabriai-tenger és a Pireneusok, délen a Földközi-tenger és az Atlanti-óceán, keleten a Földközi-tenger, nyugaton az Atlanti-óceán).", "tasks": [{"n": "1", "text": "ENUMERA los países con los que España comparte fronteras.", "text_hu": "SOROLD FEL azokat az országokat, amelyekkel Spanyolország határos."}, {"n": "2", "text": "Además de los situados en la península Ibérica, ¿qué otros territorios posee España? ESCRIBE su nombre y su localización.", "text_hu": "Az Ibériai-félszigeten lévőkön kívül milyen más területei vannak Spanyolországnak? ÍRD LE a nevüket és a helyüket."}, {"n": "3", "text": "ESCRIBE el nombre de la forma del relieve que separa la península Ibérica de Europa.", "text_hu": "ÍRD LE annak a domborzati formának a nevét, amely elválasztja az Ibériai-félszigetet Európától."}], "section": "espana"}, "tb44": {"title": "Las coordenadas terrestres", "title_hu": "A földrajzi koordináták", "summary_hu": "A földrajzi koordináták egy pont pontos helyét adják meg a Föld felszínén. Képzeletbeli vonalakkal ábrázoljuk: a szélességi körök (paralelek) és a hosszúsági körök (meridiánok). Három lépés: az Egyenlítő, a greenwichi 0° meridián, majd a szélesség (É/D) és a hosszúság (K/Ny).", "tasks": [{"n": "extra", "text": "Extra: Mira el globo con los paralelos y los meridianos y contesta.", "text_hu": "Extra: Nézd meg a szélességi és hosszúsági körökkel ellátott földgömböt, és válaszolj."}], "section": "coordenadas"}, "tb45": {"title": "Las coordenadas: mapa y actividades", "title_hu": "A koordináták: térkép és feladatok", "summary_hu": "Ha ismered a szélességet és hosszúságot, a Föld bármely pontját meg tudod adni. Egy világtérkép hálóval. Feladatok: szigetek besorolása északi/déli szélesség szerint, Új-Jork, Peking és Madrid szélessége, koordináták megfejtése a térképen, a saját település koordinátái.", "tasks": [{"n": "1", "text": "En equipos, CLASIFICAD las siguientes islas según se localicen en latitud norte o latitud sur: Galápagos, Cabo Verde, Canarias, Malvinas, Kerguelen, Británicas y Filipinas.", "text_hu": "Csoportokban OSZTÁLYOZZÁTOK a következő szigeteket aszerint, hogy északi vagy déli szélességen vannak: Galápagos, Zöld-foki-szigetek, Kanári-szigetek, Falkland-(Malvin-)szigetek, Kerguelen, Brit-szigetek és Fülöp-szigetek."}, {"n": "2", "text": "UBICA las ciudades de Nueva York, Pekín y Madrid y señala su latitud.", "text_hu": "HELYEZD EL Új-Jork, Peking és Madrid városát, és jelöld meg a szélességüket."}, {"n": "3", "text": "INDICA con qué puntos señalados en el mapa se corresponden las siguientes coordenadas. • 40° de latitud norte y 120° de longitud oeste. • 20° de latitud sur y 40° de longitud oeste. • 20° de latitud norte y 40° de longitud este. • 40° de latitud norte y 0° de longitud.", "text_hu": "MUTASD MEG, a térkép mely megjelölt pontjai felelnek meg a következő koordinátáknak. • 40° északi szélesség és 120° nyugati hosszúság. • 20° déli szélesség és 40° nyugati hosszúság. • 20° északi szélesség és 40° keleti hosszúság. • 40° északi szélesség és 0° hosszúság."}, {"n": "4", "text": "Busca información y SEÑALA las coordenadas de la localidad en la que vives y de otras localidades que conoces o que te gustaría conocer.", "text_hu": "Keress információt, és JELÖLD MEG annak a településnek a koordinátáit, ahol élsz, és más településekét, amelyeket ismersz vagy szeretnél megismerni."}], "section": "coordenadas"}, "tb46": {"title": "Practicamos (1)", "title_hu": "Gyakorlunk (1)", "summary_hu": "Gyakorló oldal. Az 1. feladatban Spanyolország fizikai térképét nézzük: hegységeket, a Guadalquivir- és az Ebro-medence környékét keressük meg, és azt, melyik óceánban vannak a Kanári-szigetek. A 2. feladatban a GPS mai használatát kell utánajárni, és összehasonlítani az iránytűvel.", "tasks": [{"n": "1", "text": "Fíjate en el mapa físico y ESCRIBE: el nombre de cinco cadenas o cordilleras montañosas; el nombre de las montañas que se encuentran al norte y al sur de la depresión del Guadalquivir; el nombre de las montañas que se encuentran al norte y al sur de la depresión del Ebro; ¿en qué océano están ubicadas las islas Canarias?", "text_hu": "Nézd meg a fizikai térképet, és ÍRD LE: öt hegylánc nevét; a Guadalquivir-medencétől északra és délre fekvő hegyek nevét; az Ebro-medencétől északra és délre fekvő hegyek nevét; melyik óceánban vannak a Kanári-szigetek?"}, {"n": "2", "text": "INVESTIGA sobre el uso de los GPS en la actualidad. EXPLICA cómo ha cambiado la forma en la que las personas se orientan y localizan distintos lugares. ¿Qué ventajas y qué desventajas tiene un GPS comparado con una brújula tradicional? JUSTIFICA tu respuesta. EXPLICA qué clase de información puedes obtener de cada uno.", "text_hu": "KUTASS utána, ma hogyan használják a GPS-t. MAGYARÁZD EL, hogyan változott meg, ahogyan az emberek tájékozódnak és helyeket találnak meg. Milyen előnyei és hátrányai vannak a GPS-nek a hagyományos iránytűhöz képest? INDOKOLD. MAGYARÁZD EL, milyen információt kaphatsz mindegyikből."}], "section": "practica"}, "tb47": {"title": "Practicamos (2)", "title_hu": "Gyakorlunk (2)", "summary_hu": "Folytatódó gyakorló oldal. A 3. feladatban egy világtérképről kell megmondani, mi hiányzik belőle (cím, jelmagyarázat, méretarány). A 4. feladat: hegyen vagy GPS nélkül, iránytűvel és térképpel – hogyan tájékozódsz napsütésben és viharban. Az 5. feladat: rajzolj Spanyolország-térképet, és jelöld a természetes határokat, a szomszéd országokat, a szigeteket, Ceutát és Melillát.", "tasks": [{"n": "3", "text": "Fíjate en el siguiente mapa y contesta las preguntas. SEÑALA las partes que faltan para poder interpretar el mapa. ¿Cómo afecta esto a la información que podemos obtener de él? JUSTIFICA tu respuesta.", "text_hu": "Nézd meg a következő térképet, és válaszolj a kérdésekre. JELÖLD MEG a hiányzó részeket, amelyek nélkül nem lehet értelmezni a térképet. Hogyan befolyásolja ez a térképből kapható információt? INDOKOLD."}, {"n": "4", "text": "Imagina que estás en una montaña y no puedes conectarte a un GPS. Llevas una mochila con una brújula y un mapa de la zona y se dan estas dos situaciones. El día es soleado y tienes que localizar el norte. ¿Qué métodos de orientación puedes emplear? JUSTIFICA tu respuesta. El día está muy nublado y hay tormenta. ¿Qué método de orientación es el más adecuado? ARGUMENTA tu contestación.", "text_hu": "Képzeld el, hogy egy hegyen vagy, és nem tudsz GPS-hez csatlakozni. A hátizsákodban iránytű és a környék térképe van, és két helyzet adódik. Napos az idő, és meg kell találnod az északot. Milyen tájékozódási módszereket használhatsz? INDOKOLD. Nagyon felhős az ég, és vihar van. Melyik a legalkalmasabb módszer? ÉRVELJ."}, {"n": "5", "text": "DIBUJA un mapa de España y resuelve las siguientes actividades. ESCRIBE los límites geográficos naturales en cada uno de los puntos cardinales. NOMBRA cada uno de los países con los que tiene límites artificiales. LOCALIZA las islas Baleares y las Canarias. SEÑALA las ciudades autónomas de Ceuta y Melilla.", "text_hu": "RAJZOLJ egy térképet Spanyolországról, és oldd meg a következő feladatokat. ÍRD LE a természetes földrajzi határokat az egyes égtájak szerint. NEVEZD MEG azokat az országokat, amelyekkel mesterséges határa van. KERESD MEG a Baleár- és a Kanári-szigeteket. JELÖLD MEG Ceuta és Melilla autonóm városokat."}], "section": "practica"}, "tb48": {"title": "Practicamos (3)", "title_hu": "Gyakorlunk (3)", "summary_hu": "Gyakorló oldal. A 6. feladatban kincses térképet rajzolsz a környékedről szélrózsával és jelmagyarázattal. A 7. feladatban négy utazást tervezel a világtérképen (Madrid–Canberra, Dakar–Mexikóváros, Moszkva–Antananarivo, Ushuaia–Kisangani): irány, óceán, földrész, és három koordináta alapján a megfelelő város.", "tasks": [{"n": "6", "text": "DIBUJA un pequeño mapa del tesoro de tu barrio o de tu localidad siguiendo estas instrucciones. ELIGE el punto en el que quieres esconder el tesoro. SEÑALA los puntos cardinales con una rosa de los vientos. INCLUYE una leyenda con símbolos para cada uno de los elementos del mapa: para el tesoro, las calles y carreteras, los ríos, las casas, los edificios...", "text_hu": "RAJZOLJ egy kis kincses térképet a környékedről vagy a településedről az alábbi utasítások szerint. VÁLASSZ ki egy pontot, ahová a kincset elrejtenéd. JELÖLD MEG az égtájakat szélrózsával. KÉSZÍTS jelmagyarázatot jelekkel a térkép minden elemére: a kincsre, az utcákra és országutakra, a folyókra, a házakra, az épületekre..."}, {"n": "7", "text": "Imagina que tienes que llevar a cabo cuatro viajes entre estos destinos: entre Madrid y Camberra; entre Dakar y Ciudad de México; entre Moscú y Antananarivo; entre Ushuaia y Kisangani. EXPLICA en qué dirección debes viajar (norte, sur, este u oeste). NOMBRA el océano que vas a atravesar en cada uno de los viajes. SEÑALA en qué continente se encuentra cada uno de los destinos. LOCALIZA a qué ciudades de las mencionadas pertenecen las siguientes coordenadas: 56° de latitud norte y 37° de longitud este; 14° de latitud norte y 15° de longitud oeste; 55° de latitud sur y 68° de longitud oeste.", "text_hu": "Képzeld el, hogy négy utat kell megtenned ezek között az úti célok között: Madrid és Canberra; Dakar és Mexikóváros; Moszkva és Antananarivo; Ushuaia és Kisangani. MAGYARÁZD EL, milyen irányba kell utaznod (észak, dél, kelet vagy nyugat). NEVEZD MEG az óceánt, amelyen átkelsz az egyes utakon. JELÖLD MEG, melyik földrészen van az egyes úti cél. KERESD MEG, hogy az említett városok közül melyikhez tartoznak a következő koordináták."}], "section": "practica"}, "tb49": {"title": "¿Qué hemos aprendido? Repasa", "title_hu": "Mit tanultunk? Ismételj!", "summary_hu": "A fejezet összefoglaló oldala (gondolattérkép). A Földet földgömbön és világtérképen ábrázoljuk; az Egyenlítő két féltekére osztja a Földet; az égtájak: észak, dél, kelet, nyugat. A térképek lehetnek fizikaiak vagy tematikusak, részei a cím, jelmagyarázat, szélrózsa és méretarány. Spanyolország természetes határai, szomszédai és hegyvidékes domborzata.", "tasks": [{"n": "Repasa", "text": "REPASA. La Tierra se representa en globos terráqueos y mapamundis. Los mapas pueden ser físicos o temáticos y constan de título, leyenda, rosa de los vientos y escala. Los límites naturales de España son el mar Mediterráneo, el mar Cantábrico, el océano Atlántico y los Pirineos. España tiene fronteras con Portugal, Francia, el Principado de Andorra, el peñón de Gibraltar (Reino Unido) y Marruecos. El relieve de España es muy montañoso y está compuesto por la Meseta Central y una serie de cordilleras, sistemas montañosos y depresiones.", "text_hu": "ISMÉTELD. A Földet földgömbökön és világtérképeken ábrázoljuk. A térképek lehetnek fizikaiak vagy tematikusak, és részei a cím, a jelmagyarázat, a szélrózsa és a méretarány. Spanyolország természetes határai a Földközi-tenger, a Cantabriai-tenger, az Atlanti-óceán és a Pireneusok. Spanyolországnak határa van Portugáliával, Franciaországgal, az Andorrai Hercegséggel, a Gibraltár-sziklával (Egyesült Királyság) és Marokkóval. Spanyolország domborzata nagyon hegyes: a Központi-fennsík, hegyláncok, hegységrendszerek és medencék alkotják."}], "section": "repaso"}, "tb50": {"title": "¿Qué hemos aprendido? Aplica", "title_hu": "Mit tanultunk? Alkalmazd!", "summary_hu": "Alkalmazós oldal a Pireneusok fizikai térképével. Egy látogatás során a Nemzeti Földrajzi Intézetben a gyerekeket kérdésekkel tesztelik a térképről. Meg kell mondani, fizikai vagy politikai-e a térkép, értelmezni a címet, a szélrózsát és a méretarányt, a természetben való tájékozódást, a Pireneusok mint határ két országgal, Spanyolország hegyláncai és medencéi, végül földgömbön vagy világtérképen látszik-e jobban a Pireneusok.", "tasks": [{"n": "1", "text": "¿Es un mapa físico o político? JUSTIFICA tu respuesta.", "text_hu": "Fizikai vagy politikai térkép ez? INDOKOLD a válaszod."}, {"n": "2", "text": "Fíjate en las partes que permiten interpretar el mapa y contesta. ¿El título te da pistas sobre el tema que se representa en el mapa? JUSTIFICA tu contestación. Observa la rosa de los vientos y ESCRIBE el nombre del pico que está más al este y el del pico que está más al oeste. OBSERVA la escala y di cuál es la proporción entre un centímetro en el mapa y en la realidad.", "text_hu": "Nézd meg a térkép értelmezését segítő részeket, és válaszolj. Ad-e a cím támpontot a térkép témájáról? INDOKOLD. Nézd a szélrózsát, és ÍRD LE, melyik a legkeletibb és melyik a legnyugatibb csúcs neve. NÉZD a méretarányt, és mondd meg, mi az arány a térképen mért egy centiméter és a valóság között."}, {"n": "3", "text": "Imagina que quieres subir al monte Aneto y te han indicado que tienes que dirigirte hacia el norte. DESCRIBE de qué formas puedes orientarte con la naturaleza.", "text_hu": "Képzeld el, hogy fel akarsz mászni az Aneto-hegyre, és azt mondták, hogy észak felé kell menned. ÍRD LE, hogyan tájékozódhatsz a természet segítségével."}, {"n": "4", "text": "Los Pirineos son la frontera natural de España con dos países. ESCRIBE sus nombres.", "text_hu": "A Pireneusok Spanyolország természetes határa két országgal. ÍRD LE a nevüket."}, {"n": "5", "text": "Partiendo de los Pirineos hacia el sur, ESCRIBE una lista con las cordilleras y depresiones que podemos encontrar en España.", "text_hu": "A Pireneusoktól dél felé haladva ÍRJ egy listát Spanyolország hegyláncairól és medencéiről."}, {"n": "6", "text": "Por último, piensa si sería más fácil ver con detalle los Pirineos en un globo terráqueo o en un mapamundi. JUSTIFICA tu respuesta.", "text_hu": "Végül gondold végig, hogy a Pireneusokat részletesebben földgömbön vagy világtérképen lenne-e könnyebb látni. INDOKOLD a válaszod."}], "section": "repaso"}, "tb51": {"title": "¿Qué hemos aprendido? Crea y Ticket de salida", "title_hu": "Mit tanultunk? Alkoss! és Kilépőjegy", "summary_hu": "A fejezet záró oldala. „Alkoss!”: hogyan ismertetnéd meg Spanyolország földrajzát? Három ötlet közül választhatsz: domborzati térkép gyurmából, tájékozódási játék koordinátákkal, vagy napló Silvia módjára. A „Kilépőjegy”: olvasd el az állításokat, és mondd meg, mennyire tanultad meg (keveset, eléggé vagy sokat), majd hasonlítsd össze a belépőjeggyel.", "tasks": [{"n": "Crea", "text": "CREA. ¿Cómo darías tú a conocer la geografía de España? Has aprendido mucho sobre mapas y orientación, en especial sobre la geografía española. ¿Cuál de estas propuestas prefieres desarrollar para mostrar tus conocimientos? ¿Por qué? Un mapa en relieve de España elaborado con plastilina, donde marques las formas del relieve destacadas. Un juego de orientación para localizar diferentes puntos. Tú das las coordenadas y tus compañeros deberán adivinarlos. Una entrada para un diario, como si fueras Silvia. Elige una montaña e imagina que has estado allí, qué dirías, qué recomendarías...", "text_hu": "ALKOSS. Te hogyan ismertetnéd meg Spanyolország földrajzát? Sokat tanultál a térképekről és a tájékozódásról, főleg Spanyolország földrajzáról. A következő ötletek közül melyiket szeretnéd kidolgozni, hogy megmutasd a tudásodat? Miért? Spanyolország domborzati térképe gyurmából, ahol megjelölöd a fontos domborzati formákat. Tájékozódási játék különböző pontok megkeresésére: te megadod a koordinátákat, a társaid kitalálják. Naplóbejegyzés, mintha Silvia lennél: válassz ki egy hegyet, képzeld, hogy ott jártál, mit mondanál, mit ajánlanál..."}, {"n": "Ticket", "text": "TICKET DE SALIDA. LEE cada enunciado y DI cuánto crees que has aprendido: un poco, bastante o mucho. El globo terráqueo y el planisferio. La orientación. Los mapas. Los límites de España. Las montañas de España. La localización. ¡No olvides compararlo con tu ticket de entrada!", "text_hu": "KILÉPŐJEGY. OLVASD el az állításokat, és MONDD meg, szerinted mennyit tanultál: keveset, eléggé vagy sokat. A földgömb és a síktérkép. A tájékozódás. A térképek. Spanyolország határai. Spanyolország hegyei. Az elhelyezkedés. Ne felejtsd el összehasonlítani a belépőjeggyel!"}], "section": "repaso"}}, "books": {"tb": "Lengua 3 – tankönyv", "cu": "Lengua 3 – munkafüzet (cuaderno)", "sb": "Lengua 3 – Saberes básicos"}},SP={"es": {"1 centímetro": [0.0, 1.3], "1 cm del mapa son 100 cm reales, o sea, 1 metro.": [1.6, 4.214], "10 metros": [6.115, 1.161], "100 cm reales son ¿cuántos metros?": [7.576, 2.368], "100 cm, o sea, 1 metro": [10.244, 2.287], "20° de latitud norte y 40° de longitud este:": [12.831, 3.611], "20° de latitud sur y 40° de longitud oeste:": [16.742, 3.599], "40° N y 0° → España": [20.641, 2.368], "40° de latitud norte y 0° de longitud:": [23.31, 3.146], "40° de latitud norte y 120° de longitud oeste:": [26.756, 3.924], "56° N, 37° E = Moscú · 14° N, 15° O = Dakar · 55° S, 68° O = Ushuaia": [30.98, 10.008], "A la derecha": [41.288, 1.126], "A la izquierda": [42.714, 1.231], "A un objeto plano": [44.245, 1.451], "A una bola": [45.996, 1.173], "Actívate": [47.469, 0.998], "Actívate (2) y Ticket de entrada": [48.767, 2.136], "Al norte de la depresión del Ebro están los Pirineos y al sur, el Sistema Ibérico.": [51.203, 4.667], "Al norte de la depresión del Guadalquivir está Sierra Morena y al sur, las cordilleras Béticas.": [56.17, 5.55], "Al oeste de España está el mar Cantábrico.": [62.02, 2.368], "Al oeste, la frontera con Portugal.": [64.688, 1.974], "Al sur, el pequeño territorio británico de Gibraltar.": [66.962, 3.495], "Alemania": [70.757, 1.08], "América": [72.136, 1.022], "América del Norte": [73.458, 1.382], "América del Sur": [75.14, 1.289], "Andorra": [76.728, 0.859], "Antananarivo": [77.888, 1.219], "Antes se usaban mapas, el Sol, las estrellas y la brújula.": [79.407, 3.471], "Antártida": [83.178, 1.126], "Aplica: mira el «Mapa físico de los Pirineos» y contesta.": [84.604, 4.005], "Archipiélago a la derecha de la península, en el mar Mediterráneo:": [88.91, 3.622], "Archipiélago de abajo a la izquierda, en el océano Atlántico:": [92.832, 3.646], "Arriba": [96.777, 0.848], "Asia": [97.925, 0.801], "Averigua el país a partir de las pistas.": [99.026, 2.577], "Añade una leyenda con símbolos para el tesoro, las calles, los ríos y las casas.": [101.903, 5.178], "Brasil está en…": [107.382, 1.428], "Británicas": [109.11, 1.103], "Busca las coordenadas de la localidad en la que vives.": [110.513, 2.972], "Cabo Verde": [113.785, 1.115], "Calcula con la escala.": [115.199, 1.649], "Camberra": [117.148, 0.882], "Canarias": [118.33, 0.94], "Canarias (Atlántico), Baleares (Mediterráneo), Ceuta y Melilla (África)": [119.571, 4.156], "Ceuta y Melilla": [124.027, 1.289], "Ceuta y Melilla están en el norte de África.": [125.616, 2.554], "Ceuta y Melilla están en el norte de…": [128.47, 2.322], "Ceuta y Melilla son ciudades autónomas en el norte de África.": [131.092, 3.297], "Chistes": [134.689, 0.929], "Ciudad de México": [135.918, 1.265], "Clasificad las islas: ¿latitud norte o latitud sur?": [137.483, 3.82], "Con el Sol": [141.603, 1.08], "Con el Sol y con la brújula": [142.983, 1.765], "Con el brazo derecho hacia el este, ¿qué tienes delante?": [145.048, 3.03], "Con la escala 1:100, 1 cm del mapa son…": [148.378, 3.135], "Con la estrella Polar": [151.812, 1.416], "Con la latitud y la longitud encuentras la ciudad: 56° N y 37° E es Moscú. i-óceán": [1238.597, 1.44], "Iránytűvel és GPS-szel": [1240.336, 1.985], "Ismételj: egészítsd ki a helyes szóval!": [1242.622, 2.705], "Ismétlés": [1245.627, 1.115], "Javítsd ki az állításokat!": [1247.041, 2.206], "Jegyezd meg: Spanyolország az északi félgömbön, Európában van, és az Ibériai-félsziget nagy részét foglalja el. Határai természetesek (tengerek, óceánok, hegyek) vagy mesterségesek (országhatárok).": [1249.547, 12.817], "Jegyezd meg: a Földet földgömbön és világtérképen ábrázoljuk. A térképnek van címe, jelmagyarázata, szélrózsája és méretaránya. Spanyolország Portugáliával, Franciaországgal, Andorrával, Gibraltárral és Marokkóval határos.": [1262.665, 15.94], "Jegyezd meg: a földgömb gömb; a síktérkép az egész Föld lapos térképe. Az Egyenlítő két félgömbre osztja a Földet.": [1278.905, 7.93], "Jegyezd meg: a szélesség az Egyenlítőtől mért távolság (északi vagy déli). A hosszúság a greenwichi, vagyis 0° meridiántól mért távolság (keleti vagy nyugati).": [1287.135, 10.182], "Jegyezd meg: a térképek segítenek tájékozódni és megismerni a helyeket.": [1297.617, 4.853], "Jegyezd meg: a térképnek van címe, jelmagyarázata, szélrózsája és méretaránya. Vannak fizikai és tematikus térképek (ilyen a politikai is).": [1302.77, 9.729], "Jegyezd meg: az égtájak: észak (N), dél (S), kelet (E) és nyugat (O). Tájékozódhatunk a Nappal, a Sarkcsillaggal, iránytűvel és GPS-szel.": [1312.799, 8.975], "Jegyezd meg: felhők és vihar esetén a tájékozódás legjobb segítője az iránytű. A térképnek kell cím, jelmagyarázat, szélrózsa és méretarány.": [1322.073, 9.961], "Jelmagyarázat nélkül nem tudjuk…": [1332.335, 2.891], "Jelöld az égtájakat szélrózsával.": [1335.526, 2.659], "Jobbra": [1338.484, 1.01], "K: Földközi-tenger": [1339.794, 2.032], "Kanári-szigetek": [1342.126, 1.416], "Kanári-szigetek → Atlanti-óceán": [1343.843, 2.496], "Kanári-szigetek, Baleárok, Ceuta és Melilla": [1346.639, 3.146], "Kelet": [1350.085, 0.836], "Keleten": [1351.221, 1.033], "Keletről nyugatra veszi körül a Földet.": [1352.554, 2.647], "Keresd meg a településed koordinátáit!": [1355.501, 2.937], "Kerguelen-szigetek": [1358.739, 1.509], "Kilépőjegy: mennyit tanultál? Keveset, eléggé vagy sokat. Hasonlítsd össze a belépőjegyeddel!": [1360.548, 7.047], "Kinyújtott karokkal a jobb kéz nyugatot mutat.": [1367.895, 2.868], "Kis hercegség Franciaország és Spanyolország között:": [1371.063, 3.646], "Kisangani": [1375.008, 1.184], "Koppints a természeti elemekre, amelyeket a fizikai térkép mutat!": [1376.493, 4.191], "Koppints az óceánok nevére!": [1380.984, 2.067], "Képzeld el, hogy az osztálytermed 10 méter, és le akarod rajzolni egy papírra.": [1383.35, 5.294], "Képzeletbeli vonal.": [1388.945, 1.707], "Képzeletbeli vonalakkal ábrázoljuk őket, amelyek körülveszik a Földet: a szélességi és a hosszúsági körökkel.": [1390.951, 7.407], "Készíts jelmagyarázatot jelekkel a kincshez, utcákhoz, folyókhoz és házakhoz.": [1398.658, 5.294], "Központi-fennsík, hegyláncok és medencék": [1404.253, 2.798], "Lapos": [1407.351, 0.998], "Lisszabon": [1408.649, 1.115], "Ma felmentem az Anetóra. Észak felé mentem, és iránytűvel tájékozódtam.": [1410.064, 5.236], "Ma nagyon pontosan tudunk tájékozódni.": [1415.6, 2.519], "Madrid": [1418.419, 0.94], "Madrid Európában, Canberra Óceániában van.": [1419.659, 3.471], "Madrid → Canberra: főleg merre utazol?": [1423.431, 3.158], "Madrid: északi szélesség…": [1426.889, 2.786], "Magyarázd el, hogyan működik az iránytű!": [1429.975, 2.705], "Magyarázd el, mik a térképek!": [1432.98, 2.229], "Majdnem! Nézd meg a helyes választ.": [1435.509, 2.972], "Marokkó": [1438.782, 1.01], "Meg tudom különböztetni a földgömböt és a síktérképet.": [1440.092, 3.68], "Meglátogatjuk a Nemzeti Földrajzi Intézetet.": [1444.072, 3.239], "Megnézem, hol kel a Nap: az a kelet.": [1447.611, 2.531], "Melyik Spanyolország szigetcsoportja?": [1450.442, 2.473], "Melyik a két szigetcsoport helyes neve?": [1453.215, 2.426], "Melyik a legjobb indoklás?": [1455.942, 1.962], "Melyik betű a nyugat?": [1458.204, 1.625], "Melyik domborzati forma választja el az Ibériai-félszigetet Európától?": [1460.129, 4.632], "Melyik eszköznek kell elem és műholdjel?": [1465.061, 2.508], "Melyik eszköznek van mágnestűje?": [1467.869, 2.334], "Melyik fennsík van a félsziget közepén?": [1470.503, 2.438], "Melyik félgömbön van Spanyolország?": [1473.241, 2.508], "Melyik földrész van az adott helyen?": [1476.049, 2.276], "Melyik földrészen van Dakar?": [1478.624, 2.125], "Melyik földrészen van az úti cél?": [1481.049, 2.473], "Melyik hegység van a Guadalquivir-medencétől délre?": [1483.822, 3.495], "Melyik hegység van a Guadalquivir-medencétől északra?": [1487.616, 3.541], "Melyik hegység van az Ebro-medencétől délre?": [1491.457, 2.914], "Melyik hegység van az Ebro-medencétől északra?": [1494.671, 2.984], "Melyik országgal határos Spanyolország nyugaton?": [1497.955, 3.135], "Melyik országokkal határos Spanyolország?": [1501.39, 2.961], "Melyik rész hiányzik a valódi távolságokhoz?": [1504.65, 3.123], "Melyik rész hiányzik, hogy tudjuk, miről szól a térkép?": [1508.074, 3.286], "Melyik rész hiányzik, hogy tudjuk, mit jelentenek a színek?": [1511.659, 3.553], "Melyik rész magyarázza a jeleket és a színeket?": [1515.512, 2.914], "Melyik rész mutatja a térkép és a valóság viszonyát?": [1518.726, 3.274], "Melyik sark van fent?": [1522.3, 1.672], "Melyik szigetcsoport van a Földközi-tengerben?": [1524.272, 3.053], "Melyik természetes határ?": [1527.625, 1.916], "Melyik téma szól a szélességről és a hosszúságról?": [1529.841, 3.39], "Melyik térkép mutatja a domborzatot?": [1533.531, 2.392], "Melyik város van 14° északi szélességen és 15° nyugati hosszúságon?": [1536.223, 5.364], "Melyik város van 55° déli szélességen és 68° nyugati hosszúságon?": [1541.886, 5.178], "Melyik város van 56° északi szélességen és 37° keleti hosszúságon?": [1547.364, 5.387], "Melyik óceán?": [1553.052, 1.428], "Melyik óceánban vannak a Kanári-szigetek?": [1554.78, 2.844], "Merre kel a Nap?": [1557.924, 1.428], "Merre mutat mindig a tű?": [1559.652, 1.811], "Merre mutat mindig az iránytű tűje?": [1561.763, 2.45], "Merre nyugszik le a Nap?": [1564.513, 1.753], "Mert a Föld gömbölyű, mint a földgömb.": [1566.566, 2.612], "Mert a földgömb szép.": [1569.478, 1.788], "Mert a térkép nagy.": [1571.566, 1.707], "Mert hegyeket, csúcsokat, folyókat és magasságokat mutat": [1573.573, 3.796], "Mert helyet változtat": [1577.669, 1.718], "Mert kialszik": [1579.688, 1.091], "Mert nem látszik az ég": [1581.079, 1.614], "Mert országokat mutat": [1582.993, 1.823], "Mesekönyv": [1585.115, 1.103], "Mesterséges határok: északon Franciaország és Andorra; nyugaton Portugália; délen Gibraltár, amely az Egyesült Királyságé.": [1586.518, 8.591], "Mexikóváros": [1595.41, 1.405], "Mi Franciaország fővárosa?": [1597.115, 2.287], "Mi a síktérkép másik neve?": [1599.702, 2.032], "Mi a térkép, és melyek a részei: cím, jelmagyarázat, szélrózsa, méretarány (1:100). A térképek fajtái: fizikai és tematikus (például politikai) térképek.": [1602.034, 11.238], "Mi a térkép?": [1613.572, 1.358], "Mi az ország fővárosa?": [1615.23, 1.985], "Mi hasonlít jobban a valódi Földre?": [1617.516, 2.485], "Mi készít képeket a Földről az űrből?": [1620.3, 2.728], "Mi körül forog a Föld?": [1623.329, 1.846], "Mi segít megismertetni a földrajzot?": [1625.475, 2.635], "Mi van Spanyolországtól keletre?": [1628.41, 2.31], "Milyen alakú a földgömb?": [1631.02, 1.916], "Milyen alakú valójában a Föld?": [1633.236, 2.334], "Milyen domborzati forma ez?": [1635.87, 2.09], "Milyen más területei vannak Spanyolországnak? Párosítsd a helyükkel!": [1638.259, 4.83], "Milyen térképet kell megnézned?": [1643.389, 2.194], "Milyennek képzeled a Föld bolygót? Inkább egy golyóra hasonlít vagy egy lapos tárgyra?": [1645.883, 5.445], "Minden utazásnál megmondod az irányt, az óceánt, amelyen átkelsz, és az úti célok földrészét.": [1651.629, 6.177], "Mindig fényképez, és közzéteszi a fotókat. Útvonalakról és tájékozódási tanácso   if(pos===items.length)wDone(el,w,sid,Math.max(0,items.length-err),items.length)}else{err++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600);praise(false)}})}
function wTF(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((it,i)=>`<div class="fillq" data-i="${i}"><span style="flex:1 1 260px"><b>${esc(it.t)}</b>${huOn&&it.hu?`<br><span class="hu">${esc(it.hu)}</span>`:''}</span><button class="abtn" data-s>🔊</button><button class="tile" data-v="1">✔ Verdadero</button><button class="tile" data-v="0">✘ Falso</button></div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('.fillq').forEach(q=>{const it=w.items[q.dataset.i];q.querySelector('[data-s]').onclick=()=>sayPair(it.t,it.hu);
  q.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(q.dataset.d)return;q.dataset.d=1;n++;const good=(b.dataset.v==='1')===!!it.answer;if(good)ok++;b.classList.add(good?'ok':'no');
   if(!good)q.querySelector(`[data-v="${it.answer?1:0}"]`).classList.add('ok');play([clip('es',it.answer?'Verdadero':'Falso')||null]);praise(good);if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
function wChoice(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((c,i)=>`<div data-ci="${i}">${choiceHTML(c,'w'+i)}</div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('[data-ci]').forEach(d=>{const c=w.items[d.dataset.ci],root=d.querySelector('.check');
  root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>sayPair(c.q,c.q_hu));
  root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(root.dataset.done)return;root.dataset.done=1;n++;const i=+b.dataset.i,good=i===c.answer;if(good)ok++;
   b.classList.add(good?'ok':'no');if(!good)root.querySelectorAll('.opt')[c.answer].classList.add('ok');kitty(root.querySelector('.kit'),good);sayEs(c.options[c.answer].t);
   if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
function wNum(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((it,i)=>`<div class="fillq" data-i="${i}">${emo(it.pic,'e')}<span style="flex:1 1 220px"><b style="font-size:20px">${esc(it.q)}</b>${huOn&&it.q_hu?`<br><span class="hu">${esc(it.q_hu)}</span>`:''}</span><button class="abtn" data-s>🔊</button><input inputmode="numeric" style="font:inherit;font-size:22px;width:120px;padding:8px;border-radius:12px;border:2px solid var(--line)"> ${esc(it.unit||'')}<button class="tile" data-ok>✔</button></div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('.fillq').forEach(q=>{const it=w.items[q.dataset.i],inp=q.querySelector('input');q.querySelector('[data-s]').onclick=()=>sayPair(it.q,it.q_hu);
  const go=()=>{if(q.dataset.d||!inp.value.trim())return;q.dataset.d=1;n++;const v=parseFloat(inp.value.replace(',','.').replace(/\s/g,''));const good=Math.abs(v-Number(it.answer))<1e-9;if(good)ok++;
   inp.style.borderColor=good?'var(--ok)':'var(--bad)';inp.style.background=good?'var(--okbg)':'var(--badbg)';if(!good)inp.insertAdjacentHTML('afterend',` <b style="color:var(--ok)">→ ${esc(it.answer)}</b>`);
   praise(good);if(n===w.items.length)wDone(el,w,sid,ok,n)};
  q.querySelector('[data-ok]').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}})}
// ---------- példák
let egSec='all';
function rEg(V){const list=[];D.sections.forEach(s=>(s.examples||[]).forEach((e,i)=>{if(egSec==='all'||egSec===s.id)list.push({...e,sid:s.id,k:s.id+i})}));
 let h=`<div class="panel"><div class="filt"><select id="egS"><option value="all">Minden rész</option>${D.sections.map(s=>`<option value="${s.id}" ${egSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <button class="big l" id="egAll">🔊 Mind felolvasása</button></div><p class="hu" style="margin:0">Tipp: a magyar fordítás elmosva látszik – előbb próbáld kitalálni, aztán koppints rá!</p>`;
 list.forEach((e,i)=>{h+=`<div class="ex">${emo(e.pic,'e')}<div><div class="row" style="margin:0 0 4px">${pchip(e.ref)}</div><div class="es">${hlText(e.es,e.hl)}</div>${huOn?`<div class="hu hide" data-rv>${esc(e.hu)}</div>`:''}
  <div class="row"><button class="abtn" data-es="${i}">🔊 ES</button>${huOn?`<button class="abtn h" data-hu="${i}">🔊 HU</button>`:''}${e.try?`<button class="abtn" data-try="${i}">✏️ Te jössz!</button>`:''}</div><div data-tb="${i}"></div></div></div>`});
 V.innerHTML=h+'</div>';
 $('#egS').onchange=e=>{egSec=e.target.value;render()};$('#egAll').onclick=()=>{const L=[];list.forEach(e=>{L.push(clip('es',e.es));if(huOn)L.push(clip('hu',e.hu))});play(L)};
 V.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>b.classList.remove('hide'));
 V.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>sayEs(list[b.dataset.es].es));V.querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>sayHu(list[b.dataset.hu].hu));
 V.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{const i=b.dataset.try,t=list[i].try,box=V.querySelector(`[data-tb="${i}"]`);box.innerHTML=choiceHTML(t,'t'+i);bindChoice(box.querySelector('.check'),t)})}
// ---------- szótár
let wdSec='all',wdPos='all',wdQ='',game=null;
function rWd(V){const L=WORDS.filter(w=>(wdSec==='all'||w.sec===wdSec)&&(wdPos==='all'||w.pos===wdPos)&&(!wdQ||(w.w+' '+w.hu).toLowerCase().includes(wdQ.toLowerCase()))).sort((a,b)=>a.w.replace(/^(el|la|los|las) /,'').localeCompare(b.w.replace(/^(el|la|los|las) /,''),'es'));
 const kn=WORDS.filter(w=>ST.known[w.w]).length;
 let h=`<div class="panel"><div class="filt"><input id="wq" placeholder="🔍 Keresés…" value="${esc(wdQ)}"><select id="ws"><option value="all">Minden rész</option>${D.sections.map(s=>`<option value="${s.id}" ${wdSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="wp"><option value="all">Minden szófaj</option>${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${wdPos===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <p style="margin:0 0 8px"><b>${L.length}</b> szó · tudom: <b>${kn}</b> / ${WORDS.length}. Koppints a kártyára: megfordul és felolvassa. 👍 = tudom.</p>
 <div class="games"><button class="big" data-g="mem">🃏 Memória</button><button class="big" data-g="hear">👂 Hallás → kép</button><button class="big" data-g="build">🔡 Betűkirakó</button>${game?'<button class="big l" data-g="">✕ Vissza a kártyákhoz</button>':''}</div><div id="gm"></div>`;
 if(!game){h+=`<div class="wgrid">${L.map(w=>`<div class="wc ${ST.known[w.w]?'known':''}" data-w="${esc(w.w)}"><div class="in"><div class="fa">${emo(w.pic,'e')}<b>${esc(w.w)}</b><small><span class="pos">${POS[w.pos]||''}</span> · 📖 ${esc(w.page||'')}. o.</small></div>
  <div class="ba">${emo(w.pic,'e')}<b>${esc(w.hu)}</b><small>${esc(w.w)}</small><button class="abtn" data-k style="margin-top:6px">${ST.known[w.w]?'✅ tudom':'👍 tudom'}</button></div></div></div>`).join('')}</div>`}
 V.innerHTML=h+'</div>';
 $('#wq').oninput=e=>{wdQ=e.target.value;const p=e.target.selectionStart;render();const q=$('#wq');q.focus();q.setSelectionRange(p,p)};
 $('#ws').onchange=e=>{wdSec=e.target.value;render()};$('#wp').onchange=e=>{wdPos=e.target.value;render()};
 V.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{game=b.dataset.g||null;render();if(game)runGame(game,L.length>=4?L:WORDS)});
 V.querySelectorAll('.wc').forEach(c=>c.onclick=e=>{const w=WORDS.find(x=>x.w===c.dataset.w);if(e.target.closest('[data-k]')){ST.known[w.w]=!ST.known[w.w];save();if(ST.known[w.w])star(1);render();return}
  c.classList.toggle('f');if(c.classList.contains('f'))sayPair(w.w,w.hu);else sayEs(w.w)})}
function runGame(g,pool){const G=$('#gm');
 if(g==='mem'){const ws=shuffle(pool).slice(0,6);const cards=shuffle([...ws.map((w,i)=>({i,k:'es',w})),...ws.map((w,i)=>({i,k:'pic',w}))]);let open=[],done=0,tries=0;
  G.innerHTML=`<p>Keresd a párokat: a spanyol szó és a képe! <span class="kit" id="mk">🐱</span></p><div class="mem">${cards.map((c,j)=>`<button class="mc" data-j="${j}">?</button>`).join('')}</div>`;
  G.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const c=cards[b.dataset.j];if(b.classList.contains('open')||b.classList.contains('done')||open.length===2)return;b.classList.add('open');b.innerHTML=c.k==='es'?esc(c.w.w):emo(c.w.pic,'e');if(c.k==='es')sayEs(c.w.w);open.push([b,c]);
   if(open.length===2){tries++;const[a,bb]=open;if(a[1].i===bb[1].i&&a[1].k!==bb[1].k){a[0].classList.add('done');bb[0].classList.add('done');done++;open=[];kitty($('#mk'),true);sayPair(c.w.w,c.w.hu);if(done===ws.length){star(3);G.insertAdjacentHTML('beforeend',`<p class="res">🎉 Kész ${tries} próbálkozásból!</p>`)}}
    else setTimeout(()=>{a[0].classList.remove('open');bb[0].classList.remove('open');a[0].textContent='?';bb[0].textContent='?';open=[];kitty($('#mk'),false)},1100)}})}
 if(g==='hear'){let n=0,ok=0;const next=()=>{if(n===10){G.innerHTML=`<p class="res">Eredmény: ${ok} / 10 <span class="kit j">😺</span></p>`;star(Math.round(ok/3));return}
   const w=pool[Math.floor(Math.random()*pool.length)];const opts=shuffle([w,...shuffle(pool.filter(x=>x.w!==w.w&&x.pic!==w.pic)).slice(0,3)]);
   G.innerHTML=`<p class="q">👂 ${n+1}/10 – Melyik képet hallod? <button class="abtn" id="rep">🔊 Újra</button> <span class="kit" id="hk">🐱</span></p><div class="mem">${opts.map((o,i)=>`<button class="mc open" data-i="${i}">${emo(o.pic,'e')}</button>`).join('')}</div>`;
   sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);
   G.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const good=opts[b.dataset.i].w===w.w;n++;if(good)ok++;b.classList.add(good?'done':'no');kitty($('#hk'),good);sayPair(w.w,w.hu);setTimeout(next,1500)})};next()}
 if(g==='build'){const cand=pool.filter(w=>!/\s/.test(w.w.replace(/^(el|la|los|las|un|una) /,'')));let n=0,ok=0;
  const next=()=>{if(n===8||!cand.length){G.innerHTML=`<p class="res">Eredmény: ${ok} / ${n} <span class="kit j">😺</span></p>`;star(Math.round(ok/2));return}
   const w=cand[Math.floor(Math.random()*cand.length)],word=w.w.replace(/^(el|la|los|las|un|una) /,'');let got='';const letters=shuffle([...word]);
   G.innerHTML=`<p class="q">🔡 Rakd ki a szót! ${huOn?`(${esc(w.hu)})`:''} <button class="abtn" id="rep">🔊</button></p><div class="row">${emo(w.pic,'e')}<span class="es" id="got" style="font-size:30px;min-width:160px;border-bottom:3px solid var(--line)">&nbsp;</span></div><div class="pool">${letters.map((l,i)=>`<button class="tile" data-i="${i}" style="font-size:24px;min-width:48px">${esc(l)}</button>`).join('')}</div><button class="big l" id="clr">↺ Újrakezd</button>`;
   sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);$('#clr').onclick=()=>{got='';$('#got').innerHTML='&nbsp;';G.querySelectorAll('.tile').forEach(t=>t.classList.remove('used'))};
   G.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{got+=letters[b.dataset.i];b.classList.add('used');$('#got').textContent=got;
    if(got.length===word.length){n++;const good=got===word;if(good)ok++;$('#got').innerHTML=good?`✅ ${esc(word)}`:`❌ <s>${esc(got)}</s> → ${esc(word)}`;sayPair(w.w,w.hu);setTimeout(next,1800)}})};next()}}
// ---------- kvíz (véletlen, ≥50 lehetséges kérdés)
function quizPool(sec){const P=[];D.sections.forEach(s=>{if(sec!=='all'&&s.id!==sec)return;
 (s.cards||[]).forEach(c=>{if(c.check)P.push({...c.check,ref:c.ref,s:s.id})});
 (s.examples||[]).forEach(e=>{if(e.try)P.push({...e.try,ref:e.ref,s:s.id})});
 (s.widgets||[]).forEach(w=>{if(w.type==='choice')w.items.forEach(c=>P.push({...c,ref:w.ref,s:s.id}));
  if(w.type==='num')w.items.forEach(it=>{const a=Number(it.answer);const o=shuffle([a,a+1,Math.max(0,a-1),a+10].filter((x,i,arr)=>arr.indexOf(x)===i)).slice(0,4);if(!o.includes(a))o[0]=a;const opts=shuffle(o).map(x=>({t:String(x)}));P.push({q:it.q,q_hu:it.q_hu,options:opts,answer:opts.findIndex(x=>x.t===String(a)),ref:w.ref,s:s.id,nohu:1})});
  if(w.type==='truefalse')w.items.forEach(it=>P.push({q:it.t,q_hu:it.hu,options:[{t:'Verdadero',hu:'Igaz'},{t:'Falso',hu:'Hamis'}],answer:it.answer?0:1,ref:w.ref,s:s.id}));
  if(w.type==='fill')w.items.forEach(it=>P.push({q:it.t.replace('__','_'),q_hu:it.hu,options:it.options.map(o=>({t:it.t.replace('__',o)})),answer:it.options.indexOf(it.answer),ref:w.ref,s:s.id,say:it.full}));
  if(w.type==='match')w.pairs.forEach((p,i)=>{const o=shuffle(w.pairs.filter((x,j)=>j!==i)).slice(0,2).map(x=>({t:x.b,hu:x.b_hu}));const opts=shuffle([{t:p.b,hu:p.b_hu},...o]);P.push({q:`${p.a} → ?`,q_hu:w.prompt_hu,options:opts,answer:opts.findIndex(x=>x.t===p.b),ref:w.ref,s:s.id})});
  if(w.type==='sort')w.items.forEach(it=>{const opts=w.bins.map(b=>({t:b.es,hu:b.hu}));P.push({q:`${it.t}: ¿${w.bins.map(b=>b.es).join(' o ')}?`,q_hu:it.hu,options:opts,answer:w.bins.findIndex(b=>b.id===it.bin),ref:w.ref,s:s.id})})});
 (s.words||[]).forEach(wd=>{const others=shuffle(WORDS.filter(x=>x.w!==wd.w&&x.hu!==wd.hu)).slice(0,3);
  let o=shuffle([wd,...others]);P.push({q:`¿Qué significa «${wd.w}»?`,q_hu:'Mit jelent?',options:o.map(x=>({t:x.hu})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1});
  o=shuffle([wd,...others]);P.push({q:`«${wd.hu}» – ¿en español?`,q_hu:'Hogy mondják spanyolul?',options:o.map(x=>({t:x.w})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1})})});
 return P.filter(q=>q.options&&q.answer>=0&&q.answer<q.options.length)}
let QZ=null,qzSec='all';
function rQz(V){const pool=quizPool(qzSec);
 let h=`<div class="panel"><div class="filt"><select id="qs"><option value="all">Az egész fejezet</option>${D.sections.map(s=>`<option value="${s.id}" ${qzSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="qn">${[10,20,30,50,100].map(n=>`<option ${n===20?'selected':''}>${n}</option>`).join('')}</select><button class="big g" id="qgo">▶ Indítás</button></div><p class="hu" style="margin:0">${pool.length} különböző kérdés közül véletlenszerűen.</p><div id="qb"></div></div>`;
 V.innerHTML=h;$('#qs').onchange=e=>{qzSec=e.target.value;QZ=null;render()};
 $('#qgo').onclick=()=>{const n=+$('#qn').value;const qs=[];for(let i=0;i<n;i++)qs.push(pool[Math.floor(Math.random()*pool.length)]);QZ={qs,i:0,ok:0};qShow()};
 if(QZ)qShow()}
function qShow(){const B=$('#qb');if(!B)return;if(QZ.i>=QZ.qs.length){B.innerHTML=`<p class="res" style="font-size:22px"><span class="kit j">😺</span> Kész! ${QZ.ok} / ${QZ.qs.length}</p>`;star(Math.round(QZ.ok/4));QZ=null;return}
 const q=QZ.qs[QZ.i];const opts=q.options;
 B.innerHTML=`<p style="font-weight:800">${QZ.i+1}. / ${QZ.qs.length} · jó: ${QZ.ok} ${pchip(q.ref)}</p><div class="check" style="border:0"><div class="q" style="font-size:21px">${esc(q.q)} <button class="abtn" data-r>🔊</button></div>${huOn&&q.q_hu?`<div class="hu">${esc(q.q_hu)}</div>`:''}
 <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}${huOn&&o.hu&&!q.nohu?`<small>${esc(o.hu)}</small>`:''}</button>`).join('')}</div><div class="res"><span class="kit">🐱</span></div></div>`;
 const rd=()=>q.say?sayEs(q.say):sayPair(q.q,q.q_hu);B.querySelector('[data-r]').onclick=rd;rd();
 B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(B.dataset.lock)return;B.dataset.lock=1;const i=+b.dataset.i,ok=i===q.answer;if(ok)QZ.ok++;b.classList.add(ok?'ok':'no');B.querySelectorAll('.opt')[q.answer].classList.add('ok');
  kitty(B.querySelector('.kit'),ok);const r=opts[q.answer];play([q.say?clip('es',q.say):null,/[áéíóúñ¿¡]|^[a-z]/i.test(r.t)&&!q.nohu?clip('es',r.t):null,huOn&&q.nohu?clip('hu',q.q_hu.includes('spanyolul')?'':r.t):null]);
  setTimeout(()=>{delete B.dataset.lock;QZ.i++;qShow()},ok?1600:2600)})}
// ---------- indítás
$('#hnum').textContent=D.unit.num;$('#htitle').textContent=D.unit.title;
$('#hsub').textContent=[D.unit.title_hu||'',D.unit.pages_tb?'Tankönyv '+D.unit.pages_tb:'',D.unit.pages_cu?'Munkafüzet '+D.unit.pages_cu:'',D.unit.pages_sb?'Saberes básicos '+D.unit.pages_sb:''].filter(Boolean).join(' · ');$('#stars').textContent='⭐ '+ST.stars;
const hs=location.hash.slice(1);if(['ov','ex','eg','wd','qz'].includes(hs))tab=hs;render();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
</script>
