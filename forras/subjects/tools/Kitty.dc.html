<!doctype html>
<html lang="hu">
<head>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","happy","sad"],"default":"idle"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood ?? 'idle';
    return { cls: 'kitty kitty-' + m, isIdle: m === 'idle', isHappy: m === 'happy', isSad: m === 'sad' };
  }
}
</script>
</body>
</html>
