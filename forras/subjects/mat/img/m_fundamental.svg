<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"><rect width="320" height="220" rx="18" fill="#FFF4D6"/><text x="160" y="70" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B2B2B" text-anchor="middle">29 : 8 = 3, resto 5</text><text x="160" y="130" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F4E79" text-anchor="middle">8 × 3 + 5 = 29</text><text x="160" y="185" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B6670" text-anchor="middle">divisor × cociente + resto</text><rect x="30" y="100" width="260" height="2" fill="#9AA5B1"/></svg>