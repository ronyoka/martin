<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"><rect width="320" height="220" rx="18" fill="#F3F0FA"/><text x="160" y="80" font-family="Verdana, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F4E79" text-anchor="middle">5 × 2 = 2 × 5</text><text x="160" y="140" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="700" fill="#3E8E41" text-anchor="middle">4 × (2 × 3) = 24</text><text x="160" y="190" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B6670" text-anchor="middle">propiedades</text></svg>