button{font:inherit;color:inherit}

.hero .sub{color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tab{border:none;border-radius:16px;padding:10px 16px;font-weight:900;cursor:pointer;background:var(--soft);min-height:48px;font-size:16px}
.tab.on{background:var(--acc);color:#fff}
.sw{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;margin-left:auto}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sec{border:2px solid var(--line);border-radius:20px;padding:12px;background:var(--bg);cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;min-height:90px}
.sec .ic{width:56px;height:56px;flex:none}
.sec .ic svg{width:56px;height:56px}
.sec b{display:block;font-size:18px}
.sec small{color:var(--muted);display:block}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.pchip{display:inline-flex;align-items:center;gap:4px;border:none;border-radius:999px;background:var(--chip);color:var(--navy);padding:3px 10px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.pchip{color:#9CC3EA}}
.kind{display:inline-block;border-radius:999px;background:var(--green);color:#fff;font-size:13px;font-weight:800;padding:2px 10px}
.schips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.schip{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;display:flex;gap:6px;align-items:center}
.schip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.schip .e{width:24px;height:24px}.schip .e svg{width:24px;height:24px}
.card{border:3px solid var(--line);border-radius:24px;padding:16px;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:center;min-height:320px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
.card .pic{display:grid;place-items:center;min-height:200px;background:var(--card);border-radius:18px;padding:8px}
.card .pic svg{width:100%;max-width:360px;height:auto;max-height:260px}
.card .pic .emo svg{width:150px;height:150px}
.es{font-size:23px;font-weight:700}
.hu{color:var(--muted);font-size:17px;margin-top:6px}
.es .w{cursor:pointer;border-radius:6px;padding:0 1px}
.es .w:hover{background:var(--soft)}
mark{background:var(--hl);color:inherit;border-radius:6px;padding:0 3px;font-weight:900}
.abtn{border:none;border-radius:14px;padding:8px 12px;font-weight:900;cursor:pointer;background:var(--soft);min-height:44px;min-width:56px}
.abtn.h{background:var(--chip)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px}
.big{border:none;border-radius:999px;padding:12px 22px;font-weight:900;cursor:pointer;min-height:50px;background:var(--navy);color:#fff;font-size:17px}
.big.l{background:var(--soft);color:var(--ink)}.big.g{background:var(--ok)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}.dots i.on{background:var(--acc)}.dots i.done{background:var(--green)}
.check{margin-top:12px;border-top:2px dashed var(--line);padding-top:10px}
.check .q{font-weight:800}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.opt{border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--card);cursor:pointer;text-align:left;min-height:52px}
.opt small{display:block;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.rule{margin-top:16px;border-radius:24px;padding:16px;background:linear-gradient(135deg,#FFE9A8,#FFD4A3);color:#3B2A10;border:3px solid #F2B55A}
.rule h3{margin:0 0 6px;font-size:22px}
.rule .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.rule .it{background:#FFF8E6;border-radius:16px;padding:10px;cursor:pointer;border:2px solid #F2C36E}
.rule .it b{display:block;font-size:19px}
.rule .it span{display:block;color:#6B5426;font-size:15px}
.wid{margin-top:16px;border:3px solid var(--line);border-radius:22px;padding:14px;background:var(--bg)}
.wid h4{margin:0;font-size:19px}
.wid .pr{color:var(--muted)}
.tw{font-size:24px;line-height:2.1}

.tw .tok.sel{background:var(--hl)}.tw .tok.ok{background:var(--okbg);border-color:var(--ok)}.tw .tok.no{background:var(--badbg);border-color:var(--bad)}.tw .tok.miss{border-color:var(--ok);border-style:dashed}

, "hu": "az a fa ott, azok a kövek ott", "ref": {"book": "sb", "page": 22, "ex": null}, "hl": ["aquel", "aquellas"], "pic": "🪨", "try": null}, {"es": "libro → librito, libro → librote", "hu": "könyv → könyvecske, könyv → nagy könyv", "ref": {"book": "sb", "page": 22, "ex": null}, "hl": ["librito", "librote"], "pic": "📘", "try": null}, {"es": "cama, color, cubo; bosque, equipo; kárate, kimono, koala", "hu": "ágy, szín, vödör; erdő, csapat; karate, kimonó, koala", "ref": {"book": "sb", "page": 22, "ex": null}, "hl": ["bosque", "koala"], "pic": "🐨", "try": null}, {"es": "El árbol se estiró hacia el cielo para saludar al sol.", "hu": "A fa nyújtózkodott az ég felé, hogy köszöntse a napot.", "ref": {"book": "sb", "page": 23, "ex": null}, "hl": ["saludar"], "pic": "☀️", "try": {"type": "choice", "q": "¿Qué recurso es?", "q_hu": "Melyik eszköz?", "options": [{"t": "metáfora", "hu": "metafora"}, {"t": "personificación", "hu": "megszemélyesítés"}], "answer": 1}}, {"es": "Un burro es como el primo del caballo, pero más pequeño.", "hu": "A szamár olyan, mint a ló unokatestvére, csak kisebb.", "ref": {"book": "sb", "page": 24, "ex": null}, "hl": ["primo del caballo"], "pic": "🫏", "try": null}], "words": [{"w": "la presentación", "hu": "a bemutatkozás", "pos": "sust", "page": 21, "pic": "👋"}, {"w": "el determinante", "hu": "a determináns", "pos": "sust", "page": 21, "pic": "👉"}, {"w": "el artículo", "hu": "a névelő", "pos": "sust", "page": 21, "pic": "📰"}, {"w": "determinado", "hu": "határozott", "pos": "adj", "page": 21, "pic": "✅"}, {"w": "indeterminado", "hu": "határozatlan", "pos": "adj", "page": 21, "pic": "❓"}, {"w": "el demostrativo", "hu": "a mutató szó", "pos": "sust", "page": 21, "pic": "📏"}, {"w": "la cercanía", "hu": "a közelség", "pos": "sust", "page": 21, "pic": "👇"}, {"w": "la distancia media", "hu": "a közepes távolság", "pos": "sust", "page": 21, "pic": "👉"}, {"w": "la lejanía", "hu": "a távolság, messzeség", "pos": "sust", "page": 21, "pic": "🔭"}, {"w": "el diminutivo", "hu": "a kicsinyítő alak", "pos": "sust", "page": 22, "pic": "🤏"}, {"w": "el aumentativo", "hu": "a nagyító alak", "pos": "sust", "page": 22, "pic": "🐘"}, {"w": "el sonido", "hu": "a hang", "pos": "sust", "page": 22, "pic": "🔊"}, {"w": "la personificación", "hu": "a megszemélyesítés", "pos": "sust", "page": 23, "pic": "🧑"}, {"w": "la metáfora", "hu": "a metafora", "pos": "sust", "page": 23, "pic": "🔗"}, {"w": "la descripción", "hu": "a leírás", "pos": "sust", "page": 24, "pic": "📝"}, {"w": "los rasgos físicos", "hu": "a külső jegyek", "pos": "sust", "page": 24, "pic": "👀"}, {"w": "el comportamiento", "hu": "a viselkedés", "pos": "sust", "page": 24, "pic": "🐾"}]}, {"id": "repaso", "title": "¿Qué hemos aprendido?", "title_hu": "Mit tanultunk?", "kind": "Repaso", "kind_hu": "Ismétlés", "pages": "50–53", "icon": "✅", "summary_hu": "A fejezet összefoglalása: bemutatkozás, determinánsok, kicsinyítő és nagyító alakok, c/qu/k, irodalmi eszközök és leírás. Utána gyakorlás Martina naplójával (Galicia, Lugo), a „Curiopalabras” különleges szavai, az „Alkoss” feladat és a kilépőjegy.", "cards": [{"id": "c1", "es": "Cuando no conocemos a las personas, solemos presentarnos. Podemos decir nuestra edad, nombre o gustos.", "hu": "Ha nem ismerjük az embereket, bemutatkozunk: elmondhatjuk a korunkat, a nevünket vagy azt, mit szeretünk. Kedves hang, mosoly!", "ref": {"book": "tb", "page": 50, "ex": null}, "hl": ["presentarnos", "edad", "nombre", "gustos"], "pic": "👋", "svg": null, "check": null}, {"id": "c2", "es": "Los artículos indican si el nombre es conocido o desconocido: el huerto, un huerto. Los demostrativos indican la distancia: esta, esa, aquella montaña.", "hu": "A névelők: ismert vagy nem ismert (el huerto / un huerto). A mutató szavak: távolság (esta / esa / aquella montaña).", "ref": {"book": "tb", "page": 50, "ex": null}, "hl": ["el huerto", "un huerto", "esta", "esa", "aquella"], "pic": "⛰️", "svg": "<svg viewBox='0 0 240 160' xmlns='http://www.w3.org/2000/svg' b22": {"title": "Los demostrativos. Diminutivos y aumentativos. c, qu, k", "title_hu": "Mutató szavak. Kicsinyítő és nagyító alakok. c, qu, k", "summary_hu": "", "tasks": [], "section": "saberes"}, "sb23": {"title": "Los recursos literarios", "title_hu": "Irodalmi eszközök", "summary_hu": "", "tasks": [], "section": "saberes"}, "sb24": {"title": "La descripción", "title_hu": "A leírás", "summary_hu": "", "tasks": [], "section": "saberes"}}, "books": {"tb": "Lengua 3 – tankönyv", "cu": "Lengua 3 – munkafüzet (cuaderno)", "sb": "Lengua 3 – Saberes básicos"}},SP={"es": {"-azo, -aza: regalazo, olaza": [0.0, 2.241], "-illo, -illa: platillo, naricilla": [2.541, 2.252], "-ito, -ita: librito, tacita": [5.093, 2.113], "-ote, -ota: librote, abrazote": [7.506, 2.438], "-ón, -ona: tazón, maletón": [10.244, 2.125], "1. Planifica: rasgos físicos, hábitat y comportamiento.": [12.669, 4.54], "1. Se evapora por el sol.": [17.508, 2.45], "2. Redacta: haz un borrador y usa comparaciones.": [20.258, 3.866], "2. Se junta en una nube.": [24.424, 2.473], "3. Cae como lluvia.": [27.197, 2.299], "3. Revisa: relee el texto y corrige las faltas.": [29.796, 4.261], "4. Vuelve al mar.": [34.357, 2.055], "A Gotilia le gusta estar siempre en el mismo sitio.": [36.712, 2.81], "Acabo": [39.821, 0.824], "Actívate y ticket de entrada": [40.946, 1.776], "Ahora todo es verde. Hace más frío, y hasta llueve un poquito.": [43.022, 4.005], "Akabo": [47.327, 0.871], "Analiza cada paso antes de darlo.": [48.498, 2.276], "Analiza sus rasgos físicos.": [51.074, 2.136], "Aquel globo": [53.51, 1.138], "Aquel árbol, aquellas piedras.": [54.948, 2.055], "Aquella casa es muy grande.": [57.303, 1.985], "Aquella casa es muy grande. Ese perro ladra mucho. Una abeja voló hacia las flores.": [59.588, 6.002], "Aquellas flores huelen bien. → demostrativo de cercanía": [65.89, 3.82], "Asegúrate de mostrarte abierto y amigable.": [70.01, 2.566], "Así generamos un entorno cómodo y de confianza.": [72.876, 2.914], "Así hacemos que llueva.": [76.09, 1.625], "Aumentativo de «viaje»:": [78.015, 1.753], "Belén apuntó la puntuación en un papelito.": [80.068, 2.647], "Buenos días.": [83.015, 1.207], "Ca, co, cu se escriben con c. Que, qui se escriben con qu. Algunas palabras se escriben con k.": [84.523, 6.478], "Cae como lluvia.": [91.301, 1.324], "Camina despacio cuando baja al suelo.": [92.925, 2.531], "Cercanía (aquí): este, esta, estos, estas. Este árbol, estas piedras.": [95.756, 4.957], "Cerido": [101.013, 0.848], "Clasifica las palabras: c, qu o k.": [102.161, 2.74], "Clasifica los determinantes.": [105.201, 2.148], "Clasifícalos: ¿artículo o demostrativo?": [107.649, 2.821], "Compartimos intereses o experiencias para encontrar puntos en común.": [110.77, 4.342], "Completa con el artículo adecuado.": [115.412, 2.31], "Completa con el diminutivo.": [118.022, 1.985], "Completa las comparaciones.": [120.308, 1.962], "Completa las oraciones con c, qu o k.": [122.57, 2.705], "Comprendo lo que leo (1–7)": [125.575, 1.939], "Comprendo lo que leo (8–15)": [127.814, 1.927], "Comprendo lo que leo.": [130.041, 1.44], "Compré unas manzanas. → demostrativo de distancia media": [131.781, 3.947], "Con c cuando va delante de las vocales a, o, u: cama, color, cubo.": [136.028, 3.715], "Con k en algunas palabras, como kárate, kimono y koala.": [140.043, 3.39], "Con qu cuando va delante de las vocales e, i: bosque, equipo.": [143.733, 3.622], "Corre tan rápido como…": [147.656, 1.521], "Corrige las faltas de ortografía del diario.": [149.477, 2.531], "Crea y Ticket de salida": [152.307, 1.567], "Crea: ¿qué harías para mostrar tu rincón o tu paisaje favorito?": [154.175, 3.506], "Cuando algo tiene un tamaño menor de lo normal, utilizamos los diminutivos.": [157.981, 4.098], "Cuando estamos tantas y tan juntas, pesamos mucho y nos caemos. Así hacemos que llueva.": [162.379, 5.155], "Cuando no conocemos a las personas con las que estamos, solemos presentarnos.": [167.834, 3.924], "Cuando no conocemos a las personas, solemos presentarnos. Podemos decir nuestra edad, nombre o gustos.": [172.058, 5.817], "Cuando nos encontramos con personas que no conocemos, el primer paso es presentarse.": [178.175, 4.296], "Cuando una persona se esté presentando, recíbela con una sonrisa y una actitud abierta.": [182.771, 4.946], "Cuidado: mesilla y manzanilla son palabras nuevas, no diminutivos.": [188.017, 4.029], "Curiopalabras: llanura, periplo, peregrinos, cordillera, mullido, antojo, rebuzno, marea.": [192.345, 4.865], "Describe tu animal favorito: planifica, redacta y revisa.": [197.51, 3.971], "Describir algo consiste en decir cómo es para que otros puedan imaginarlo.": [201.78, 3.913], "Describir un animal es explicar sus rasgos físicos y cómo se comporta.": [205.993, 4.249], "Determinados (conocido): el, la, los, las. Indeterminados (no conocido): un, una, unos, unas.": [210.542, 6.281], "Di con una sola palabra si es pequeño o grande.": [217.123, 2.635], "Diario de Martina: ¡Por fin hemos llegado a Galicia! Ha sido un viaje largo desde Jaén.": [220.059, 5.027], "Diario de Martina: ¿verdadero o falso?": [225.386, 2.461], "Diminutivo de «montañas»:": [228.147, 1.858], "Diminutivo de «peces»:": [230.305, 1.765], "Diminutivo de «viaje»:": [232.369, 1.765], "Distancia media (ahí): ese, esa, esos, esas. Ese árbol, esas piedras.": [234.434, 5.352], "Divide tu presentación en saludo e información sobre ti.": [240.086, 3.262], "Divide tu presentación: ¿saludo o información sobre ti?": [243.649, 3.46], "El agua se convierte en hielo. 🧊": [247.408, 3.924], "El amor llamó a su puerta.": [251.633, 1.765], "El animal tenía una mancha en esta oreja.": [253.697, 2.879], "El burro es muy inteligente y tiene muy buena memoria.": [256.877, 3.402], "El burro es más grande que el caballo.": [260.578, 2.322], "El burro hace un sonido fuerte que se llama rebuzno: «¡i-a, i-a!».": [263.2, 4.18], "El burro siempre se acuerda del camino a casa.": [267.68, 2.612], "El burro tiene las orejas cortas.": tő és nagyító alakok, c/qu/k, irodalmi eszközök és leírás. Utána gyakorlás Martina naplójával (Galicia, Lugo), a „Curiopalabras” különleges szavai, az „Alkoss” feladat és a kilépőjegy.": [174.615, 17.287], "A fogak gyöngyök.": [192.202, 1.544], "A fogkefe habzik, hullámok törnek a fogakon. Mik a «hullámok»?": [194.046, 4.47], "A folyó egy ezüstút a sziklák között (metafora, „mint” szó nélkül). A folyó simogatta a lábát (megszemélyesítés).": [198.816, 7.024], "A földet nézem, és nem mondok semmit.": [206.14, 2.763], "A földre esett cseppek felfelé mennek.": [209.203, 2.577], "A füle nagyon hosszú, így a távoli hangokat is pontosan hallja. – külső jegy": [212.081, 5.213], "A füle nagyon hosszú.": [217.594, 1.73], "A halak a dagály ritmusára táncolnak.": [219.624, 2.74], "A halak a dagály ritmusára táncolnak. – Megszemélyesítés: a halak úgy táncolnak, mint az emberek.": [222.663, 6.374], "A hold egy ezüstpénz az égen.": [229.337, 2.148], "A hold egy ezüstpénz az égen. Ez kifejezőbb, mint azt mondani: a hold ragyog az égen.": [231.785, 5.654], "A hold kaparja a vizet.": [237.739, 1.765], "A hold ragyog az égen.": [239.804, 1.788], "A jaéni út rövid volt.": [241.892, 1.974], "A kecskék a ___ hegyen vannak.": [244.166, 2.02], "A kecskék a hegyen vannak.": [246.486, 1.997], "A kecskék a hegyen vannak. A «las» és az «el» a főnév előtt áll, és elárulja, hány darab van, és hímnemű vagy nőnemű-e.": [248.783, 7.86], "A kedvenc virágaim a tulipánok. (határozott)": [256.943, 3.82], "A kicsi még tanulja a játékot.": [261.062, 2.299], "A kicsike nem tud játszani.": [263.661, 2.043], "A kicsinyítő alakot a szó végének cseréjével képezzük: -ito, -ita, -illo, -illa. Libro (könyv) → librito (könyvecske).": [266.004, 7.651], "A kutya megmozgatta a kis mancsait.": [273.955, 2.705], "A leírás": [276.961, 1.173], "A lufi lila. → mutató szó, messze": [278.433, 2.705], "A megszemélyesítés (personificación): emberi tulajdonságot adunk állatnak, növénynek vagy tárgynak.": [281.438, 6.455], "A metafora két dolgot kapcsol össze, amelyek hasonlítanak egymásra – de nem mondjuk ki, hogy „olyan, mint”.": [288.193, 6.13], "A mutató szavak": [294.623, 1.312], "A mutató szavak (demostrativos) megmondják, milyen messze van a dolog attól, aki beszél.": [296.235, 5.05], "A mutató szavak a távolságot jelzik: este – közel (itt), ese – kicsit távolabb (ott), aquel – messze (amott).": [301.586, 6.745], "A második bekezdés a viselkedéséről szól.": [308.631, 3.088], "A nagy ___ gondosan van kihímezve.": [312.019, 2.241], "A nagydarab gyerek elmozdította az asztalt.": [314.56, 2.972], "A nagyító alak végződései: -ón, -ona, -azo, -aza, -ote, -ota. Libro (könyv) → librote (nagy könyv).": [317.832, 7.454], "A nap a melegével felmelegíti a tengert. A cseppek elpárolognak, és felszállnak az égig – mintha egy láthatatlan léggömbben utaznának.": [325.586, 8.835], "A nap a melegével felmelegíti az egész tenger felszínét.": [334.721, 3.843], "A nap egy tűznarancs az égen.": [338.864, 2.31], "A nap felmelegíti a tenger vizét.": [341.474, 2.438], "A nap melegétől elpárolog.": [344.212, 2.194], "A nap melegít, és a víz felszáll.": [346.707, 2.531], "A nap, az óriás narancs, arannyá festette az eget. A napot egy naranccsal hasonlítjuk össze: mindkettő kerek és narancssárga.": [349.538, 8.127], "A nap, az óriás narancs… Mit mivel hasonlítunk össze?": [357.965, 3.901], "A nappalink foteljének két füle van. Ha titkod van, mondd el neki, és tanácsot ad.": [362.166, 5.759], "A névelők is determinánsok. Megmutatják, hogy a dolgot ismerjük-e (el paisaje – a táj) vagy nem (un paisaje – egy táj).": [368.224, 7.43], "A névelők megmutatják, ismert-e a dolog: el paisaje (a táj – ismert), un paisaje (egy táj – nem ismert).": [375.955, 6.792], "A névelők: ismert vagy nem ismert (el huerto / un huerto). A mutató szavak: távolság (esta / esa / aquella montaña).": [383.046, 7.93], "A papír türelmesen néz rám.": [391.276, 2.218], "A plüss ___ egy nagyon kedves játék.": [393.794, 2.31], "A plüssmaci: cseréld ki a kiemelt szavakat kicsinyítő vagy nagyító alakra!": [396.404, 4.748], "A plüssmackó nagyon kedves és puha.": [401.452, 2.67], "A pára felhővé áll össze.": [404.423, 2.31], "A riporterek gyerekek, akik megmutatják a kedvenc tájukat.": [407.033, 4.087], "A riporterek megmutatják a kedvenc tájukat.": [411.42, 3.286], "A sivatag tizenöt kilométerre van.": [415.005, 2.485], "A spanyol K hangot háromféleképpen írhatjuk: c-vel (ca, co, cu), qu-val (que, qui – az u ilyenkor néma) és néhány szóban k-val (koala, kárate, kilómetro).": [417.79, 10.182], "A szamár füle rövid.": [428.272, 1.625], "A szamár hangosan szól, ezt úgy hívják: rebuzno (iázás). Úgy hangzik: „i-á, i-á!”": [430.197, 6.548], "A szamár mindig emlékszik a hazavezető útra.": [437.045, 3.03], "A szamár nagyobb, mint a ló.": [440.376, 1.811], "A szamár nagyon okos, és nagyon jó a memóriája.": [442.487, 3.297], "A szamár nagyon okos, és nagyon jó a memóriája: mindig hazatalál. – viselkedés": [446.084, 5.619], "A szamár olyan, mint a ló unokatestvére, csak kisebb.": [452.003, 3.704], "A szamár olyan, mint a ló unokatestvére, csak kisebb. (Összehasonlítás: „como” = mint.)": [456.007, 6.339], "A szeme úgy ragyog, mint…": [462.646, 2.531], "A szerelem bekopogott az ajtaján.": [465.477, 2.357], "A szél erősen fúj.": [468.134, 1.881], "A szél fütyüli az ősz dalát.": [470.314, 2.229], "A szél fütyüli az ősz dalát. Igazából a szél nem tud fütyülni – ez egy különleges, költői beszédmód.": [472.844, 6.792], "A szél ide-oda viszi a cseppeket.": [479.935, 2.241], "A szél mozgatja a fák leveleit.": [482.476, 2.392], "A szél olyan, mint egy égi busz, ami ide-oda visz minket. És ingyen van!": [485.168, 4.888], "A szél olyan, mint egy égi busz.": [490.356, 2.357], "A széllel utazni sok pénzbe kerül.": [493.012, 2.461], "A szó végét megváltoztatva megmondhatjuk, hogy valami kicsi (diminutivo: libro → librito) vagy nagy (aumentativo: libro → librote). A kicsinyítő alak sokszor kedvességet is kifejez.": [495.774, 11.204], "A tenger tele van sóval.": [507.277, 1.916], "A tengerben élek, messze a szárazföldtől.": [509.493, 2.856], "A tengerben élek, messze a szárazföldtől. Nem szeretek mindig ugyanott lenni: sokat utazom.": [512.649, 6.13], "A teste vöröses.": [519.079, 1.614], "A testét szőr borítja, ami lehet szürke, barna, fekete vagy fehér. A farka kicsit rövid, és a végén szőrpamacs van.": [520.993, 8.011], "A testét szőr borítja.": [529.304, 1.8], "A toll egy tintából való madár – metafora. A papír türelmesen néz rám – megszemélyesítés.": [531.403, 6.757], "A toll egy tintából való madár.": [538.46, 2.148], "A tücskök az álmok hírnökei.": [540.908, 2.206], "A tücskök az álmok hírnökei. – Metafora: a tücsköket hírnököknek nevezzük.": [543.414, 5.492], "A tücskök zenélnek, énekelnek és táncolnak egész éjjel az utak mentén.": [549.206, 4.923], "A tücskök zenélnek, énekelnek és táncolnak egész éjjel. – Megszemélyesítés (Fiesta de grillos – Tücsökbuli).": [554.428, 7.546], "A virágok táncolnak a széllel.": [562.275, 2.403], "A város egy óriási hangyaboly.": [564.978, 2.334], "A víz jéggé válik.": [567.612, 1.753], "A vörös panda a hegyi erdőkben él.": [569.665, 2.589], "A vörös panda: külső jegy vagy viselkedés?": [572.554, 3.111], "A «cartita» ebből a szóból jön:": [575.965, 2.31], "A «dadito» ebből a szóból jön:": [578.576, 2.194], "A «halak» kicsinyítő alakja:": [581.07, 2.067], "A «hegyek» kicsinyítő alakja:": [583.436, 2.148], "A «librito»:": [585.884, 1.149], "A «librote»:": [587.334, 1.196], "A «patitas» kifejezi:": [588.829, 1.765], "A «poquito»:": [590.894, 1.231], "Ablakok kilátással": [592.425, 1.869], "Akarsz énekelni?": [594.594, 1.533], "Akik a földre esünk, mindig lefelé haladunk, és patakokat, folyókat alkotunk.": [596.427, 4.957], "Akkora, mint egy kutya.": [601.684, 1.858], "Alakítsd át: határozott → határozatlan névelő!": [603.842, 3.506], "Alaptudás: Ablakok kilátással": [607.648, 2.74], "Alkoss! és kilépőjegy": [610.688, 2.357], "Alkoss: hogyan mutatnád meg a kedvenc helyedet? Rajzzal, versben (metaforákkal) vagy riporttal, fotókkal. Utána töltsd ki a kilépőjegyet, és hasonlítsd össze a belépőjeggyel!": [613.345, 10.623], "Amikor nagyon sokan vagyunk szorosan együtt, nehezek leszünk, és leesünk. Így lesz eső.": [624.268, 5.759], "Amikor olyan emberekkel találkozunk, akiket nem ismerünk, először bemutatkozunk.": [630.326, 5.074], "Arra szolgál, hogy bemutassa a főnevet, vagy elárulja róla valamit.": [635.7, 4.551], "Az a fa ott, azok a kövek ott.": [640.551, 2.403], "Az a ház nagyon nagy. Az a kutya sokat ugat. Egy méh a virágok felé repült.": [643.254, 6.014], "Az a ház ott nagyon nagy.": [649.568, 1.962], "Az a lufi ott": [651.83, 1.44], "Az asztalon három könyv van. → határozatlan névelő": [653.57, 3.982], "Az első bekezdés a külsejéről szól.": [657.852, 2.67], "Az emberek nehéz terhek szállítására használták a szamarat.": [660.822, 4.005], "Az igazi neve Hidronia. Mi akkor a «Gotilia»?": [665.128, 3.471], "Az irodalmi szövegekben (versek, mesék) a szavakat különleges módon használjuk, hogy játsszunk az olvasó képzeletével.": [668.899, 7.047], "Az irodalmi szövegekben a szavakat különleges módon használjuk, hogy játsszunk az olvasó képzeletével. Két eszközt tanulsz: a megszemélyesítést (a fa köszön a napnak) és a metaforát (a fa a mókusok esernyője).": [676.247, 12.353], "Az «Aquellas» mutató szó:": [688.9, 1.892], "Az «aquella montaña» azt jelzi:": [691.092, 2.241], "Az «estas» mutató szó, és azt jelzi:": [693.633, 2.67], "Az «este» azt jelzi:": [696.603, 1.66], "Az «utazás» kicsinyítő alakja:": [698.563, 2.276], "Az «utazás» nagyító alakja:": [701.139, 2.09], "Az «és így egész életünkben» azt jelenti, hogy…": [703.529, 3.599], "Az állatnak egy folt volt ezen a fülén.": [707.428, 2.635], "Az élet egy hullámvasút.": [710.363, 2.125], "Az út egy kilométer volt.": [712.788, 2.032], "Azok a hegyek ott": [715.12, 1.521], "Azok a virágok": [716.94, 1.37], "Azok a virágok jó illatúak. → mutató szó, közel": [718.61, 3.889], "Azon az asztalon": [722.8, 1.498], "Barátságos hangon beszélek.": [724.597, 2.276], "Belén egy kis papírra írta fel a pontokat.": [727.173, 2.74], "Belépőjegy: olvasd el a mondatokat, és mondd meg, mennyit tudsz róluk már most: sokat, keveset vagy semmit.": [730.213, 6.594], "Bemutatkozunk.": [737.107, 1.567], "Bemutatkozás: kezdhetjük a nevünkkel, korunkkal, származásunkkal, azzal, amit szeretünk, és amit jól tudunk. Barátságos hang és mosoly!": [738.975, 8.719], "Budapestről jöttem.": [747.994, 1.695], "C, qu vagy k?": [749.989, 1.44], "C, qu vagy k? Figyeld a következő magánhangzót!": [751.729, 3.936], "C-vel írjuk, ha utána a, o vagy u jön: cama (ágy), color (szín), cubo (vödör).": [755.964, 5.422], "Ca, co, cu → c. Que, qui → qu. És néhány szó → k.": [761.686, 5.294], "Cseréld ki a kiemelt determinánst!": [767.28, 2.473], "Csoportosítsd: c, qu vagy k?": [770.053, 2.252], "Csoportosítsd: névelő vagy mutató szó?": [772.606, 2.728], "Délen meleg volt, mintha nyár lenne.": [775.634, 2.577], "Ebben a fejezetben Martin megtanul bemutatkozni, és elolvassa egy vízcsepp, Gotilia történetét a víz körforgásáról. A nyelvtanban a determinánsokkal (névelők és mutató szavak), a kicsinyítő és nagyító alakokkal és a c/qu/k helyesírással ismerkedik, végül megtanulja, mi a metafora és a megszemélyesítés, és hogyan kell leírni egy állatot.": [778.511, 21.235], "Ebédidő felé": [800.046, 1.486], "Egy asztalon": [801.832, 1.254], "Egy csepp története": [803.386, 1.521], "Egy csepp története (folytatás)": [805.207, 1.985], "Egy csepp története (olvasmány)": [807.492, 1.997], "Egy ember abból a raktárból hozta ezeket a dobozokat.": [809.789, 3.262], "Egy ember abból a raktárból hozta ezeket a dobozokat. una: határozatlan névelő; ese: mutató szó, közepes távolság; estas: mutató szó, közel.": [813.351, 9.416], "Egy kis bögre az egy…": [823.067, 2.148], "Egy kis bögre: tacita (bögrécske). Egy nagyon nagy bögre: tazón (nagy bögre). Egyetlen szóval megmondhatod, hogy valami kicsi vagy nagy!": [825.515, 8.29], "Egy kis könyv az egy…": [834.105, 2.252], "Egy macska egy kis labdát rágcsált.": [836.657, 2.392], "Egy nagyon messzi hegy: ___ hegy": [839.349, 1.753], "Egy nagyon nagy bögre az egy…": [841.402, 2.554], "Egy nagyon nagy könyv az egy…": [844.256, 2.531], "Egy tévécsatorna dokumentumfilmet akar forgatni az ország domborzatáról (hegyek, völgyek) és éghajlatáról.": [847.087, 6.455], "Egy tévécsatorna dokumentumfilmet akar forgatni.": [853.842, 3.17], "Egy állat leírása: elmondjuk a külsejét és azt, hogyan viselkedik (egyedül, más állatokkal és emberekkel).": [857.311, 6.548], "Egy állat leírásánál a külsejéről és a viselkedéséről beszélünk.": [864.16, 4.481], "Egy állatnál elmondjuk a külső jegyeit (milyen a teste) és azt, hogyan viselkedik – egyedül és másokkal.": [868.941, 6.269], "Egyetlen szóval mondd meg, kicsi vagy nagy!": [875.51, 2.635], "Egészítsd ki a kicsinyítő alakkal!": [878.446, 2.647], "Egészítsd ki a mondatokat c-vel, qu-val vagy k-val!": [881.393, 3.1], "Elmegyünk.": [884.793, 1.173], "Elmondjuk, mi érdekel minket és mit éltünk át, hogy közös pontokat találjunk – például mindketten szeretünk focizni.": [886.265, 6.978], "Enzo nagyszülei Teruelben laknak. (határozott)": [893.543, 3.646], "Erősen fújt a szél.": [897.488, 1.823], "Esőként lehull.": [899.611, 1.625], "Ez a fa, ezek a kövek.": [901.537, 2.113], "Ez a hely egy paradicsom.": [903.95, 1.858], "Ez a lufi": [906.107, 1.022], "Ez a túrázó közel vagy messze volt a szarvastól?": [907.429, 3.193], "Ez egy lehetőség arra, hogy megismerjenek minket, és tudják, kik vagyunk.": [910.922, 4.598], "Ezek a virágok": [915.819, 1.382], "Ezt a hőséget nem lehet kibírni.": [917.501, 2.461], "Fehérek és puhák.": [920.262, 1.707], "Fejezd be az összehasonlításokat!": [922.269, 2.38], "Fejezetnyitó": [924.949, 1.393], "Felhővé változunk.": [926.642, 1.823], "Felhővé áll össze.": [928.765, 1.718], "Fent az égen mind összegyűlünk, és felhővé változunk.": [930.783, 3.413], "Figyelj arra, hogy nyitott és barátságos legyél: nézz a többiekre, és használj kedves gesztusokat, például kézfogást.": [934.496, 7.605], "Fogalmazás": [942.401, 1.242], "Félnek, hogy leesnek.": [943.943, 1.579], "Félnek.": [945.822, 1.033], "Galiciába": [947.155, 1.289], "Gombóc van a torkomban.": [948.744, 2.125], "Gondold végig, és válassz!": [951.169, 2.101], "Gotilia": [953.57, 1.207], "Gotilia a tengerben él.": [955.078, 1.939], "Gotilia mindig ugyanott szeret lenni.": [957.317, 2.415], "Gotilia útja: a víz körforgása.": [960.031, 2.961], "Gyakorlunk (a leírás)": [963.292, 1.695], "Gyakorlunk (determinánsok)": [965.287, 1.927], "Gyakorlunk (helyesírás, kicsinyítő és nagyító alakok)": [967.514, 3.669], "Gyakorlunk (irodalmi eszközök)": [971.483, 2.09], "Ha nem ismerjük az embereket, bemutatkozunk: elmondhatjuk a korunkat, a nevünket vagy azt, mit szeretünk. Kedves hang, mosoly!": [973.873, 7.837], "Ha nem ismerjük azokat, akikkel vagyunk, általában bemutatkozunk.": [982.01, 4.18], "Ha valaki más mutatkozik be, fogadd mosolyogva és nyitottan, kedves üdvözléssel.": [986.489, 4.865], "Ha valami a szokásosnál kisebb, kicsinyítő alakot (diminutivo) használunk.": [991.654, 4.528], "Ha valami a szokásosnál nagyobb, nagyító alakot (aumentativo) használunk.": [996.482, 4.458], "Hangolódj rá! és belépőjegy": [1001.24, 2.682], "Használj összehasonlításokat: „olyan nagy, mint…”, „úgy hangzik, mint…”. Így könnyebb elképzelni az állatot.": [1004.222, 7.465], "Határozott névelők (ismert dolog): el, la, los, las. Határozatlan névelők (nem ismert): un, una, unos, unas.": [1011.987, 8.069], "Helyesírás": [1020.356, 1.312], "Hidegek.": [1021.968, 1.08], "Hidronia": [1023.348, 1.196], "Hidronia vagyok, egy kis csepp tiszta, kristálytiszta vízből.": [1024.843, 4.04], "Hidronia vagyok, egy kis csepp.": [1029.184, 2.264], "Hidronia, a kis vízcsepp (barátainak Gotilia) elmeséli az útját: a tengerből a nap melegétől felszáll az égbe, felhő lesz, esőként lehull, a folyókon visszatér a tengerbe – és kezdi elölről. Ez a víz körforgása. Utána szövegértési feladatok.": [1031.748, 17.113], "Hogy hívják a szamár hangját?": [1049.161, 2.241], "Hogy hívják ezeket a folyamatokat? Kösd össze!": [1051.701, 3.622], "Hogy hívják ezt az állatot?": [1055.624, 2.136], "Hogy hívják ezt?": [1058.06, 1.556], "Hogy hívják őt a barátai?": [1059.916, 1.985], "Hogy hívják őt?": [1062.201, 1.556], "Hogy írjuk a nevüket?": [1064.057, 1.672], "Hogy írjuk?": [1066.029, 1.138], "Hogyan fogadsz egy új osztálytársat?": [1067.466, 2.763], "Hogyan mondanád, hogy senki ne sértődjön meg?": [1070.53, 2.984], "Hogyan mutatnád meg a kedvenc tájadat?": [1073.813, 2.601], "Hogyan viselkedj, amikor bemutatkozol? Jó így?": [1076.714, 3.692], "Hogyan írjuk? _ilómetro": [1080.706, 2.368], "Hogyan írjuk? _imono": [1083.374, 2.055], "Hogyan írjuk? _ince (tizenöt)": [1085.729, 2.543], "Hogyan írjuk? _olor (szín)": [1088.572, 2.392], "Hogyan írjuk? _ubo (vödör)": [1091.264, 2.392], "Hogyan írjuk? bos_e (erdő)": [1093.955, 2.589], "Hogyan írjuk? e_ipo (csapat)": [1096.844, 2.543], "Hol áll a determináns?": [1099.687, 1.846], "Hol él Gotilia?": [1101.833, 1.37], "Hol él?": [1103.503, 0.94], "Holnap Martina búvárkodni megy, hogy halakat lásson.": [1104.743, 3.437], "Hosszú volt az út Jaénből.": [1108.48, 2.067], "Hosszú, gyűrűs farka van, mint egy színes ecset.": [1110.846, 3.355], "Hosszú, gyűrűs farka van.": [1114.502, 2.078], "Hová érkezett Martina?": [1116.88, 1.881], "Igaz vagy hamis?": [1119.061, 1.567], "Igen": [1120.928, 0.755], "Igen, minden nap.": [1121.983, 1.486], "Imádja a bambuszt.": [1123.769, 1.73], "Imádnivaló ___ van.": [1125.799, 1.474], "Imádom az állatokat.": [1127.573, 1.823], "Irodalmi eszközök": [1129.696, 1.416], "Irodalom": [1131.412, 1.022], "Ismétlés": [1132.734, 1.149], "Javítsd ki a napló helyesírási hibáit! Melyik a helyes?": [1134.183, 4.168], "Jaénbe": [1138.651, 0.952], "Jegyezd meg: a determinánsok a főnév előtt állnak.": [1139.903, 3.402], "Jegyezd meg: c, qu vagy k?": [1143.605, 2.31], "Jegyezd meg: ezeket mondhatod el magadról.": [1146.215, 2.961], "Jegyezd meg: kicsinyítő és nagyító végződések.": [1149.476, 3.692], "Jegyezd meg: megszemélyesítés és metafora.": [1153.468, 3.193], "Jó reggelt!": [1156.961, 1.358], "Jól áll neked annak a ruhának a zöld színe. (határozott)": [1158.619, 4.214], "K-t bizonyos szavakban írunk, például kilómetro (kilométer) vagy koala. Ezeket meg kell tanulni!": [1163.133, 6.095], "K-val csak néhány szót írunk, például: kárate (karate), kimono (kimonó), koala (koala).": [1169.529, 5.039], "Kedves": [1174.867, 0.964], "Kedves naplóm! Most érkeztem meg a faházhoz.": [1176.131, 3.889], "Kedves naplóm:": [1180.32, 1.498], "Kerekek és narancssárgák.": [1182.118, 2.229], "Kezdhetjük néhány adattal: név, életkor, származás (honnan jöttél), mit szeretsz és mit tudsz jól.": [1184.647, 5.979], "Kezet fognak.": [1190.926, 1.416], "Ki Hidronia?": [1192.643, 1.335], "Ki ment túl közel az állathoz?": [1194.278, 2.148], "Ki meséli a történetet?": [1196.726, 1.95], "Kicsi és fürge állat.": [1198.976, 1.846], "Kicsinyítő vagy nagyító alak?": [1201.122, 2.194], "Kicsinyítő és nagyító alakok": [1203.616, 2.264], "Kicsinyítő: kisebb méret (-ito, -ita, -illo, -illa). Nagyító: nagyobb méret (-ón, -ona, -azo, -aza, -ote, -ota).": [1206.18, 8.789], "Kicsinyítő: regalito (kis ajándék). Nagyító: regalazo (hatalmas ajándék).": [1215.269, 5.654], "Kik a riporterek?": [1221.223, 1.567], "Kilenc éves vagyok.": [1223.091, 1.683], "Kilépőjegy: mennyit tanultál? (egy kicsit, eleget, sokat)": [1225.074, 4.168], "Kisebb, mint a ló.": [1229.542, 1.567], "Koppints a determinánsokra az első bekezdésben!": [1231.409, 3.262], "Koppints a determinánsokra!": [1234.972, 2.043], "Koppints az igékre, amelyek megszemélyesítik a fotelt!": [1237.315, 3.413], "Képezz kicsinyítő és nagyító alakot!": [1241.028, 2.74], "Kérek néhány paradicsomot attól a standtól ott. Ez a növény egy leander.": [1244.068, 5.027], "Kösd össze a determinánst a fajtájával!": [1249.396, 2.694], "Kösd össze a mutató szót a távolsággal!": [1252.389, 2.728], "Kösd össze az adatot a mondattal!": [1255.417, 2.276], "Közel (itt): este, esta, estos, estas – ez a / ezek a. Ez a fa, ezek a kövek.": [1257.993, 6.362], "Közel vagy messze vannak?": [1264.655, 1.8], "Közepes távolság (ott, kicsit távolabb): ese, esa, esos, esas – az a / azok a. Az a fa, azok a kövek.": [1266.755, 7.709], "Küldtem neked egy üzenetet. (határozatlan)": [1274.764, 3.39], "Külső jegy vagy viselkedés?": [1278.454, 2.032], "Külön van a külső és a viselkedés? Van összehasonlítás?": [1280.786, 4.377], "Lassan jár, amikor lemászik a földre.": [1285.463, 2.798], "Leírni azt jelenti: elmondani, milyen valami, hogy mások el tudják képzelni. Egy állat leírásában elmondjuk a külsejét (rasgos físicos) és a viselkedését (comportamiento) – a könyv példája a szamár.": [1288.561, 12.33], "Leírni valamit azt jelenti: elmondjuk, milyen, hogy mások el tudják képzelni.": [1301.19, 4.702], "Lucíának hívnak.": [1306.192, 1.8], "Lugóban minden barna.": [1308.292, 1.776], "Láttam azt a fehér szarvast ott, ami annak a folyónak a partján ivott.": [1310.368, 4.342], "Láttam egy szúnyogokkal teli kaptárt.": [1315.01, 2.67], "Láttuk a Központi-hegységet. Azok a hegyek ott óriásiak voltak!": [1317.981, 4.772], "Látunk téged, amikor kinyitod a mosdó csapját – a cseppek a házadba is eljutnak.": [1323.052, 5.039], "Magyarországról jöttem.": [1328.391, 1.869], "Majdnem! Nézd meg a helyes választ.": [1330.56, 3.053], "Martina megérkezett Galiciába.": [1333.914, 2.38], "Martina naplója: Végre megérkeztünk Galiciába! Hosszú volt az út Jaénből, de imádta nézni, hogyan változik a táj.": [1336.594, 7.616], "Martina naplója: igaz vagy hamis?": [1344.51, 2.682], "Martinnak hívnak.": [1347.492, 1.614], "Megsimogatjuk az arcodat, amikor mosakszol.": [1349.406, 3.03], "Megszemélyesítés: emberi tulajdonságot adunk állatnak, tárgynak. Pl. a tücskök zenélnek, énekelnek és táncolnak.": [1352.736, 8.266], "Megtalálta a kincset.": [1361.302, 1.765], "Megtanulod, hogyan mutatkozz be új embereknek: köszönsz, majd elmondod a neved, a korod, honnan jöttél, mit szeretsz és mit tudsz jól. Közben kedves hangon beszélsz és mosolyogsz.": [1363.367, 10.054], "Megtörténhet ez a valóságban?": [1373.721, 2.31], "Megyek, veszek egy kicsit.": [1376.332, 1.834], "Megöntözzük a földeket, és nőnek a rétek és az erdők.": [1378.466, 3.843], "Mekkora?": [1382.609, 1.033], "Melyik a kicsinyítő alak? Melyik szóból jön?": [1383.942, 3.355], "Melyik a kifejezőbb?": [1387.597, 1.637], "Melyik a kisebb?": [1389.534, 1.416], "Melyik a legnagyobb ajándék?": [1391.251, 2.009], "Melyik a legnagyobb bögre?": [1393.559, 1.707], "Melyik a nagyító alak?": [1395.566, 1.695], "Melyik adat ez?": [1397.561, 1.44], "Melyik adatot mondod el ebben a mondatban?": [1399.301, 2.508], "Melyik bekezdésben van egy állat leírása?": [1402.108, 2.995], "Melyik betű áll a, o, u előtt?": [1405.404, 2.902], "Melyik családra hasonlít?": [1408.606, 1.904], "Melyik determináns illik az új főnévhez? Példa: ese señor → esa señora": [1410.81, 5.364], "Melyik egy összehasonlítás?": [1416.474, 2.067], "Melyik eszköz ez?": [1418.841, 1.544], "Melyik eszköz van a kifejezésben?": [1420.685, 2.357], "Melyik eszköz?": [1423.342, 1.347], "Melyik határozatlan névelő?": [1424.988, 2.183], "Melyik határozott névelő?": [1427.471, 1.985], "Melyik kicsinyítő alak?": [1429.756, 1.823], "Melyik mondatban ismerjük már a kincset?": [1431.879, 2.508], "Melyik mondatban van metafora?": [1434.687, 2.09], "Melyik mutató szó jelzi, hogy messze van?": [1437.077, 2.45], "Melyik nagyító alak?": [1439.826, 1.602], "Melyik rész a köszönés?": [1441.729, 1.741], "Melyik szó illik elé? ___ cabras (kecskék) vagy ___ monte (hegy)?": [1443.77, 3.843], "Melyik szót írjuk k-val?": [1447.913, 1.939], "Melyik van jól írva?": [1450.152, 1.602], "Mennyi szúnyog!": [1452.054, 1.393], "Mennyi szúnyog! Ezt a hőséget nem lehet kibírni.": [1453.747, 3.785], "Mennyi szúnyog! Ezt a hőséget nem lehet kibírni. Cuántos és calor c-vel (ua, a), mosquitos és quien qu-val (i, ie).": [1457.832, 8.522], "Mennyibe kerül a széllel utazni?": [1466.654, 2.218], "Mert beteg.": [1469.171, 1.3], "Mert nyugodt és türelmes.": [1470.772, 1.974], "Mert utána a jön.": [1473.045, 1.498], "Mert utána e jön.": [1474.843, 1.533], "Messze (amott): aquel, aquella, aquellos, aquellas – az ott / azok ott. Az a fa ott messze, azok a kövek ott messze.": [1476.676, 7.512], "Metafora vagy megszemélyesítés?": [1484.487, 2.218], "Metafora, megszemélyesítés és leírás.": [1487.005, 3.204], "Metafora: két hasonló dolgot kapcsolunk össze. Pl. a fa a mókusok és madarak esernyője.": [1490.509, 6.385], "Mi a kicsinyítő alakja? (Figyelj a helyesírásra!)": [1497.195, 3.738], "Mi a «libro» kicsinyítő alakja?": [1501.233, 2.136], "Mi a «manzana» (alma) kicsinyítő alakja?": [1503.669, 2.543], "Mi jön először?": [1506.512, 1.416], "Mi olyan, mint egy égi busz?": [1508.228, 2.125], "Miben hasonlít a felhő és a vatta?": [1510.653, 2.624], "Miben hasonlít a nap és a narancs?": [1513.577, 2.438], "Mik azok a chascarrillos?": [1516.315, 1.997], "Mikor ismerte meg Álvaro ezt a helyet?": [1518.612, 2.519], "Milyen a szamár füle?": [1521.431, 1.591], "Milyen a tenger vize?": [1523.322, 1.533], "Milyen a természete?": [1525.154, 1.625], "Milyen determináns? Kösd össze!": [1527.08, 2.914], "Milyen fajta szöveg ez?": [1530.294, 1.823], "Milyen irodalmi eszközt használ?": [1532.416, 2.368], "Milyen két fajtája van a determinánsoknak?": [1535.085, 2.856], "Minden lépést végiggondol.": [1538.241, 2.136], "Mintha ennek az országnak két arca lenne: délen meleg és barna, északon hideg és zöld. Spanyolország egy pénzérme – metafora!": [1540.677, 8.499], "Mire hasonlít a fa?": [1549.476, 1.614], "Mire hasonlítanak a csillagok?": [1551.389, 2.055], "Mit akar forgatni a csatorna?": [1553.744, 2.02], "Mit csinál a fa úgy, mint egy ember?": [1556.065, 2.485], "Mit csinál a nap, hogy a cseppek felszálljanak?": [1558.849, 2.647], "Mit csinálunk először új emberekkel?": [1561.796, 2.589], "Mit eszik?": [1564.685, 1.196], "Mit fejez ki a «patitas»?": [1566.181, 1.939], "Mit fogunk tanulni ebben a fejezetben?": [1568.42, 2.531], "Mit fogunk tanulni?": [1571.251, 1.625], "Mit fogunk tanulni? Hat új témát: a bemutatkozást, a determinánsokat, a kicsinyítő és nagyító alakokat, a c/qu/k helyesírást, az irodalmi eszközöket és a leírást.": [1573.176, 12.051], "Mit hasonlítunk egy óriás naranccsal?": [1585.527, 2.577], "Mit hasonlítunk össze egy óriás naranccsal?": [1588.405, 2.844], "Mit jelent, hogy «a molekuláiknál fogva» fogják egymást?": [1591.549, 3.262], "Mit melegít fel a nap?": [1595.112, 1.741], "Mit mondunk el egy állat leírásában?": [1597.153, 2.589], "Mit tanultunk?": [1600.042, 1.416], "Mit tanultunk? Alkalmazd: Martina naplója": [1601.759, 3.727], "Mit tanultunk? Ismétlés (1)": [1605.785, 2.659], "Mit tanultunk? Ismétlés (2) és érdekes szavak": [1608.744, 4.017], "Mit ábrázol a rajz?": [1613.061, 1.753], "Mit ábrázol a szöveg rajza?": [1615.114, 2.043], "Mitől lesznek a cseppek nehezek, és mitől esnek le?": [1617.458, 3.216], "Mivel hasonlítja össze a farkát?": [1620.974, 2.415], "Miért esnek le a cseppek?": [1623.688, 1.916], "Miért mondja Gotilia, hogy «Sajnálom!»?": [1625.904, 2.426], "Miért mondjuk el, mit szeretünk?": [1628.631, 2.043], "Miért tűnik úgy, hogy semmihez nincs kedve?": [1630.974, 2.728], "Miért írjuk a «queso» szót qu-val?": [1634.002, 2.194], "Mosolygok a többiekre.": [1636.497, 1.811], "Mosolyogj, hogy lássák: új barátokat szeretnél.": [1638.608, 3.239], "Mosolyogva fogadom az új társat.": [1642.147, 2.415], "Most minden zöld. Hidegebb van, és még egy kicsit esik is.": [1644.862, 4.238], "Most érkeztem meg a faházhoz.": [1649.399, 2.241], "Most …-tam": [1651.94, 1.602], "Mutató szavak. Kicsinyítő és nagyító alakok. c, qu, k": [1653.842, 4.679], "Nagy.": [1658.821, 0.871], "Nagyon dolgos, erős állat és hűséges társ.": [1659.992, 3.193], "Nagyon dolgos, erős állat és hűsé function play(list){Q=list.filter(Boolean);nx()}
function nx(){clearTimeout(tm);$('#aes').pause();$('#ahu').pause();try{speechSynthesis.cancel()}catch(e){}
 const c=Q.shift();if(!c)return;
 if(c.tts){try{const u=new SpeechSynthesisUtterance(c.t);u.lang=c.l==='es'?'es-ES':'hu-HU';u.onend=()=>setTimeout(nx,200);speechSynthesis.speak(u)}catch(e){nx()}return}
 const a=$(c.l==='es'?'#aes':'#ahu');try{a.currentTime=c.s;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
 tm=setTimeout(()=>{a.pause();setTimeout(nx,200)},c.d*1000+80)}
const sayEs=t=>play([clip('es',t)]);
const sayHu=t=>play([clip('hu',t)]);

 s=s.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
 return s.replace(/(^|[\s>(¿¡"«])([\p{L}][\p{L}'-]*)/gu,(m,a,w)=>a+`<span class="w" data-w="${w}">${w}</span>`)}

// ---------- nézetek
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();window.scrollTo({top:$('#tabs').offsetTop-8,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#huOn').onchange=e=>{huOn=e.target.checked;render()};
function secProgress(s){const n=(s.cards||[]).length+(s.widgets||[]).length;let d=0;(s.cards||[]).forEach(c=>{if(ST.seen[s.id+':'+c.id])d++});(s.widgets||[]).forEach(w=>{if(ST.done[s.id+':'+w.id])d++});return n?Math.round(100*d/n):0}
function render(){const V=$('#view');({ov:rOv,ex:rEx,eg:rEg,wd:rWd,qz:rQz})[tab](V)}
function rOv(V){const u=D.unit;let h=`<div class="panel"><p class="es" style="font-size:20px">${esc(u.intro)} <button class="abtn" data-a="intro">🔊</button></p>${huOn?`<p class="hu">${esc(u.intro_hu)}</p>`:''}
 <h3>A fejezet részei</h3><div class="grid">`;
 D.sections.forEach((s,i)=>{const p=secProgress(s);h+=`<button class="sec" data-s="${i}"><span class="ic">${emo(s.icon,'e')}</span><span style="flex:1"><span class="kind">${esc(s.kind||'')}</span><b>${esc(s.title)}</b>${huOn?`<small>${esc(s.title_hu)}</small>`:''}<small>📖 ${esc(s.pages||'')}</small><span class="bar"><i style="width:${p}%"></i></span></span></button>`});
 h+=`</div><h3>Oldaltérkép</h3><div class="ov">`;
 u.pagemap.forEach(p=>{const s=D.sections.find(x=>x.id===p.section);h+=`<button class="pg" data-pg="${p.book}${p.page}"><span class="pchip">📖 ${BKS[p.book]||'Tk.'} ${p.page}</span><span>${esc(p.title)}${huOn?`<br><small class="hu">${esc(p.title_hu||'')}</small>`:''}</span></button>`});
 h+='</div></div>';V.innerHTML=h;
 V.querySelector('[data-a=intro]').onclick=()=>sayPair(u.intro,u.intro_hu);
 V.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{secI=+b.dataset.s;cardI=0;setTab('ex')});
 V.querySelectorAll('.pg').forEach(b=>b.onclick=()=>openPage(b.dataset.pg))}
function secChips(onpick){return `<div class="schips">${D.sections.map((s,i)=>`<button class="schip ${i===secI?'on':''}" data-si="${i}">${emo(s.icon,'e')}${esc(s.title)}</button>`).join('')}</div>`}
function bindChips(V,cb){V.querySelectorAll('.schip').forEach(b=>b.onclick=()=>{secI=+b.dataset.si;cardI=0;cb()}); const on=V.querySelector('.schip.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'})}
function rEx(V){const s=D.sections[secI],cs=s.cards||[];cardI=Math.max(0,Math.min(cardI,cs.length-1));const c=cs[cardI];
 let h=`<div class="panel">${secChips()}<div class="row" style="margin:0 0 10px"><span class="kind">${esc(s.kind||'')}</span><b style="font-size:20px">${esc(s.title)}</b>${huOn?`<span class="hu" style="margin:0">– ${esc(s.title_hu)}</span>`:''}</div>
 ${huOn&&s.summary_hu?`<p class="hu" style="margin-top:0">${esc(s.summary_hu)}</p>`:''}`;
 if(c){ST.seen[s.id+':'+c.id]=1;save();
  h+=`<div class="card" key="${c.id}"><div class="pic">${c.svg?c.svg:emo(c.pic,'emo')}</div><div><div class="row" style="margin:0 0 6px">${pchip(c.ref)}<span class="muted" style="color:var(--muted);font-weight:800">${cardI+1} / ${cs.length}</span></div>
  <div class="es">${hlText(c.es,c.hl)}</div>${huOn?`<div class="hu">${esc(c.hu)}</div>`:''}
  <div class="row"><button class="abtn" id="cES">🔊 ES</button>${huOn?'<button class="abtn h" id="cHU">🔊 HU</button>':''}</div>${choiceHTML(c.check,'cc')}</div></div>
  <div class="nav"><button class="big l" id="prev">◀</button><div class="dots">${cs.map((x,i)=>`<i class="${i===cardI?'on':ST.seen[s.id+':'+x.id]?'done':''}" data-d="${i}"></i>`).join('')}</div><button class="big" id="next">▶</button></div>`}
 if(s.rule){h+=`<div class="rule"><div class="row" style="margin:0;justify-content:space-between"><h3>📌 Recuerda – Jegyezd meg!</h3>${pchip(s.rule.ref)}</div><div class="es" style="font-size:20px">${esc(s.rule.es)}</div>${huOn?`<div style="margin-top:4px">${esc(s.rule.hu)}</div>`:''}<button class="abtn" id="rS" style="margin-top:8px">🔊</button>
  <div class="items">${(s.rule.items||[]).map((it,i)=>`<div class="it" data-ri="${i}"><b>${esc(it.es)}</b>${huOn?`<span>${esc(it.hu)}</span>`:''}${huOn&&it.note_hu?`<span>💡 ${esc(it.note_hu)}</span>`:''}</div>`).join('')}</div></div>`}
 h+=`<h3 style="margin:20px 0 0">🧩 Próbáld ki! – gyakorló feladatok (${(s.widgets||[]).length})</h3><div id="wids"></div></div>`;
 V.innerHTML=h;bindChips(V,()=>render());
 if(c){$('#cES').onclick=()=>sayEs(c.es);const hb=$('#cHU');if(hb)hb.onclick=()=>sayHu(c.hu);
  $('#prev').onclick=()=>{if(cardI>0){cardI--;render()}};$('#next').onclick=()=>{if(cardI<cs.length-1){cardI++;render()}else{document.getElementById('wids').scrollIntoView({behavior:'smooth'})}};
  V.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>{cardI=+d.dataset.d;render()});
  const ck=V.querySelector('[data-chk=cc]');if(ck)bindChoice(ck,c.check);
  setTimeout(()=>sayPair(c.es,c.hu),250)}
 if(s.rule){$('#rS').onclick=()=>sayPair(s.rule.es,s.rule.hu);V.querySelectorAll('.rule .it').forEach(b=>b.onclick=()=>{const it=s.rule.items[b.dataset.ri];sayPair(it.es,it.hu)})}
 const W=$('#wids');(s.widgets||[]).forEach(w=>{const el=document.createElement('div');el.className='wid';W.appendChild(el);widget(el,w,s.id)})}
// ---------- widgetek
function wHead(w,sid){const d=ST.done[sid+':'+w.id];return `<div class="row" style="margin:0;justify-content:space-between"><h4>${d?'✅':'🧩'} ${esc(w.prompt)} <button class="abtn" data-wp>🔊</button></h4>${pchip(w.ref)}</div>${huOn&&w.prompt_hu?`<div class="pr">${esc(w.prompt_hu)}</div>`:''}`}
function wDone(el,w,sid,ok,tot){const r=el.querySelector('.res');const all=ok===tot;r.innerHTML=`<span class="kit">🐱</span> ${ok} / ${tot} jó ${all?'– szuper!':''} <button class="abtn" data-again>↻ Újra</button>`;
 kitty(r.querySelector('.kit'),all);if(all){ST.done[sid+':'+w.id]=1;save();star(2);play([clip('hu','Szuper, minden jó!')])}else praise(false);
 r.querySelector('[data-again]').onclick=()=>widget(el,w,sid)}
function widget(el,w,sid){const f=({tapwords:wTap,sort:wSort,match:wMatch,fill:wFill,order:wOrder,truefalse:wTF,choice:wChoice})[w.type];if(!f){el.remove();return}
 f(el,w,sid);const p=el.querySelector('[data-wp]');if(p)p.onclick=()=>sayPair(w.prompt,w.prompt_hu)}
function wTap(el,w,sid){const toks=w.sentence.match(/[\p{L}'-]+|[^\p{L}\s]+/gu)||[];const tg=w.targets.map(x=>x.toLowerCase());
 el.innerHTML=wHead(w,sid)+`<div class="tw">${toks.map((t,i)=>/\p{L}/u.test(t)?`<span class="tok" data-i="${i}">${esc(t)}</span>`:esc(t)).join(' ')}</div>${huOn&&w.sentence_hu?`<div class="hu">${esc(w.sentence_hu)}</div>`:''}
 <div class="row"><button class="abtn" data-s>🔊 Mondat</button><button class="big g" data-ok>✔ Kész</button></div><div class="res"></div>`;
 el.querySelector('[data-s]').onclick=()=>sayPair(w.sentence,w.sentence_hu);
 el.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{t.classList.toggle('sel');sayEs(t.textContent)});
 el.querySelector('[data-ok]').onclick=()=>{let ok=0,bad=0;const found=new Set();el.querySelectorAll('.tok').forEach(t=>{const isT=tg.includes(t.textContent.toLowerCase());
  if(t.classList.contains('sel')){if(isT){t.classList.add('ok');found.add(t.textContent.toLowerCase())}else{t.classList.add('no');bad++}}else if(isT)t.classList.add('miss')});
  ok=found.size;wDone(el,w,sid,bad?Math.max(0,ok-bad):ok,tg.length)}}
function wSort(el,w,sid){const items=shuffle(w.items);let sel=null,ok=0,n=0;
 el.innerHTML=wHead(w,sid)+`<div class="pool">${items.map((it,i)=>`<button class="tile" data-i="${i}">${esc(it.t)}${huOn&&it.hu?`<small style="display:block;font-weight:400;color:var(--muted)">${esc(it.hu)}</small>`:''}</button>`).join('')}</div>
 <div class="bins">${w.bins.map(b=>`<div class="bin" data-b="${esc(b.id)}"><b>${esc(b.es)}</b>${huOn?`<small>${esc(b.hu)}</small>`:''}<div class="in"></div></div>`).join('')}</div><div class="res"></div>`;
 el.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{el.querySelectorAll('.tile').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=+t.dataset.i;sayEs(items[sel].t)});
 el.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(sel===null)return;const it=items[sel],t=el.querySelector(`.tile[data-i="${sel}"]`);const good=it.bin===b.dataset.b;n++;if(good)ok++;
  const c=document.createElement('span');c.className='tile '+(good?'ok':'no');c.textContent=it.t+(good?'':' ✗');b.querySelector('.in').appendChild(c);t.classList.add('used');sel=null;
  if(!good){const right=w.bins.find(x=>x.id===it.bin);play([clip('es',it.t),clip('es',right?right.es:'')])}else sayEs(it.t);
  if(n===items.length)wDone(el,w,sid,ok,n)})}
function wMatch(el,w,sid){const L=w.pairs.map((p,i)=>({i,t:p.a,h:p.a_hu})),R=shuffle(w.pairs.map((p,i)=>({i,t:p.b,h:p.b_hu})));let sl=null,ok=0,n=0;
 el.innerHTML=wHead(w,sid)+`<div class="cols"><div class="pool" style="flex-direction:column">${L.map(x=>`<button class="tile" data-l="${x.i}">${esc(x.t)}${huOn&&x.h?` <small style="font-weight:400;color:var(--muted)">(${esc(x.h)})</small>`:''}</button>`).join('')}</div>
 <div class="pool" style="flex-direction:column">${R.map(x=>`<button class="tile" data-r="${x.i}">${esc(x.t)}${huOn&&x.h?` <small style="font-weight:400;color:var(--muted)">(${esc(x.h)})</small>`:''}</button>`).join('')}</div></div><div class="res"></div>`;
 el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sl=+b.dataset.l;sayEs(w.pairs[sl].a)});
 el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(sl===null)return;const r=+b.dataset.r,lb=el.querySelector(`[data-l="${sl}"]`);n++;
  if(r===sl){ok++;lb.classList.add('ok','used');b.classList.add('ok','used');play([clip('es',w.pairs[sl].a),clip('es',w.pairs[sl].b)])}
  else{lb.classList.add('no');b.classList.add('no');setTimeout(()=>{lb.classList.remove('no');b.classList.remove('no')},700);n--;praise(false)}
  lb.classList.remove('sel');sl=null;if(el.querySelectorAll('[data-l].ok').length===L.length)wDone(el,w,sid,L.length,L.length)})}
function wFill(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((it,i)=>`<div class="fillq" data-i="${i}">${emo(it.pic,'e')}<span class="w">${esc(it.t).replace('__','<u>&nbsp;?&nbsp;</u>')}</span>${it.options.map(o=>`<button class="tile" data-o="${esc(o)}">${esc(o)}</button>`).join('')}${huOn&&it.hu?`<span class="hu" style="margin:0">${esc(it.hu)}</span>`:''}</div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('.fillq').forEach(q=>{const it=w.items[q.dataset.i];q.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(q.dataset.d)return;q.dataset.d=1;n++;const good=b.dataset.o===it.answer;if(good)ok++;
  b.classList.add(good?'ok':'no');q.querySelector('.w').innerHTML=esc(it.full);if(!good)q.querySelector(`[data-o="${it.answer}"]`).classList.add('ok');play([clip('es',it.full),huOn&&it.hu?clip('hu',it.hu):null]);
  if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
function wOrder(el,w,sid){const items=w.items.map((x,i)=>({...x,i}));const sh=shuffle(items);let pos=0,err=0;
 el.innerHTML=wHead(w,sid)+`<p class="pr">Koppints sorban: mi van először, mi utána?</p><ol class="pool" style="flex-direction:column;padding-left:24px" data-out></ol><div class="pool" style="flex-direction:column">${sh.map(x=>`<button class="tile" data-i="${x.i}" style="text-align:left">${esc(x.t)}${huOn&&x.hu?`<small style="display:block;font-weight:400;color:var(--muted)">${esc(x.hu)}</small>`:''}</button>`).join('')}</div><div class="res"></div>`;
 el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===pos){b.classList.add('used');const li=document.createElement('li');li.className='tile ok';li.textContent=items[i].t;el.querySelector('[data-out]').appendChild(li);sayEs(items[i].t);pos++;
  if(pos===items.length)wDone(el,w,sid,Math.max(0,items.length-err),items.length)}else{err++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600);praise(false)}})}
function wTF(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((it,i)=>`<div class="fillq" data-i="${i}"><span style="flex:1 1 260px"><b>${esc(it.t)}</b>${huOn&&it.hu?`<br><span class="hu">${esc(it.hu)}</span>`:''}</span><button class="abtn" data-s>🔊</button><button class="tile" data-v="1">✔ Verdadero</button><button class="tile" data-v="0">✘ Falso</button></div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('.fillq').forEach(q=>{const it=w.items[q.dataset.i];q.querySelector('[data-s]').onclick=()=>sayPair(it.t,it.hu);
  q.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(q.dataset.d)return;q.dataset.d=1;n++;const good=(b.dataset.v==='1')===!!it.answer;if(good)ok++;b.classList.add(good?'ok':'no');
   if(!good)q.querySelector(`[data-v="${it.answer?1:0}"]`).classList.add('ok');play([clip('es',it.answer?'Verdadero':'Falso')||null]);praise(good);if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
function wChoice(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((c,i)=>`<div data-ci="${i}">${choiceHTML(c,'w'+i)}</div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('[data-ci]').forEach(d=>{const c=w.items[d.dataset.ci],root=d.querySelector('.check');
  root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>sayPair(c.q,c.q_hu));
  root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(root.dataset.done)return;root.dataset.done=1;n++;const i=+b.dataset.i,good=i===c.answer;if(good)ok++;
   b.classList.add(good?'ok':'no');if(!good)root.querySelectorAll('.opt')[c.answer].classList.add('ok');kitty(root.querySelector('.kit'),good);sayEs(c.options[c.answer].t);
   if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
// ---------- példák
let egSec='all';
function rEg(V){const list=[];D.sections.forEach(s=>(s.examples||[]).forEach((e,i)=>{if(egSec==='all'||egSec===s.id)list.push({...e,sid:s.id,k:s.id+i})}));
 let h=`<div class="panel"><div class="filt"><select id="egS"><option value="all">Minden rész</option>${D.sections.map(s=>`<option value="${s.id}" ${egSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <button class="big l" id="egAll">🔊 Mind felolvasása</button></div><p class="hu" style="margin:0">Tipp: a magyar fordítás elmosva látszik – előbb próbáld kitalálni, aztán koppints rá!</p>`;
 list.forEach((e,i)=>{h+=`<div class="ex">${emo(e.pic,'e')}<div><div class="row" style="margin:0 0 4px">${pchip(e.ref)}</div><div class="es">${hlText(e.es,e.hl)}</div>${huOn?`<div class="hu hide" data-rv>${esc(e.hu)}</div>`:''}
  <div class="row"><button class="abtn" data-es="${i}">🔊 ES</button>${huOn?`<button class="abtn h" data-hu="${i}">🔊 HU</button>`:''}${e.try?`<button class="abtn" data-try="${i}">✏️ Te jössz!</button>`:''}</div><div data-tb="${i}"></div></div></div>`});
 V.innerHTML=h+'</div>';
 $('#egS').onchange=e=>{egSec=e.target.value;render()};$('#egAll').onclick=()=>{const L=[];list.forEach(e=>{L.push(clip('es',e.es));if(huOn)L.push(clip('hu',e.hu))});play(L)};
 V.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>b.classList.remove('hide'));
 V.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>sayEs(list[b.dataset.es].es));V.querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>sayHu(list[b.dataset.hu].hu));
 V.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{const i=b.dataset.try,t=list[i].try,box=V.querySelector(`[data-tb="${i}"]`);box.innerHTML=choiceHTML(t,'t'+i);bindChoice(box.querySelector('.check'),t)})}
// ---------- szótár
let wdSec='all',wdPos='all',wdQ='',game=null;
function rWd(V){const L=WORDS.filter(w=>(wdSec==='all'||w.sec===wdSec)&&(wdPos==='all'||w.pos===wdPos)&&(!wdQ||(w.w+' '+w.hu).toLowerCase().includes(wdQ.toLowerCase()))).sort((a,b)=>a.w.replace(/^(el|la|los|las) /,'').localeCompare(b.w.replace(/^(el|la|los|las) /,''),'es'));
 const kn=WORDS.filter(w=>ST.known[w.w]).length;
 let h=`<div class="panel"><div class="filt"><input id="wq" placeholder="🔍 Keresés…" value="${esc(wdQ)}"><select id="ws"><option value="all">Minden rész</option>${D.sections.map(s=>`<option value="${s.id}" ${wdSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="wp"><option value="all">Minden szófaj</option>${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${wdPos===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <p style="margin:0 0 8px"><b>${L.length}</b> szó · tudom: <b>${kn}</b> / ${WORDS.length}. Koppints a kártyára: megfordul és felolvassa. 👍 = tudom.</p>
 <div class="games"><button class="big" data-g="mem">🃏 Memória</button><button class="big" data-g="hear">👂 Hallás → kép</button><button class="big" data-g="build">🔡 Betűkirakó</button>${game?'<button class="big l" data-g="">✕ Vissza a kártyákhoz</button>':''}</div><div id="gm"></div>`;
 if(!game){h+=`<div class="wgrid">${L.map(w=>`<div class="wc ${ST.known[w.w]?'known':''}" data-w="${esc(w.w)}"><div class="in"><div class="fa">${emo(w.pic,'e')}<b>${esc(w.w)}</b><small><span class="pos">${POS[w.pos]||''}</span> · 📖 ${esc(w.page||'')}. o.</small></div>
  <div class="ba">${emo(w.pic,'e')}<b>${esc(w.hu)}</b><small>${esc(w.w)}</small><button class="abtn" data-k style="margin-top:6px">${ST.known[w.w]?'✅ tudom':'👍 tudom'}</button></div></div></div>`).join('')}</div>`}
 V.innerHTML=h+'</div>';
 $('#wq').oninput=e=>{wdQ=e.target.value;const p=e.target.selectionStart;render();const q=$('#wq');q.focus();q.setSelectionRange(p,p)};
 $('#ws').onchange=e=>{wdSec=e.target.value;render()};$('#wp').onchange=e=>{wdPos=e.target.value;render()};
 V.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{game=b.dataset.g||null;render();if(game)runGame(game,L.length>=4?L:WORDS)});
 V.querySelectorAll('.wc').forEach(c=>c.onclick=e=>{const w=WORDS.find(x=>x.w===c.dataset.w);if(e.target.closest('[data-k]')){ST.known[w.w]=!ST.known[w.w];save();if(ST.known[w.w])star(1);render();return}
  c.classList.toggle('f');if(c.classList.contains('f'))sayPair(w.w,w.hu);else sayEs(w.w)})}
function runGame(g,pool){const G=$('#gm');
 if(g==='mem'){const ws=shuffle(pool).slice(0,6);const cards=shuffle([...ws.map((w,i)=>({i,k:'es',w})),...ws.map((w,i)=>({i,k:'pic',w}))]);let open=[],done=0,tries=0;
  G.innerHTML=`<p>Keresd a párokat: a spanyol szó és a képe! <span class="kit" id="mk">🐱</span></p><div class="mem">${cards.map((c,j)=>`<button class="mc" data-j="${j}">?</button>`).join('')}</div>`;
  G.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const c=cards[b.dataset.j];if(b.classList.contains('open')||b.classList.contains('done')||open.length===2)return;b.classList.add('open');b.innerHTML=c.k==='es'?esc(c.w.w):emo(c.w.pic,'e');if(c.k==='es')sayEs(c.w.w);open.push([b,c]);
   if(open.length===2){tries++;const[a,bb]=open;if(a[1].i===bb[1].i&&a[1].k!==bb[1].k){a[0].classList.add('done');bb[0].classList.add('done');done++;open=[];kitty($('#mk'),true);sayPair(c.w.w,c.w.hu);if(done===ws.length){star(3);G.insertAdjacentHTML('beforeend',`<p class="res">🎉 Kész ${tries} próbálkozásból!</p>`)}}
    else setTimeout(()=>{a[0].classList.remove('open');bb[0].classList.remove('open');a[0].textContent='?';bb[0].textContent='?';open=[];kitty($('#mk'),false)},1100)}})}
 if(g==='hear'){let n=0,ok=0;const next=()=>{if(n===10){G.innerHTML=`<p class="res">Eredmény: ${ok} / 10 <span class="kit j">😺</span></p>`;star(Math.round(ok/3));return}
   const w=pool[Math.floor(Math.random()*pool.length)];const opts=shuffle([w,...shuffle(pool.filter(x=>x.w!==w.w&&x.pic!==w.pic)).slice(0,3)]);
   G.innerHTML=`<p class="q">👂 ${n+1}/10 – Melyik képet hallod? <button class="abtn" id="rep">🔊 Újra</button> <span class="kit" id="hk">🐱</span></p><div class="mem">${opts.map((o,i)=>`<button class="mc open" data-i="${i}">${emo(o.pic,'e')}</button>`).join('')}</div>`;
   sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);
   G.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const good=opts[b.dataset.i].w===w.w;n++;if(good)ok++;b.classList.add(good?'done':'no');kitty($('#hk'),good);sayPair(w.w,w.hu);setTimeout(next,1500)})};next()}
 if(g==='build'){const cand=pool.filter(w=>!/\s/.test(w.w.replace(/^(el|la|los|las|un|una) /,'')));let n=0,ok=0;
  const next=()=>{if(n===8||!cand.length){G.innerHTML=`<p class="res">Eredmény: ${ok} / ${n} <span class="kit j">😺</span></p>`;star(Math.round(ok/2));return}
   const w=cand[Math.floor(Math.random()*cand.length)],word=w.w.replace(/^(el|la|los|las|un|una) /,'');let got='';const letters=shuffle([...word]);
   G.innerHTML=`<p class="q">🔡 Rakd ki a szót! ${huOn?`(${esc(w.hu)})`:''} <button class="abtn" id="rep">🔊</button></p><div class="row">${emo(w.pic,'e')}<span class="es" id="got" style="font-size:30px;min-width:160px;border-bottom:3px solid var(--line)">&nbsp;</span></div><div class="pool">${letters.map((l,i)=>`<button class="tile" data-i="${i}" style="font-size:24px;min-width:48px">${esc(l)}</button>`).join('')}</div><button class="big l" id="clr">↺ Újrakezd</button>`;
   sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);$('#clr').onclick=()=>{got='';$('#got').innerHTML='&nbsp;';G.querySelectorAll('.tile').forEach(t=>t.classList.remove('used'))};
   G.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{got+=letters[b.dataset.i];b.classList.add('used');$('#got').textContent=got;
    if(got.length===word.length){n++;const good=got===word;if(good)ok++;$('#got').innerHTML=good?`✅ ${esc(word)}`:`❌ <s>${esc(got)}</s> → ${esc(word)}`;sayPair(w.w,w.hu);setTimeout(next,1800)}})};next()}}
// ---------- kvíz (véletlen, ≥50 lehetséges kérdés)
function quizPool(sec){const P=[];D.sections.forEach(s=>{if(sec!=='all'&&s.id!==sec)return;
 (s.cards||[]).forEach(c=>{if(c.check)P.push({...c.check,ref:c.ref,s:s.id})});
 (s.examples||[]).forEach(e=>{if(e.try)P.push({...e.try,ref:e.ref,s:s.id})});
 (s.widgets||[]).forEach(w=>{if(w.type==='choice')w.items.forEach(c=>P.push({...c,ref:w.ref,s:s.id}));
  if(w.type==='truefalse')w.items.forEach(it=>P.push({q:it.t,q_hu:it.hu,options:[{t:'Verdadero',hu:'Igaz'},{t:'Falso',hu:'Hamis'}],answer:it.answer?0:1,ref:w.ref,s:s.id}));
  if(w.type==='fill')w.items.forEach(it=>P.push({q:it.t.replace('__','_'),q_hu:it.hu,options:it.options.map(o=>({t:it.t.replace('__',o)})),answer:it.options.indexOf(it.answer),ref:w.ref,s:s.id,say:it.full}));
  if(w.type==='match')w.pairs.forEach((p,i)=>{const o=shuffle(w.pairs.filter((x,j)=>j!==i)).slice(0,2).map(x=>({t:x.b,hu:x.b_hu}));const opts=shuffle([{t:p.b,hu:p.b_hu},...o]);P.push({q:`${p.a} → ?`,q_hu:w.prompt_hu,options:opts,answer:opts.findIndex(x=>x.t===p.b),ref:w.ref,s:s.id})});
  if(w.type==='sort')w.items.forEach(it=>{const opts=w.bins.map(b=>({t:b.es,hu:b.hu}));P.push({q:`${it.t}: ¿${w.bins.map(b=>b.es).join(' o ')}?`,q_hu:it.hu,options:opts,answer:w.bins.findIndex(b=>b.id===it.bin),ref:w.ref,s:s.id})})});
 (s.words||[]).forEach(wd=>{const others=shuffle(WORDS.filter(x=>x.w!==wd.w&&x.hu!==wd.hu)).slice(0,3);
  let o=shuffle([wd,...others]);P.push({q:`¿Qué significa «${wd.w}»?`,q_hu:'Mit jelent?',options:o.map(x=>({t:x.hu})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1});
  o=shuffle([wd,...others]);P.push({q:`«${wd.hu}» – ¿en español?`,q_hu:'Hogy mondják spanyolul?',options:o.map(x=>({t:x.w})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1})})});
 return P.filter(q=>q.options&&q.answer>=0&&q.answer<q.options.length)}
let QZ=null,qzSec='all';
function rQz(V){const pool=quizPool(qzSec);
 let h=`<div class="panel"><div class="filt"><select id="qs"><option value="all">Az egész fejezet</option>${D.sections.map(s=>`<option value="${s.id}" ${qzSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="qn">${[10,20,30,50,100].map(n=>`<option ${n===20?'selected':''}>${n}</option>`).join('')}</select><button class="big g" id="qgo">▶ Indítás</button></div><p class="hu" style="margin:0">${pool.length} különböző kérdés közül véletlenszerűen.</p><div id="qb"></div></div>`;
 V.innerHTML=h;$('#qs').onchange=e=>{qzSec=e.target.value;QZ=null;render()};
 $('#qgo').onclick=()=>{const n=+$('#qn').value;const qs=[];for(let i=0;i<n;i++)qs.push(pool[Math.floor(Math.random()*pool.length)]);QZ={qs,i:0,ok:0};qShow()};
 if(QZ)qShow()}
function qShow(){const B=$('#qb');if(!B)return;if(QZ.i>=QZ.qs.length){B.innerHTML=`<p class="res" style="font-size:22px"><span class="kit j">😺</span> Kész! ${QZ.ok} / ${QZ.qs.length}</p>`;star(Math.round(QZ.ok/4));QZ=null;return}
 const q=QZ.qs[QZ.i];const opts=q.options;
 B.innerHTML=`<p style="font-weight:800">${QZ.i+1}. / ${QZ.qs.length} · jó: ${QZ.ok} ${pchip(q.ref)}</p><div class="check" style="border:0"><div class="q" style="font-size:21px">${esc(q.q)} <button class="abtn" data-r>🔊</button></div>${huOn&&q.q_hu?`<div class="hu">${esc(q.q_hu)}</div>`:''}
 <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}${huOn&&o.hu&&!q.nohu?`<small>${esc(o.hu)}</small>`:''}</button>`).join('')}</div><div class="res"><span class="kit">🐱</span></div></div>`;
 const rd=()=>q.say?sayEs(q.say):sayPair(q.q,q.q_hu);B.querySelector('[data-r]').onclick=rd;rd();
 B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(B.dataset.lock)return;B.dataset.lock=1;const i=+b.dataset.i,ok=i===q.answer;if(ok)QZ.ok++;b.classList.add(ok?'ok':'no');B.querySelectorAll('.opt')[q.answer].classList.add('ok');
  kitty(B.querySelector('.kit'),ok);const r=opts[q.answer];play([q.say?clip('es',q.say):null,/[áéíóúñ¿¡]|^[a-z]/i.test(r.t)&&!q.nohu?clip('es',r.t):null,huOn&&q.nohu?clip('hu',q.q_hu.includes('spanyolul')?'':r.t):null]);
  setTimeout(()=>{delete B.dataset.lock;QZ.i++;qShow()},ok?1600:2600)})}
// ---------- indítás
$('#hnum').textContent=D.unit.num;$('#htitle').textContent=D.unit.title;
$('#hsub').textContent=[D.unit.title_hu||'',D.unit.pages_tb?'Tankönyv '+D.unit.pages_tb:'',D.unit.pages_cu?'Munkafüzet '+D.unit.pages_cu:'',D.unit.pages_sb?'Saberes básicos '+D.unit.pages_sb:''].filter(Boolean).join(' · ');$('#stars').textContent='⭐ '+ST.stars;
const hs=location.hash.slice(1);if(['ov','ex','eg','wd','qz'].includes(hs))tab=hs;render();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
</script>
