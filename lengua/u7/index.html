.rule .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.rule .it{background:#FFF8E6;border-radius:16px;padding:10px;cursor:pointer;border:2px solid #F2C36E}

sifica las palabras.": [132.353, 1.916], "Clasifica las preposiciones, conjunciones e interjecciones del texto del astronauta.": [134.569, 4.865], "Coloca los enunciados en el orden en que aparecen en el texto.": [139.733, 3.437], "Completa con la preposición adecuada.": [143.47, 2.426], "Completa el texto del universo.": [146.196, 2.101], "Completa eligiendo las palabras esdrújulas.": [148.598, 2.984], "Completa los enunciados con la conjunción adecuada.": [151.882, 2.937], "Comprendo lo que leo (10–17)": [155.119, 2.403], "Comprendo lo que leo (1–9)": [157.822, 1.974], "Comprendo lo que leo.": [160.096, 1.416], "Con el telescopio, Galileo vio…": [161.812, 2.415], "Conozco las características de un texto teatral.": [164.527, 2.798], "Copia las preposiciones que encuentres en este fragmento.": [167.625, 3.204], "Copia solo las palabras esdrújulas.": [171.13, 2.647], "Crea y ticket de salida": [174.077, 1.625], "Curiopalabras: laúd, telescopio, experimento, péndulo, anteojos, expedición, gruta, satélite.": [176.002, 6.432], "Curiopalabras: une cada palabra con su significado.": [182.734, 3.402], "Deben tener cuidado con el espacio vacío e infinito.": [186.436, 3.007], "Deben tener cuidado con el espacio vacío.": [189.743, 2.508], "Delante de cada intervención está el nombre del personaje que habla: ARMONÍA: ¿Qué es lo que pasa con el dragón ese?": [192.55, 5.631], "Desde pequeño fue muy curioso: le gustaba mirar el cielo y hacer experimentos.": [198.481, 4.4], "Desde que era niño, Galileo decidió que quería dedicarse a la medicina.": [203.181, 3.866], "Desde siempre, la gente ha mirado al cielo.": [207.348, 2.775], "Después de muchos días de viaje, Amundsen y su equipo siguen su camino por el hielo.": [210.422, 4.238], "Dibuja el cómic.": [214.96, 1.498], "Dicen que somos polvo de estrellas.": [216.758, 2.229], "Diseña unas viñetas donde muestres el viaje de vuelta de un grupo de astronautas.": [219.287, 4.609], "ESTELA: (Susurrando.) Por fin…": [224.196, 2.485], "ESTELA: (Susurrando.) Por fin… Adiós a las farolas, adiós al ruido.": [226.98, 4.621], "El Sol es una estrella y la Luna es un satélite.": [231.901, 2.728], "El Sol se encuentra a millones de kilómetros.": [234.93, 2.682], "El astronauta viaja a la Luna.": [237.912, 2.264], "El astronauta viaja a la Luna. La preposición a une viaja y la Luna.": [240.475, 4.876], "El astronauta viaja a la Luna. ¿Qué palabra es la preposición?": [245.652, 4.04], "El circo es un lugar mágico.": [249.992, 2.043], "El circo es un lugar sorprendente / mágico.": [252.335, 3.065], "El cohete despegó un martes y alunizó un domingo.": [255.7, 2.879], "El cohete despegó un martes y alunizó un domingo. La conjunción y une dos enunciados.": [258.88, 5.085], "El cómic": [264.265, 0.998], "El entrevistado hace todas las preguntas.": [265.563, 2.647], "El entrevistado o entrevistada las responde.": [268.51, 2.856], "El entrevistado responde a las preguntas con claridad y orden.": [271.666, 3.785], "El entrevistado responde con claridad y orden, habla como persona experta y muestra respeto.": [275.751, 5.538], "El entrevistado responde sin orden.": [281.589, 2.496], "El entrevistador o entrevistadora hace preguntas.": [284.385, 3.622], "El entrevistador se informa antes de la entrevista.": [288.308, 3.065], "El entrevistador se informa sobre el tema o el invitado antes de la entrevista.": [291.673, 4.609], "El entrevistador se informa, presenta al invitado, hace preguntas interesantes y habla con respeto.": [296.582, 6.258], "El hombre que miraba las estrellas": [303.14, 1.811], "El hombre que miraba las estrellas (2)": [305.251, 2.241], "El hombre que miraba las estrellas (lectura)": [307.791, 2.31], "El marciano está varado en Marte.": [310.402, 2.043], "El mensajero celeste": [312.745, 1.892], "El paquete no llegará hoy": [314.938, 1.858], "El planeta es azul y verde.": [317.095, 1.95], "El planeta tiene agua pero aire.": [319.346, 2.252], "El planeta tiene agua y aire.": [321.898, 2.206], "El planeta tiene agua. Tiene aire. → Una sola oración:": [324.404, 4.702], "El péndulo se utilizó para construir relojes más precisos.": [329.406, 3.704], "El sábado habrá un eclipse solar.": [333.41, 2.171], "El teatro": [335.881, 1.057], "El tesoro del dragón": [337.237, 1.567], "El texto de teatro tiene el nombre del personaje y acotaciones: ESTELA: (Susurrando.) Por fin…": [339.104, 5.515], "El texto teatral se escribe para ser representado en un escenario. Partes: nombre del personaje, palabras y acotaciones.": [344.919, 7.245], "El texto teatral: texto escrito para ser representado en un escenario. Sus partes son:": [352.464, 5.561], "El universo es un lugar inmenso y lleno de misterios.": [358.325, 2.995], "El viaje es largo, pero emocionante.": [361.62, 2.403], "El viaje espacial duró desde la mañana hasta la noche.": [364.324, 3.204], "El … habrá un eclipse solar.": [367.828, 1.892], "Elegid el personaje al que queréis entrevistar.": [370.02, 2.926], "Elige la respuesta correcta.": [373.246, 1.823], "Empezó a estudiar para ser médico, pero lo que más le gustaba eran las matemáticas y la ciencia.": [375.369, 5.886], "En el texto de teatro, ¿qué es (Se tumba bocarriba.)?": [381.555, 2.589], "En esta unidad aprendemos la entrevista, la preposición, la conjunción y la interjección, las palabras compuestas, las esdrújulas, el teatro y el cómic.": [384.444, 8.835], "En grupo, dramatiza una situación que se pueda vivir en un cohete espacial.": [393.579, 3.947], "En la cuarta viñeta aparece la onomatopeya ¡CLONK!": [397.827, 2.902], "En la foto hay un telescopio.": [401.029, 2.113], "En las Montañas del Norte, en una gruta, existía un dragón que guardaba un grandísimo tesoro.": [403.442, 4.621], "En parejas, realizad una breve entrevista a un personaje de cómic.": [408.363, 3.727], "En pirámide, película y pétalo la sílaba tónica está en antepenúltimo lugar.": [412.39, 4.296], "En satélite, la sílaba tónica es té.": [416.986, 2.473], "Entretenernos con una aventura.": [419.759, 2.067], "Es habitual ver viñetas en un cómic.": [422.125, 2.183], "Es una biografía: un texto que cuenta la vida real de una persona. Inventos de Galileo Galilei:": [424.608, 5.84], "Escoge el tema principal del texto.": [430.748, 2.461], "Escoge la palabra compuesta de cada pareja.": [433.509, 2.682], "Escoge las palabras con la sílaba tónica en antepenúltimo lugar.": [436.491, 3.866], "Escoged quién entrevistará y quién será el personaje entrevistado.": [440.657, 4.087], "Escribe el nombre. ¿Cómo se escribe?": [445.044, 2.844], "Escribe estas interjecciones donde corresponda: oh, ay, uf, guau.": [448.188, 4.354], "Escribe las palabras compuestas.": [452.842, 2.368], "Escribe un libro.": [455.51, 1.521], "Esos son asuntos de Estado.": [457.331, 1.858], "Estela suspiró aliviada, dejando atrás el ruido y las farolas.": [459.489, 4.191], "Estela suspiró aliviada…": [463.98, 1.765], "Están escritos para ser representados.": [466.045, 2.543], "FICHA 1. La preposición, la conjunción y la interjección": [468.887, 4.18], "FICHA 1. La preposición, la conjunción y la interjección (continuación)": [473.367, 5.004], "FICHA 2. Las palabras compuestas": [478.671, 3.065], "FICHA 3. La tilde en las palabras esdrújulas": [482.036, 3.692], "FICHA 4. El teatro": [486.028, 2.287], "FICHA 4. El teatro (continuación)": [488.615, 2.868], "FICHA 5. El cómic": [491.783, 2.183], "FICHA 5. El cómic (continuación)": [494.265, 2.926], "Forma palabras compuestas con estas piezas.": [497.491, 2.856], "Forma palabras nuevas combinando las palabras.": [500.647, 2.798], "Fue profesor de matemáticas en la Universidad de Pisa.": [503.745, 3.088], "Fue un astrónomo, matemático y físico muy importante.": [507.133, 3.146], "Fue un viaje difícil, pero lleno de valor y trabajo en equipo.": [510.58, 3.332], "GERBERTO: (Apresurado.) Majestad, nos han robado los camellos.": [514.212, 4.412], "Galileo Galilei nació en el año 1564 en Pisa, una ciudad italiana famosa por su torre inclinada.": [518.923, 6.13], "Galileo Galilei nació en el año 1564 en Pisa.": [525.354, 3.704], "Galileo construye un telescopio.": [529.357, 2.206], "Galileo descubrió que la Luna no era lisa: tenía montañas y valles, al igual que la Tierra.": [531.863, 5.224], "Galileo escribió un libro titulado El mensajero celeste.": [537.387, 3.959], "Galileo escuchó hablar de los anteojos, que servían para ver objetos lejanos, y construyó su propio telescopio.": [541.646, 6.49], "Galileo inventó los anteojos para ver de lejos.": [548.436, 2.984], "Galileo nació en una ciudad de Italia conocida por tener una torre inclinada.": [551.72, 4.354], "Galileo se dio cuenta de que la Tierra se movía alrededor del Sol.": [556.374, 3.646], "Gerberto": [560.32, 1.022], "Gerberto y Melchor": [561.641, 1.428], "Habla como persona experta en el tema.": [563.369, 2.264], "Habla con respeto.": [565.933, 1.428], "Había muchas más estrellas en el cielo de las que se podían ver a simple vista.": [567.661, 3.622], "Haced la entrevista hablando con claridad.": [571.583, 2.357], "Identifica las conjunciones de estas situaciones.": [574.24, 2.81], "Identifico la preposición, la conjunción y la interjección.": [577.35, 3.669], "Indica si las afirmaciones son verdaderas o falsas.": [581.319, 3.193], "Informarnos sobre una vida real.": [584.811, 2.287], "Instrumento musical parecido a una guitarra.": [587.399, 2.914], "Invéntate en qué consistirá la misión.": [590.613, 2.461], "Inés": [593.374, 0.801], "Júpiter": [594.475, 0.917], "Júpiter es uno de los planetas del sistema solar.": [595.692, 2.728], "LUNA: Pues mira quién viene por ahí, Saturno con sus anillos, ese sí que es presumido… ¡Mira cómo va!": [598.721, 5.027], "La Tierra gira": [604.048, 1.335], "La Tierra se mueve ni la sentimos quieta.": [605.683, 2.496], "La Tierra se mueve, pero la sentimos quieta.": [608.479, 2.496], "La Tierra se mueve. La sentimos quieta. → Una sola oración:": [611.275, 4.621], "La brújula y el micrófono": [616.196, 1.846], "La casa está a muchos metros / kilómetros de distancia.": [618.342, 3.332], "La conjunción une palabras del mismo nivel gramatical: y, e, ni, o, u, pero. Saturno y Marte.": [621.974, 6.2], "La conjunción une palabras del mismo nivel: ningún elemento depende de otro. Son: y, e, ni, o, u, pero.": [628.474, 6.142], "La entrevista": [634.915, 1.231], "La entrevista · La preposición y la conjunción": [636.446, 3.541], "La historia es contada únicamente mediante la acción y los diálogos de los personajes.": [640.287, 4.656], "La idea del péndulo se le ocurrió mientras observaba una lámpara.": [645.243, 3.704], "La interjección · Las palabras compuestas · La tilde en las esdrújulas": [649.246, 5.085], "La nave del marciano se averió.": [654.631, 2.067], "La preposición une palabras que dependen unas de otras. No puede aparecer sola.": [656.998, 4.876], "La preposición une palabras que dependen unas de otras: a, con, de, desde, en, entre, hacia, hasta, para, por.": [662.174, 5.468], "La preposición, la conjunción y la interjección": [667.943, 3.03], "La preposición, la conjunción y la interjección (actividades)": [671.273, 3.75], "La tilde en las palabras esdrújulas": [675.323, 2.438], "La tía de Estela es una apasionada de las estrellas.": [678.061, 2.984], "La tía de Estela es una apasionada de las estrellas. Cada vez que puede, se va a algún sitio alejado de la ciudad para contemplar el cielo.": [681.345, 7.372], "Las acotaciones indican cómo actuar.": [689.017, 2.45], "Las acotaciones van entre paréntesis e indican cómo tiene que actuar el personaje: (Muy enfadada.)": [691.767, 5.224], "Las estrellas se ven con un telescopio.": [697.291, 2.345], "Las estrellas se ven con un telescopio. La preposición con une ven y telescopio.": [699.936, 4.772], "Las interjecciones expresan sentimientos, saludan, animan o llaman la atención: ¡Oh, qué estrella tan brillante! ¡Ay! Me he tropezado con una piedra.": [705.008, 9.497], "Las interjecciones no unen palabras: se usan para expresar sentimientos,  1.974], "-ig": [24.531, 0.755], "-nak, számára": [25.586, 1.474], "-ról (messziről)": [27.36, 1.474], "-tól": [29.135, 0.662], "-val": [30.096, 0.557], "-val (a szemével)": [30.954, 1.347], "-val, -vel": [32.6, 0.813], "1. lap: Elöljárószó, kötőszó és indulatszó": [33.713, 3.529], "1. lap: Elöljárószó, kötőszó, indulatszó (folytatás)": [37.542, 3.936], "1564-ben": [41.778, 1.869], "2. lap: Az összetett szavak": [43.947, 2.136], "2024-ben": [46.384, 1.695], "3. lap: Ékezet az esdrújula szavakon": [48.379, 3.042], "4. lap: A színház": [51.721, 1.823], "4. lap: A színház (folytatás)": [53.843, 2.473], "5. lap: A képregény": [56.616, 1.869], "5. lap: A képregény (folytatás)": [58.785, 2.496], "A Föld forog": [61.582, 1.3], "A Föld mozog, de mozdulatlannak érezzük.": [63.182, 2.844], "A Föld mozog. Mozdulatlannak érezzük. → Egy mondatban:": [66.326, 4.783], "A Hemigalaktikus expedícióval indultam a galaxis bal oldaláról, hogy megismerjem a jobb oldal rejtélyeit. (A del = de + el.)": [71.41, 8.847], "A Hold szerint ki nagyon beképzelt?": [80.556, 2.31], "A Hold szerint melyik bolygó a legbeképzeltebb?": [83.167, 2.833], "A Jupiter a Naprendszer egyik bolygója.": [86.3, 2.635], "A Mars és a Jupiter a szomszédai.": [89.235, 2.287], "A Nap egy csillag, a Hold pedig egy hold (mellékbolygó).": [91.822, 3.506], "A Nap több millió kilométerre van.": [95.629, 2.461], "A ZZZ… jelentése…": [98.39, 3.181], "A bocadillók azok a buborékok, amelyekbe a szereplők szavait írjuk.": [101.871, 4.458], "A bolygó kék és zöld. (munkafüzet 64/4)": [106.629, 4.156], "A bolygón van víz és levegő.": [111.086, 2.101], "A bolygón van víz. Van levegő. → Egy mondatban:": [113.487, 4.133], "A bolygónk a Mars és a Vénusz között van.": [117.92, 2.682], "A brújula (iránytű) és a micrófono (mikrofon) esdrújula szó. Az estrella (csillag) nem az.": [120.902, 5.84], "A cirkusz meglepő / varázslatos hely.": [127.042, 2.81], "A cirkusz varázslatos hely.": [130.151, 2.067], "A csillagokat távcsővel látni.": [132.518, 2.229], "A csillagokat távcsővel látni. A con elöljárószó összeköti a ven (látni) és a telescopio (távcső) szavakat.": [135.047, 7.094], "A csillagász ezt tanulmányozza:": [142.441, 2.334], "A csomag nem érkezik meg ma": [145.074, 1.904], "A fejezet nyitóoldala: Estela nagynénje rajong a csillagokért, és távcsővel nézi az eget. A „Hangolódj rá!” feladatai előre megmutatják, mit tanulunk: összetett szavak, esdrújula szavak, képregény és színház.": [147.279, 14.002], "A fejezet összefoglalása: interjú, elöljárószó, kötőszó, indulatszó, esdrújula szavak, összetett szavak, színház és képregény. Utána gyakorlunk Martín és Bruno, az űrhajós testvérek és a marslakó történetével, végül jön az „Alkoss” feladat és a kilépőjegy.": [161.58, 18.03], "A ház sok méterre / kilométerre van.": [179.91, 2.763], "A kabátokat és az esernyőket a ruhatárban hagyhatják.": [182.974, 3.889], "A kockákat, amelyekre a történet fel van osztva, viñetáknak hívjuk.": [187.163, 4.609], "A képen van egy távcső (teleszkóp).": [192.072, 2.438], "A képregény": [194.81, 1.207], "A képregény ezzel mesél el egy történetet:": [196.318, 3.007], "A képregény kockái:": [199.625, 1.823], "A képregény olyan elbeszélés, amely rajzokkal és szöveggel mesél el egy történetet.": [201.747, 5.283], "A képregény rajzokkal és szavakkal elmesélt történet. Eszközei:": [207.33, 4.865], "A képregény rajzokkal és szavakkal elmesélt történet: képkockák, szövegbuborékok és hangutánzó szavak.": [212.495, 6.687], "A képregény rajzokkal és szöveggel mesél el egy történetet. A kockák neve viñeta, a szövegbuborék bocadillo, a hangutánzó szó (plof, boom) onomatopeya. Megtanuljuk lépésről lépésre megtervezni és megrajzolni a saját képregényünket.": [219.482, 14.872], "A képregény rajzokkal és szöveggel mesél. Vannak benne képkockák, szövegbuborékok és hangutánzó szavak.": [234.654, 7.245], "A kérdező (riporter) kérdéseket tesz fel.": [242.199, 2.972], "A kérdező az interjú előtt tájékozódik.": [245.471, 2.949], "A kérdező az interjú előtt utánanéz a témának vagy a vendégnek.": [248.72, 4.342], "A kérdező tájékozódik, bemutatja a vendéget, érdekes kérdéseket tesz fel és tisztelettel beszél.": [253.362, 6.281], "A kötőszó egyenrangú szavakat köt össze: egyik sem függ a másiktól. Ezek: y (és), e (és – i előtt), ni (sem), o (vagy), u (vagy – o előtt), pero (de).": [259.943, 11.006], "A kötőszó egyenrangú szavakat köt össze: y, e, ni, o, u, pero. Szaturnusz és Mars.": [271.249, 6.838], "A marslakó a Marson ragadt.": [278.388, 2.078], "A marslakó űrhajója elromlott.": [280.766, 2.299], "A mágico (varázslatos) esdrújula szó: MÁ-gi-co.": [283.365, 3.553], "A negyedik képkockában szerepel a ¡CLONK! hangutánzó szó.": [287.217, 4.458], "A pirámide (piramis), película (film) és pétalo (szirom) szavakban a hangsúlyos szótag hátulról a harmadik.": [291.975, 6.223], "A plof és a boom…": [298.498, 2.043], "A rakéta kedden szállt fel, és vasárnap szállt le a Holdon.": [300.842, 3.773], "A rakéta kedden szállt fel, és vasárnap szállt le a Holdon. Az y kötőszó két mondatot köt össze.": [304.915, 6.745], "A rendezői utasítások (acotaciones) zárójelben vannak, és megmondják, hogyan kell játszania a szereplőnek: (Nagyon mérgesen.)": [311.96, 7.895], "A rendezői utasítások megmondják, hogyan kell játszani.": [320.155, 3.704], "A rompecabezas (kirakós) összetett szó: romper (törni) + cabezas (fejek).": [324.159, 4.83], "A satélite (műhold) esdrújula szó: sa-TÉ-li-te.": [329.289, 3.274], "A satélite szóban a té a hangsúlyos szótag.": [332.863, 3.193], "A semáforo (közlekedési lámpa), a termómetro (hőmérő) és a página (oldal) esdrújula szavak.": [336.355, 6.084], "A szavak lehetnek agudák (utolsó szótag hangsúlyos), llanák (utolsó előtti) vagy esdrújulák (hátulról a harmadik).": [342.739, 6.943], "A szereplők párbeszédet folytatnak.": [349.982, 2.496], "A színdarab olyan szöveg, amelyet arra írnak, hogy színészek és színésznők előadják a színpadon.": [352.778, 5.689], "A színdarab szövegében ott van a szereplő neve és a rendezői utasítás (acotación): ESTELA: (Suttogva.) Végre…": [358.767, 8.243], "A színdarab: olyan szöveg, amelyet színpadon való előadásra írtak. Részei:": [367.31, 5.619], "A színdarabban mi a (Hanyatt fekszik.)?": [373.229, 2.38], "A színdarabot arra írják, hogy színészek előadják a színpadon. Nincs elbeszélő: a történet a szereplők párbeszédéből és tetteiből derül ki. Részei: a szereplő neve, amit mond, és a zárójeles rendezői utasítás (acotación).": [375.909, 14.733], "A színdarabot előadásra írják. Benne van a szereplő neve, a szavai és a rendezői utasítások.": [390.942, 6.711], "A színdarabot színpadi előadásra írják. Részei: a szereplő neve, a szavai és a rendezői utasítások.": [397.953, 7.279], "A színház": [405.532, 1.08], "A színészek az elbeszélők.": [406.912, 2.055], "A szöveg szerint hány óceánja van a Földnek?": [409.267, 2.914], "A sárkány kincse": [412.481, 1.463], "A terasz székei műanyagból / fémből vannak.": [414.244, 2.984], "A testvérem nagyon ügyesen javít meg dolgokat.": [417.528, 3.007], "A tevéket?": [420.835, 1.207], "A tulajdonnevek is lehetnek esdrújulák: Álvaro.": [422.342, 3.239], "A távcsöve három-négyszeresére tudta nagyítani, amit néztek vele.": [425.881, 4.342], "A távcső és az inga mellett Galileo feltalálta az iránytűt és a vizes hőmérőt is (így írja a könyv).": [430.523, 6.455], "A távcsővel Galileo…": [437.278, 2.252], "A történetet csak a szereplők cselekvése és párbeszédei mesélik el.": [439.831, 4.481], "A világegyetem hatalmas, rejtélyekkel teli hely.": [444.612, 3.286], "A végén a marslakó folytathatja az útját.": [448.198, 3.1], "A ¡PUM! ütés, a ¡CRASH! ütközés (csattanás), a ¡BOING! pattanás.": [451.598, 6.095], "A „Egy erőművet jöttem építeni…” mondatot … mondja.": [457.993, 4.621], "A „Végre megtaláltalak!” egy … belsejében van.": [462.914, 4.214], "A: kasztanyetta": [467.428, 1.707], "ARMONÍA:": [469.435, 1.173], "ARMÓNIA:": [470.907, 1.184], "ARMÓNIA: (Nagyon mérgesen.) Na persze, még mit nem!": [472.392, 4.052], "ARMÓNIA: Mi van azzal a sárkánnyal?": [476.744, 2.67], "Alapismeretek (összefoglaló füzet)": [479.714, 2.496], "Alapismeretek: Irány a csillagok": [482.51, 2.194], "Alkalmazd, amit tanultál!": [485.004, 2.101], "Alkoss és kilépőjegy": [487.406, 1.672], "Alkoss összetett szavakat a darabokból!": [489.378, 2.694], "Alkoss új szavakat! Kösd össze a két szót, amelyek együtt új szót adnak.": [492.371, 5.097], "Amikor csak teheti, elmegy valahova messze a várostól, hogy az eget nézze.": [497.768, 4.354], "Armonía és Solfeo": [502.422, 1.66], "Armonía, Solfeo, Melodía és Clodoveo": [504.382, 3.03], "Armónia": [507.712, 1.138], "Arra írják őket, hogy előadják.": [509.15, 2.717], "Az (Elmerülten.)…": [512.166, 1.451], "Az abrelatas (konzervnyitó) és a sacapuntas (hegyező) összetett szavak.": [513.918, 4.342], "Az abrelatas összetett szó.": [518.56, 2.043], "Az apja zenész volt, és megtanította lanton játszani.": [520.903, 3.669], "Az elöljárószó egymástól függő szavakat köt össze: a, con, de, desde, en, entre, hacia, hasta, para, por.": [524.872, 8.858], "Az elöljárószó olyan szavakat köt össze, amelyek egymástól függnek. Önmagában nem állhat.": [534.03, 6.351], "Az elöljárószó, a kötőszó és az indulatszó": [540.681, 3.367], "Az elöljárószók (a, con, de, en, para…) és a kötőszók (y, o, pero…) összekötik a szavakat. Az indulatszók (¡Oh!, ¡Ay!, ¡Uf!) nem kötnek össze semmit: érzést fejeznek ki, köszönnek, biztatnak vagy figyelmet kérnek.": [544.348, 16.289], "Az elöljárószók állhatnak egyedül is.": [560.937, 2.786], "Az elöljárószók és a kötőszók arra valók, hogy szavakat vagy mondatokat kössenek össze.": [564.023, 5.213], "Az ember, aki a csillagokat nézte": [569.536, 2.589], "Az ember, aki a csillagokat nézte (2)": [572.425, 2.879], "Az ember, aki a csillagokat nézte (olvasmány)": [575.604, 3.007], "Az emberek mindig is nézték az eget.": [578.911, 2.415], "Az esdrújula szavak mindig ékezetesek.": [581.626, 2.728], "Az esdrújula szavak mindig ékezetesek: közlekedési lámpa, hőmérő, oldal.": [584.655, 5.05], "Az esdrújula szavak mindig ékezetet kapnak a hangsúlyos szótagon.": [590.005, 4.029], "Az esdrújula szavakban a hangsúlyos szótag hátulról a harmadik (antepenúltima): sa-TÉ-li-te, MÁ-gi-co. Ezek a szavak MINDIG ékezetet kapnak a hangsúlyos szótagon. Átismételjük az aguda és llana szavakat is.": [594.334, 13.526], "Az esdrújula szavakban a hangsúlyos szótag hátulról a harmadik helyen van.": [608.159, 4.528], "Az esdrújula szavakban hátulról a harmadik szótag hangsúlyos, és mindig ékezetesek: satélite, mágico.": [612.987, 6.92], "Az esdrújula szavakban hátulról a harmadik szótag hangsúlyos. Mindig van rajtuk ékezet.": [620.207, 6.2], "Az esernyőket a ruhatárban hagyhatják.": [626.706, 2.926], "Az indulatszók felkiáltójelek vagy kérdőjelek között állnak: ¡ay! (jaj), ¡eh! (hé), ¡uf! (hű, uff), ¡hala! (hűha).": [629.932, 8.975], "Az indulatszók nem kötnek össze szavakat: érzéseket fejeznek ki, köszönnek, biztatnak vagy felhívják a figyelmet.": [639.207, 6.838], "Az indulatszók szavakat kötnek össze.": [646.345, 2.496], "Az indulatszók érzést fejeznek ki, köszönnek, biztatnak vagy figyelmet kérnek: Ó, milyen fényes csillag! Jaj! Megbotlottam egy kőben.": [649.141, 8.847], "Az inga ötlete akkor jutott eszébe, amikor egy lámpát figyelt.": [658.288, 3.866], "Az ingát pontosabb órák készítésére használták.": [662.454, 3.425], "Az interjú": [666.179, 1.161], "Az interjú előtt utánanéz a témának vagy a vendégnek.": [667.64, 3.634], "Az interjú két ember beszélgetése (párbeszéde).": [671.574, 3.309], "Az interjú két ember beszélgetése.": [675.183, 2.705], "Az interjú két ember beszélgetése: a kérdező (entrevistador) kérdez, az interjúalany (entrevistado) válaszol. Megtanuljuk, mi a dolga mindkettőnek, és hogyan készítsünk egy rövid interjút egy képregényhőssel.": [678.188, 13.328], "Az interjú két ember beszélgetése: a kérdező kérdez, az interjúalany válaszol.": [691.816, 5.573], "Az interjú két ember előre megtervezett beszélgetése.": [697.689, 3.762], "Az interjú két ember hivatalos, megtervezett beszélgetése. Lehet szóbeli vagy írásbeli.": [701.75, 6.072], "Az interjú két ember megtervezett beszélgetése.": [708.122, 3.262], "Az interjú lehet szóbeli vagy írásbeli.": [711.685, 2.717], "Az interjú · Elöljárószó és kötőszó": [714.702, 2.995], "Az interjúalany tesz fel minden kérdést.": [717.997, 2.833], "Az interjúalany világosan és rendezetten válaszol a kérdésekre.": [721.13, 4.412], "Az interjúalany világosan és rendezetten válaszol, szakértőként beszél és tiszteletet mutat.": [725.842, 6.153], "Az interjúalany válaszol a kérdésekre.": [732.295, 2.833], "Az interjúalany összevissza válaszol.": [735.428, 2.752], "Az interjú…": [738.479, 1.869], "Az iránytű és a mikrofon": [740.648, 1.962], "Az onomatopeyák hangutánzó szavak, mint a plof (pottyan) vagy a boom (bumm).": [742.911, 4.377], "Az utazás hosszú, de izgalmas.": [747.587, 2.357], "Az ¡Ay! kifejez…": [750.244, 2.612], "Az «apasionada» azt jelenti, hogy…": [753.157, 2.81], "Az Északi-hegységben, egy barlangban élt egy sárkány, amely egy hatalmas kincset őrzött.": [756.266, 5.004], "Az égi hírnök": [761.57, 1.324], "Az ékezet az esdrújula szavakon": [763.194, 2.264], "Az én szupererőm…": [765.758, 2.113], "Az órbita (pálya) szó…": [768.171, 2.299], "Az összefoglaló füzet (Saberes básicos) 7. fejezete röviden: az interjú, az elöljárószó, a kötőszó és az indulatszó, az összetett szavak, az ékezet az esdrújula szavakon, a színház és a képregény.": [770.769, 12.841], "Az összetett szavak": [783.91, 1.382], "Az összetett szavak két vagy több egyszerű szó összekapcsolásából állnak.": [785.592, 4.423], "Az összetett szavak két vagy több egyszerű szóból állnak: konzervnyitó, hegyező.": [790.315, 4.69], "Az összetett szavak két vagy több egyszerű szóból állnak: kosárlabda, sobremesa (beszélgetés evés után).": [795.305, 6.2], "Az összetett szavak két vagy több egyszerű szóból állnak: kosárlabda, sobremesa.": [801.805, 4.865], "Az összetett szó ebből áll:": [806.97, 2.148], "Az összetett szó egy új szó, saját jelentéssel.": [809.418, 3.181], "Az összetett szó két (vagy több) egyszerű szóból áll össze, és új jelentése lesz: abrir + latas = abrelatas (konzervnyitó), sacar + puntas = sacapuntas (hegyező). Úgy illesztjük össze, mint a kirakós darabjait.": [812.899, 14.234], "Az űrhajós a Holdra utazik.": [827.433, 2.334], "Az űrhajós a Holdra utazik. Az a elöljárószó összeköti a viaja (utazik) és a la Luna (a Hold) szavakat.": [830.066, 7.105], "Az űrhajósok az űr felé utaznak.": [837.471, 2.647], "Az űrutazás reggeltől estig tartott.": [840.419, 2.612], "Azt mondják, csillagporból vagyunk.": [843.331, 2.31], "B: furulya": [845.941, 1.463], "Bemutatja az interjúalanyt.": [847.704, 2.113], "Bevezetés": [850.117, 1.115], "Biciklivel megyünk.": [851.532, 1.649], "Biciklivel megyünk. (tankönyv 164/1)": [853.48, 3.936], "Boing!": [857.716, 0.917], "Boldizsár szerint ki vitte el a tevéket?": [858.933, 2.717], "Bruno beindítja a motorokat, azok felbőgnek, és jelzik, hogy minden meg van javítva.": [861.95, 5.132], "Bruno megjavítja a gépet.": [867.381, 2.09], "C: lant": [869.771, 1.138], "CLODOVEO:": [871.209, 1.149], "CLODOVEO: (Elmerülten.) Egy kincs, nem kevesebb, mint egy kincs…": [872.658, 4.911], "Carlos": [877.869, 0.859], "Csoportban játsszatok el egy jelenetet egy űrrakétában.": [879.029, 3.831], "Délben indultunk, de a dugó miatt éjfélkor értünk oda.": [883.16, 3.622], "Délben indultunk.": [887.082, 1.672], "Döntsétek el, ki kérdez, és ki lesz a szereplő.": [889.054, 3.158], "ESTELA: (Suttogva.) Végre… (színdarab)": [892.512, 3.808], "ESTELA: (Suttogva.) Végre… Viszlát, lámpák, viszlát, zaj.": [896.62, 5.317], "Ebben a fejezetben Martin megtanulja, hogyan készül egy interjú, és elolvassa Galileo Galilei életrajzát. A nyelvtanban az elöljárószóval, a kötőszóval és az indulatszóval, az összetett szavakkal és az esdrújula szavak ékezetével ismerkedik, végül megismeri a színdarabot és a képregényt.": [902.237, 18.413], "Ebben a fejezetben tanuljuk: az interjút, az elöljárószót, a kötőszót és az indulatszót, az összetett szavakat, az esdrújula szavakat, a színházat és a képregényt.": [920.951, 10.577], "Egy erőművet jöttem építeni… de ezen a bolygón maguktól nőnek ki!": [931.828, 4.934], "Egy fiú megcsúszik egy banánhéjon. Mit mond?": [937.062, 3.529], "Egy kincs, nem kevesebb, mint egy kincs…": [940.891, 2.902], "Egy lánynak nagyon melege van, legyezi magát. Mit mond?": [944.094, 4.296], "Egy nap, miközben azt figyelte, hogyan leng egy lámpa a templomban, nagy ötlete támadt: feltalálta az ingát.": [948.689, 6.304], "Egy élettel teli bolygón élünk.": [955.294, 2.322], "Egyszerű szó + egyszerű szó = összetett szó": [957.916, 3.576], "Egészítsd ki a megfelelő elöljárószóval!": [961.791, 2.961], "Egészítsd ki a mondatokat a megfelelő kötőszóval!": [965.052, 3.367], "Egészítsd ki a világegyetemről szóló szöveget!": [968.719, 3.181], "Egészítsd ki az esdrújula szóval!": [972.2, 2.426], "Elmegy valahova messze a várostól, hogy az eget nézze.": [974.927, 3.239], "Elromlott az űrhajóm, és itt kötöttem ki, a Holdon rekedve.": [978.466, 3.866], "Elszórakoztatlak, „töröm a fejed”…": [982.632, 2.426], "Elöljárószó, kötőszó, indulatszó": [985.358, 3.042], "Elöljárószó, kötőszó, indulatszó (feladatok)": [988.7, 3.46], "Előtte utánanéz a témának.": [992.46, 2.113], "Esdrújula vagy nem? Válogasd szét!": [994.873, 3.135], "Estela megkönnyebbülten sóhajtott, maga mögött hagyva a zajt és a lámpákat.": [998.308, 4.737], "Estela megkönnyebbülten sóhajtott… (elbeszélés)": [1003.344, 3.762], "Estela nagynénje rajong a csillagokért.": [1007.406, 2.821], "Ez egy életrajz: olyan szöveg, amely egy valódi ember életét meséli el. Galileo Galilei találmányai:": [1010.527, 7.001], "Ez meg ki?": [1017.828, 1.161], "Ezek államügyek.": [1019.289, 1.591], "Fejtsd meg a találós kérdéseket! Segítség: összetett szavak.": [1021.18, 4.481], "Felfüggesztett tárgy, amely ide-oda leng.": [1025.961, 2.705], "Felismerem az elöljárószót, a kötőszót és az indulatszót.": [1028.966, 3.889], "Felismerem az összetett szavakat.": [1033.156, 2.252], "Felség, ellopták a tevéinket.": [1035.708, 2.392], "FÖLD: Öt óceánom és öt kontinensem van.": [1038.4, 3.262], "GERBERTO: (Sietve.) Felség, ellopták a tevéinket!": [1041.962, 4.261], "Galileo Galilei 1564-ben született Pisában, egy olasz városban, amely a ferde tornyáról híres.": [1046.523, 7.129], "Galileo Galilei 1564-ben született Pisában.": [1053.951, 3.866], "Galileo Galilei életrajza: Pisában született, szerette a zenét, a matematikát és a kísérleteket. Feltalálta az ingát, megépítette a saját távcsövét, és felfedezte, hogy a Holdon hegyek és völgyek vannak, a Föld pedig a Nap körül kering.": [1058.118, 14.826], "Galileo egy olasz városban született, amely a ferde tornyáról ismert.": [1073.243, 4.458], "Galileo felfedezte, hogy a Hold nem sima: hegyek és völgyek vannak rajta, akárcsak a Földön.": [1078.002, 5.619], "Galileo hallott a messzelátóról (anteojos), amivel távoli dolgokat lehetett látni, és megépítette a saját távcsövét.": [1083.921, 7.012], "Galileo már gyerekkorában eldöntötte, hogy orvos akar lenni.": [1091.233, 3.773], "Galileo rájött, hogy a Föld a Nap körül kering.": [1095.307, 3.123], "Galileo szerint mi kering a Nap körül?": [1098.73, 2.473], "Galileo találmányai": [1101.503, 1.672], "Galileo találta fel a messzelátót, hogy messzire lásson.": [1103.474, 3.471], "Galileo találta fel? Válogasd szét!": [1107.246, 3.193], "Galileo távcsövet épít.": [1110.739, 1.974], "Galileo élete és felfedezései": [1113.012, 2.496], "Galileo írt egy könyvet Az égi hírnök címmel.": [1115.808, 3.204], "Gerberto": [1119.313, 1.138], "Gerberto és Menyhért": [1120.751, 1.625], "Gitárhoz hasonló hangszer.": [1122.676, 2.183], "Gondold ki, melyik jelenetet rajzolod az egyes kockákba.": [1125.159, 3.634], "Gondolj a szövegre, és válassz!": [1129.093, 2.241], "Grrr!": [1131.633, 1.265], "Gyakorlunk (A bolygók színháza)": [1133.199, 2.206], "Gyakorlunk (elöljárószó, kötőszó, indulatszó)": [1135.705, 3.518], "Gyakorlunk (készíts képregényt)": [1139.522, 2.194], "Gyakorlunk (összetett szavak, esdrújula szavak, tollbamondás)": [1142.017, 3.611], "Gyümölcsturmixot iszom.": [1145.927, 1.881], "Gyümölcsturmixot iszom. (tankönyv 164/1)": [1148.108, 4.168], "HA-HA-HA!": [1152.576, 0.987], "HOLD: Nézd csak, ki jön ott: a Szaturnusz a gyűrűivel, na, az aztán beképzelt… Nézd, hogy jár!": [1153.863, 6.56], "Ha az első kocka egyik felfedezője mondana valamit, hogyan rajzolnád?": [1160.723, 4.203], "Ha azt akarod, hogy elszórakoztassalak, keress nekem megoldást: nagy figyelemmel „töröm a fejed”.": [1165.226, 5.886], "Ha interjút készíthetnél egy űrhajósnővel vagy egy csillagásszal, mit kérdeznél tőlük?": [1171.412, 5.12], "Ha lehet, hullócsillagokat szeretne látni.": [1176.832, 2.786], "Hagymával vagy hagyma nélkül szereted a krumplis tortillát?": [1179.918, 3.541], "Hangolódj rá! és belépőjegy": [1183.759, 2.67], "Helyesírás": [1186.73, 1.3], "Hogy a képregény kifejező legyen, használj ilyen szavakat: ¡ay! (jaj), ¡oh! (ó), ¿eh? (mi?), ¡guau! (hűha), és hangokat: ¡BOOM!, ¡BANG!": [1188.33, 10.333], "Hogy hívják a buborékokat, ahol a szereplők beszélnek?": [1198.963, 3.46], "Hogy hívják a képregény kockáit?": [1202.723, 2.589], "Hogy hívják a szereplőket?": [1205.612, 2.136], "Hogy lássa az eget, a város közepére megy.": [1208.048, 2.694], "Hogyan beszél egymással a kérdező és az interjúalany?": [1211.041, 3.506], "Hogyan képzeled el egy űrhajósnő űrutazását vagy egy csillagász munkáját?": [1214.848, 4.76], "Hogyan válaszol az interjúalany?": [1219.908, 2.31], "Hogyan írjuk helyesen? (Mind esdrújula!)": [1222.518, 3.019], "Hogyan írjuk?": [1225.837, 1.265], "Hol adják elő a színdarabot?": [1227.402, 2.194], "Hol hallható ez az interjú?": [1229.896, 2.159], "Hol szoktunk viñetákat (képkockákat) látni?": [1232.356, 3.042], "Hol szoktunk viñetákat látni?": [1235.698, 2.194], "Hol utazik Amundsen és csapata?": [1238.192, 2.206], "Hol van a hangsúlyos szótag egy esdrújula szóban?": [1240.698, 3.228], "Hol van a marslakó?": [1244.225, 1.521], "Hol volt a sárkány?": [1246.046, 1.695], "Hova kerül ez a szöveg?": [1248.041, 1.672], "Hova megy, hogy lássa az eget?": [1250.013, 1.904], "Hová érkeznek a felfedezők?": [1252.217, 2.264], "Hány ember vesz részt egy interjúban?": [1254.781, 2.543], "Hány esdrújula szó van a mondatban?": [1257.624, 2.438], "Hát. Nincsenek itt.": [1260.362, 2.136], "Hé!": [1262.798, 0.755], "Hűha!": [1263.853, 0.929], "Hűha! (csodálat)": [1265.082, 1.869], "Hűha! Az űrhajós nagyon gyorsan haladt az űrhajójában az űrön át.": [1267.251, 5.05], "Igaz ez a színdarabokra?": [1272.601, 1.858], "Igaz vagy hamis?": [1274.759, 1.567], "Igazak vagy hamisak az állítások?": [1276.626, 2.531], "Igen, mindig.": [1279.457, 1.231], "Indulatszó · Összetett szavak · Esdrújula szavak": [1280.988, 2.856], "Interjút a rádióban is lehet hallgatni.": [1284.144, 2.763], "Inés": [1287.207, 0.824], "Irodalom": [1288.331, 1.045], "Irány a csillagok": [1289.676, 1.324], "Irány a csillagok!": [1291.3, 1.544], "Irány a csillagok: összefoglaló": [1293.144, 2.38], "Ismerem a színdarab jellemzőit.": [1295.824, 2.218], "Ismétlés": [1298.341, 1.149], "Jaj!": [1299.791, 0.72], "Jaj! (fájdalom)": [1300.811, 1.718], "Jaj! Megbotlottam egy kőben.": [1302.829, 2.647], "Jaj! Megbotlottam egy kőben. Az indulatszó fájdalmat fejez ki.": [1305.776, 5.05], "Jegyezd meg: az elöljárók és a kötőszók szavakat kötnek össze; az indulatszók felkiáltást, érzést fejeznek ki.": [1311.126, 7.221], "Jupiter": [1318.648, 1.068], "Jó, jó. Azt még meglátjuk…": [1320.016, 3.32], "Jól elkülönülnek a képkockák egymástól?": [1323.636, 2.972], "Keresd meg a kötőszót a sószórók mondataiban!": [1326.908, 3.146], "Ki a rádió vendége? Mivel foglalkozik?": [1330.355, 3.448], "Ki beszél szakértőként a témáról?": [1334.103, 2.554], "Ki beszél?": [1336.957, 1.196], "Ki csinálja: a kérdező vagy az interjúalany?": [1338.453, 3.019], "Ki kérdez az interjúban?": [1341.771, 1.869], "Ki kérdez?": [1343.941, 1.184], "Ki mondja?": [1345.425, 1.149], "Ki teszi fel a kérdéseket?": [1346.874, 2.101], "Ki teszi fel ezt a kérdést?": [1349.276, 2.067], "Ki válaszol így?": [1351.642, 1.486], "Ki válaszol?": [1353.428, 1.277], "Kicsi korától nagyon kíváncsi volt: szerette nézni az eget és kísérletezni.": [1355.005, 4.702], "Kik beszélnek a szövegben?": [1360.007, 1.997], "Kilépőjegy: mennyit tanultál? Egy kicsit, eleget vagy sokat? Hasonlítsd össze a belépőjegyeddel!": [1362.304, 6.827], "Klonk!": [1369.431, 0.906], "Klonk! (a zászlórúd koppan a jégen)": [1370.637, 3.019], "Kopp, kopp!": [1373.955, 1.173], "Kopp, kopp! → kopogás az ajtón": [1375.428, 2.752], "Koppints az elöljárószókra a részletben!": [1378.479, 2.798], "Koppints az elöljárószókra!": [1381.577, 2.055], "Koppints az összetett szavakra!": [1383.932, 2.09], "Koppints azokra a szavakra, amelyek az éggel kapcsolatosak!": [1386.322, 3.587], "Kávét vagy teát kérsz?": [1390.21, 1.718], "Képregényben szoktunk viñetákat (képkockákat) látni.": [1392.228, 3.704], "Készítsetek interjút egy igazi csillagásszal.": [1396.231, 3.077], "Készítsétek el az interjút, világosan beszélve.": [1399.608, 3.239], "Készítsétek elő az interjút: találjátok ki a kérdéseket és a válaszokat.": [1403.147, 5.05], "Két szóból új szót alkothatunk: parar (megállítani) + caídas (esések) = paracaídas (ejtőernyő).": [1408.498, 6.734], "Kísérletet végzett fonálra akasztott golyókkal, és így feltalálta az ingát.": [1415.531, 4.853], "Kíváncsi szavak: kösd össze a spanyol szót a magyarral!": [1420.684, 3.576], "Kíváncsi szavak: lant, távcső, kísérlet, inga, messzelátó, expedíció, barlang, műhold.": [1424.56, 5.886], "Kölcsönadod a dugóhúzódat? Az enyémet a lakóautóban hagytam.": [1430.747, 4.458], "Könyv Galileo rajzaival és megfigyeléseivel.": [1435.505, 3.111], "Könyvet ír.": [1438.916, 1.242], "Körömfestésre való.": [1440.459, 1.788], "Kösd össze a fogalmat a meghatározásával!": [1442.546, 2.984], "K    sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);$('#clr').onclick=()=>{got='';$('#got').innerHTML='&nbsp;';G.querySelectorAll('.tile').forEach(t=>t.classList.remove('used'))};
   G.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{got+=letters[b.dataset.i];b.classList.add('used');$('#got').textContent=got;
    if(got.length===word.length){n++;const good=got===word;if(good)ok++;$('#got').innerHTML=good?`✅ ${esc(word)}`:`❌ <s>${esc(got)}</s> → ${esc(word)}`;sayPair(w.w,w.hu);setTimeout(next,1800)}})};next()}}
// ---------- kvíz (véletlen, ≥50 lehetséges kérdés)
function quizPool(sec){const P=[];D.sections.forEach(s=>{if(sec!=='all'&&s.id!==sec)return;
 (s.cards||[]).forEach(c=>{if(c.check)P.push({...c.check,ref:c.ref,s:s.id})});
 (s.examples||[]).forEach(e=>{if(e.try)P.push({...e.try,ref:e.ref,s:s.id})});
 (s.widgets||[]).forEach(w=>{if(w.type==='choice')w.items.forEach(c=>P.push({...c,ref:w.ref,s:s.id}));
  if(w.type==='truefalse')w.items.forEach(it=>P.push({q:it.t,q_hu:it.hu,options:[{t:'Verdadero',hu:'Igaz'},{t:'Falso',hu:'Hamis'}],answer:it.answer?0:1,ref:w.ref,s:s.id}));
  if(w.type==='fill')w.items.forEach(it=>P.push({q:it.t.replace('__','_'),q_hu:it.hu,options:it.options.map(o=>({t:it.t.replace('__',o)})),answer:it.options.indexOf(it.answer),ref:w.ref,s:s.id,say:it.full}));
  if(w.type==='match')w.pairs.forEach((p,i)=>{const o=shuffle(w.pairs.filter((x,j)=>j!==i)).slice(0,2).map(x=>({t:x.b,hu:x.b_hu}));const opts=shuffle([{t:p.b,hu:p.b_hu},...o]);P.push({q:`${p.a} → ?`,q_hu:w.prompt_hu,options:opts,answer:opts.findIndex(x=>x.t===p.b),ref:w.ref,s:s.id})});
  if(w.type==='sort')w.items.forEach(it=>{const opts=w.bins.map(b=>({t:b.es,hu:b.hu}));P.push({q:`${it.t}: ¿${w.bins.map(b=>b.es).join(' o ')}?`,q_hu:it.hu,options:opts,answer:w.bins.findIndex(b=>b.id===it.bin),ref:w.ref,s:s.id})})});
 (s.words||[]).forEach(wd=>{const others=shuffle(WORDS.filter(x=>x.w!==wd.w&&x.hu!==wd.hu)).slice(0,3);
  let o=shuffle([wd,...others]);P.push({q:`¿Qué significa «${wd.w}»?`,q_hu:'Mit jelent?',options:o.map(x=>({t:x.hu})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1});
  o=shuffle([wd,...others]);P.push({q:`«${wd.hu}» – ¿en español?`,q_hu:'Hogy mondják spanyolul?',options:o.map(x=>({t:x.w})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1})})});
 return P.filter(q=>q.options&&q.answer>=0&&q.answer<q.options.length)}
let QZ=null,qzSec='all';
function rQz(V){const pool=quizPool(qzSec);
 let h=`<div class="panel"><div class="filt"><select id="qs"><option value="all">Az egész fejezet</option>${D.sections.map(s=>`<option value="${s.id}" ${qzSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="qn">${[10,20,30,50,100].map(n=>`<option ${n===20?'selected':''}>${n}</option>`).join('')}</select><button class="big g" id="qgo">▶ Indítás</button></div><p class="hu" style="margin:0">${pool.length} különböző kérdés közül véletlenszerűen.</p><div id="qb"></div></div>`;
 V.innerHTML=h;$('#qs').onchange=e=>{qzSec=e.target.value;QZ=null;render()};
 $('#qgo').onclick=()=>{const n=+$('#qn').value;const qs=[];for(let i=0;i<n;i++)qs.push(pool[Math.floor(Math.random()*pool.length)]);QZ={qs,i:0,ok:0};qShow()};
 if(QZ)qShow()}
function qShow(){const B=$('#qb');if(!B)return;if(QZ.i>=QZ.qs.length){B.innerHTML=`<p class="res" style="font-size:22px"><span class="kit j">😺</span> Kész! ${QZ.ok} / ${QZ.qs.length}</p>`;star(Math.round(QZ.ok/4));QZ=null;return}
 const q=QZ.qs[QZ.i];const opts=q.options;
 B.innerHTML=`<p style="font-weight:800">${QZ.i+1}. / ${QZ.qs.length} · jó: ${QZ.ok} ${pchip(q.ref)}</p><div class="check" style="border:0"><div class="q" style="font-size:21px">${esc(q.q)} <button class="abtn" data-r>🔊</button></div>${huOn&&q.q_hu?`<div class="hu">${esc(q.q_hu)}</div>`:''}
 <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}${huOn&&o.hu&&!q.nohu?`<small>${esc(o.hu)}</small>`:''}</button>`).join('')}</div><div class="res"><span class="kit">🐱</span></div></div>`;
 const rd=()=>q.say?sayEs(q.say):sayPair(q.q,q.q_hu);B.querySelector('[data-r]').onclick=rd;rd();
 B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(B.dataset.lock)return;B.dataset.lock=1;const i=+b.dataset.i,ok=i===q.answer;if(ok)QZ.ok++;b.classList.add(ok?'ok':'no');B.querySelectorAll('.opt')[q.answer].classList.add('ok');
  kitty(B.querySelector('.kit'),ok);const r=opts[q.answer];play([q.say?clip('es',q.say):null,/[áéíóúñ¿¡]|^[a-z]/i.test(r.t)&&!q.nohu?clip('es',r.t):null,huOn&&q.nohu?clip('hu',q.q_hu.includes('spanyolul')?'':r.t):null]);
  setTimeout(()=>{delete B.dataset.lock;QZ.i++;qShow()},ok?1600:2600)})}

$('#hnum').textContent=D.unit.num;$('#htitle').textContent=D.unit.title;
$('#hsub').textContent=[D.unit.title_hu||'',D.unit.pages_tb?'Tankönyv '+D.unit.pages_tb:'',D.unit.pages_cu?'Munkafüzet '+D.unit.pages_cu:'',D.unit.pages_sb?'Saberes básicos '+D.unit.pages_sb:''].filter(Boolean).join(' · ');$('#stars').textContent='⭐ '+ST.stars;
const hs=location.hash.slice(1);if(['ov','ex','eg','wd','qz'].includes(hs))tab=hs;render();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
