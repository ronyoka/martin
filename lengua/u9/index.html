k menteni, de hiába: darabokban volt!", "options": [{"t": "2", "hu": "kettő"}, {"t": "4", "hu": "négy"}, {"t": "3", "hu": "három"}], "answer": 1}, {"q": "¿Cuántas estrofas tiene el poema del Tomate (¡Ay! ¡Qué disparate!…)?", "q_hu": "Hány versszakos a Paradicsomos vers?", "options": [{"t": "5", "hu": "öt"}, {"t": "3", "hu": "három"}, {"t": "1", "hu": "egy"}], "answer": 1}]}, {"id": "w2", "type": "order", "ref": {"book": "cu", "page": 83, "ex": "1"}, "prompt": "Ordena los versos de la estrofa.", "prompt_hu": "Tedd sorba a versszak sorait!", "items": [{"t": "¿Quieren que les cuente?", "hu": "Akarjátok, hogy elmeséljem?"}, {"t": "Se arrojó a la fuente", "hu": "Beleugrott a tálba"}, {"t": "sobre la ensalada", "hu": "a salátára,"}, {"t": "recién preparada.", "hu": "ami épp elkészült."}]}, {"id": "w3", "type": "choice", "ref": {"book": "cu", "page": 84, "ex": "3"}, "prompt": "Cuenta la medida de cada verso.", "prompt_hu": "Számold meg, hány szótagos a sor!", "items": [{"q": "Abrí la ventana,", "q_hu": "Kinyitottam az ablakot,", "options": [{"t": "8", "hu": "nyolc"}, {"t": "5", "hu": "öt"}, {"t": "6", "hu": "hat"}], "answer": 2}, {"q": "la lluvia caía,", "q_hu": "esett az eső,", "options": [{"t": "6", "hu": "hat"}, {"t": "4", "hu": "négy"}, {"t": "7", "hu": "hét"}], "answer": 0}, {"q": "canastas vacías.", "q_hu": "üres kosarak.", "options": [{"t": "6", "hu": "hat"}, {"t": "7", "hu": "hét"}, {"t": "5", "hu": "öt"}], "answer": 0}, {"q": "¿Quién las cogería?", "q_hu": "Ki szedné le őket?", "options": [{"t": "5", "hu": "öt"}, {"t": "8", "hu": "nyolc"}, {"t": "6", "hu": "hat"}], "answer": 2}, {"q": "se las comerían.", "q_hu": "megennék őket.", "options": [{"t": "4", "hu": "négy"}, {"t": "8", "hu": "nyolc"}, {"t": "6", "hu": "hat"}], "answer": 2}]}, {"id": "w4", "type": "fill", "ref": {"book": "cu", "page": 84, "ex": "4"}, "prompt": "Copia las palabras que riman.", "prompt_hu": "Írd be a rímelő szót!", "items": [{"t": "El diario __ / la noticia saca:", "options": ["Espinaca", "Cebolla", "Pepino"], "answer": "Espinaca", "full": "El diario Espinaca / la noticia saca:", "hu": "A Spenót újság közli a hírt:", "pic": "🥬"}, {"t": "Al leer, la __ / lloraba en su olla.", "options": ["Acelga", "Cebolla", "Remolacha"], "answer": "Cebolla", "full": "Al leer, la Cebolla / lloraba en su olla.", "hu": "Olvasás közben a Hagyma sírt a fazekában.", "pic": "🧅"}, {"t": "Una __ / se puso borracha.", "options": ["Remolacha", "Espinaca", "Pepino"], "answer": "Remolacha", "full": "Una Remolacha / se puso borracha.", "hu": "Egy Cékla becsípett.", "pic": "🍠"}, {"t": "—¡Me importa un comino!, / dijo don __…", "options": ["Cebolla", "Pepino", "Acelga"], "answer": "Pepino", "full": "—¡Me importa un comino!, / dijo don Pepino…", "hu": "– Fütyülök rá! – mondta Uborka úr…", "pic": "🥒"}, {"t": "y no habló la __ / (estaba de huelga).", "options": ["Acelga", "Remolacha", "Espinaca"], "answer": "Acelga", "full": "y no habló la Acelga / (estaba de huelga).", "hu": "és Mángold nem szólt (sztrájkolt éppen).", "pic": "🥗"}]}, {"id": "w5", "type": "sort", "ref": {"book": "sb", "page": 53, "ex": null}, "prompt": "¿Arte menor o arte mayor?", "prompt_hu": "Rövid sor (arte menor) vagy hosszú sor (arte mayor)?", "bins": [{"id": "men", "es": "arte menor (8 o menos)", "hu": "rövid sor (legfeljebb 8)"}, {"id": "may", "es": "arte mayor (más de 8)", "hu": "hosszú sor (8-nál több)"}], "items": [{"t": "Cuando la escarcha y el hielo (10)", "hu": "Amikor a dér és a jég (10)", "bin": "may"}, {"t": "se empiezan a derretir (8)", "hu": "olvadni kezd (8)", "bin": "men"}, {"t": "Abrí la ventana (6)", "hu": "Kinyitottam az ablakot (6)", "bin": "men"}, {"t": "Su rojo vestido (6)", "hu": "Piros ruhája (6)", "bin": "men"}, {"t": "Los historiadores estudian el pasado (13)", "hu": "A történészek a múltat tanulmányozzák (13)", "bin": "may"}, {"t": "Las personas del pasado vivían en cuevas (14)", "hu": "A régi emberek barlangokban éltek (14)", "bin": "may"}]}, {"id": "w6", "type": "truefalse", "ref": {"book": "sb", "page": 53, "ex": null}, "prompt": "¿Verdadero o falso?", "prompt_hu": "Igaz vagy hamis?", "items": [{"t": "Una estrofa es un grupo de versos.", "hu": "A versszak verssorok csoportja.", "answer": true}, {"t": "La medida es el número de estrofas.", "hu": "A mérték a versszakok száma.", "answer": false}, {"t": "Un verso de 10 sílabas es de arte mayor.", "hu": "A 10 szótagos sor hosszú sor (arte mayor).", "answer": true}, {"t": "Un verso de 8 sílabas es de arte mayor.", "hu": "A 8 szótagos sor hosszú sor (arte mayor).", "answer": false}, {"t": "Al leer versos sentimos un ritmo musical.", "hu": "Verset olvasva zenei ritmust érzünk.", "answer": true}]}], "examples": [{"es": "¡Qué frío siente de pronto!", "hu": "Milyen hideg lett hirtelen!", "ref": {"book": "sb", "page": 53, "ex": null}, "hl": ["frío"], "pic": "🥶", "try": {"type": "choice", "q": "Esta línea del poema es un…", "q_hu": "Ez a sor a versben egy…", "options": [{"t": "verso", "hu": "verssor"}, {"t": "estrofa", "hu": "versszak"}], "answer": 0}}, {"es": "Necesita un buen abrigo.", "hu": "Jó kabát kell neki.", "ref": {"book": "sb", "page": 53, "ex": null}, "hl": ["abrigo"], "pic": "🧥", "try": null}, {"es": "Cuando la escarcha y el hielo se empiezan a derretir, salen las nubes al cielo con delantales de abril.", "hu": "Amikor a dér és a jég olvadni kezd, kijönnek a felhők az égre áprilisi kötényben.", "ref": {"book": "sb", "page": 53, "ex": null}, "hl": ["escarcha", "hielo", "nubes"], "pic": "☁️", "try": {"type": "choice", "q": "¿Cuántos versos tiene esta estrofa?", "q_hu": "Hány sorból áll ez a versszak?", "options": [{"t": "2", "hu": "kettő"}, {"t": "4", "hu": "négy"}], "answer": 1}}, {"es": "¡Ay! ¡Qué disparate! ¡Se mató un Tomate!", "hu": "Jaj, micsoda butaság! Szörnyet halt egy Paradicsom!", "ref": {"book": "cu", "page": 83, "ex": "1"}, "hl": ["disparate", "Tomate"], "pic": "🍅", "try": {"type": "choice", "q": "¿Qué palabras riman?", "q_hu": "Melyik szavak rímelnek?", "options": [{"t": "Ay – Qué", "hu": : [59.155, 3.82], "Al exponer, es bueno hablar muy rápido.": [63.275, 2.81], "Al exponer, ¿a quién miras?": [66.384, 1.974], "Al leer versos sentimos un ritmo musical.": [68.658, 2.728], "Al leer, cuando aparece una coma, hacemos una breve pausa, más corta que con un punto.": [71.686, 4.261], "Al leer, la Cebolla / lloraba en su olla.": [76.247, 2.635], "Al leer, la Cebolla lloraba en su olla.": [79.183, 2.426], "Algunas fuentes son objetos, como monedas o vasijas.": [81.909, 3.541], "Algunas fuentes son objetos, como monedas, herramientas o vasijas que se encuentran en excavaciones.": [85.75, 6.06], "Algunas fuentes son objetos: monedas, herramientas o vasijas.": [92.111, 4.319], "Ana y yo no. Nosotras no tenemos entrada.": [96.73, 3.262], "Antes de la y de una lista ponemos coma.": [100.292, 2.368], "Apoya tus ideas mediante gestos.": [102.96, 2.508], "Ardillas y pájaros se las comerían.": [105.768, 2.392], "Ay – Qué": [108.46, 0.975], "Buscan pistas en las fuentes históricas.": [109.735, 2.728], "Buscan pistas que nos ayuden a comprender otras épocas.": [112.763, 3.274], "Cada persona puede tener una opinión diferente.": [116.337, 2.694], "Cada renglón de un poema es un verso. Al leerlo, se produce una sensación de ritmo musical.": [119.331, 5.677], "Cada uno de los grupos de versos de un poema se llama estrofa.": [125.308, 3.413], "Cazaban y recolectaban alimentos.": [129.022, 2.45], "Cazaban, pescaban y recolectaban frutos.": [131.771, 2.786], "Cazaban, pescaban, y recolectaban frutos.": [134.858, 2.891], "Clasifica los tipos de fuentes.": [138.049, 2.159], "Clasifica según el campo semántico.": [140.508, 2.45], "Combina texto e imágenes.": [143.258, 2.009], "Compara la escuela del pasado con la de ahora.": [145.566, 2.775], "Compara la vida en el campo y en la ciudad.": [148.641, 2.438], "Compara los medios de comunicación de ahora con los que tenían tus abuelos.": [151.379, 3.878], "Compara los medios de transporte del pasado con los de ahora.": [155.557, 3.2
