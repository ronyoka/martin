– salta", "hu": "világos – ugrál", "bin": "parecida"}]}, {"id": "w2", "type": "choice", "ref": {"book": "cu", "page": 76, "ex": "4"}, "prompt": "Busca las palabras que riman.", "prompt_hu": "Keresd a rímelő szavakat!", "items": [{"q": "mar · cantar · sol · volar → ¿Qué palabra NO rima?", "q_hu": "Melyik szó NEM rímel a többivel?", "options": [{"t": "mar", "hu": "tenger"}, {"t": "cantar", "hu": "énekelni"}, {"t": "volar", "hu": "repülni"}, {"t": "sol", "hu": "nap"}], "answer": 3}, {"q": "luna · mano · pura · bruma → ¿Qué palabra NO rima?", "q_hu": "Melyik szó NEM rímel a többivel?", "options": [{"t": "luna", "hu": "hold"}, {"t": "bruma", "hu": "köd"}, {"t": "mano", "hu": "kéz"}, {"t": "pura", "hu": "tiszta"}], "answer": 2}, {"q": "¿Qué palabra rima con «estela»?", "q_hu": "Melyik szó rímel az „estela” (csík, nyom) szóra?", "options": [{"t": "vuela", "hu": "repül"}, {"t": "sueña", "hu": "álmodik"}, {"t": "quiere", "hu": "akar"}], "answer": 0}]}, {"id": "w3", "type": "fill", "ref": {"book": "cu", "page": 76, "ex": "6"}, "prompt": "Completa el poema.", "prompt_hu": "Egészítsd ki a verset!", "items": [{"t": "El río baja __", "options": ["cantando", "monte"], "answer": "cantando", "full": "El río baja cantando", "hu": "A folyó énekelve fut le", "pic": "🏞️"}, {"t": "por la ladera del __.", "options": ["horizonte", "monte"], "answer": "monte", "full": "por la ladera del monte.", "hu": "a hegy oldalán.", "pic": "⛰️"}, {"t": "busca el mar __", "options": ["brillando", "horizonte"], "answer": "brillando", "full": "busca el mar brillando", "hu": "csillogva keresi a tengert", "pic": "✨"}, {"t": "bajo el cielo del __.", "options": ["cantando", "horizonte"], "answer": "horizonte", "full": "bajo el cielo del horizonte.", "hu": "a látóhatár ege alatt.", "pic": "🌅"}]}, {"id": "w4", "type": "match", "ref": {"book": "cu", "page": 76, "ex": "7"}, "prompt": "Une los versos que riman entre sí.", "prompt_hu": "Kösd össze az egymással rímelő verssorokat!", "pairs": [{"a": "El río cruza la llanura, hasta llegar al ancho mar.", "a_hu": "A folyó átszeli a síkságot, amíg el nem éri a széles tengert.", "b": "Avanza con paso lento, con su lindo susurrar.", "b_hu": "Lassú léptekkel halad, szép csobogással."}, {"a": "El mapa marca el sendero, las montañas y el camino.", "a_hu": "A térkép jelöli az ösvényt, a hegyeket és az utat.", "b": "Bajo el cielo azul y sereno, guía al viajero amigo.", "b_hu": "A kék, derült ég alatt vezeti a barát utazót."}, {"a": "Cuando el mapa se despliega, el paisaje se revela.", "a_hu": "Amikor kinyílik a térkép, feltárul a táj.", "b": "Mares, ríos y lagos, montañas y cordilleras.", "b_hu": "Tengerek, folyók és tavak, hegyek és hegyláncok."}]}, {"id": "w5", "type": "tapwords", "ref": {"book": "cu", "page": 75, "ex": null}, "prompt": "Toca las palabras que riman con «dedica».", "prompt_hu": "Koppints a „dedica” szóval rímelő szavakra!", "sentence": "La pulga Federica a picar se dedica, la gente la critica.", "sentence_hu": "Federica, a bolha, csípéssel foglalkozik, az emberek kritizálják.", "targets": ["Federica", "dedica", "critica"]}, {"id": "w6", "type": "tapwords", "ref": {"book": "cu", "page": 75, "ex": "1"}, "prompt": "Toca las palabras que riman con «obligación».", "prompt_hu": "Koppints az „obligación” szóval rímelő szóra!", "sentence": "Porque es su obligación: la gente la critica, si pica porque pica, ¡qué falta de atención!", "sentence_hu": "Mert ez a kötelessége: az emberek kritizálják, ha csíp, hát csíp – micsoda figyelmetlenség!", "targets": ["obligación", "atención"]}, {"id": "w7", "type": "choice", "ref": {"book": "cu", "page": 75, "ex": "2"}, "prompt": "Cuenta los versos.", "prompt_hu": "Számold meg a verssorokat!", "items": [{"q": "Es pulga, es solo pulga, / y lo suyo es picar. / La maestra le dice: / —Pulga, te portas mal.", "q_hu": "Hány verssor van?", "options": [{"t": "5", "hu": "5"}, {"t": "3", "hu": "3"}, {"t": "4", "hu": "4"}], "answer": 2}, {"q": "Federica dio un salto, / se fue al mapa / y se metió en el mar.", "q_hu": "Hány verssor van?", "options": [{"t": "3", "hu": "3"}, {"t": "4", "hu": "4"}, {"t": "7", "hu": "7"}], "answer": 0}, {"q": "Total de versos del poema:", "q_hu": "Összesen hány verssor van?", "options": [{"t": "7", "hu": "7"}, {"t": "8", "hu": "8"}, {"t": "6", "hu": "6"}], "answer": 0}]}, {"id": "w8", "type": "truefalse", "ref": {"book": "sb", "page": 49, "ex": null}, "prompt": "¿Verdadero o falso?", "prompt_hu": "Igaz vagy hamis?", "items": [{"t": "Un verso es cada renglón de un poema.", "hu": "A verssor a vers egy sora.", "answer": true}, {"t": "En la rima igual solo coinciden las vocales.", "hu": "Teljes rímnél csak a magánhangzók egyeznek.", "answer": false}, {"t": "Para ver la rima miramos el final de los versos.", "hu": "A rímhez a sorok végét nézzük.", "answer": true}, {"t": "«clara» y «salta» tienen rima parecida.", "hu": "A „clara” és a „salta” hasonló rím.", "answer": true}, {"t": "Todos los versos de un poema tienen que rimar.", "hu": "Egy vers minden sorának rímelnie kell.", "answer": false}]}], "examples": [{"es": "El sol brilla y yo estoy en mi silla.", "hu": "Süt a nap, én a székemen ülök.", "ref": {"book": "sb", "page": 49, "ex": null}, "hl": ["brilla", "silla"], "pic": "☀️", "try": {"type": "choice", "q": "¿Qué rima es?", "q_hu": "Milyen rím ez?", "options": [{"t": "rima igual", "hu": "teljes rím"}, {"t": "rima parecida", "hu": "hasonló rím"}], "answer": 0}}, {"es": "La luna está clara y el niño salta.", "hu": "A hold világos, a fiú ugrál.", "ref": {"book": "sb", "page": 49, "ex": null}, "hl": ["clara", "salta"], "pic": "🌙", "try": {"type": "choice", "q": "¿Qué rima es?", "q_hu": "Milyen rím ez?", "options": [{"t": "rima igual", "hu": "teljes rím"}, {"t": "rima parecida", "hu": "hasonló rím"}], "answer": 1}}, {"es": "Sigo una huella de luz, cerca de un palo y su cruz.", "hu": "Egy fénynyomot követek, egy bot és a keresztje mellett.", "ref": {"book": "sb", "page": 49, "ex": null}, "hl": ["luz", "cruz"], "pic": "✝️", "try": null}, {"es": " veg részei.": [57.392, 2.566], "A dátum (fecha): megmondja, melyik napon jelent meg a hír. „2025. április 30.”": [60.258, 6.188], "A felfedezés után a hatóságok szakértőket hívtak, hogy megvizsgálják a helyet.": [66.746, 5.178], "A folyó átszeli a síkságot, amíg el nem éri a széles tengert.": [72.224, 4.214], "A folyó énekelve fut le": [76.738, 1.985], "A folyó énekelve fut le a hegyoldalon.": [79.023, 2.856], "A folyók a hegyekben erednek.": [82.18, 2.171], "A földgömb kerek, és helyesen mutatja a Földet.": [84.651, 3.204], "A földgömb kerek, és helyesen mutatja a Földet. – Ez a példaszöveg első bekezdése: a földgömbről és a térképekről szól.": [88.155, 7.999], "A földgömb kerek.": [96.454, 1.625], "A földgömbös szövegben az „Elképesztő!” ige nélküli mondat, a többi mondatban van ige.": [98.38, 5.921], "A főcím (titular): a hír címe, nagy betűkkel. „Új sziget bukkant fel a Csendes-óceánon.”": [104.601, 6.165], "A főcím a hír végén van.": [111.066, 2.252], "A hold világos, a fiú ugrál.": [113.618, 2.45], "A három pont (…) azt jelzi, hogy a gondolat befejezetlen marad, vagy izgalmat, meglepetést kelt.": [116.368, 5.584], "A három pont valójában két pont.": [122.252, 2.531], "A három pont…": [125.083, 1.834], "A hír": [127.217, 0.929], "A hír (noticia) olyan szöveg, amely valamiről tájékoztat, ami nemrég történt.": [128.446, 4.934], "A hír (szóban és írásban is) elmondja: mi történt, kivel, mikor és hol.": [133.68, 4.412], "A hír elmesél valamit, ami nemrég történt valahol.": [138.392, 3.437], "A hír elmondja, mi történt, kivel, mikor és hol.": [142.129, 3.216], "A hír melyik része ez?": [145.645, 1.95], "A hír melyik része?": [147.895, 1.625], "A hír olyasmiről szól, ami nagyon sok éve történt.": [149.821, 3.448], "A hír olyasmiről szól, ami nemrég történt.": [153.569, 3.088], "A hír szövege (cuerpo de la noticia): elmondja, mi történt, minden adattal.": [156.957, 5.016], "A hír valós eseményről szól, ami nemrég történt. Nem kitalált mese!": [162.273, 5.027], "A hír valós eseményről tájékoztat.": [167.6, 2.705], "A hír…": [170.605, 1.602], "A hó eltakarta az ösvényeket és a jelzéseket.": [172.507, 3.576], "A juguetería…": [176.383, 1.869], "A juguetito…": [178.552, 1.916], "A játékboltban játékokat árulnak.": [180.768, 2.74], "A kutya meg volt ijedve, és ide-oda futkosott.": [183.808, 2.995], "A kék, derült ég alatt vezeti a barát utazót.": [187.103, 3.158], "A kép (imagen): egy fotó, ami a hírhez tartozik. A szigetes hírnél egy hajó látható a tengeren.": [190.561, 6.536], "A költészet szép és érzelmes módja annak, hogy kifejezzük az érzéseinket. Az eredmény egy szöveg, amit versnek (poema) hívunk.": [197.397, 8.44], "A legjobban azt szeretem, hogy vásárról vásárra járok.": [206.138, 3.471], "A levél … szöveg.": [209.909, 2.125], "A mondat (enunciado) egy vagy több szó, amelynek önmagában teljes értelme van.": [212.334, 4.923], "A mondat (enunciado) lehet igés vagy ige nélküli. A beszélő szándéka szerint lehet kijelentő (állító vagy tagadó), kérdő vagy felkiáltó.": [217.556, 8.464], "A mondat elején és a pont után mindig nagybetűvel írunk.": [226.32, 3.936], "A mondat lehet kijelentő (állító vagy tagadó), kérdő vagy felkiáltó.": [230.556, 4.249], "A mondatok fajtái": [235.105, 1.567], "A mondatok fajtái · A szócsalád": [236.973, 2.09], "A nagyapám asztalos volt, és mindig szerettem a műhelye illatát.": [239.362, 4.168], "A nagyapám asztalos volt.": [243.83, 2.101], "A nagybetű (mayúscula) az a nagy betű, amit bizonyos szavak elején használunk.": [246.232, 4.818], "A panadera…": [251.35, 1.811], "A panadero és a panecillo egy családba tartozik.": [253.461, 3.471], "A parkban vagyunk!": [257.232, 1.533], "A parkban vagyunk! (felkiáltó)": [259.065, 2.798], "A parkban vagyunk.": [262.163, 1.567], "A parkban vagyunk?": [264.03, 1.486], "A parkban vagyunk? (kérdő)": [265.816, 2.403], "A pont azt jelzi, hogy egy mondat vagy egy szöveg véget ért.": [268.52, 3.855], "A pont háromféle lehet: punto y seguido, punto y aparte és punto final. Nagybetűt írunk a szöveg és a mondat elején, valamint a tulajdonnevekben. A három pont befejezetlen gondolatot vagy izgalmat jelez.": [272.674, 13.816], "A pont, a nagybetű és a három pont": [286.79, 2.496], "A punto y aparte ugyanannak a bekezdésnek a mondatait választja el.": [289.586, 4.83], "A punto y seguido a bekezdéseket választja el.": [294.716, 3.68], "A pékné egy zsemlét árul a pékségben.": [298.696, 2.856], "A pékné kenyeret árul a pékségben.": [301.852, 2.647], "A pékné süti a kenyeret.": [304.799, 1.95], "A rejtett barlangok": [307.05, 1.533], "A rím vizsgálatához a sorok végét nézzük, a leghangsúlyosabb szótagtól kezdve. cam-I-no → -ino.": [308.882, 5.642], "A rímhez a sorok végét nézzük.": [314.825, 2.322], "A sziget a Csendes-óceánon bukkant fel.": [317.447, 2.705], "A sziget egy vulkán műve.": [320.452, 1.927], "A sziget neve Szén-sziget.": [322.679, 1.939], "A sziget száz éve bukkant fel.": [324.918, 2.264], "A sziget talaja fehér.": [327.482, 1.858], "A szóbeli hír": [329.64, 1.3], "A szóbeli hír · A szöveg és a bekezdés · A mondatfajták": [331.24, 3.379], "A szócsalád": [334.918, 1.126], "A szócsalád olyan szavak csoportja, amelyek ugyanabból a szóból származnak.": [336.345, 4.307], "A szócsalád szavai ugyanabból a szóból származnak, és közös a tövük (raíz): pan → panadera, panadería, panecillo.": [340.952, 7.082], "A szócsaládot olyan szavak alkotják, amelyeknek közös a tövük.": [348.334, 4.017], "A szöveg csak írott lehet.": [352.651, 1.881], "A szöveg egy témáról szól. Az írott szöveg bekezdésekre tagolódik, minden bekezdés egy gondolat.": [354.832, 6.629], "A szöveg olyan szavak csoportja, amelyek egy témáról szólnak, és teljes értelmük van.": [361.761, 5.213], "A szöveg és a bekezdés": [367.274, 1.753], "A szövegek bekezdésekre oszlanak. Minden bekezdésben egy vagy több mondat van.": [369.327, 5.654], "A szövegnek teljes értelme van.": [375.281, 2.392], "A takarítók eltakarítják a havat, mert veszélyes bemenni az erdőbe.": [377.973, 4.249], "A talaja teljesen fekete kőzet, és még mindig füstoszlopok szállnak fel belőle.": [382.522, 4.772], "A tulajdonneveket nagybetűvel írjuk.": [387.594, 2.635], "A térkép jelöli az ösvényt, a hegyeket és az utat.": [390.529, 3.518], "A térképészek „kilapították” a világot, hogy térképeket készítsenek.": [394.347, 4.54], "A vers (poema) verssorokból (versos) áll. Egyes sorok rímelnek: a végük egyformán (rima igual) vagy hasonlóan (rima parecida) cseng.": [399.187, 7.964], "A vers sorait verssoroknak hívjuk. Két vagy több sor rímel, ha az utolsó szavuk egyformán végződik.": [407.451, 6.49], "A verssor a vers egy sora.": [414.241, 2.02], "A verssor és a rím": [416.561, 1.707], "A verssorok rímelnek, ha egyformán (teljes rím) vagy hasonlóan (hasonló rím) végződnek.": [418.568, 5.457], "A zárópont az egész szöveg végére kerül.": [424.324, 2.74], "A „2025. április 30.”…": [427.364, 2.659], "A „Gredos-hegységben” melyik kérdésre felel?": [430.323, 2.728], "A „Jó reggelt!” … mondat.": [433.351, 3.135], "A „Mi” pont után áll. Ezért…": [436.786, 3.239], "A „camino” szóban melyik szótag a leghangsúlyosabb?": [440.325, 3.03], "A „camino” és a „despido”…": [443.656, 1.823], "A „clara” és a „salta” hasonló rím.": [445.778, 2.403], "A „horizonte” mivel rímel?": [448.482, 1.858], "A „luz” mivel rímel?": [450.639, 1.544], "A „luz” és a „cruz”…": [452.483, 1.474], "A „mano” és a „prado”…": [454.258, 1.637], "A „marítimo” (tengeri) melyik családba tartozik?": [456.195, 2.937], "A „tesoro” és az „oro”…": [459.432, 1.683], "A „¿Cuándo?” arra kérdez, hogy…": [461.416, 3.39], "Afrika": [465.106, 1.126], "Akkor teljes, ha elmondja: mi történt, kivel történt, mikor és hol.": [466.532, 4.342], "Alakítsd át: „Mindenkinek jut paella.”": [471.174, 2.833], "Alatta nagy kincs van, sok aranypénzzel, és ennek az útnak a végén befejezem és elköszönök. – tesoro/oro: teljes rím (-oro), camino/despido: hasonló rím (-io).": [474.307, 10.937], "Alatta nagy kincs van, sok aranypénzzel.": [485.543, 2.74], "Alig néhány órája a tudósok megerősítették a felfedezést.": [488.583, 4.238], "Alig néhány órája.": [493.121, 1.718], "Amikor elmondod, sorban kell elmagyaráznod a legfontosabb adatokat.": [495.139, 4.47], "Amikor kinyílik a térkép, feltárul a táj.": [499.909, 3.042], "Attól függően, hogy mit akar az, aki mondja, a mondatoknak különböző fajtái (modalidades) vannak.": [503.251, 6.177], "Az Explorator hajó tudósaival.": [509.727, 2.531], "Az adatokat sorban kell elmondani.": [512.558, 2.392], "Az egész fejezet ismétlése: a hír, a szöveg és a bekezdés, a mondatfajták, a szócsalád, a pont és a nagybetű, valamint a rím.": [515.25, 8.429], "Az egész szöveg végére kerül a…": [523.979, 2.786], "Az első Svájc.": [527.065, 1.521], "Az ige nélküli mondatban van ige.": [528.886, 2.415], "Az igés mondatban van ige (Zulima lee). Az ige nélküliben nincs (¡Hasta mañana!).": [531.601, 4.934], "Az utat reggelre hó borította.": [536.835, 2.415], "Az írott hír friss, valós eseményről tájékoztat. Részei: főcím (titular), dátum (fecha), a hír szövege (cuerpo) és kép (imagen).": [539.55, 8.812], "Az írott hír részei: főcím, dátum, a hír szövege és kép.": [548.662, 4.342], "Az írott szöveg részei a…": [553.304, 2.519], "Az írott szövegek kisebb részekre tagolódnak: ezek a bekezdések.": [556.124, 4.4], "Az önkormányzat a következő napokra megtiltotta az út bejárását.": [560.824, 4.54], "Az önkormányzat lezárta az utat a felhalmozódott hó miatt.": [565.663, 3.82], "Az önkormányzat megtiltotta az út bejárását.": [569.783, 3.239], "Az út reggelre hó alá került.": [573.322, 2.577], "Az „A földgömb kerek” mondatban van ige: es. Ez egy … mondat.": [576.2, 5.224], "Az „Europa” utáni pont…": [581.724, 2.345], "Barlangokat fedeznek fel.": [584.369, 2.078], "Boldoggá tesz, hogy megmutathatom, amit készítek, és látom, hogy a gyerekek örülnek nekik.": [586.748, 5.41], "Csillogva keresi a tengert a látóhatár ege alatt.": [592.458, 3.32], "Csoportosítsd az egy családba tartozó szavakat!": [596.078, 2.995], "E": [599.374, 0.569], "Egy bekezdés nem keveri a témákat: Spanyolország domborzatának semmi köze egy elveszett kutyához. A munkafüzetben két összekevert bekezdést kell szétválogatni.": [600.242, 10.031], "Egy bekezdésben egy vagy több mondat van.": [610.574, 2.81], "Egy csapat túrázó barlangokat fedezett fel.": [613.683, 2.868], "Egy csapat túrázó ezen a hétvégén föld alatti barlangokat fedezett fel Rioverde falu közelében.": [616.851, 5.991], "Egy fénynyomot követek, egy bot és a keresztje mellett.": [623.142, 3.506], "Egy kutya elveszett a környékbeli parkban.": [626.948, 2.67], "Egy szócsalád szavainak közös a töve: pan → panadera, panadería, panecillo.": [629.918, 4.992], "Egy térkép van a kezemben, egy fénynyomot követek. Keresek a réten, egy bot és a keresztje mellett. – mano/prado: hasonló rím (-ao), luz/cruz: teljes rím (-uz).": [635.21, 10.971], "Egy vers minden sorának rímelnie kell.": [646.482, 2.705], "Egyes verssorok rímelnek: két vagy több sor utolsó hangjai egyformán vagy hasonlóan csengenek.": [649.487, 5.747], "Egészítsd ki a megfelelő kötőszóval!": [655.534, 2.635], "Egészítsd ki a mondatfajtának megfelelően!": [658.469, 3.135], "Egészítsd ki a verset!": [661.904, 1.939], "El kell mondani, kivel történt.": [664.143, 2.345], "Elképesztő!": [666.788, 1.393], "Eltűnt egy hajó.": [668.481, 1.451], "Ennek a fejezetnek a tankönyvi oldalait még nem fényképeztük le, ezért a Saberes básicos összefoglaló (46–50. old.) és a munkafüzet (71–78. old.) alapján készült. Martin megtanulja, hogyan mondjon el és írjon le egy hírt (mi, ki, mikor, hol), mi a szöveg, a bekezdés és a mondat, milyen mondatfajták vannak, mi a szócsalád és a szótő. A helyesírásban a pont fajtáival, a nagybetűvel és a három ponttal, az irodalomban pedig a verssorral és a rímmel ismerkedik.": [670.233, 31.161], "Európa": [701.694, 1.08], "Ez a második leghegyesebb ország.": [703.073, 2.403], "Ez is a varázsához tartozik.": [705.777, 2.287], "Ezeken a térképeken látszik, hogy északon hegyek vannak.": [708.364, 3.622], "Ezenkívül a szakértők jelentései megmutatják, mekkora természeti és földtani értékük van a barlangoknak.": [712.286, 6.583], "Ezért sok térképen Grönland majdnem akkorának látszik, mint Afrika. Pedig valójában tizennégyszer kisebb. Elképesztő! – Ez a második bekezdés.": [719.169, 10.449], "Ezért úgy döntöttem, lesz egy saját műhelyem.": [729.918, 2.984], "Ezért úgy döntöttem, lesz egy sajátom.": [733.202, 2.821], "Federica, a bolha, csípéssel foglalkozik, az emberek kritizálják.": [736.323, 4.47], "Federica, a bolha, csípéssel foglalkozik.": [741.093, 3.251], "Felbukkant egy sziget.": [744.644, 1.718], "Feljutottál a csúcsra?": [746.662, 1.73], "Felkiáltó mondat: érzelmet fejez ki (öröm, meglepetés, fájdalom). „A parkban vagyunk!” Az elején fordított felkiáltójel: ¡": [748.692, 8.649], "Felkiáltó:": [757.641, 1.312], "Fontos földtani értékű barlangokat fedeztek fel": [759.253, 3.506], "Fontos földtani értékű barlangokat fedeztek fel.": [763.059, 3.448], "Fáj? (kérdő)": [766.808, 1.741], "Grönland": [768.849, 1.022], "Grönland tizennégyszer kisebb Afrikánál.": [770.171, 2.844], "Hasonló rím (rima parecida): csak a magánhangzók egyeznek. clara – salta: a–a és a–a, de a mássalhangzók (r, lt) mások.": [773.315, 8.092], "Hasonló rímnél csak a magánhangzók egyeznek.": [781.707, 2.937], "Helyesírás": [784.945, 1.3], "Hivatalos: a világtérkép épp megváltozott.": [786.545, 2.961], "Hivatalos: a világtérkép épp megváltozott…": [789.805, 3.576], "Hogy hívják a költészet szövegét?": [793.681, 2.473], "Hogy hívnak?": [796.454, 1.219], "Hogy megértsük, domborzati térképeket használunk.": [797.973, 3.297], "Hogyan mondjunk el szóban egy hírt? Sorban elmondjuk a legfontosabbat: mi történt, kivel, mikor és hol.": [801.571, 6.583], "Hogyan mondunk el egy hírt?": [808.453, 1.881], "Hol NINCS hír?": [810.634, 1.242], "Hol NINCSENEK általában hírek?": [812.177, 2.218], "Hol bukkant fel a sziget?": [814.694, 1.881], "Hol keressük a rímet?": [816.875, 1.672], "Hol történt?": [818.847, 1.277], "Hol történt? – A hely: egy város, egy hegy, egy tenger…": [820.424, 4.644], "Hol van a Gombaút?": [825.368, 1.683], "Hol árulják a kenyeret?": [827.351, 1.823], "Hol?": [829.474, 0.755], "Holnapig!": [830.529, 1.091], "Holnapig! Viszlát holnap!": [831.92, 2.566], "Honnan származnak egy szócsalád szavai?": [834.786, 2.612], "Hány bekezdése van a szövegnek?": [837.698, 2.276], "Hány kérdésre felel egy teljes hír?": [840.274, 2.322], "Hány pontból áll a három pont?": [842.896, 2.159], "Hány verssor van?": [845.355, 1.533], "Hány zárópont van egy szövegben?": [847.188, 2.334], "Hányszor kisebb Grönland Afrikánál?": [849.821, 2.566], "Híreket találunk az újságokban, a rádióban, a tévében és az interneten.": [852.687, 5.201], "Húszévesen kezdtem kézművességgel foglalkozni.": [858.188, 3.425], "Igaz vagy hamis?": [861.913, 1.544], "Ige nélküli mondat (enunciado no oracional): nincs benne ige. Például: „Holnapig! / Viszlát holnap!”": [863.757, 7.523], "Igés mondat (enunciado oracional): van benne ige. Például: „Zulima minden nap olvas.” – az ige: lee (olvas).": [871.581, 8.243], "Igés mondat?": [880.124, 1.312], "Imádom!": [881.736, 1.103], "Irodalom": [883.139, 1.045], "Ismételd át a fejezetet!": [884.483, 2.09], "Ismétlés": [886.873, 1.138], "Ismétlés: Északtól délig": [888.311, 2.229], "Jegyezd meg: a fejezet legfontosabb szabályai egy helyen.": [890.84, 3.657], "Jegyezd meg: a hír négy kérdésre felel. Mondd el őket sorban!": [894.797, 4.748], "Jegyezd meg: a mondatok fajtái a beszélő szándéka szerint.": [899.846, 3.762], "Jegyezd meg: a pont fajtái, a nagybetű és a három pont.": [903.907, 3.982], "Jegyezd meg: a szöveg bekezdésekből áll, a bekezdés pedig mondatokból.": [908.19, 4.551], "Jegyezd meg: az írott hír részei.": [913.041, 2.682], "Jegyezd meg: egy szócsalád szavainak közös a töve (raíz).": [916.023, 3.855], "Jegyezd meg: teljes rím és hasonló rím. Mindig a sor végét nézd, a hangsúlyos magánhangzótól!": [920.177, 6.525], "Juguete (játék) a szótő: juguetero (játékkészítő), juguetería (játékbolt), juguetito (kis játék).": [927.002, 6.641], "Jut mindenkinek paella?": [933.943, 1.834], "Keresd a fajátékos standot… és ott megtalálsz!": [936.077, 3.855], "Keresd a rímelő szavakat!": [940.232, 1.916], "Keresd meg minden sorban a szavak tövét!": [942.447, 2.577], "Ki fedezte fel a barlangokat?": [945.325, 2.276], "Kijelentő, tagadó mondat: szintén tájékoztat, de tagad – van benne „no” (nem). „Nem vagyunk a parkban.”": [947.9, 6.699], "Kijelentő, tagadó:": [954.899, 1.602], "Kijelentő, állító mondat: információt ad. „A parkban vagyunk.”": [956.801, 4.992], "Kirándulni megyünk a hegyre.": [962.094, 1.927], "Kivel történt?": [964.321, 1.405], "Kivel történt? – Az emberek vagy állatok, akikről a hír szól.": [966.026, 4.563], "Kivel?": [970.889, 0.987], "Koppints a kérdőszavakra!": [972.175, 1.881], "Koppints a két rímelő szóra!": [974.356, 2.125], "Koppints a nagybetűvel kezdődő szavakra!": [976.781, 2.752], "Koppints a „dedica” szóval rímelő szavakra!": [979.832, 2.612], "Koppints a „pan” (kenyér) családjába tartozó szavakra!": [982.745, 3.088], "Koppints az igére!": [986.133, 1.498], "Koppints az „obligación” szóval rímelő szóra!": [987.931, 2.868], "Kérdő mondat: kérdez valamit. „A parkban vagyunk?” Spanyolul az elején fordított kérdőjel van: ¿": [991.098, 6.978], "Kérdő:": [998.376, 1.022], "Kösd össze az egymással rímelő verssorokat!": [999.698, 3.042], "Kötőszavakat használunk – porque (mert), por eso (ezért), debido a (miatt) –, hogy megmagyarázzuk, miért történik valami.": [1003.039, 7.535], "Lassú léptekkel halad, szép csobogással.": [1010.874, 3.042], "Lehet szóbeli (amikor beszélünk) vagy írott (amikor írunk).": [1014.216, 3.634], "Majdnem! Nézd meg a helyes választ.": [1018.15, 3.042], "Marina Olas tudós kifejezte a meghatottságát.": [1021.492, 3.181], "Marino (tengeri), marea (árapály) és marisco (tenger gyümölcse) a „mar” (tenger) családjába tartozik. Panadero (pék) és panecillo (zsemle) a „pan” (kenyér) családjába.": [1024.973, 9.555], "Melyik a legjobb főcím a barlangos hírhez?": [1034.828, 2.705], "Melyik a nagybetű?": [1037.833, 1.544], "Melyik a nagyobb?": [1039.677, 1.347], "Melyik az ige ebben a mondatban?": [1041.324, 1.997], "Melyik egy főcím?": [1043.621, 1.498], "Melyik kérdés hiányzik?": [1045.419, 1.881], "Melyik kérdés kérdez az eseményre?": [1047.599, 2.334], "Melyik kérdésre felel az adat?": [1050.233, 2.125], "Melyik pont választja el a bekezdéseket?": [1052.658, 2.81], "Melyik pont zár le egy bekezdést?": [1055.767, 2.264], "Melyik rész a leghosszabb?": [1058.331, 1.788], "Melyik rész ismétlődik?": [1060.419, 1.858], "Melyik részben vannak a legnagyobb betűk?": [1062.577, 2.624], "Melyik szó NEM rímel a többivel?": [1065.5, 2.438], "Melyik szó NEM tartozik a „mar” (tenger) családjába?": [1068.239, 3.239], "Melyik szó rímel a „dedica” szóra?": [1071.778, 2.276], "Melyik szó rímel a „silla” szóra?": [1074.353, 2.067], "Melyik szó rímel az „estela” (csík, nyom) szóra?": [1076.72, 2.868], "Melyik szó tartozik a „juguete” családjába?": [1079.888, 2.798], "Melyik szó tartozik a „río” (folyó) családjába?": [1082.986, 2.821], "Melyik szó teszi tagadóvá?": [1086.107, 1.962], "Melyik szót írjuk nagybetűvel?": [1088.369, 2.218], "Melyik témához tartozik a szó?": [1090.886, 2.299], "Melyik válasz mondja meg, hol?": [1093.485, 1.939], "Melyik válasz mondja meg, mikor?": [1095.724, 2.125], "Menj a körforgalomhoz.": [1098.149, 1.997], "Menj a körforgalomhoz. Hajts ki a második kijáraton, és haladj a jobb sávban a lámpáig. Utána fordulj jobbra, egészen a térig. Van egy ingyenes parkoló.": [1100.446, 10.716], "Menj a körforgalomhoz. Hajts ki a második kijáraton.": [1111.462, 4.063], "Mert ez a kötelessége: az emberek kritizálják, ha csíp, hát csíp – micsoda figyelmetlenség!": [1115.825, 5.793], "Mert ez a kötelessége… micsoda figyelmetlenség!": [1121.918, 3.773], "Mi a campo, campestre, campiña töve?": [1125.992, 2.601], "Mi a közös rész?": [1128.892, 1.463], "Mi a pékség, pékné, zsemle szavak töve?": [1130.655, 2.775], "Mi a szótő?": [1133.73, 1.324], "Mi a szöveg, és hogyan oszlik bekezdésekre? Minden bekezdés egy gondolatról szól, és egy vagy több mondatból áll.": [1135.354, 7.314], "Mi a szöveg?": [1142.968, 1.196], "Mi a verssor?": [1144.464, 1.277], "Mi a „frutería” töve?": [1146.041, 1.637], "Mi rímel?": [1147.978, 1.138], "Mi történt az úton?": [1149.416, 1.718], "Mi történt?": [1151.434, 1.289], "Mi történt? – Ez a hír legfontosabb kérdése: maga az esemény.": [1153.022, 4.667], "Mi végződik egyformán?": [1157.99, 1.881], "Mi?": [1160.171, 0.789], "Mi? Ki? Mikor? Hol?": [1161.26, 3.332], "Micsoda ütés! (felkiáltó)": [1164.892, 2.67], "Mikor fedezték fel a barlangokat?": [1167.862, 2.426], "Mikor történt az, amiről a hír szól?": [1170.589, 2.531], "Mikor történt?": [1173.42, 1.428], "Mikor történt? – Például: tegnap, ma reggel, ezen a hétvégén.": [1175.148, 4.609], "Mikor?": [1180.057, 1.01], "Milyen a földgömb?": [1181.367, 1.521], "Milyen gyönyörű táj!": [1183.188, 1.637], "Milyen jel van a végén?": [1185.125, 1.683], "Milyen jelek vannak a kérdés körül?": [1187.108, 2.322], "Milyen magas hegy!": [1189.73, 1.416], "Milyen mondat?": [1191.447, 1.242], "Milyen pont van az „Europa” után?": [1192.989, 2.194], "Milyen rím ez?": [1195.483, 1.289], "Milyen rím?": [1197.072, 1.103], "Milyen színű a talaj?": [1198.475, 1.707], "Milyen írásjel ez?": [1200.482, 1.66], "Mindegyikben van egy egyforma rész: a szótő (raíz). Ez segít megérteni a jelentésüket.": [1202.442, 5.933], "Minden bekezdés a szövegtől eltérő témáról szól.": [1208.675, 3.437], "Minden bekezdés általában egy gondolatról szól, ami a szöveg témájához kapcsolódik.": [1212.411, 5.248], "Minden bekezdés…": [1217.959, 2.194], "Mindenkinek jut paella!": [1220.453, 1.776], "Miről szól a szöveg?": [1222.53, 1.602], "Miről szól ez a bekezdés?": [1224.432, 1.985], "Mit csinál a hír?": [1226.717, 1.405], "Mit fedeztek fel?": [1228.422, 1.591], "Mit f  el.innerHTML=wHead(w,sid)+`<p class="pr">Koppints sorban: mi van először, mi utána?</p><ol class="pool" style="flex-direction:column;padding-left:24px" data-out></ol><div class="pool" style="flex-direction:column">${sh.map(x=>`<button class="tile" data-i="${x.i}" style="text-align:left">${esc(x.t)}${huOn&&x.hu?`<small style="display:block;font-weight:400;color:var(--muted)">${esc(x.hu)}</small>`:''}</button>`).join('')}</div><div class="res"></div>`;
 el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===pos){b.classList.add('used');const li=document.createElement('li');li.className='tile ok';li.textContent=items[i].t;el.querySelector('[data-out]').appendChild(li);sayEs(items[i].t);pos++;
  if(pos===items.length)wDone(el,w,sid,Math.max(0,items.length-err),items.length)}else{err++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600);praise(false)}})}
function wTF(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((it,i)=>`<div class="fillq" data-i="${i}"><span style="flex:1 1 260px"><b>${esc(it.t)}</b>${huOn&&it.hu?`<br><span class="hu">${esc(it.hu)}</span>`:''}</span><button class="abtn" data-s>🔊</button><button class="tile" data-v="1">✔ Verdadero</button><button class="tile" data-v="0">✘ Falso</button></div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('.fillq').forEach(q=>{const it=w.items[q.dataset.i];q.querySelector('[data-s]').onclick=()=>sayPair(it.t,it.hu);
  q.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(q.dataset.d)return;q.dataset.d=1;n++;const good=(b.dataset.v==='1')===!!it.answer;if(good)ok++;b.classList.add(good?'ok':'no');
   if(!good)q.querySelector(`[data-v="${it.answer?1:0}"]`).classList.add('ok');play([clip('es',it.answer?'Verdadero':'Falso')||null]);praise(good);if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
function wChoice(el,w,sid){let ok=0,n=0;
 el.innerHTML=wHead(w,sid)+w.items.map((c,i)=>`<div data-ci="${i}">${choiceHTML(c,'w'+i)}</div>`).join('')+'<div class="res"></div>';
 el.querySelectorAll('[data-ci]').forEach(d=>{const c=w.items[d.dataset.ci],root=d.querySelector('.check');
  root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>sayPair(c.q,c.q_hu));
  root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(root.dataset.done)return;root.dataset.done=1;n++;const i=+b.dataset.i,good=i===c.answer;if(good)ok++;
   b.classList.add(good?'ok':'no');if(!good)root.querySelectorAll('.opt')[c.answer].classList.add('ok');kitty(root.querySelector('.kit'),good);sayEs(c.options[c.answer].t);
   if(n===w.items.length)wDone(el,w,sid,ok,n)})})}
// ---------- példák
let egSec='all';
function rEg(V){const list=[];D.sections.forEach(s=>(s.examples||[]).forEach((e,i)=>{if(egSec==='all'||egSec===s.id)list.push({...e,sid:s.id,k:s.id+i})}));
 let h=`<div class="panel"><div class="filt"><select id="egS"><option value="all">Minden rész</option>${D.sections.map(s=>`<option value="${s.id}" ${egSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <button class="big l" id="egAll">🔊 Mind felolvasása</button></div><p class="hu" style="margin:0">Tipp: a magyar fordítás elmosva látszik – előbb próbáld kitalálni, aztán koppints rá!</p>`;
 list.forEach((e,i)=>{h+=`<div class="ex">${emo(e.pic,'e')}<div><div class="row" style="margin:0 0 4px">${pchip(e.ref)}</div><div class="es">${hlText(e.es,e.hl)}</div>${huOn?`<div class="hu hide" data-rv>${esc(e.hu)}</div>`:''}
  <div class="row"><button class="abtn" data-es="${i}">🔊 ES</button>${huOn?`<button class="abtn h" data-hu="${i}">🔊 HU</button>`:''}${e.try?`<button class="abtn" data-try="${i}">✏️ Te jössz!</button>`:''}</div><div data-tb="${i}"></div></div></div>`});
 V.innerHTML=h+'</div>';
 $('#egS').onchange=e=>{egSec=e.target.value;render()};$('#egAll').onclick=()=>{const L=[];list.forEach(e=>{L.push(clip('es',e.es));if(huOn)L.push(clip('hu',e.hu))});play(L)};
 V.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>b.classList.remove('hide'));
 V.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>sayEs(list[b.dataset.es].es));V.querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>sayHu(list[b.dataset.hu].hu));
 V.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{const i=b.dataset.try,t=list[i].try,box=V.querySelector(`[data-tb="${i}"]`);box.innerHTML=choiceHTML(t,'t'+i);bindChoice(box.querySelector('.check'),t)})}
// ---------- szótár
let wdSec='all',wdPos='all',wdQ='',game=null;
function rWd(V){const L=WORDS.filter(w=>(wdSec==='all'||w.sec===wdSec)&&(wdPos==='all'||w.pos===wdPos)&&(!wdQ||(w.w+' '+w.hu).toLowerCase().includes(wdQ.toLowerCase()))).sort((a,b)=>a.w.replace(/^(el|la|los|las) /,'').localeCompare(b.w.replace(/^(el|la|los|las) /,''),'es'));
 const kn=WORDS.filter(w=>ST.known[w.w]).length;
 let h=`<div class="panel"><div class="filt"><input id="wq" placeholder="🔍 Keresés…" value="${esc(wdQ)}"><select id="ws"><option value="all">Minden rész</option>${D.sections.map(s=>`<option value="${s.id}" ${wdSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="wp"><option value="all">Minden szófaj</option>${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${wdPos===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <p style="margin:0 0 8px"><b>${L.length}</b> szó · tudom: <b>${kn}</b> / ${WORDS.length}. Koppints a kártyára: megfordul és felolvassa. 👍 = tudom.</p>
 <div class="games"><button class="big" data-g="mem">🃏 Memória</button><button class="big" data-g="hear">👂 Hallás → kép</button><button class="big" data-g="build">🔡 Betűkirakó</button>${game?'<button class="big l" data-g="">✕ Vissza a kártyákhoz</button>':''}</div><div id="gm"></div>`;
 if(!game){h+=`<div class="wgrid">${L.map(w=>`<div class="wc ${ST.known[w.w]?'known':''}" data-w="${esc(w.w)}"><div class="in"><div class="fa">${emo(w.pic,'e')}<b>${esc(w.w)}</b><small><span class="pos">${POS[w.pos]||''}</span> · 📖 ${esc(w.page||'')}. o.</small></div>
  <div class="ba">${emo(w.pic,'e')}<b>${esc(w.hu)}</b><small>${esc(w.w)}</small><button class="abtn" data-k style="margin-top:6px">${ST.known[w.w]?'✅ tudom':'👍 tudom'}</button></div></div></div>`).join('')}</div>`}
 V.innerHTML=h+'</div>';
 $('#wq').oninput=e=>{wdQ=e.target.value;const p=e.target.selectionStart;render();const q=$('#wq');q.focus();q.setSelectionRange(p,p)};
 $('#ws').onchange=e=>{wdSec=e.target.value;render()};$('#wp').onchange=e=>{wdPos=e.target.value;render()};
 V.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{game=b.dataset.g||null;render();if(game)runGame(game,L.length>=4?L:WORDS)});
 V.querySelectorAll('.wc').forEach(c=>c.onclick=e=>{const w=WORDS.find(x=>x.w===c.dataset.w);if(e.target.closest('[data-k]')){ST.known[w.w]=!ST.known[w.w];save();if(ST.known[w.w])star(1);render();return}
  c.classList.toggle('f');if(c.classList.contains('f'))sayPair(w.w,w.hu);else sayEs(w.w)})}
function runGame(g,pool){const G=$('#gm');
 if(g==='mem'){const ws=shuffle(pool).slice(0,6);const cards=shuffle([...ws.map((w,i)=>({i,k:'es',w})),...ws.map((w,i)=>({i,k:'pic',w}))]);let open=[],done=0,tries=0;
  G.innerHTML=`<p>Keresd a párokat: a spanyol szó és a képe! <span class="kit" id="mk">🐱</span></p><div class="mem">${cards.map((c,j)=>`<button class="mc" data-j="${j}">?</button>`).join('')}</div>`;
  G.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const c=cards[b.dataset.j];if(b.classList.contains('open')||b.classList.contains('done')||open.length===2)return;b.classList.add('open');b.innerHTML=c.k==='es'?esc(c.w.w):emo(c.w.pic,'e');if(c.k==='es')sayEs(c.w.w);open.push([b,c]);
   if(open.length===2){tries++;const[a,bb]=open;if(a[1].i===bb[1].i&&a[1].k!==bb[1].k){a[0].classList.add('done');bb[0].classList.add('done');done++;open=[];kitty($('#mk'),true);sayPair(c.w.w,c.w.hu);if(done===ws.length){star(3);G.insertAdjacentHTML('beforeend',`<p class="res">🎉 Kész ${tries} próbálkozásból!</p>`)}}
    else setTimeout(()=>{a[0].classList.remove('open');bb[0].classList.remove('open');a[0].textContent='?';bb[0].textContent='?';open=[];kitty($('#mk'),false)},1100)}})}
 if(g==='hear'){let n=0,ok=0;const next=()=>{if(n===10){G.innerHTML=`<p class="res">Eredmény: ${ok} / 10 <span class="kit j">😺</span></p>`;star(Math.round(ok/3));return}
   const w=pool[Math.floor(Math.random()*pool.length)];const opts=shuffle([w,...shuffle(pool.filter(x=>x.w!==w.w&&x.pic!==w.pic)).slice(0,3)]);
   G.innerHTML=`<p class="q">👂 ${n+1}/10 – Melyik képet hallod? <button class="abtn" id="rep">🔊 Újra</button> <span class="kit" id="hk">🐱</span></p><div class="mem">${opts.map((o,i)=>`<button class="mc open" data-i="${i}">${emo(o.pic,'e')}</button>`).join('')}</div>`;
   sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);
   G.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const good=opts[b.dataset.i].w===w.w;n++;if(good)ok++;b.classList.add(good?'done':'no');kitty($('#hk'),good);sayPair(w.w,w.hu);setTimeout(next,1500)})};next()}
 if(g==='build'){const cand=pool.filter(w=>!/\s/.test(w.w.replace(/^(el|la|los|las|un|una) /,'')));let n=0,ok=0;
  const next=()=>{if(n===8||!cand.length){G.innerHTML=`<p class="res">Eredmény: ${ok} / ${n} <span class="kit j">😺</span></p>`;star(Math.round(ok/2));return}
   const w=cand[Math.floor(Math.random()*cand.length)],word=w.w.replace(/^(el|la|los|las|un|una) /,'');let got='';const letters=shuffle([...word]);
   G.innerHTML=`<p class="q">🔡 Rakd ki a szót! ${huOn?`(${esc(w.hu)})`:''} <button class="abtn" id="rep">🔊</button></p><div class="row">${emo(w.pic,'e')}<span class="es" id="got" style="font-size:30px;min-width:160px;border-bottom:3px solid var(--line)">&nbsp;</span></div><div class="pool">${letters.map((l,i)=>`<button class="tile" data-i="${i}" style="font-size:24px;min-width:48px">${esc(l)}</button>`).join('')}</div><button class="big l" id="clr">↺ Újrakezd</button>`;
   sayEs(w.w);$('#rep').onclick=()=>sayEs(w.w);$('#clr').onclick=()=>{got='';$('#got').innerHTML='&nbsp;';G.querySelectorAll('.tile').forEach(t=>t.classList.remove('used'))};
   G.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{got+=letters[b.dataset.i];b.classList.add('used');$('#got').textContent=got;
    if(got.length===word.length){n++;const good=got===word;if(good)ok++;$('#got').innerHTML=good?`✅ ${esc(word)}`:`❌ <s>${esc(got)}</s> → ${esc(word)}`;sayPair(w.w,w.hu);setTimeout(next,1800)}})};next()}}
// ---------- kvíz (véletlen, ≥50 lehetséges kérdés)
function quizPool(sec){const P=[];D.sections.forEach(s=>{if(sec!=='all'&&s.id!==sec)return;
 (s.cards||[]).forEach(c=>{if(c.check)P.push({...c.check,ref:c.ref,s:s.id})});
 (s.examples||[]).forEach(e=>{if(e.try)P.push({...e.try,ref:e.ref,s:s.id})});
 (s.widgets||[]).forEach(w=>{if(w.type==='choice')w.items.forEach(c=>P.push({...c,ref:w.ref,s:s.id}));
  if(w.type==='truefalse')w.items.forEach(it=>P.push({q:it.t,q_hu:it.hu,options:[{t:'Verdadero',hu:'Igaz'},{t:'Falso',hu:'Hamis'}],answer:it.answer?0:1,ref:w.ref,s:s.id}));
  if(w.type==='fill')w.items.forEach(it=>P.push({q:it.t.replace('__','_'),q_hu:it.hu,options:it.options.map(o=>({t:it.t.replace('__',o)})),answer:it.options.indexOf(it.answer),ref:w.ref,s:s.id,say:it.full}));
  if(w.type==='match')w.pairs.forEach((p,i)=>{const o=shuffle(w.pairs.filter((x,j)=>j!==i)).slice(0,2).map(x=>({t:x.b,hu:x.b_hu}));const opts=shuffle([{t:p.b,hu:p.b_hu},...o]);P.push({q:`${p.a} → ?`,q_hu:w.prompt_hu,options:opts,answer:opts.findIndex(x=>x.t===p.b),ref:w.ref,s:s.id})});
  if(w.type==='sort')w.items.forEach(it=>{const opts=w.bins.map(b=>({t:b.es,hu:b.hu}));P.push({q:`${it.t}: ¿${w.bins.map(b=>b.es).join(' o ')}?`,q_hu:it.hu,options:opts,answer:w.bins.findIndex(b=>b.id===it.bin),ref:w.ref,s:s.id})})});
 (s.words||[]).forEach(wd=>{const others=shuffle(WORDS.filter(x=>x.w!==wd.w&&x.hu!==wd.hu)).slice(0,3);
  let o=shuffle([wd,...others]);P.push({q:`¿Qué significa «${wd.w}»?`,q_hu:'Mit jelent?',options:o.map(x=>({t:x.hu})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1});
  o=shuffle([wd,...others]);P.push({q:`«${wd.hu}» – ¿en español?`,q_hu:'Hogy mondják spanyolul?',options:o.map(x=>({t:x.w})),answer:o.indexOf(wd),ref:{book:'tb',page:wd.page},s:s.id,say:wd.w,nohu:1})})});
 return P.filter(q=>q.options&&q.answer>=0&&q.answer<q.options.length)}
let QZ=null,qzSec='all';
function rQz(V){const pool=quizPool(qzSec);
 let h=`<div class="panel"><div class="filt"><select id="qs"><option value="all">Az egész fejezet</option>${D.sections.map(s=>`<option value="${s.id}" ${qzSec===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
 <select id="qn">${[10,20,30,50,100].map(n=>`<option ${n===20?'selected':''}>${n}</option>`).join('')}</select><button class="big g" id="qgo">▶ Indítás</button></div><p class="hu" style="margin:0">${pool.length} különböző kérdés közül véletlenszerűen.</p><div id="qb"></div></div>`;
 V.innerHTML=h;$('#qs').onchange=e=>{qzSec=e.target.value;QZ=null;render()};
 $('#qgo').onclick=()=>{const n=+$('#qn').value;const qs=[];for(let i=0;i<n;i++)qs.push(pool[Math.floor(Math.random()*pool.length)]);QZ={qs,i:0,ok:0};qShow()};
 if(QZ)qShow()}
function qShow(){const B=$('#qb');if(!B)return;if(QZ.i>=QZ.qs.length){B.innerHTML=`<p class="res" style="font-size:22px"><span class="kit j">😺</span> Kész! ${QZ.ok} / ${QZ.qs.length}</p>`;star(Math.round(QZ.ok/4));QZ=null;return}
 const q=QZ.qs[QZ.i];const opts=q.options;
 B.innerHTML=`<p style="font-weight:800">${QZ.i+1}. / ${QZ.qs.length} · jó: ${QZ.ok} ${pchip(q.ref)}</p><div class="check" style="border:0"><div class="q" style="font-size:21px">${esc(q.q)} <button class="abtn" data-r>🔊</button></div>${huOn&&q.q_hu?`<div class="hu">${esc(q.q_hu)}</div>`:''}
 <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}${huOn&&o.hu&&!q.nohu?`<small>${esc(o.hu)}</small>`:''}</button>`).join('')}</div><div class="res"><span class="kit">🐱</span></div></div>`;
 const rd=()=>q.say?sayEs(q.say):sayPair(q.q,q.q_hu);B.querySelector('[data-r]').onclick=rd;rd();
 B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(B.dataset.lock)return;B.dataset.lock=1;const i=+b.dataset.i,ok=i===q.answer;if(ok)QZ.ok++;b.classList.add(ok?'ok':'no');B.querySelectorAll('.opt')[q.answer].classList.add('ok');
  kitty(B.querySelector('.kit'),ok);const r=opts[q.answer];play([q.say?clip('es',q.say):null,/[áéíóúñ¿¡]|^[a-z]/i.test(r.t)&&!q.nohu?clip('es',r.t):null,huOn&&q.nohu?clip('hu',q.q_hu.includes('spanyolul')?'':r.t):null]);
  setTimeout(()=>{delete B.dataset.lock;QZ.i++;qShow()},ok?1600:2600)})}
// ---------- indítás
$('#hnum').textContent=D.unit.num;$('#htitle').textContent=D.unit.title;
$('#hsub').textContent=[D.unit.title_hu||'',D.unit.pages_tb?'Tankönyv '+D.unit.pages_tb:'',D.unit.pages_cu?'Munkafüzet '+D.unit.pages_cu:'',D.unit.pages_sb?'Saberes básicos '+D.unit.pages_sb:''].filter(Boolean).join(' · ');$('#stars').textContent='⭐ '+ST.stars;
const hs=location.hash.slice(1);if(['ov','ex','eg','wd','qz'].includes(hs))tab=hs;render();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
</script>
</body>
