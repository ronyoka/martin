e cx=\"40.71\" cy=\"27.34\" rx=\"5.16\" ry=\"3.48\" transform=\"translate(-7.41 36.79) rotate(-45)\" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" stroke-width=\"2\"/><ellipse cx=\"40.71\" cy=\"35.48\" rx=\"5.16\" ry=\"3.48\" transform=\"translate(-13.16 39.18) rotate(-45)\" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" stroke-width=\"2\"/><ellipse cx=\"40.71\" cy=\"43.62\" rx=\"5.16\" ry=\"3.48\" transform=\"translate(-18.92 41.56) rotate(-45)\" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" stroke-width=\"2\"/><ellipse cx=\"40.71\" cy=\"51.76\" rx=\"5.16\" ry=\"3.48\" transform=\"translate(-24.68 43.95) rotate(-45)\" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" stroke-width=\"2\"/></g></svg>", "✋": "<svg viewBox=\"0 0 72 72\" xmlns=\"http://www.w3.org/2000/svg\"><g/><g/><g><path fill=\"#fcea2b\" stroke=\"none\" d=\"M30.61,13.73c0.28-1.92-1.04-3.72-2.97-4.00s-3.72,1.04-4.00,2.97 c-0.04,0.30-0.04,0.62-0.01,0.93L23.35,32.64l0.02,4.32l0.17-12.99 c0.28-1.92-1.04-3.72-2.97-4.00s-3.72,1.04-4.00,2.97c-0.04,0.30-0.04,0.62-0.01,0.93 l-0.17,12.99l0.05,10.08c0.42,8.31,7.75,13.62,16.06,13.20c4.79-0.26,9.32-2.27,12.72-5.65 c2.91-3.09,10.08-11.53,10.08-11.53c1.46-2.15,0.32-5.49-0.80-4.67l-9.87,4.65l-0.03-5.39 l0.03,5.39l-0.03-5.39l0.03-21.85c0.28-1.92-1.04-3.72-2.97-4.00s-3.72,1.04-4.00,2.97 c-0.04,0.30-0.04,0.62-0.01,0.93l-0.09,6.99l-0.18,10.63l0.36-22.19 c0.28-1.92-1.04-3.72-2.97-4.00c-1.92-0.28-3.72,1.04-4.00,2.97c-0.04,0.30-0.04,0.62-0.01,0.93 l-0.20,24.01\"/></g><g/><g><path fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M30.61,13.73 c0.28-1.92-1.04-3.72-2.97-4.00s-3.72,1.04-4.00,2.97c-0.04,0.30-0.04,0.62-0.01,0.93 L23.35,32.64l0.00,0.95l0.19-9.62c0.28-1.92-1.04-3.72-2.97-4.00s-3.72,1.04-4.00,2.97 c-0.04,0.30-0.04,0.62-0.01,0.93l-0.17,12.99l0.05,10.08c0.42,8.31,7.75,13.62,16.06,13.20 c4.79-0.26,9.32-2.27,12.72-5.65c2.91-3.09,10.08-11.53,10.08-11.53 c1.46-2.15,0.32-5.49-0.80-4.67l-9.87,4.65l-0.03-5.39l0.03,5.39l-0.03-5.39l0.03-21.85 c0.28-1.92-1.04-3.72-2.97-4.00s-3.72,1.04-4.00,2.97c-0.04,0.30-0.04,0.62-0.01,0.93 l-0.09,6.99l-0.18,10.63l0.36-22.19c0.28-1.92-1.04-3.72-2.97-4.00 c-1.92-0.28-3.72,1.04-4.00,2.97c-0.04,0.30-0.04,0.62-0.01,0.93l-0.17,20.45\"/></g></svg>"}, "pages": {"tb54": {"title": "Un día en el huerto", "title_hu": "Egy nap a veteményesben", "summary_hu": "Fejezetnyitó oldal. Andrea iskolájában büszkék a veteményeskertjükre: a néhány hete elvetett növények meghozták az első termést, és meghívják a családokat, hogy megmutassák a kertet. A kérdés: milyen munkákat végeznek a gyerekek a veteményesben?", "tasks": [{"n": "1", "text": "¿Qué tareas realiza el alumnado en el huerto? ¿Qué plantarías en el huerto de tu cole y cómo explicarías lo que se hace en él?", "text_hu": "Milyen munkákat végeznek a tanulók a veteményesben? Mit ültetnél az iskolád veteményesébe, és hogyan magyaráznád el, mit csinálnak ott?"}], "section": "inicio"}, "tb55": {"title": "¿Qué vamos a aprender?", "title_hu": "Mit fogunk tanulni?", "summary_hu": "Fényképek a veteményesről (gyerekek kosarakkal, egy kislány öntöz, egy madárijesztő) és a fejezet tartalma: elbeszélés saját élményről, melléknév, rokon értelmű szavak, c/z/s, irodalmi elbeszélés, képeslap.", "tasks": [{"n": "aprender", "text": "¿Qué vamos a aprender? (la lista de la página)", "text_hu": "Mit fogunk tanulni? (az oldalon lévő lista)"}], "section": "inicio"}, "tb56": {"title": "Actívate", "title_hu": "Hangolódj rá!", "summary_hu": "Ráhangoló feladatok a fejezet témáiról: mellékneveket keresni, egyeztetni a főnevet és melléknevet, rokon értelmű szó közül kiválasztani a kakukktojást, c/z/s betűt pótolni, és eldönteni, hogy egy szövegrészlet mesekezdet vagy mesevég. Alul a „belépőjegy”: önértékelés.", "tasks": [{"n": "1", "text": "ENCUENTRA los adjetivos que aparecen en esta lista de palabras.", "text_hu": "KERESD MEG a mellékneveket ebben a szólistában."}, {"n": "2", "text": "ELIGE la opción adecuada para crear un enunciado. La (planta / plantas) (verde / verdes) creció con fuerza.", "text_hu": "VÁLASSZ a helyes lehetőséget, hogy mondat legyen belőle. La (planta / plantas) (verde / verdes) creció con fuerza."}, {"n": "3", "text": "BUSCA el intruso. ¿Cuál no es un sinónimo de comer?", "text_hu": "KERESD MEG a kakukktojást. Melyik nem rokon értelmű az „enni” (comer) szóval?"}, {"n": "4", "text": "INDICA si los huecos del enunciado se completan con c, z o s. El jardín de A.....u.....ena es muy hermo.....o.", "text_hu": "JELÖLD, hogy a mondat hézagait c-vel, z-vel vagy s-sel kell kitölteni. El jardín de A.....u.....ena es muy hermo.....o."}, {"n": "5", "text": "CONTESTA. ¿Crees que este texto es una parte del inicio o del final de un cuento? EXPLICA tu respuesta.", "text_hu": "VÁLASZOLJ. Szerinted ez a szöveg a mese kezdetének vagy végének része? MAGYARÁZD MEG a válaszodat."}, {"n": "ticket", "text": "TICKET DE ENTRADA: LEE cada enunciado y DI si crees que sabes mucho, poco o nada.", "text_hu": "BELÉPŐJEGY: OLVASD el az egyes mondatokat, és mondd meg, szerinted sokat, keveset vagy semmit tudsz róla."}], "section": "inicio"}, "tb57": {"title": "La narración de experiencias personales", "title_hu": "Saját élmények elmesélése", "summary_hu": "Szóbeli kommunikáció: saját élményt elmesélni azt jelenti, hogy elmondod, mi történt és hogyan érezted magad, rendezett sorrendben (először, aztán, végül). Meghallgatsz egy lány (Sofía) elbeszélését és kérdésekre válaszolsz, majd te is elmeséled egy különleges élményedet.", "tasks": [{"n": "1", "text": "ESCUCHA la narración. RESPONDE a estas preguntas.", "text_hu": "HALLGASD MEG az elbeszélést. VÁLASZOLJ ezekre a kérdésekre."}, {"n": "2", "text": "NARRA una historia que hayas vivido y que sea especial para ti. PIENSA, HAZ que tu narración responda a las preguntas, DESCRIBE y COMPARTE.", "text_hu": "MESÉLJ el egy történetet, amit átéltél, és ami különleges számodra. GONDOLKODJ, a történeted feleljen a kérdésekre, ÍRD LE és OSZD MEG."}], "section": "experiencia"}, "tb58": {"title": "Plantas para todo", "title_hu": "Növények mindenre", "summary_hu": "Olvasmány (ismeretterjesztő szöveg): sokféle növény van (magas fák, apró virágok, száraz helyen élő kaktuszok, nedvességet kedvelő páfrányok). A botanikus kert olyan hely, ahol a növényeket védik, kutatják és bemutatják; a növények rendezettek és névtáblával ellátottak, és botanikusok dolgoznak ott.", "tasks": [{"n": "antes", "text": "Antes de leer: ¿Alguna vez has estado en un jardín botánico? ¿Sabes qué puedes encontrar allí? Descúbrelo con este texto.", "text_hu": "Olvasás előtt: Voltál már botanikus kertben? Tudod, mit találhatsz ott? Fedezd fel ezzel a szöveggel."}], "section": "lectura"}, "tb59": {"title": "Tipos de plantas del jardín botánico", "title_hu": "A botanikus kert növénytípusai", "summary_hu": "Az olvasmány folytatása: a botanikus kertben hatalmas fákat, élénk virágokat, gyógynövényeket és sok más fajt látunk. Három csoport: dísznövények (rózsa, azálea, orchidea, tulipán), gyógy- és fűszernövények (kamilla, citromfű, gyömbér; rozmaring, kakukkfű) és élelmezési növények (kukorica, paradicsom, kakaó).", "tasks": [{"n": "fijate", "text": "Fíjate en los tres cuadros de la página y relaciona cada planta con su tipo. (En el libro no hay ejercicio en esta página: son preguntas de comprobación.)", "text_hu": "Nézd meg az oldal három dobozát, és párosítsd mindegyik növényt a típusával. (A könyvben ezen az oldalon nincs feladat: ezek ellenőrző kérdések.)"}], "section": "lectura"}, "tb60": {"title": "Comprendo lo que leo (1–7)", "title_hu": "Értem, amit olvasok (1–7)", "summary_hu": "Szövegértési feladatok a botanikus kertről: a szöveg célja, mit csinálnak a botanikusok, öt növényfaj megnevezése, a példák besorolása (élelmezési, dísz-, gyógynövény), melyik kép dísznövény, a „reproducen” szó jelentése és mire utal az „ellas” (ők).", "tasks": [{"n": "1", "text": "INDICA cuál es el propósito de este texto.", "text_hu": "JELÖLD, mi ennek a szövegnek a célja."}, {"n": "2", "text": "EXPLICA. ¿Qué hacen las personas que trabajan en un jardín botánico?", "text_hu": "MAGYARÁZD EL. Mit csinálnak azok, akik botanikus kertben dolgoznak?"}, {"n": "3", "text": "NOMBRA cinco especies de plantas que se mencionan en el texto.", "text_hu": "NEVEZZ MEG öt növényfajt, amit a szöveg említ."}, {"n": "4", "text": "INDICA el tipo de planta al que corresponde cada ejemplo. (alimenticias, ornamentales, medicinales)", "text_hu": "JELÖLD, melyik növénytípushoz tartozik az egyes példa. (élelmezési, dísz-, gyógynövény)"}, {"n": "5", "text": "RESPONDE. ¿Cuál de estas es una planta ornamental?", "text_hu": "VÁLASZOLJ. Melyik ezek közül a dísznövény?"}, {"n": "6", "text": "ESCOGE. La palabra reproducen en «investigan cómo crecen las plantas y cómo se reproducen» se refiere a…", "text_hu": "VÁLASSZ. A „reproducen” szó az „investigan cómo crecen las plantas y cómo se reproducen” mondatban arra utal, hogy…"}, {"n": "7", "text": "CONTESTA. ¿De quién o qué habla el texto cuando dice «De ellas obtenemos frutas, verduras…»?", "text_hu": "VÁLASZOLJ. Kiről vagy miről beszél a szöveg, amikor ezt írja: „De ellas obtenemos frutas, verduras…”?"}], "section": "lectura"}, "tb61": {"title": "Comprendo lo que leo (8–14)", "title_hu": "Értem, amit olvasok (8–14)", "summary_hu": "Folytatódó szövegértési feladatok: a botanikus kert és a park különbsége (két fotó), miért hasonlítják a gyógynövényeket természetes elsősegélydobozhoz, illatos növény besorolása, zöldséges lasagne receptje (ehető növények és fűszerek), igaz/hamis állítások, saját botanikus kert tervezése és a szöveg értékelése.", "tasks": [{"n": "8", "text": "ESCRIBE qué diferencias hay entre un jardín botánico y un parque.", "text_hu": "ÍRD LE, milyen különbségek vannak a botanikus kert és a park között."}, {"n": "9", "text": "EXPLICA. ¿Por qué crees que se comparan las plantas medicinales con un botiquín natural?", "text_hu": "MAGYARÁZD EL. Szerinted miért hasonlítják a gyógynövényeket természetes elsősegélydobozhoz?"}, {"n": "10", "text": "CONTESTA. Si encuentras una planta que huele muy bien, ¿a qué grupo crees que pertenecerá?", "text_hu": "VÁLASZOLJ. Ha találsz egy nagyon jó illatú növényt, melyik csoportba tartozhat szerinted?"}, {"n": "11", "text": "LEE los ingredientes de esta receta. INDICA las plantas comestibles y las especias que se emplean.", "text_hu": "OLVASD el ennek a receptnek a hozzávalóit. JELÖLD, melyek az ehető növények és a használt fűszerek."}, {"n": "12", "text": "ESCRIBE si estas afirmaciones son verdaderas o falsas.", "text_hu": "ÍRD LE, hogy ezek az állítások igazak vagy hamisak."}, {"n": "13", "text": "DISEÑA un pequeño jardín botánico con tres plantas diferentes. ESCRIBE el nombre de cada planta, su clase y su uso.", "text_hu": "TERVEZZ egy kis botanikus kertet három különböző növénnyel. ÍRD LE az egyes növények nevét, fajtáját és használatát."}, {"n": "14", "text": "RESPONDE. ¿El texto cumple con su propósito de informar? ¿Añadirías o quitarías alguna parte?", "text_hu": "VÁLASZOLJ. A szöveg teljesíti a tájékoztatási célját? Hozzátennél vagy elhagynál valamilyen részt?"}], "section": "lectura"}, "tb62": {"title": "El adjetivo", "title_hu": "A melléknév", "summary_hu": "Nyelvtan: a melléknév (adjetivo) a főnév mellett áll, és megmondja, milyen vagy hogyan van egy személy, állat vagy dolog (una rosa roja). Általában a főnév után áll (una casa grande), néha előtte (un hermoso paisaje). Három feladat: a kiemelt szavak szerepe, melléknév és információtípus párosítása, két tárgy leírása.", "tasks": [{"n": "1", "text": "ELIGE. ¿Para qué sirven las palabras destacadas? Ana es morena y alta. (Para describir a Ana. / Para decir lo que hace Ana.)", "text_hu": "VÁLASSZ. Mire valók a kiemelt szavak? Ana es morena y alta. (Ana leírására. / Annak megmondására, mit csinál Ana.)"}, {"n": "2", "text": "HAZ parejas que estén formadas por un adjetivo y el tipo de información que da. (azul, forma, triangular, tamaño, enorme, color, dulce, sabor)", "text_hu": "ALKOSS párokat: egy melléknév és az az információtípus, amit megad. (azul, forma, triangular, tamaño, enorme, color, dulce, sabor)"}, {"n": "3", "text": "DESCRIBE estos elementos con al menos dos adjetivos. (A: una regadera, B: unas botas)", "text_hu": "ÍRD LE ezeket a tárgyakat legalább két melléknévvel. (A: öntözőkanna, B: csizma)"}], "section": "adjetivo"}, "tb63": {"title": "El género y número de los adjetivos", "title_hu": "A melléknevek neme és száma", "summary_hu": "A melléknév ugyanolyan nemű (hímnem/nőnem) és számú (egyes/többes) mint a főnév, amelyhez tartozik (juego divertido – juegos divertidos; silla baja – sillas bajas). A csillagos feladat és a 4–7. feladatok: melléknevek keresése, főnévhez illő melléknév, nem és szám változtatása.", "tasks": [{"n": "rodea", "text": "RODEA los adjetivos y SUBRAYA los nombres a los que acompañan. (La calabaza es grande y naranja. / Tiene una enorme hoja verde. / Sobre la hoja hay una mariquita pequeña y roja. / Unos insectos diminutos vuelan por el jardín.)", "text_hu": "KARIKÁZD be a mellékneveket és HÚZD ALÁ a főneveket, amelyekhez tartoznak. (A tök nagy és narancssárga. / Van egy hatalmas zöld levele. / A levélen egy kicsi és piros katicabogár van. / Apró rovarok repkednek a kertben.)"}, {"n": "4", "text": "COPIA los grupos de palabras. ESCRIBE los nombres en color rojo, los determinantes en azul y los adjetivos en verde.", "text_hu": "MÁSOLD LE a szócsoportokat. ÍRD a főneveket pirossal, a határozókat kékkel és a mellékneveket zölddel."}, {"n": "5", "text": "ESCOGE un nombre adecuado para cada adjetivo. (libros / luna / ardillas)", "text_hu": "VÁLASSZ megfelelő főnevet az egyes melléknevekhez. (libros / luna / ardillas)"}, {"n": "6", "text": "CAMBIA el género y el número de los adjetivos que se indican para que concuerden con el nombre. (los pétalos (rojo), las macetas (negro), las moras (silvestre), los libros (pesado))", "text_hu": "VÁLTOZTASD MEG a megadott melléknevek nemét és számát, hogy egyezzenek a főnévvel. (los pétalos (rojo), las macetas (negro), las moras (silvestre), los libros (pesado))"}, {"n": "7", "text": "ESCRIBE tres adjetivos para cada nombre. (lechugas, pájaros, huerto, manzana)", "text_hu": "ÍRJ három melléknevet az egyes főnevekhez. (lechugas, pájaros, huerto, manzana)"}], "section": "adjetivo"}, "tb64": {"title": "Los sinónimos", "title_hu": "A rokon értelmű szavak", "summary_hu": "Szókincs: a rokon értelmű szavak (sinónimos) jelentése azonos vagy hasonló, így ugyanazt mondhatjuk más szavakkal (caminar = andar; coche = vehículo = automóvil). Öt feladat: szinonima választása, írása, két tárgy kétféle neve, kiemelt szavak cseréje és egy iskolai nap leírása szinonimákkal.", "tasks": [{"n": "1", "text": "ELIGE un sinónimo de estas palabras. antiguo (moderno / viejo), atrevida (valiente / tímida)", "text_hu": "VÁLASSZ rokon értelmű szót ezekhez. antiguo (moderno / viejo), atrevida (valiente / tímida)"}, {"n": "2", "text": "ESCRIBE un sinónimo para estas palabras. sencillo, vencedor, empapado, florecer, alegre, sembrar", "text_hu": "ÍRJ rokon értelmű szót ezekhez a szavakhoz. sencillo, vencedor, empapado, florecer, alegre, sembrar"}, {"n": "3", "text": "DESCUBRID en grupo dos formas de llamar a cada objeto. (A: un barco de vela, B: una maceta)", "text_hu": "FEDEZZETEK FEL csoportban két nevet minden tárgyra. (A: vitorlás hajó, B: virágcserép)"}, {"n": "4", "text": "SUSTITUYE las palabras destacadas por sinónimos. Edu colabora en el jardín regando las plantas. / El jardinero terminó de podar el árbol. / Llenamos el cesto de deliciosas moras.", "text_hu": "HELYETTESÍTSD a kiemelt szavakat rokon értelmű szavakkal. Edu colabora en el jardín regando las plantas. / El jardinero terminó de podar el árbol. / Llenamos el cesto de deliciosas moras."}, {"n": "5", "text": "PIENSA en un día cualquiera en tu colegio. DESCRÍBELO utilizando sinónimos de estas palabras. (divertido, dibujar, jugar, hermoso, maestra)", "text_hu": "GONDOLJ egy átlagos napra az iskolában. ÍRD LE rokon értelmű szavak használatával. (divertido, dibujar, jugar, hermoso, maestra)"}], "section": "sinonimos"}, "tb65": {"title": "Las palabras con c, con z y con s", "title_hu": "Szavak c-vel, z-vel és s-sel", "summary_hu": "Helyesírás: a spanyol z hangot c-vel írjuk e, i előtt (quince, ciruelo), z-vel a, o, u előtt (zanahoria, Lorenzo, zueco). Szabályok: z-vel írjuk az -azo/-aza végű szavakat és az -ez/-eza végű főneveket; s-sel az -oso/-osa végű mellékneveket és az -esto/-esta/-ista végű szavakat. Három gyakorlat.", "tasks": [{"n": "1", "text": "COMPLETA en tu cuaderno con c o z y EXPLICA por qué has usado cada uno. ….ielo, ….ebolla, do….ena, an….uelo, cora….ón, ….anahoria", "text_hu": "EGÉSZÍTSD KI a füzetedben c-vel vagy z-vel, és MAGYARÁZD MEG, miért azt használtad. ….ielo, ….ebolla, do….ena, an….uelo, cora….ón, ….anahoria"}, {"n": "2", "text": "ESCRIBE tres palabras que terminen en -oso u -osa. Después, CREA una oración para cada una.", "text_hu": "ÍRJ három szót, amelyek -oso vagy -osa végűek. Utána ALKOSS mondatot mindegyikkel."}, {"n": "3", "text": "ENCUENTRA en la imagen palabras que contengan el sonido Z.", "text_hu": "KERESS a képen olyan szavakat, amelyekben a Z hang van."}], "section": "czs"}, "tb66": {"title": "Practicamos (adjetivo, sinónimos)", "title_hu": "Gyakorlunk (melléknév, rokon értelmű szavak)", "summary_hu": "Gyakorló feladatok: melléknevek nemének és számának meghatározása táblázatban, egy szöveg melléknevei ellenkezőjére cserélve (egy teljesen más kert leírása), a virág szirmainak rokon értelmű párokba rendezése és egy történet kitalálása, valamint dikta.", "tasks": [{"n": "1", "text": "COMPLETA esta tabla con el género y número de los adjetivos. preciosos, simpática, rápido, lentas", "text_hu": "EGÉSZÍTSD KI ezt a táblázatot a melléknevek nemével és számával. preciosos, simpática, rápido, lentas"}, {"n": "2", "text": "TRANSFORMA los adjetivos del texto para que el resultado sea la descripción de un jardín totalmente distinto.", "text_hu": "ALAKÍTSD ÁT a szöveg mellékneveit úgy, hogy egy teljesen más kert leírása legyen belőle."}, {"n": "3", "text": "RELACIONAD los pétalos de la flor para crear parejas de sinónimos. INVENTAD una historia utilizando el mayor número posible de palabras de la flor.", "text_hu": "PÁROSÍTSÁTOK a virág szirmait rokon értelmű párokká. TALÁLJATOK KI egy történetet a virág minél több szavával."}, {"n": "4", "text": "ESCUCHA y COPIA el dictado.", "text_hu": "HALLGASD MEG és MÁSOLD LE a diktát."}], "section": "adjetivo"}, "tb67": {"title": "Practicamos (c, z, s, sinónimos, creación)", "title_hu": "Gyakorlunk (c, z, s, rokon értelmű szavak, alkotás)", "summary_hu": "További gyakorló feladatok: egy tortuga-történet c/z/s hibáinak javítása, mondat írása két játék nevével (sakk, búgócsiga), kiemelt szavak cseréje rokon értelmű szavakra, egy fantasztikus lény leírása melléknevekkel és találós kérdés kitalálása párban.", "tasks": [{"n": "5", "text": "CORRIGE las palabras con c, z o s. (Una valeroza y modezta tortuga crusó el enorme oséano. Su caparacón brillante reflejaba el zielo asul. Con mucho esfuerco, llegó a una isla rocoza de gran belleca. Allí, la tortuga caminó por la arena suave y encontró una flor muy espesial que cambiaba de color.)", "text_hu": "JAVÍTSD KI a c, z vagy s betűs szavakat. (Egy bátor és szerény teknős átkelt a hatalmas óceánon… Nagy erőfeszítéssel egy sziklás, nagyon szép szigetre ért. Ott a teknős végigsétált a puha homokon, és talált egy nagyon különleges virágot, ami színt váltott.)"}, {"n": "6", "text": "ESCRIBE un enunciado con el nombre de cada juego. (A: ajedrez, B: peonza)", "text_hu": "ÍRJ egy mondatot az egyes játékok nevével. (A: sakk, B: búgócsiga)"}, {"n": "7", "text": "CAMBIA las palabras destacadas por sinónimos, pero intenta que los enunciados mantengan su significado. Gonzalo está entusiasmado con su regalo. / Paula es muy inteligente.", "text_hu": "CSERÉLD LE a kiemelt szavakat rokon értelmű szavakra, de próbáld úgy, hogy a mondatok jelentése megmaradjon. Gonzalo está entusiasmado con su regalo. / Paula es muy inteligente."}, {"n": "8", "text": "IMAGINA que descubres una criatura fantástica. DESCRÍBELA utilizando adjetivos. Ve de la cabeza a los pies, explica qué come, dónde vive, qué carácter tiene…", "text_hu": "KÉPZELD EL, hogy felfedezel egy fantasztikus lényt. ÍRD LE melléknevekkel. Haladj a fejtől a lábig, magyarázd el, mit eszik, hol él, milyen a jelleme…"}, {"n": "9", "text": "En parejas, INVENTAD una adivinanza sobre un objeto o un animal. Asegúrate de incluir: dos adjetivos y una palabra con c, z o s. Ejemplo: Soy un animal pequeño y curioso. Me gusta cazar ratones. ¿Qué soy?", "text_hu": "Párban TALÁLJATOK KI egy találós kérdést egy tárgyról vagy állatról. Legyen benne: két melléknév és egy c, z vagy s-es szó. Példa: Soy un animal pequeño y curioso. Me gusta cazar ratones. ¿Qué soy?"}], "section": "czs"}, "tb68": {"title": "La narración literaria", "title_hu": "Az irodalmi elbeszélés", "summary_hu": "Az elbeszélő szöveg egy történetet mesél el szereplőkről (főszereplők), egy helyen és időben. Három része van: inicio (kezdet: bemutatják a főszereplőt és a helyet), nudo (bonyodalom: mi történik, mi a probléma) és desenlace (megoldás: vége a történetnek). A példa Ping, a becsületes kisfiú története a kínai császárról és a magról.", "tasks": [{"n": "fijate", "text": "(Texto) La narración literaria: partes inicio, nudo y desenlace del cuento de Ping.", "text_hu": "(Szöveg) Az irodalmi elbeszélés: Ping meséjének kezdete, bonyodalma és megoldása."}], "section": "narracion"}, "tb69": {"title": "Practicamos (la narración)", "title_hu": "Gyakorlunk (az elbeszélés)", "summary_hu": "Gyakorló feladatok az elbeszélésről: kérdések Ping meséjéről (főszereplő, a részek, mit tehetett volna Ping), Pluma de Águila (Sas Toll) történetéről (főszereplő, mikor és hol játszódik, az inicio-nudo-desenlace felismerése) és egy ismert népmese szereplőjének kitalálós leírása párban.", "tasks": [{"n": "1", "text": "LEE la narración de la página anterior y RESPONDE. ¿Quiénes son los protagonistas del cuento? ¿Qué se narra en cada una de las partes señaladas en el texto? ¿Qué podría haber hecho Ping al ver que su semilla no crecía?", "text_hu": "OLVASD EL az előző oldal elbeszélését és VÁLASZOLJ. Kik a mese főszereplői? Mit mesélnek el a megjelölt részek mindegyikében? Mit tehetett volna Ping, amikor látta, hogy a magja nem nő?"}, {"n": "2", "text": "CONTESTA a las preguntas después de leer el cuento. (Pluma de Águila) ¿Quién es el protagonista? ¿Cuándo sucede la historia? ¿Dónde ocurre? Identifica las partes de la historia: inicio, nudo y desenlace.", "text_hu": "VÁLASZOLJ a kérdésekre a mese elolvasása után. (Pluma de Águila) Ki a főszereplő? Mikor történik? Hol játszódik? Azonosítsd a történet részeit: inicio, nudo, desenlace."}, {"n": "3", "text": "Por turnos, DESCRIBID los rasgos físicos y el carácter de un personaje de un cuento popular que conozcáis, pero no digáis su nombre. ADIVINA el personaje que ha descrito tu pareja.", "text_hu": "Felváltva ÍRJÁTOK LE egy ismert népmese szereplőjének külsejét és jellemét, de ne mondjátok ki a nevét. TALÁLD KI, melyik szereplőt írta le a párod."}], "section": "narracion"}, "tb70": {"title": "La postal", "title_hu": "A képeslap", "summary_hu": "A képeslap (postal) egy módja annak, hogy a messzi családtagokkal és barátokkal tartsuk a kapcsolatot. Egyik oldalán fotó vagy rajz van, a másikon rövid, közvetlen szöveg és a címzett címe (borítékja nincs). A minta: egy nagyapa írja unokájának, Enzónak, a cseresznyékről. Részei: fecha y lugar (dátum és hely), saludo, texto (szöveg), despedida (elköszönés), firma (aláírás).", "tasks": [{"n": "fijate", "text": "(Modelo) La postal de Enzo con sus partes: fecha y lugar, texto, despedida, firma.", "text_hu": "(Minta) Enzo képeslapja a részeivel: dátum és hely, szöveg, elköszönés, aláírás."}], "section": "postal"}, "tb71": {"title": "Practicamos (la postal)", "title_hu": "Gyakorlunk (a képeslap)", "summary_hu": "Gyakorló feladatok a képeslapról: kérdések Enzo képeslapjáról (ki küldi, kinek, mire való a cím), köszönések és elköszönések megkülönböztetése, saját képeslap megírása három lépésben (tervezés, fogalmazás, ellenőrzés) egy állatalakúra nyírt bokrokkal teli kertről, végül postaláda készítése és a képeslapok kiosztása.", "tasks": [{"n": "1", "text": "FÍJATE en la postal de la página anterior y RESPONDE. ¿Quién envía la postal? ¿A quién va dirigida? ¿Para qué se pone la dirección?", "text_hu": "FIGYELD MEG az előző oldal képeslapját, és VÁLASZOLJ. Ki küldi a képeslapot? Kinek szól? Mire való a cím?"}, {"n": "2", "text": "ESCRIBE si son saludos o despedidas. hola, Rosa / un abrazo / ¿qué tal, Iván? / besos", "text_hu": "ÍRD LE, hogy köszönések vagy elköszönések. hola, Rosa / un abrazo / ¿qué tal, Iván? / besos"}, {"n": "3", "text": "IMAGINA que has visitado una ciudad donde hay un jardín con arbustos con forma de animales, y quieres escribirle una postal a un familiar. 1) PLANIFICA: ORGANIZA tus ideas. 2) REDACTA: ESCRIBE un borrador de la postal con todos los datos. 3) REVISA: RELEE el texto final y VALORA estos puntos.", "text_hu": "KÉPZELD EL, hogy meglátogattál egy várost, ahol állatalakúra nyírt bokrokból álló kert van, és képeslapot akarsz írni egy rokonodnak. 1) TERVEZZ: RENDEZD el a gondolataidat. 2) FOGALMAZZ: ÍRJ piszkozatot a képeslapról minden adattal. 3) ELLENŐRIZZ: OLVASD ÚJRA a végleges szöveget, és ÉRTÉKELD ezeket a pontokat."}, {"n": "4", "text": "CREAD un buzón en el que podáis echar vuestras postales. REPARTID todas las postales entre la clase para que cada uno evalúe la que reciba.", "text_hu": "KÉSZÍTSETEK egy postaládát, amibe bedobhatjátok a képeslapjaitokat. OSZTÁTOK KI az összes képeslapot az osztályban, hogy mindenki értékelje azt, amelyiket kap."}], "section": "postal"}, "tb72": {"title": "¿Qué hemos aprendido? Repasa (1)", "title_hu": "Mit tanultunk? Ismételj (1)", "summary_hu": "Ismétlő oldal: a saját élmény elbeszélése (világosan és rendezetten: primero, después/luego, al final – hol történt, mi történt, mit éreztünk), a melléknév (tulajdonságot fejez ki, nemben és számban egyezik a főnévvel) és a c, z, s szabályai (c: e, i előtt; z: a, o, u előtt, -azo/-aza, -ez/-eza; s: -oso/-osa, -esta/-esto/-ista).", "tasks": [{"n": "narracion", "text": "REPASA: La narración de experiencias personales.", "text_hu": "ISMÉTELJ: A személyes élmények elbeszélése."}, {"n": "adjetivo", "text": "REPASA: El adjetivo.", "text_hu": "ISMÉTELJ: A melléknév."}, {"n": "czs", "text": "REPASA: Las palabras con c, con z y con s. (tabla)", "text_hu": "ISMÉTELJ: A c, z és s betűs szavak. (táblázat)"}], "section": "repaso"}, "tb73": {"title": "¿Qué hemos aprendido? Repasa (2)", "title_hu": "Mit tanultunk? Ismételj (2)", "summary_hu": "Folytatódó ismétlő oldal: a rokon értelmű szavak (sinónimos: azonos vagy nagyon hasonló jelentésű szavak, hogy ne ismételjünk, pl. hablar – conversar – dialogar), az irodalmi elbeszélés három része (inicio, nudo, desenlace), és a „Curiopalabras” doboz a fejezet érdekes szavaival (fajok, szaporodnak, gyógyító, díszítő, illatos, kicsírázott, utód, botanikus).", "tasks": [{"n": "sinonimos", "text": "REPASA: Los sinónimos. (hablar, conversar, dialogar)", "text_hu": "ISMÉTELJ: A rokon értelmű szavak. (hablar, conversar, dialogar)"}, {"n": "literaria", "text": "REPASA: La narración literaria. (inicio, nudo, desenlace)", "text_hu": "ISMÉTELJ: Az irodalmi elbeszélés. (inicio, nudo, desenlace)"}, {"n": "curio", "text": "CURIOPALABRAS: especies, reproducen, medicinales, ornamentales, aromáticas, germinó, sucesor, botánico.", "text_hu": "CURIOPALABRAS (érdekes szavak): fajok, szaporodnak, gyógyító, díszítő, illatos, kicsírázott, utód, botanikus."}], "section": "repaso"}, "tb74": {"title": "¿Qué hemos aprendido? Aplica", "title_hu": "Mit tanultunk? Alkalmazd", "summary_hu": "Alkalmazó feladatok egy részlet alapján (Leonardo, a jószívű favágó, a különleges mag a kezén: a hetedik éjszakán a mag kicsírázik, zöld szár nő belőle, és sárga virág nyílik hét selymes, illatos szirommal). Kérdések: melléknév keresése, a virág leírása, melléknevek elemzése, szinonima, c/z betűs szavak keresése, -oso/-osa végű szavak és a befejezés kitalálása.", "tasks": [{"n": "1", "text": "BUSCA en el texto un adjetivo para describir al leñador.", "text_hu": "KERESS a szövegben egy melléknevet a favágó leírására."}, {"n": "2", "text": "DESCRIBE la flor con dos adjetivos que no aparezcan en el texto.", "text_hu": "ÍRD LE a virágot két olyan melléknévvel, ami nem szerepel a szövegben."}, {"n": "3", "text": "ANALIZA los adjetivos de este enunciado del texto. Una flor amarilla con siete pétalos sedosos y fragantes.", "text_hu": "ELEMEZD a szöveg ezen mondatának mellékneveit. Una flor amarilla con siete pétalos sedosos y fragantes."}, {"n": "4", "text": "SUSTITUYE la palabra destacada por un sinónimo. La semilla germinó mientras Leonardo dormía.", "text_hu": "CSERÉLD LE a kiemelt szót egy szinonimára. La semilla germinó mientras Leonardo dormía."}, {"n": "5", "text": "LOCALIZA en el texto una palabra con za, zo, zu y dos con ce o ci.", "text_hu": "KERESS a szövegben egy za, zo, zu-s szót és két ce vagy ci-s szót."}, {"n": "6", "text": "ESCRIBE las palabras del texto que terminen en -oso u -osa.", "text_hu": "ÍRD LE a szövegből azokat a szavakat, amelyek -oso vagy -osa végűek."}, {"n": "7", "text": "INVÉNTATE un desenlace para esta historia.", "text_hu": "TALÁLJ KI egy befejezést ehhez a történethez."}], "section": "repaso"}, "tb75": {"title": "Crea y Ticket de salida", "title_hu": "Alkoss és Kilépőjegy", "summary_hu": "A fejezet záró oldala. „Crea”: ha az iskolának lenne iskolai veteményese, hogyan mesélnéd el, mit csináltok? Három feladat közül kell választani és indokolni: veteményes rajza melléknevekkel (szín, használat, forma, illat), képeslap egy barátnak, vagy az élmény elmesélése más osztályoknak. „Ticket de salida”: hat témát értékelsz magadnak (egy kicsit, eléggé, nagyon), és összehasonlítod a belépőjeggyel.", "tasks": [{"n": "crea", "text": "CREA: ¿Cuál de estas tareas encaja mejor contigo? ¿Por qué? (Dibujo de un huerto / Postal / Narrar tu experiencia)", "text_hu": "ALKOSS: Melyik feladat illik hozzád a legjobban? Miért? (A veteményes rajza / Képeslap / Az élmény elmesélése)"}, {"n": "ticket", "text": "TICKET DE SALIDA: LEE cada enunciado y DI cuánto crees que has aprendido: un poco, bastante o mucho. ¡No olvides compararlo con tu ticket de entrada!", "text_hu": "KILÉPŐJEGY: OLVASD EL az egyes állításokat, és MONDD EL, mennyit gondolsz, hogy megtanultál: egy kicsit, eléggé vagy nagyon. Ne felejtsd összehasonlítani a belépőjeggyel!"}], "section": "repaso"}, "cu23": {"title": "FICHA 1. El adjetivo", "title_hu": "1. lap: A melléknév", "summary_hu": "A melléknév megmondja, milyen a főnév, amiről szó van (pl. csillagos ég, hatalmas rét). Be kell karikázni a mellékneveket, képeket leírni velük, és a főnévhez illő, vele egyező melléknevet választani.", "tasks": [{"n": "1", "text": "RODEA el adjetivo en cada grupo de palabras.", "text_hu": "Karikázd be a melléknevet minden szócsoportban."}, {"n": "2", "text": "DESCRIBE cada imagen con dos adjetivos.", "text_hu": "Írd le mindegyik képet két melléknévvel."}, {"n": "3", "text": "ESCRIBE un adjetivo para cada nombre.", "text_hu": "Írj egy melléknevet minden főnév mellé."}, {"n": "4", "text": "UNE cada nombre con un adjetivo adecuado.", "text_hu": "Kösd össze mindegyik főnevet egy hozzá illő melléknévvel."}], "section": "adjetivo"}, "cu24": {"title": "FICHA 1. El adjetivo (continuación)", "title_hu": "1. lap: A melléknév (folytatás)", "summary_hu": "Főnevek és hozzájuk tartozó melléknevek keresése mondatokban, a melléknevek osztályozása nem és szám szerint, mondatok átírása egyesből többesbe és fordítva, és a lemezjátszóhoz illő melléknevek kiválasztása.", "tasks": [{"n": "5", "text": "SUBRAYA los nombres y RODEA los adjetivos que lo califican. / CLASIFICA los adjetivos.", "text_hu": "Húzd alá a főneveket és karikázd be a hozzájuk tartozó mellékneveket. / OSZTÁLYOZD a mellékneveket."}, {"n": "6", "text": "CAMBIA el número de los adjetivos como en el ejemplo.", "text_hu": "Változtasd meg a melléknevek számát a példa szerint."}, {"n": "7", "text": "RODEA solo los adjetivos adecuados para este objeto.", "text_hu": "Csak az ehhez a tárgyhoz illő mellékneveket karikázd be."}], "section": "adjetivo"}, "cu25": {"title": "FICHA 2. Los sinónimos", "title_hu": "2. lap: A szinonimák (rokon értelmű szavak)", "summary_hu": "A szinonimák egyező vagy hasonló jelentésű szavak. Szópárokat kell összekötni, szavakat szinonimával helyettesíteni, mondatokat szinonimával kiegészíteni, és kiválasztani a kiemelt szó szinonimáját.", "tasks": [{"n": "1", "text": "UNE cada palabra con su sinónimo.", "text_hu": "Kösd össze mindegyik szót a rokon értelmű párjával."}, {"n": "2", "text": "SUSTITUYE la palabra entre paréntesis por un sinónimo.", "text_hu": "Helyettesítsd a zárójelben lévő szót egy rokon értelmű szóval."}, {"n": "3", "text": "COMPLETA las oraciones usando un sinónimo de estas palabras.", "text_hu": "Egészítsd ki a mondatokat ezeknek a szavaknak a rokon értelmű párjával."}, {"n": "4", "text": "MARCA la palabra que sea un sinónimo de la destacada en cada caso.", "text_hu": "Jelöld meg azt a szót, ami rokon értelmű a kiemelttel."}], "section": "sinonimos"}, "cu26": {"title": "FICHA 3. Las palabras con c, con z y con s", "title_hu": "3. lap: A c-vel, z-vel és s-sel írt szavak", "summary_hu": "Za, zo, zu z-vel, ce és ci c-vel íródik. Hasonlóan hangzó, de másként írt és más jelentésű szavakat (taza/tasa, riza/risa, coser/cocer) kell megkülönböztetni, szavakat kiegészíteni c-vel vagy z-vel, és mondatokat képekhez rendelni.", "tasks": [{"n": "1", "text": "ESCRIBE la palabra correcta en cada caso.", "text_hu": "Írd be a helyes szót minden esetben."}, {"n": "2", "text": "COMPLETA las palabras con c o z.", "text_hu": "Egészítsd ki a szavakat c-vel vagy z-vel."}, {"n": "3", "text": "ESCRIBE el número de la escena a la que corresponde cada oración.", "text_hu": "Írd be annak a jelenetnek a számát, amelyikhez az egyes mondatok tartoznak."}], "section": "czs"}, "cu27": {"title": "FICHA 4. La narración literaria", "title_hu": "4. lap: Az irodalmi elbeszélés", "summary_hu": "Az elbeszélés szereplőkkel történő eseményeket mesél el egy helyen és időben; három része van: inicio (bevezetés), nudo (bonyodalom), desenlace (megoldás). Egy összekevert, Lidia felfedezőről szóló szöveg négy bekezdését kell sorba rakni, és a részek szerint kiszínezni.", "tasks": [{"n": "1", "text": "NUMERA cada párrafo según el orden lógico de la narración. / COLOREA los recuadros numerados según el código.", "text_hu": "Számozd meg a bekezdéseket az elbeszélés logikus sorrendje szerint. / SZÍNEZD ki a megszámozott négyzeteket a kód szerint."}], "section": "narracion"}, "cu28": {"title": "FICHA 4. La narración literaria (continuación)", "title_hu": "4. lap: Az irodalmi elbeszélés (folytatás)", "summary_hu": "Kérdések a Lidia-történetről (hol, mikor, ki, mi történik, hogyan végződik); az elbeszélés elemeinek (hol, mikor, események, főszereplő, megoldás) hozzárendelése az inicio, nudo, desenlace részekhez; képek hozzárendelése a részekhez.", "tasks": [{"n": "2", "text": "RESPONDE a las preguntas sobre el texto anterior.", "text_hu": "Válaszolj a kérdésekre az előző szöveg alapján."}, {"n": "3", "text": "UNE cada elemento con la parte de la narración donde se cuenta.", "text_hu": "Kösd össze az elemeket azzal az elbeszélés-résszel, ahol elmondják őket."}, {"n": "4", "text": "UNE esta imagen con la oración que corresponde.", "text_hu": "Kösd össze ezt a képet a hozzá tartozó résszel."}], "section": "narracion"}, "cu29": {"title": "FICHA 5. La postal", "title_hu": "5. lap: A képeslap", "summary_hu": "A képeslap rövid üzenet egy távoli személynek: egyik oldalán kép, a másikon rövid szöveg, bélyeg és cím. Egy mintaképeslap részeit kell megnevezni (hely és dátum, köszöntés, üzenet, elköszönés, aláírás, cím), és kiválasztani a hátoldalhoz illő képet.", "tasks": [{"n": "1", "text": "LEE la postal y ESCRIBE el nombre de cada parte. / MARCA la imagen adecuada para la parte de atrás.", "text_hu": "Olvasd el képeslapot és írd le minden rész nevét. / JELÖLD meg a hátoldalhoz illő képet."}], "section": "postal"}, "cu30": {"title": "FICHA 5. La postal (continuación)", "title_hu": "5. lap: A képeslap (folytatás)", "summary_hu": "Egy nagyszülők által unokáiknak írt képeslap hiányzó részeit kell odamásolni (hely és dátum, köszöntés, elköszönés, aláírás), majd Martinnak saját képeslapot kell írnia egy tengerparti világítótornyos kép mellé.", "tasks": [{"n": "2", "text": "COPIA donde corresponde.", "text_hu": "Másold oda, ahová illik."}, {"n": "3", "text": "ESCRIBE una postal.", "text_hu": "Írj egy képeslapot."}], "section": "postal"}, "cu31": {"title": "FICHA 6. Búsqueda de información", "title_hu": "6. lap: Információkeresés", "summary_hu": "Az információ kereséséhez kulcsszavakat választunk, és tudjuk, hogy a források nyomtatottak (papír) vagy digitálisak (képernyő). Az internet nem minden információja igaz. Feladatok: kulcsszavak, források osztályozása táblázatban, igaz/hamis és az információ-hely párosítás.", "tasks": [{"n": "1", "text": "ESCRIBE las palabras clave necesarias para buscar cada información.", "text_hu": "Írd le a kulcsszavakat, amelyek kellenek az egyes információk kereséséhez."}, {"n": "2", "text": "CLASIFICA estas fuentes en la tabla.", "text_hu": "Osztályozd ezeket a forrásokat a táblázatban."}, {"n": "3", "text": "ESCRIBE V si es verdadero y F si es falso.", "text_hu": "Írj V-t, ha igaz, és F-et, ha hamis."}, {"n": "4", "text": "UNE cada información con el lugar donde podrías encontrarla.", "text_hu": "Kösd össze az információt azzal a hellyel, ahol megtalálhatnád."}], "section": "busqueda"}, "cu32": {"title": "FICHA 6. Búsqueda de información (continuación)", "title_hu": "6. lap: Információkeresés (folytatás)", "summary_hu": "A könyv, a magazin és az újság különböző információforrások; a könyvtárban a könyveket részlegek szerint rendezik, a gerincükön lévő címke (tejuelo) a jelzetet (signatura) tartalmazza. Feladatok: forrástípusok párosítása, a tejuelo kiegészítése, címek, részlegek és jelzetek összekötése, saját jelzet kitalálása.", "tasks": [{"n": "5", "text": "COPIA cada tipo de fuente de información donde corresponde.", "text_hu": "Másold oda minden információforrás-típust, ahová illik."}, {"n": "6", "text": "COMPLETA.", "text_hu": "Egészítsd ki."}, {"n": "7", "text": "UNE cada título con su sección, su género y su tejuelo.", "text_hu": "Kösd össze mindegyik címet a részlegével, a műfajával és a jelzetével."}, {"n": "8", "text": "INVENTA una signatura para cada libro.", "text_hu": "Találj ki jelzetet minden könyvhöz."}], "section": "busqueda"}}, "books": {"tb": "Lengua 3 – tankönyv", "cu": "Lengua 3 – munkafüzet (cuaderno)", "sb": "Lengua 3 – Saberes básicos"}},SP={"es": {"-eza": [0.0, 0.708], "-osa se escribe con…": [1.008, 1.672], "-oso": [2.98, 0.708], "-oso, -osa": [3.988, 1.057], "1": [5.345, 0.778], "2": [6.423, 0.789], "350": [7.512, 1.567], "A veces, los gestos de las manos también ayudan.": [9.379, 2.554], "A: unas hojas verdes": [12.234, 2.055], "Abuelos Carmen y Tomás": [14.589, 1.544], "Actívate y ticket de entrada": [16.433, 1.881], "Actívate: cinco ejercicios para empezar.": [18.614, 2.775], "Adivinanza: toca los dos adjetivos. ¿Qué animal es? (¡el gato! 🐱)": [21.688, 6.13], "Al final recogimos zanahorias. ¡Me sentí muy feliz!": [28.118, 3.727], "Al narrar una experiencia personal, explicamos dónde ocurrió, qué pasó y cómo nos sentimos.": [32.145, 5.074], "Algunas son muy altas, como los árboles.": [37.519, 2.74], "Algunas son muy altas, como los árboles; otras son pequeñas y delicadas, como las flores.": [40.559, 5.561], "Allí hay un viejo árbol.": [46.42, 1.765], "Allí trabajan científicos y científicas llamados botánicos.": [48.485, 3.599], "Allí trabajan los
